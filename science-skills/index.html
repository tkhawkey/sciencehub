<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Skills</title>
<meta name="description" content="How do scientists find things out? Meet the five types of enquiry, choose the right one for a question, and find facts you can trust. An interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../hub/objectives.js"></script><script src="../hub/levels.js"></script>
<style>
  /* ================= Shared look (matches the other Year 5 tools) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad; --pink: #e85d9e;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn.go, #drawer a.btn.primary { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 10px; }
  /* The tabs: their words go first, leaving the icons */
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }
  @media (max-width: 1180px) { .tl { display: none; } .tabs .btn { font-size: 20px; padding: 6px 9px; } }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #eef4fb; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done, .opt.done:disabled { background: #c9f2df; border-color: var(--green); opacity: 1; }
  .opt:disabled { opacity: .45; cursor: default; }
  .opt.sm { font-size: 14px; padding: 4px 8px; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }
  .says { border: 3px solid var(--yellow); }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .wq .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .slide { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .slide input[type=range] { flex: 1; min-height: 44px; accent-color: var(--coral); }
  .lay-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  .scaletag { background: var(--blue); color: #fff; font-weight: 700; border-radius: 10px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
  .readout { background: #fff; border-radius: 12px; padding: 5px 10px; font-size: 15px; line-height: 1.3; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .tapme { cursor: pointer; }
  .icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  a.linkbtn { display: inline-flex; align-items: center; text-decoration: none; }

  /* ---------- Chips: tap one, then tap where it goes – or drag it there ---------- */
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 12px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); opacity: .95; }
  .bank { display: flex; flex-wrap: wrap; gap: 6px; }
  .bank:empty::before { content: 'All placed!'; color: var(--muted); font-size: 15px; }
  .mrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .mrow > span { flex: 1; font-size: 15px; line-height: 1.25; }
  .mslot { flex: none; width: 118px; min-height: 44px; border: 2px dashed #b7c3ea; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background: #f7f9ff; cursor: pointer; text-align: center; padding: 2px 4px; }
  .mslot.ready { border-color: #e0a800; background: #fffbea; }
  .mslot.over { border-style: solid; border-color: var(--green); }
  .mslot.ok { border-style: solid; border-color: var(--green); background: #c9f2df; cursor: default; }
  .mslot.bad { border-style: solid; border-color: var(--coral); background: #ffe0e3; }
  svg .slot.over rect { stroke: var(--green); stroke-width: 4; }
  svg .slot.ready rect { stroke: #e0a800; }

  /* ---------- Sorting into two boxes ---------- */
  .sortwrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 50px 8px 8px; }
  .pool { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; align-content: start; grid-auto-rows: max-content; padding: 4px; }
  .pcard { position: relative; display: flex; flex-direction: column; border: 3px solid #fff; background: #fff; border-radius: 14px; padding: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.12); text-align: center; }
  .pcard img, .pcard .ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; pointer-events: none; }
  .pcard .ph { display: grid; place-items: center; font-size: 46px; background: #e6f3e0; }
  .pcard .ph svg { width: 60%; height: auto; }
  .pcard > span { padding: 4px 6px; }
  .pcard.sel { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
  .pcard.look { border-color: var(--blue); }
  .bins { flex: none; height: 40%; min-height: 130px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bin { border: 3px dashed #b7c3ea; border-radius: 16px; background: #fff; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; cursor: pointer; }
  .bin h3 { margin: 0; font-size: 18px; text-align: center; pointer-events: none; }
  .bin .bsub { text-align: center; font-size: 13.5px; color: var(--muted); font-weight: 600; pointer-events: none; }
  .bin.ready { border-color: var(--yellow); background: #fffbea; }
  .bin.over { border-style: solid; border-color: var(--green); background: #effbf5; }
  .bin .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .mini { width: 66px; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.1; pointer-events: none; }
  .mini img, .mini .ph { width: 58px; height: 44px; object-fit: cover; border-radius: 8px; display: grid; place-items: center; font-size: 28px; background: #e6f3e0; }
  .mini .ph svg { width: 34px; height: 34px; }
  .photo { position: relative; border-radius: 14px; overflow: hidden; background: #e6f3e0; }
  .photo img { width: 100%; display: block; }
  .photo .ph { display: grid; place-items: center; font-size: 80px; aspect-ratio: 4 / 3; }
  .pcard .credit, .mini .credit { display: none; }
  .credit { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; max-width: calc(100% - 12px); }

  /* ---------- The fair test (as in Seed Lab) ---------- */
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .steps span { font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); }
  .steps span.now { background: var(--yellow); color: var(--ink); }
  .steps span.done { background: #c9f2df; color: #147a55; }
  .varrow { margin: 8px 0; }
  .varrow > span { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
  .tag { background: var(--yellow); border-radius: 8px; padding: 1px 6px; font-size: 12px; }
  .keeps { display: grid; gap: 4px; margin-top: 6px; }
  .keep { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border-radius: 10px; background: var(--soft); font-size: 15px; cursor: pointer; }
  .keep input { width: 22px; height: 22px; flex: none; accent-color: var(--green); }
  ul.spot { padding-left: 28px; }
  .seedcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .seedcard { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 4px; min-height: 44px; font-weight: 600; font-size: 13.5px; line-height: 1.15; cursor: pointer; text-align: center; }
  .seedcard.sel { background: var(--yellow); border-color: #e0a800; }
  .seedcard:disabled { opacity: .6; cursor: default; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  .gtable th { text-align: left; font-size: 13.5px; color: var(--muted); padding: 2px 4px; }
  .gtable td { border-top: 1px solid #e1e6f5; padding: 5px 4px; }
  .numin { width: 90px; min-height: 44px; font-size: 20px; text-align: center; border: 2px solid #c3cdf2; border-radius: 12px; padding: 4px; background: #fff; }
  .numin:focus { outline: 3px solid var(--yellow); border-color: #e0a800; }
  .numin.ok { border-color: var(--green); background: #effbf5; }
  .ansrow { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-weight: 600; flex-wrap: wrap; }
  .wsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  /* ---------- Science Skills ---------- */
  .cardgrid { position: absolute; inset: 0; padding: 56px 14px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-content: center; overflow-y: auto; }
  .ecard { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; border: 4px solid #fff; background: #fff; border-radius: 20px; font: inherit; font-size: 18px; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.1); padding: 12px; text-align: center; }
  .ecard .bigem { font-size: 54px; line-height: 1; }
  .ecard.on { border-color: var(--yellow); box-shadow: 0 0 0 5px rgba(255,200,61,.35); }
  .ecard .tick { position: absolute; top: 8px; right: 12px; color: var(--green); font-weight: 700; }
  .whichwrap .pool { flex: 0 1 auto; max-height: 42%; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .qcard { display: flex; gap: 8px; align-items: center; text-align: left; border: 3px solid #fff; background: #fff; border-radius: 14px; padding: 8px 10px; min-height: 52px; font: inherit; font-weight: 600; font-size: 15px; color: var(--ink); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 0 rgba(0,0,0,.1); }
  .qcard.sel { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
  .qcard .qem { font-size: 24px; flex: none; }
  .bins.five { flex: 1 1 auto; height: auto; grid-template-columns: repeat(5, 1fr); }
  .bins.five .bin h3 { font-size: 15px; }
  .qmini { background: var(--soft); border-radius: 8px; padding: 3px 6px; font-size: 12.5px; font-weight: 600; pointer-events: none; text-align: left; width: 100%; }
  .askrow { padding: 8px 0; border-top: 1px solid #e1e6f5; }
  .askrow:first-child { border-top: 0; }
  .askrow p { margin: 2px 0 6px; }
  .askrow .navrow .opt { flex: 1; }
  .srcgrid { position: absolute; inset: 0; padding: 56px 12px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; align-content: start; overflow-y: auto; }
  .src { text-align: left; border: 3px solid #fff; background: #fff; border-radius: 16px; padding: 10px 12px; font: inherit; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.1); display: flex; flex-direction: column; gap: 6px; }
  .src .skind { font-weight: 700; font-size: 15px; }
  .src .swords { font-size: 15px; line-height: 1.35; font-style: italic; }
  .src .suse { font-weight: 700; color: #8a5a00; font-size: 14px; }
  .src .swhy { font-size: 14px; line-height: 1.3; }
  .src.on { border-color: var(--yellow); background: #fffbea; }
  .src.good { border-color: var(--green); background: #effbf5; }
  .src.bad { opacity: .75; }
  .src:disabled { cursor: default; }
  @media (max-width: 760px) {
    .cardgrid { padding-top: 44px; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
    .ecard { min-height: 92px; font-size: 13.5px; padding: 6px; } .ecard .bigem { font-size: 32px; }
    .whichwrap { padding-top: 64px; } .whichwrap .pool { grid-template-columns: 1fr; }
    .bins.five { grid-template-columns: 1fr 1fr; } .bins.five .bin h3 { font-size: 12.5px; }
    .srcgrid { padding-top: 64px; grid-template-columns: 1fr; }
  }

  /* ---------- Use a key ---------- */
  .banner .kicker .lvl { text-transform: none; letter-spacing: 0; }
  .keywrap { position: absolute; inset: 0; padding: 52px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .kthumbs { flex: none; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .kthumb { position: relative; display: flex; flex-direction: column; min-width: 0; border: 3px solid #fff; background: #fff; border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .kthumb .kimg { display: block; height: 52px; background: #e6f3e0; pointer-events: none; }
  .kthumb .kimg img, .kthumb .kimg .ph { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-size: 26px; }
  .kthumb .credit { display: none; }
  .kthumb .kname { padding: 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .kthumb.on { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
  .kthumb.named { border-color: var(--green); }
  .kthumb .tick { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .keywrap.big .kthumbs { flex: 1; min-height: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .keywrap.big .kthumb { font-size: 17px; }
  .keywrap.big .kthumb .kimg { flex: 1; height: auto; min-height: 0; }
  .kphotos { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kphotos .photo { min-height: 0; height: 100%; }
  .kphotos .photo img { height: 100%; object-fit: cover; }
  .kphotos .photo .ph { height: 100%; aspect-ratio: auto; }
  .kcap { position: absolute; left: 6px; top: 6px; background: rgba(255,255,255,.92); border-radius: 8px; padding: 2px 8px; font-size: 14px; font-weight: 700; }
  .kparts { display: flex; gap: 6px; padding: 8px; }
  .kparts .opt { flex: 1; padding: 6px 4px; }
  .knum { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; }
  .knum.sm { width: 22px; height: 22px; font-size: 13px; }
  .kq { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; margin: 10px 0 4px !important; line-height: 1.25; }
  .kyn .opt { flex: 1; font-size: 18px; }
  .ktrail { list-style: none; padding: 0; margin: 6px 0; }
  .ktrail li { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 15px; line-height: 1.25; }
  .ktrail li > span:nth-child(2) { flex: 1; }
  .ktrail .ky, .ktrail .kn { border-radius: 8px; padding: 1px 8px; font-size: 14px; }
  .ktrail .ky { background: #c9f2df; color: #0b6644; } .ktrail .kn { background: #ffe0e3; color: #a3202c; }
  .keylist { position: absolute; inset: 0; padding: 52px 10px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .kstep { flex: none; display: flex; gap: 10px; align-items: flex-start; background: #fff; border-radius: 14px; padding: 8px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .kbody { flex: 1; min-width: 0; }
  .kqt { font-weight: 700; font-size: 17px; line-height: 1.25; padding: 3px 0; }
  .kgo { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 15px; margin-top: 3px; }
  .kgo span { display: inline-flex; align-items: center; gap: 4px; }
  .kgo svg { vertical-align: middle; }
  .kgap { min-height: 44px; border: 2px dashed #b7c3ea; border-radius: 12px; background: #f7f9ff; display: flex; align-items: center; padding: 4px 10px; font-weight: 700; font-size: 16px; color: var(--muted); cursor: pointer; }
  .kgap.ready { border-color: #e0a800; background: #fffbea; color: var(--ink); }
  .kgap.over { border-style: solid; border-color: var(--green); }
  .kgap.ok { border-style: solid; border-color: var(--green); background: #c9f2df; color: var(--ink); cursor: default; }
  .kgap.bad { border-style: solid; border-color: var(--coral); background: #ffe0e3; }
  .bank .chip { text-align: left; }
  @media (max-width: 760px) {
    .keywrap, .keylist { padding: 64px 6px 6px; gap: 6px; } .sortwrap.ksort { padding-top: 64px; }
    .kthumbs { gap: 3px; } .kthumb { font-size: 12px; border-width: 2px; } .kthumb .kimg { height: 36px; }
    .kthumb .tick { width: 16px; height: 16px; font-size: 10px; }
    .keywrap.big .kthumbs { gap: 6px; } .keywrap.big .kthumb { font-size: 13px; }
    .kphotos { gap: 6px; } .kcap { font-size: 12px; padding: 1px 6px; }
    .kqt { font-size: 15px; } .kgo { font-size: 13.5px; } .kstep { padding: 6px 8px; gap: 8px; } .kgap { font-size: 14px; }
    .kq { font-size: 17px; }
  }

  /* ---------- Pictures drawn on the stage ---------- */

  if (!d.moved) {

    const v = VIEWS[state.view], html = v.ghost && v.ghost(d.id);

  const a = Y.find(p => !has(p, q)); if (a) return `The ${lc(KPLANTS[a].name)} would answer "no". But it is on the Yes side.`;
  const b = N.find(p => has(p, q)); if (b) return `The ${lc(KPLANTS[b].name)} would answer "yes". But it is on the No side.`;

    hint: 'An opinion, like "which is the prettiest?", can\'t be answered by science.', setup() { state.view = 'ask'; state.ask = freshAsk(); }, on: ev => ev === 'scene',
    win: () => 'Science can answer questions you can test, watch, measure or look up. It can\'t answer opinions.' },
  { id: 'allscenes', icon: '🗺️', title: 'Question collector', task: 'Finish <b>all 3</b> places in <b>Ask a question</b>.',
    hint: 'Try the garden, the kitchen and the playground.', setup() { state.view = 'ask'; }, on: (ev, d) => ev === 'scene' && d.n === 3,
    win: () => 'Scientific questions are everywhere: in the garden, in the kitchen and in the playground!' },
  { id: 'facts', icon: '📚', title: 'Fact finder', task: 'In <b>Find the facts</b>, choose the good sources for a research question, then explain one choice.',
    hint: 'Leave out adverts, opinions, old books and facts that don\'t answer the question.', setup() { state.view = 'facts'; state.facts = freshFacts(); }, on: ev => ev === 'facts',
    win: () => 'You chose sources that answer the question and can be trusted.' },
  { id: 'trust', icon: '🕵️', title: 'Trust detective', task: 'Finish <b>all 4</b> research questions in <b>Find the facts</b>.',
    hint: 'After each one, choose the next question at the bottom of the panel.', setup() { state.view = 'facts'; }, on: (ev, d) => ev === 'facts' && d.n === RESEARCH.length,
    win: () => 'Four research questions answered, with sources you can trust. Brilliant research!' },
  { id: 'key-follow', icon: '🔑', title: 'Follow the key', task: 'In <b>Use a key</b>, name all <b>8</b> plants.',
    hint: 'Look at both photos. The close-up often shows the answer.', setup() { state.view = 'key'; state.key = freshKey(); }, on: (ev, d) => ev === 'keynamed' && d.n === KORDER.length,
    win: () => 'All 8 plants named! A key asks yes/no questions until only one name is left.' },
  { id: 'key-finish', icon: '🧩', title: 'Finish the key', task: 'In <b>Use a key</b>, fill both gaps in the key with <b>no</b> mistakes.',
    hint: 'Look at the plants on the Yes side. They must all answer "yes".', setup() { state.view = 'key'; Object.assign(state.key, { part: 2, fin: freshFin() }); }, on: (ev, d) => ev === 'keyfinished' && d.mistakes === 0,
    win: () => 'A perfect key! Each question has one true answer, and it splits the plants into two groups.' },
  { id: 'key-build', tier: 'further', icon: '🌱', title: 'Build a key', task: 'Build your own key for <b>6</b> seeds.',
    hint: 'Choose a question that splits the seeds into two groups.', setup() { state.view = 'key'; Object.assign(state.key, { part: 3, bld: freshBld() }); }, on: ev => ev === 'keybuilt',
    win: () => 'You built your own key! Now anyone can use it to name these seeds.' }
];
// Objective wording comes from ../hub/objectives.js (HUB.objList)
const MAIN = ['SC5-SKL-1', 'SC5-SKL-2', 'SC5-SKL-3', 'SC5-SKL-18'], SUPPORT = [];
const HELP = {
  types: { q: 'How do scientists find things out?', steps: ['Tap each of the five cards.', 'Read what you do, and the example from a Year 5 topic.'], look: 'Each type of enquiry suits a different kind of question.', codes: ['SC5-SKL-2'] },
  which: { q: 'Which type of enquiry is best for each question?', steps: ['Tap a question.', 'Tap the type of enquiry that suits it best. Or drag it.'], look: 'Think about what you would actually <b>do</b> to find out.', codes: ['SC5-SKL-2', 'SC5-SKL-1'] },
  ask: { q: 'Which questions can science answer?', steps: ['Choose a place.', 'For each question: can science answer it?', 'If yes, choose the best type of enquiry.'], look: 'Questions about what people like or want can\'t be answered by science.', codes: ['SC5-SKL-1', 'SC5-SKL-2'] },
  facts: { q: 'Which sources can you trust?', steps: ['Read the question.', 'Tap every source you would use.', 'Check, then explain one choice.'], look: 'A good source answers the question, is up to date, and is not trying to sell you something.', codes: ['SC5-SKL-3'] },
  key: { q: 'How can a key help you name a plant?', steps: ['Tap a plant.', 'Look at both photos.', 'Answer each yes/no question. The key takes you to its name.', 'Then try 🧩 Finish and 🌱 Build.'], look: 'The close-up photo often shows the answer.', codes: ['SC5-SKL-18'] }
};
const MODEL = {
  types: [['📋', 'Real investigations often mix more than one type of enquiry.']],
  which: [['🤔', 'Some questions could be answered in more than one way. Here, each one has a best answer.']],
  ask: [['🖼️', 'The places are simple pictures. Look around your own garden, kitchen and playground for real questions.']],
  facts: [['📄', 'The sources here are made up, and much shorter than real ones. Real research means reading carefully.']],
  key: [['🔑', 'Real keys can be much longer. Scientists use keys to name plants and animals they find.'], ['📷', 'A photo shows one moment. In winter, an apple tree has no flowers to look at.']],
  all: [['🧑‍🔬', 'Real scientists use all five types of enquiry, and often more than one in the same project.'], ['🔍', 'In real research, always check a fact in more than one good source.']]
};

// ================= Missions =================
function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set(TOOL.store, state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}
function startMission(i) {
  closeModals();
  state.mission = i; MISSIONS[i].setup();
  location.hash = 'view=' + state.view;
  const m = MISSIONS[i];
  $('#bannerKicker').innerHTML = `Mission ${i + 1} of ${MISSIONS.length}: ${esc(m.title)} ${HUB.badge(HUB.tier(m))}`;
  $('#bannerText').innerHTML = m.task; $('#bannerHint').innerHTML = m.hint;
  $('#bannerHint').classList.add('hidden'); $('#hintBtn').textContent = '💡 Show a hint';
  $('#banner').classList.remove('hidden');
  render(); $('#drawer').scrollTop = 0;
}
function stopMission() { state.mission = null; $('#banner').classList.add('hidden'); fitBanner(); }
function fitBanner() { $('#drawer').style.paddingTop = state.mission == null ? '' : `${$('#banner').offsetHeight + 18}px`; }
function updateStars() { $('#starCount').textContent = `${state.done.filter(id => MISSIONS.some(m => m.id === id)).length}/${MISSIONS.length} ⭐`; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
function closeAll() { closeModals(); maybeHelp(); }
function confetti() {
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = TOOL.confetti[i % TOOL.confetti.length];
    s.style.left = `${Math.random() * 100}vw`; s.style.animationDuration = `${2 + Math.random() * 2}s`; s.style.animationDelay = `${Math.random() * .6}s`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}

// ================= Help, key words and Real life =================
const helpSeen = new Set();
let autoHelp = true, welcomed = false;
function showHelp() {
  const H = HELP[state.view], V = VIEWS[state.view];
  helpSeen.add(state.view);
  const core = MISSIONS.map((m, i) => m.start ? `${i + 1} (${m.title})` : null).filter(Boolean);
  const extra = HUB.ORDER.filter(t => t !== 'core').map(t => { const ms = MISSIONS.map((m, i) => HUB.tier(m) === t ? `${i + 1} (${m.title})` : null).filter(Boolean);
    return ms.length ? `${HUB.TIERS[t].em} ${HUB.TIERS[t].name}: ${ms.join(', ')}.` : ''; }).filter(Boolean);
  $('#helpBody').innerHTML = `<h2 id="helpTitle">${V.label.replace(/<[^>]+>/g, '').split(' ')[0]} ${V.name}</h2>
    ${welcomed ? '' : `<p class="welcome">Welcome to ${TOOL.name}!</p>`}
    <h3>🔬 The big question</h3><p>${H.q}</p>
    <h3>👆 What to do</h3><ol>${H.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <p><b>💡 Look out for:</b> ${H.look}</p>
    <p>📖 Tap <b>Words</b> at the top to see what the key words mean.</p>
    <p>🚀 Try the <b>Missions</b> to win stars!</p>
    <details class="teach"><summary>For teachers</summary>${HUB.objList(H.codes)}
      <h4>⏱ A 45-minute lesson</h4><p>Good missions to start with: ${core.join(', ')}.</p>${extra.length ? `<p>${extra.join(' ')}</p>` : ''}
      <h4>All of ${TOOL.name}'s objectives</h4><p>Main: ${MAIN.join(', ')}.${SUPPORT.length ? ` Supporting: ${SUPPORT.join(', ')}.` : ''}</p></details>`;
  welcomed = true;
  $('#helpModal').classList.remove('hidden');
}
function maybeHelp() { if (!autoHelp || helpSeen.has(state.view) || document.querySelector('.modal:not(.hidden)')) return; showHelp(); }

function renderStage() { $('#stage').innerHTML = VIEWS[state.view].stage(); }
function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>
    `<button class="btn${id === state.view ? ' active' : ''}" data-act="view" data-view="${id}" title="${x.name}" aria-label="${x.name}">${x.label}</button>`).join('');
  const keep = $('#drawer').scrollTop, same = render.last === state.view;
  $('#drawer').innerHTML = v.drawer();
  renderStage();
  if (same) $('#drawer').scrollTop = keep;
  render.last = state.view;
  fitBanner();
  maybeHelp();
}

// ================= Actions shared by every view =================
const top0 = () => { $('#drawer').scrollTop = 0; };
Object.assign(ACTIONS, {
  view(el) { closeModals(); state.view = el.dataset.view; location.hash = 'view=' + state.view; render(); top0(); },
  missions() {
    $('#missionList').innerHTML = HUB.starLine(MISSIONS, state.done) + HUB.missionList(MISSIONS, (m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title} ${HUB.badge(HUB.tier(m))}</span><span class="star">⭐</span></button>`);
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() { const h = $('#bannerHint'); h.classList.toggle('hidden'); $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint'; fitBanner(); },
  resetStars() { state.done = []; store.set(TOOL.store, []); updateStars(); ACTIONS.missions(); },
  closeModals() { closeAll(); },
  help() { closeModals(); showHelp(); },
  words() { $('#wordsList').innerHTML = KEYWORDS.map(([em, w, m]) => `<li><span class="em">${em}</span><span><b>${w}</b>: ${m}</span></li>`).join(''); $('#wordsModal').classList.remove('hidden'); },
  model() {
    $('#modelTab').textContent = `${VIEWS[state.view].label.replace(/<[^>]+>/g, '').split(' ')[0]} ${VIEWS[state.view].name}`;
    $('#modelList').innerHTML = [...MODEL[state.view], ...MODEL.all.filter(a => !MODEL[state.view].some(b => b[1] === a[1]))].map(([em, t]) => `<li><span class="em">${em}</span><span>${t}</span></li>`).join('');
    $('#modelModal').classList.remove('hidden');
  }
});
document.addEventListener('click', e => {
  if (DND.skipClick) { DND.skipClick = false; return; }
  const v = VIEWS[state.view], drag = e.target.closest('[data-drag]');
  if (drag && v.pick) { v.pick(drag.dataset.drag); return; }
  const drop = e.target.closest('[data-drop]'), sel = v.sel && v.sel();
  if (drop && sel) { v.drop(sel, drop.dataset.drop); return; }
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeAll(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
let resizeT;
addEventListener('resize', () => { fitBanner(); clearTimeout(resizeT); resizeT = setTimeout(renderStage, 120); });

// ================= Start =================
// Test hooks: #view=…  ·  #mission=2  ·  #nohelp=1
const hp = new URLSearchParams(location.hash.slice(1));
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
if (hp.has('nohelp')) autoHelp = false;
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
</script>
<script>
  // Offline support: saves the whole Science Hub on this device the first time any page is opened (see ../sw.js)
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
</body>
</html>
