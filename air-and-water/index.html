<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air and Water</title>
<meta name="description" content="Find out what air is made of: count 100 particles of air, then hunt for carbon dioxide in 10,000 – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Balanced Plate) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 11px; }
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #e6efff; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done, .opt.done:disabled { background: #c9f2df; border-color: var(--green); opacity: 1; }
  .opt:disabled { opacity: .45; cursor: default; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .tick { color: var(--green); }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }
  .says { border: 3px solid var(--yellow); }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .says li { margin: 4px 0; }
  /* Check stays in reach at the bottom of the drawer */
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .sw { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block; }

  /* ---------- What is air? ---------- */
  .svgtext { font-family: 'Fredoka', system-ui, sans-serif; }
  .glabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 19px; font-weight: 700; fill: var(--ink); }
  .gsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--muted); }
  .countrow { display: grid; grid-template-columns: 1fr 86px; align-items: center; gap: 6px; margin: 6px 0; }
  .countrow label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .numin { width: 86px; min-height: 44px; font-size: 20px; text-align: center; border: 2px solid #c3cdf2; border-radius: 12px; padding: 4px; background: #fff; }
  .numin:focus { outline: 3px solid var(--yellow); border-color: #e0a800; }
  .numin.ok { border-color: var(--green); background: #effbf5; }
  .numin.bad { border-color: var(--coral); background: #fff2f3; }
  textarea.reason { width: 100%; min-height: 64px; border: 2px solid #c3cdf2; border-radius: 12px; padding: 6px 8px; font-size: 15.5px; resize: vertical; }
  .found { font-size: 26px; letter-spacing: 4px; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 15.5px; margin: 6px 0; }
  .gtable th { text-align: left; font-size: 13.5px; color: var(--muted); padding: 2px 4px; }
  .gtable td { border-top: 1px solid #e1e6f5; padding: 5px 4px; }
  .gtable td:not(:first-child), .gtable th:not(:first-child) { text-align: right; }
  .gtable tr.co2 td { background: #fff3c4; font-weight: 700; }
  .bars { width: 100%; height: auto; display: block; }

  /* ---------- Chips (tap, or drag onto the picture) ---------- */
  .shelf { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 2px; min-height: 62px; font-weight: 600; font-size: 13px; line-height: 1.1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: center; }
  .chip .em { font-size: 26px; line-height: 1; }
  .chip.on { background: #c9f2df; border-color: var(--green); }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .ic { width: 28px; height: 28px; display: block; }

  /* ---------- Layers of the atmosphere ---------- */
  .lname { font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 700; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
  .ltick { font-family: 'Fredoka', system-ui, sans-serif; font-size: 12.5px; fill: var(--muted); }
  .ltick.b { font-weight: 700; fill: var(--ink); }
  .iname { font-family: 'Fredoka', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .pitem { cursor: grab; }
  .pitem > text:first-child, .pitem > use { filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  .lay-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  .scaletag { background: var(--coral); color: #fff; font-weight: 700; border-radius: 10px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
  .scaletag.true { background: var(--green); }
  .readout { background: #fff; border-radius: 12px; padding: 5px 10px; font-size: 15px; line-height: 1.3; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .layerbtns .opt { padding: 4px 8px; font-size: 14px; }
  .facts { margin: 6px 0 0; padding-left: 20px; } .facts li { margin: 3px 0; }
  @media (max-width: 760px) { .readout, .scaletag { font-size: 13px; padding: 3px 7px; } .lname { font-size: 14px; } }

  /* ---------- Around the Earth ---------- */
  .lpop { position: absolute; z-index: 5; width: 290px; background: #fff; border: 3px solid var(--yellow); border-radius: 14px; padding: 9px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.3); font-size: 15px; line-height: 1.3; pointer-events: none; }
  .lpop[data-pinned="1"] { pointer-events: auto; padding-right: 40px; }
  .lpop.hidden { display: none; }
  .lpop h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .lpop p { margin: 4px 0 0; }
  .lpop .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  @media (max-width: 760px) { .lpop { width: 250px; font-size: 13.5px; } }

  /* ---------- Water cycle ---------- */
  .wlab { font-family: 'Fredoka', system-ui, sans-serif; font-size: 16px; font-weight: 700; }
  .wsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  /* One gentle, steady movement for each part: vapour rising, rain falling, rivers flowing downhill */
  .vap { stroke-dasharray: 6 6; animation: vap 1s linear infinite; }
  @keyframes vap { to { stroke-dashoffset: -12; } }
  .flow { stroke-dasharray: 5 13; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .drop { animation: drop 1.1s linear infinite; }
  .flake { animation: drop 3s linear infinite; }
  @keyframes drop { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(var(--d)); opacity: .3; } }
  .slot { cursor: pointer; }
  .slot.wrong rect { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .vap, .flow, .drop, .flake { animation: none; } }
  .wq .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
  .wdone { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 15px; }
  @media (max-width: 760px) { .wlab { font-size: 13px; } .wsmall { font-size: 11px; } }

  /* ---------- Is it pure? ---------- */
  .prow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; margin: 6px 0; font-weight: 600; font-size: 15px; }
  .prow .opt { padding: 4px 8px; font-size: 14px; }
  .ptable td:nth-child(2) { white-space: nowrap; }

  /* ---------- River town ---------- */
  .meter { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 15px; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .meter .bars { display: inline-flex; gap: 2px; }
  .meter .bars i { width: 10px; height: 14px; border-radius: 3px; background: #e1e6f5; }
  .place { cursor: pointer; }
  .fixrow { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid #e1e6f5; }
  .fixrow:first-of-type { border-top: 0; }
  .fixrow .em { font-size: 26px; line-height: 1; }
  .fixrow .btn { margin-top: 6px; font-size: 15px; min-height: 40px; }
  .defn { background: #eef2ff; border-radius: 12px; padding: 8px 10px; font-size: 15px; }
  @media (max-width: 760px) { .meter { font-size: 12px; padding: 3px 7px; } .meter .bars i { width: 7px; height: 11px; } }

  /* ---------- Missions and pop-ups ---------- */
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  .modal-box ul.icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  /* Big round close button on every pop-up */
  .modal-box { position: relative; }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  /* Help pop-up for the current tab */
  .help-sec { margin: 10px 0 4px; font-size: 17px; }
  .help-q { font-size: 17.5px; margin: 0 0 4px; }
  .help-steps { margin: 4px 0 8px; padding-left: 24px; line-height: 1.4; }
  .help-steps li { margin: 3px 0; }
  .teach { margin: 10px 0 14px; font-size: 13.5px; color: var(--muted); }
  .teach summary { cursor: pointer; font-weight: 600; }
  .teach p { margin: 6px 0; }
  /* "The science" statements */
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 18px; }
    .tl { display: none; }
  }
</style>
</head>
<body>
<!-- Drawn icons for things that have no emoji -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-balloon" viewBox="0 0 64 64"><ellipse cx="32" cy="22" rx="17" ry="19" fill="#fff" stroke="#9aa6c7" stroke-width="3"/><path d="M32 41 V52" stroke="#5b6386" stroke-width="2"/><rect x="25" y="51" width="14" height="10" rx="2" fill="#f0892e" stroke="#a85a14" stroke-width="2"/></symbol>
  <symbol id="ic-aurora" viewBox="0 0 64 64"><path d="M4 44 C14 14 22 14 26 40 C30 14 40 12 42 38 C46 16 56 16 60 40" fill="none" stroke="#3ee08f" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M4 54 C14 30 22 30 26 52 C30 30 40 28 42 50 C46 32 56 32 60 52" fill="none" stroke="#b46cf0" stroke-width="5" stroke-linecap="round" opacity=".75"/></symbol>
  <symbol id="ic-iss" viewBox="0 0 64 64"><rect x="2" y="14" width="16" height="36" fill="#3d5bd6" stroke="#1d2a7a" stroke-width="2"/><rect x="46" y="14" width="16" height="36" fill="#3d5bd6" stroke="#1d2a7a" stroke-width="2"/><path d="M18 32 H46" stroke="#8a93ad" stroke-width="4"/><rect x="24" y="24" width="16" height="16" rx="3" fill="#e9ecf5" stroke="#8a93ad" stroke-width="2"/><path d="M10 14 V50 M54 14 V50" stroke="#1d2a7a" stroke-width="1.5"/></symbol>

<div class="topbar">
  <a class="hub-link" href="../index.html" title="Back to the Science Hub" aria-label="Back to the Science Hub">🏠</a>
  <div class="brand">💨 Air and Water</div>
  <div class="tabs" id="tabs"></div>
  <button class="btn missions" data-act="missions" title="Missions">🚀 <span class="long">Missions </span><span id="starCount"></span></button>
  <button class="btn" data-act="model" title="How is this model different from real life?">🤔<span class="long"> Real life?</span></button>
  <button class="btn" id="helpBtn" data-act="help" aria-label="How to use">❓</button>
</div>
<main>
  <div id="stage"></div>
  <div id="drawer"></div>
  <div id="lpop" class="lpop hidden" role="dialog" aria-label="About this layer"></div>
  <div id="banner" class="banner hidden" role="status">
    <div class="kicker" id="bannerKicker"></div>
    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>
    <div class="hint hidden" id="bannerHint"></div>
    <button class="close" data-act="stopMission" aria-label="Stop this mission">✖</button>
  </div>
</main>
<div id="missionsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="missionsTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="missionsTitle">🚀 Missions</h2>
    <div class="mission-list" id="missionList"></div>
    <div class="modal-actions"><button class="btn" data-act="resetStars">Reset stars</button><button class="btn primary" data-act="closeModals">Close</button></div>
  </div>
</div>
<div id="modelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="modelTitle">🤔 How is this model different from real life?</h2>
    <p class="muted" id="modelTab" style="margin:0 0 6px"></p>
    <p style="margin-top:0">A <span class="term">model</span> shows some important features of something real – but not everything.</p>
    <ul class="icons" id="modelList"></ul>
    <div class="modal-actions"><button class="btn primary" data-act="closeModals">Got it!</button></div>
  </div>
</div>
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div id="helpBody"></div>
    <div class="modal-actions"><a class="btn" href="../practice/index.html#air-water">✏️ Practise this</a><button class="btn primary" data-act="closeModals">Let's go! 🚀</button></div>
  </div>
</div>
<div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div class="win-emoji">⭐</div>

    <div class="modal-actions"><button class="btn" data-act="closeModals">Keep exploring</button><a class="btn primary" id="winPractise" href="../practice/index.html#air-water">✏️ Practise this</a><button class="btn primary" id="winNext" data-act="nextMission">Next mission ▶</button></div>
  </div>
</div>

<script>
// ================= Utilities =================
const $ = (s, r = document) => r.querySelector(s);
// Saved progress; private windows can block storage, so failures are ignored
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// A repeatable random number generator, so the same mix comes back for the same seed
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt = n => n.toLocaleString('en-GB');
// A smooth closed path through a list of [x, y] points
const smooth = pts => pts.map((q, i) => { const n = pts[(i + 1) % pts.length], m = [(q[0] + n[0]) / 2, (q[1] + n[1]) / 2];
  return (i ? '' : `M${((pts[pts.length - 1][0] + q[0]) / 2).toFixed(1)} ${((pts[pts.length - 1][1] + q[1]) / 2).toFixed(1)}`) + `Q${q[0].toFixed(1)} ${q[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`; }).join('') + 'Z';
// A picture: an emoji, or one of the drawn icons (ic-…) for things that have no emoji
const isIc = em => em.startsWith('ic-');
const picHTML = em => isIc(em) ? `<svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#${em}"/></svg>` : em;
const picSVG = (em, x, y, size) => isIc(em)
  ? `<use href="#${em}" x="${(x - size * .55).toFixed(0)}" y="${(y - size * .55).toFixed(0)}" width="${(size * 1.1).toFixed(0)}" height="${(size * 1.1).toFixed(0)}"/>`
  : `<text x="${x.toFixed(0)}" y="${(y + size * .36).toFixed(0)}" text-anchor="middle" style="font-size:${size}px">${em}</text>`;

// ================= Air =================
// Colours follow the ones scientists use in molecule models: nitrogen blue, oxygen red, carbon black.
const GAS = {
  n: { name: 'Nitrogen',       c: '#3d7bff' },
  o: { name: 'Oxygen',         c: '#ff5f6d' },
  x: { name: 'Other gases',    c: '#b3bacd' },
  c: { name: 'Carbon dioxide', c: '#1d2340' }
};
// Dry air: in 10,000 particles there are 7,808 nitrogen, 2,095 oxygen, 93 other (mostly argon) and 4 carbon dioxide.
// In 100, carbon dioxide rounds to nothing, so the 1 "other" stands for argon and everything else.
const MIX = { 100: { n: 78, o: 21, x: 1 }, 10000: { n: 7808, o: 2095, x: 93, c: 4 } };
const LENS = 8;   // the close-up shows 8 × 8 particles

// The particles for one level. co2 lists where the carbon dioxide particles are, in order.
const arrange = (() => {
  const cache = {};
  return (level, seed, sorted) => {
    const key = `${level}-${seed}-${sorted}`;
    if (cache[key]) return cache[key];
    const side = Math.sqrt(level), list = [];
    for (const [g, k] of Object.entries(MIX[level])) for (let i = 0; i < k; i++) list.push(g);
    let types = list, co2 = [];
    if (sorted) co2 = list.map((g, i) => g === 'c' ? i : -1).filter(i => i >= 0);
    else if (level === 100) types = shuffle(list.slice(), rng(seed));
    else {
      // Carbon dioxide is spread out and kept away from the edges, so each one is a separate find
      const r = rng(seed), rest = shuffle(list.filter(g => g !== 'c'), r);
      while (co2.length < MIX[level].c) {
        const x = 5 + Math.floor(r() * (side - 10)), y = 5 + Math.floor(r() * (side - 10));
        if (co2.every(i => Math.hypot(i % side - x, Math.floor(i / side) - y) > 22)) co2.push(y * side + x);
      }
      co2.sort((a, b) => a - b);
      types = []; let k = 0;
      for (let i = 0; i < level; i++) types.push(co2.includes(i) ? 'c' : rest[k++]);
    }
    return cache[key] = { types, co2, side };
  };
})();

// ================= State =================
const freshAir = () => ({ level: 100, seed: 3, sorted: false, pred: null, reason: '', predSaved: false,
  counts: { n: '', o: '', x: '' }, tries: 0, msg: null, counted: false,
  lens: [46, 46], found: [], tap: null, pct: null, pctWrong: [] });
const freshLayers = () => ({ scale: false, sel: 'tropo', chip: null, placed: {}, fx: {}, res: {}, tries: {}, said: null, probe: 5 });
const freshWater = () => ({ mode: 'step', step: 0, wrong: [], placed: {}, chip: null, said: null, cold: false, cup: 0, well: '', diff: '', ideas: false });
const freshPure = () => ({ pred: {}, reason: '', heated: false, ans: {}, wrong: {} });
const freshTown = () => ({ mode: 'spot', open: null, answered: {}, wrong: {}, fixed: {} });
const freshEarth = () => ({ hover: null, sel: null, seen: [] });
const state = { view: 'air', air: freshAir(), earth: freshEarth(), layers: freshLayers(), water: freshWater(), pure: freshPure(), town: freshTown(), mission: null, done: store.get('aw-done', []) };

// ================= What is air? =================
const AIR = {
  // Where things go on the stage, in screen pixels (the SVG's viewBox matches the stage's size)
  layout() {
    const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600, big = state.air.level === 10000;
    const top = 44, foot = 46;
    if (!big) { const G = Math.max(120, Math.min(w - 40, h - top - foot - 10)); return { w, h, G, gx: (w - G) / 2, gy: top }; }
    // Phones: the grid and the close-up share the width equally, with the key in two rows underneath
    if (w < 560) { const G = Math.min((w - 36) / 2, h - top - 90); return { w, h, G, gx: 12, gy: top, L: G, lx: 24 + G, ly: top, narrow: true }; }
    const G = Math.max(120, Math.min(h - top - foot - 10, (w - 50) * .6)), L = Math.min(G, w - G - 50, 340);
    const gx = (w - G - L - 24) / 2;
    return { w, h, G, gx, gy: top, L, lx: gx + G + 24, ly: top };
  },
  stage() {
    const a = state.air, P = AIR.layout(), A = arrange(a.level, a.seed, a.sorted), cs = P.G / A.side;
    // Until the prediction is saved the colours stay hidden, so the picture doesn't give the answer away
    const hide = !a.predSaved;
    const paths = Object.keys(GAS).map(g => {
      let d = '';
      A.types.forEach((t, i) => { if (t === g) d += `M${i % A.side + .5} ${Math.floor(i / A.side) + .5}h0`; });
      return d ? `<path d="${d}" stroke="${hide ? '#c9d0e4' : GAS[g].c}" stroke-width=".74" stroke-linecap="round" fill="none"/>` : '';
    }).join('');
    const key = Object.keys(MIX[a.level]).map(g => [g, GAS[g]]);
    const kw = P.G / key.length;
    const legend = hide ? `<text x="${P.gx + P.G / 2}" y="${P.gy + P.G + 31}" text-anchor="middle" class="gsmall">Make your prediction to see the colours!</text>`
      : key.map(([g, x], i) => {
        const [lx, ly] = P.narrow ? [12 + (i % 2) * (P.w / 2), P.gy + P.G + (i < 2 ? 98 : 124)] : [P.gx + i * kw + 4, P.gy + P.G + 26];
        return `<g transform="translate(${lx},${ly})"><circle r="8" cx="8" cy="0" fill="${x.c}"/><text x="22" y="5" class="gsmall">${x.name}</text></g>`;
      }).join('');
    const title = hide ? '100 particles of air' : `${a.level === 100 ? '100' : '10,000'} particles${P.narrow ? '' : ' of air'} · ${a.sorted ? 'sorted' : 'mixed up'}`;
    return `<svg id="airSvg" viewBox="0 0 ${P.w} ${P.h}" aria-label="${title}">
      <text x="${P.gx}" y="30" class="glabel">🔍 ${title}</text>
      <rect x="${P.gx - 6}" y="${P.gy - 6}" width="${P.G + 12}" height="${P.G + 12}" rx="12" fill="#fff"/>
      <g id="grid" transform="translate(${P.gx},${P.gy}) scale(${cs})" style="cursor:${a.level === 100 ? 'pointer' : 'crosshair'}">
        <rect width="${A.side}" height="${A.side}" fill="#fff"/>${paths}</g>
      ${legend}
      <g id="lensLayer"></g>
    </svg>`;
  },
  // The parts that change while you look around: the close-up, its frame and the rings round found particles
  drawLens() {
    const a = state.air, layer = $('#lensLayer');
    if (!layer) return;
    const P = AIR.layout(), A = arrange(a.level, a.seed, a.sorted), cs = P.G / A.side;
    const ring = i => [P.gx + (i % A.side + .5) * cs, P.gy + (Math.floor(i / A.side) + .5) * cs];
    let s = '';
    if (a.level === 100) {
      if (a.tap) s += `<text x="${P.gx + P.G}" y="30" text-anchor="end" class="gsmall">${a.tap}</text>`;
      layer.innerHTML = s; return;
    }
    a.found.forEach(k => { const [x, y] = ring(A.co2[k]); s += `<circle cx="${x}" cy="${y}" r="${Math.max(7, cs * 1.6)}" fill="none" stroke="#e0a800" stroke-width="3"/>`; });
    const [lx, ly] = a.lens, c = P.L / LENS;
    s += `<rect x="${P.gx + lx * cs}" y="${P.gy + ly * cs}" width="${LENS * cs}" height="${LENS * cs}" fill="none" stroke="#e0a800" stroke-width="3" rx="2"/>`;
    if (!P.narrow) s += `<text x="${P.lx}" y="30" class="gsmall">Close-up</text>`;
    s += `<rect x="${P.lx - 6}" y="${P.ly - 6}" width="${P.L + 12}" height="${P.L + 12}" rx="14" fill="#fff" stroke="#e0a800" stroke-width="4"/>`;
    s += `<g id="lens" style="cursor:pointer">`;
    for (let j = 0; j < LENS; j++) for (let i = 0; i < LENS; i++) {
      const idx = (ly + j) * A.side + lx + i, t = A.types[idx], k = A.co2.indexOf(idx);
      const cx = P.lx + (i + .5) * c, cy = P.ly + (j + .5) * c;
      s += `<circle cx="${cx}" cy="${cy}" r="${c * .36}" fill="${GAS[t].c}"/>`;
      if (k >= 0 && a.found.includes(k)) s += `<circle cx="${cx}" cy="${cy}" r="${c * .46}" fill="none" stroke="#e0a800" stroke-width="4"/>`;
    }
    s += `<rect x="${P.lx}" y="${P.ly}" width="${P.L}" height="${P.L}" fill="transparent"/></g>`;
    // The message under the close-up, wrapped to fit its width
    const lines = [], most = Math.max(14, Math.floor((P.L + 12) / 8));
    (a.tap || 'Tap a particle in the close-up to see what it is.').split('\n').forEach(part => {
      let line = '';
      part.split(' ').forEach(word => { if (line && (line + ' ' + word).length > most) { lines.push(line); line = word; } else line = line ? line + ' ' + word : word; });
      lines.push(line);
    });
    s += lines.map((t, i) => `<text x="${P.lx + P.L / 2}" y="${P.ly + P.L + 28 + i * 19}" text-anchor="middle" class="gsmall" style="fill:var(--ink)">${t}</text>`).join('');
    layer.innerHTML = s;
  },
  // Which particle (column, row) is under a point on the big grid, or null
  cellAt(e) {
    const P = AIR.layout(), A = arrange(state.air.level, state.air.seed, state.air.sorted), b = $('#airSvg').getBoundingClientRect();
    const x = (e.clientX - b.left - P.gx) / (P.G / A.side), y = (e.clientY - b.top - P.gy) / (P.G / A.side);
    return x >= 0 && y >= 0 && x < A.side && y < A.side ? [Math.floor(x), Math.floor(y)] : null;
  },
  lensAt(e) {
    const P = AIR.layout(), b = $('#airSvg').getBoundingClientRect();
    const x = (e.clientX - b.left - P.lx) / (P.L / LENS), y = (e.clientY - b.top - P.ly) / (P.L / LENS);
    return x >= 0 && y >= 0 && x < LENS && y < LENS ? [Math.floor(x), Math.floor(y)] : null;
  },
  moveLens(cell) {
    const side = 100, a = state.air;
    a.lens = [Math.max(0, Math.min(side - LENS, cell[0] - LENS / 2)), Math.max(0, Math.min(side - LENS, cell[1] - LENS / 2))];
    AIR.drawLens();
  },
  // Tapping a particle in the close-up. A tap next to a carbon dioxide particle counts too, so small fingers aren't punished.
  tapLens([i, j]) {
    const a = state.air, A = arrange(a.level, a.seed, a.sorted), [lx, ly] = a.lens;
    const near = A.co2.findIndex(idx => { const x = idx % A.side - lx, y = Math.floor(idx / A.side) - ly; return x >= 0 && y >= 0 && x < LENS && y < LENS && Math.abs(x - i) <= 1 && Math.abs(y - j) <= 1; });
    if (near >= 0) {
      if (a.found.includes(near)) a.tap = 'You have already found this one.';
      else {
        a.found.push(near);
        a.tap = a.found.length < 4 ? `🎉 Carbon dioxide! ${a.found.length} of 4 found.` : '🎉 You found all 4!\nNow answer the question.';
      }
      render(); return;
    }
    const t = A.types[(ly + j) * A.side + lx + i];
    a.tap = t === 'x' ? 'That is another gas, like argon.' : `That is ${GAS[t].name.toLowerCase()}.`;
    AIR.drawLens();
  },
  check() {
    const a = state.air, want = MIX[100], got = {};
    for (const g of ['n', 'o', 'x']) got[g] = a.counts[g] === '' ? null : Number(a.counts[g]);
    if (Object.values(got).some(v => v == null || !Number.isFinite(v))) { a.msg = { ok: false, msgs: ['Type a number for every gas.'] }; render(); return; }
    const close = ['n', 'o', 'x'].every(g => Math.abs(got[g] - want[g]) <= 1);
    const exact = ['n', 'o', 'x'].every(g => got[g] === want[g]);
    a.tries++;
    if (exact || close || a.tries >= 3) {
      const before = exact ? 'Yes! You counted them all correctly.' : close ? 'Very close! The exact numbers are 78, 21 and 1.' : 'Here are the right numbers: 78, 21 and 1.';
      a.counts = { n: '78', o: '21', x: '1' }; a.counted = true;
      a.msg = { ok: true, text: `${before} Look at your bar chart below.` };
      render(); emit('count', { ok: true }); return;
    }
    const msgs = [], sum = got.n + got.o + got.x;
    if (sum !== 100) msgs.push(`Your numbers add up to <b>${sum}</b>. There are exactly <b>100</b> particles, so they should add up to 100.`);
    for (const g of ['n', 'o', 'x']) if (got[g] !== want[g]) msgs.push(`Count the <b>${GAS[g].name.toLowerCase()}</b> again. Your number is too ${got[g] > want[g] ? 'high' : 'low'}.`);
    if (!a.sorted) msgs.push('Tip: press <b>Sort them</b>. Each full row is 10.');
    a.msg = { ok: false, msgs };
    render();
  },
  barChart() {
    const W = 310, H = 190, b = 40, top = 12, ch = H - b - top, bw = 56;
    let s = '';
    for (let v = 0; v <= 100; v += 20) { const y = top + ch - v / 100 * ch; s += `<line x1="34" x2="${W}" y1="${y}" y2="${y}" stroke="#e1e6f5"/><text x="28" y="${y + 5}" text-anchor="end" class="gsmall" style="font-size:12px">${v}</text>`; }
    ['n', 'o', 'x'].forEach((g, i) => {
      const v = MIX[100][g], hgt = Math.max(2, v / 100 * ch), x = 60 + i * 86, y = top + ch - hgt;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${hgt}" rx="4" fill="${GAS[g].c}"/>`;
      s += `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" class="gsmall" style="fill:var(--ink)">${v}</text>`;
      s += `<text x="${x + bw / 2}" y="${H - 18}" text-anchor="middle" class="gsmall" style="font-size:13px">${GAS[g].name}</text>`;
    });
    s += `<text x="10" y="${top + ch / 2}" transform="rotate(-90 10 ${top + ch / 2})" text-anchor="middle" class="gsmall" style="font-size:12px">Particles</text>`;
    return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart: nitrogen 78, oxygen 21, other gases 1">${s}</svg>`;
  },
  answerPct(v) {
    const a = state.air;
    if (v === '0.04') { a.pct = v; render(); emit('co2', { ok: true }); return; }
    if (!a.pctWrong.includes(v)) a.pctWrong.push(v);
    render();
  }
};
const PCT_HINT = {
  '4': '4% would mean 4 in every <b>100</b> particles. But in 100 particles there was no carbon dioxide at all!',
  '0.4': '0.4% would mean 4 in every <b>1,000</b> particles. You needed <b>10,000</b> particles to find 4.'
};

// ================= Layers of the atmosphere =================
// Heights in km. Temperatures are typical values; real ones change with the place, the season and the Sun.
const LAYERS = [
  { id: 'tropo', name: 'Troposphere', lo: 0, hi: 12, c: '#a8d6ff', ink: '#1d2340', short: 'Colder as you go up',
    trend: 'Gets <b>colder</b> as you go up: about 6 or 7 °C colder for every km.',
    facts: ['Almost all the <b>weather</b> and <b>clouds</b> are here.', 'We live here! It holds about three-quarters of all the air.', 'The top of <b>Mount Everest</b> is 8.8 km up.', 'Big passenger planes cruise about 10–12 km up, near the top.', 'It is about 16 km deep over the equator, but only about 8 km over the poles.'] },
  { id: 'strato', name: 'Stratosphere', lo: 12, hi: 50, c: '#6aa5ee', ink: '#fff', short: 'Warmer as you go up',
    trend: 'Gets <b>warmer</b> as you go up, because the ozone layer soaks up some of the Sun\'s ultraviolet (UV) light.',
    facts: ['The <b>ozone layer</b> is here, about 15–35 km up. It protects living things from the Sun\'s harmful UV light.', '<b>Weather balloons</b> rise to about 35 km before they burst.'] },
  { id: 'meso', name: 'Mesosphere', lo: 50, hi: 85, c: '#4475c9', ink: '#fff', short: 'Colder as you go up',
    trend: 'Gets <b>colder</b> as you go up. The top is the coldest place in the atmosphere: about −90 °C.',
    facts: ['Most <b>meteors</b> ("shooting stars") burn up high in this layer, about 70–100 km up.'] },
  { id: 'thermo', name: 'Thermosphere', lo: 85, hi: 600, c: '#2b4590', ink: '#fff', short: 'Much hotter as you go up, but too thin to feel hot',
    trend: 'Gets <b>much hotter</b> as you go up: 700 °C or more, and over 1,000 °C when the Sun is very active. But the air is so thin that it would not feel hot.',
    facts: ['The <b>edge of space</b> is usually said to be 100 km up.', 'The <b>aurora</b> (northern and southern lights) glow here, about 100–300 km up.', 'The <b>International Space Station</b> orbits about 400 km up.'] },
  { id: 'exo', name: 'Exosphere', lo: 600, hi: 10000, c: '#141c45', ink: '#fff', short: 'The air fades away into space',
    trend: 'The air <b>fades away</b> into space. There is almost nothing left.',
    facts: ['Some <b>weather satellites</b> orbit here, about 800 km up.', 'It reaches up to about 10,000 km.'] }
];
// [km, °C]: a typical temperature line
const TEMPS = [[0, 15], [12, -56], [20, -56], [32, -44], [47, -2], [51, -2], [71, -58], [85, -90], [100, -78], [110, -33], [120, 85], [150, 355], [200, 575], [300, 675], [400, 725], [600, 750]];
const tempAt = km => {
  if (km >= 600) return 750;
  for (let i = 1; i < TEMPS.length; i++) if (km <= TEMPS[i][0]) { const [k0, t0] = TEMPS[i - 1], [k1, t1] = TEMPS[i]; return t0 + (t1 - t0) * (km - k0) / (k1 - k0); }
};
// Things to put in the sky: [picture, name, lowest km, highest km, real height, hint]
const SKY = {
  cloud:   ['☁️', 'Clouds', 0.5, 12, 5, 'Clouds are part of the weather. Which layer has the weather?'],
  everest: ['🏔️', 'Top of Mount Everest', 7.5, 10, 8.8, 'Mount Everest is 8.8 km high. Use the numbers on the height scale.'],
  plane:   ['✈️', 'Passenger plane', 9, 13, 11, 'Big planes cruise near the top of the troposphere.'],
  ozone:   ['ic-ozone', 'Ozone layer', 15, 35, 25, 'The ozone layer is in the layer that gets warmer as you go up.'],
  balloon: ['ic-balloon', 'Weather balloon', 25, 40, 35, 'Weather balloons rise until they burst, about 35 km up.'],
  meteor:  ['🌠', 'Meteor burning up', 60, 110, 80, 'Meteors burn up in the layer above the stratosphere.'],
  aurora:  ['ic-aurora', 'Aurora', 90, 400, 200, 'The aurora glow above the edge of space, in the layer that gets very hot.'],
  iss:     ['ic-iss', 'Space Station', 330, 480, 400, 'The International Space Station orbits about 400 km up.'],
  sat:     ['🛰️', 'Weather satellite', 600, 10000, 800, 'This weather satellite is very far out, where the air fades away into space.']
};
const SKYORDER = ['cloud', 'everest', 'plane', 'ozone', 'balloon', 'meteor', 'aurora', 'iss', 'sat'];
const kmText = km => km < 100 ? `${Math.round(km)} km` : `${fmt(Math.round(km / (km < 1000 ? 10 : 100)) * (km < 1000 ? 10 : 100))} km`;
const tempText = t => `about ${Math.round(t / (t < 100 ? 5 : 50)) * (t < 100 ? 5 : 50)} °C`.replace('-', '−');

const LY = {
  // Not to scale: each layer gets a band of the picture (from the bottom). To scale: 0–1,000 km evenly.
  BANDS: [.22, .2, .18, .22, .18], TOP: 1000,
  TICKS: [[0, 4, 8, 12], [20, 30, 40, 50], [60, 70, 85], [200, 300, 400, 500, 600], [2000, 4000, 6000, 8000, 10000]],
  // Fewer numbers on phones, where there is less room
  TICKS_SMALL: [[0, 4, 8, 12], [30, 50], [70, 85], [300, 600], [10000]],
  geo() {
    const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600, narrow = w < 560;
    const x0 = narrow ? 50 : 62, gw = narrow ? 104 : Math.min(250, w * .28);
    const cw = w - x0 - gw - (narrow ? 18 : 34), gx0 = x0 + cw + (narrow ? 10 : 18);
    const yTop = narrow ? 92 : 80, yBot = h - 50;
    return { w, h, narrow, x0, cw, gx0, gx1: gx0 + gw - (narrow ? 6 : 12), yTop, yBot, H: yBot - yTop };
  },
  y(km, g) {
    if (state.layers.scale) return g.yBot - Math.min(km, LY.TOP) / LY.TOP * g.H;
    let y = g.yBot;
    for (let i = 0; i < LAYERS.length; i++) {
      const L = LAYERS[i], bh = LY.BANDS[i] * g.H;
      if (km <= L.hi || i === LAYERS.length - 1) return y - Math.min(1, Math.max(0, (km - L.lo) / (L.hi - L.lo))) * bh;
      y -= bh;
    }
  },
  km(y, g) {
    if (state.layers.scale) return Math.max(0, Math.min(LY.TOP, (g.yBot - y) / g.H * LY.TOP));
    let base = g.yBot;
    for (let i = 0; i < LAYERS.length; i++) {
      const L = LAYERS[i], bh = LY.BANDS[i] * g.H;
      if (y >= base - bh || i === LAYERS.length - 1) return L.lo + Math.min(1, Math.max(0, (base - y) / bh)) * (L.hi - L.lo);
      base -= bh;
    }
  },
  layerAt: km => LAYERS.find(L => km <= L.hi) || LAYERS[4],
  tx: (t, g) => g.gx0 + (Math.max(-100, Math.min(50, t)) + 100) / 150 * (g.gx1 - g.gx0),
  stage() {
    const s = state.layers, g = LY.geo(), T = g.yTop;
    let o = '';
    // The layers, bottom to top
    LAYERS.forEach(L => {
      const yb = LY.y(L.lo, g), yt = L.id === 'exo' ? T : LY.y(L.hi, g);
      o += `<rect x="${g.x0}" y="${yt}" width="${g.cw}" height="${Math.max(0, yb - yt)}" fill="${L.c}" data-layer="${L.id}"/>`;
      if (s.sel === L.id) o += `<rect x="${g.x0 + 2}" y="${yt + 2}" width="${g.cw - 4}" height="${Math.max(0, yb - yt - 4)}" fill="none" stroke="var(--yellow)" stroke-width="4" pointer-events="none"/>`;
    });
    // Layer names: in the middle of each band, or with pointer lines when the layer is too thin to write in
    LAYERS.forEach((L, i) => {
      const yb = LY.y(L.lo, g), yt = L.id === 'exo' ? T : LY.y(L.hi, g), mid = (yb + yt) / 2, thin = yb - yt < 26;
      const stroke = L.ink === '#fff' ? 'rgba(0,0,0,.35)' : '#fff';
      if (!thin) o += `<text x="${g.x0 + 12}" y="${mid + 6}" class="lname" fill="${L.ink}" stroke="${stroke}" pointer-events="none">${L.name}</text>`;
      else {
        const ly = g.yBot - 80 - i * 26, lx = g.x0 + g.cw * .42;
        o += `<path d="M${lx - 4} ${ly - 5} L${g.x0 + g.cw * .3 - i * 24} ${mid}" stroke="#fff" stroke-width="2" pointer-events="none"/><circle cx="${g.x0 + g.cw * .3 - i * 24}" cy="${mid}" r="3" fill="#fff"/>`;
        o += `<text x="${lx}" y="${ly}" class="lname" fill="#fff" stroke="rgba(0,0,0,.45)" pointer-events="none">${L.name}</text>`;
      }
    });
    // The edge of space
    const ye = LY.y(100, g);
    o += `<path d="M${g.x0} ${ye} H${g.x0 + g.cw}" stroke="#fff" stroke-width="2" stroke-dasharray="7 6" opacity=".8" pointer-events="none"/>`;
    o += `<text x="${g.x0 + g.cw - 8}" y="${ye - 6}" text-anchor="end" class="iname" style="fill:#fff;stroke:rgba(0,0,0,.4)" pointer-events="none">Edge of space</text>`;
    if (s.scale) o += `<text x="${g.x0 + g.cw / 2}" y="${T + 18}" text-anchor="middle" class="iname" style="fill:#fff;stroke:rgba(0,0,0,.5);font-size:13px" pointer-events="none">↑ The exosphere carries on up to about 10,000 km: 10 times higher than this picture!</text>`;
    // The ground
    o += `<rect x="${g.x0}" y="${g.yBot}" width="${g.cw}" height="10" fill="#4caf50"/><rect x="${g.x0}" y="${g.yBot + 10}" width="${g.cw}" height="6" fill="#8d6e4a"/>`;
    // Height scale. Not to scale, each layer has its own spacing, so the scale is broken at every layer edge.
    o += `<path d="M${g.x0 - 1} ${T} V${g.yBot}" stroke="var(--ink)" stroke-width="2"/>`;
    o += `<text x="${g.x0 - 6}" y="${T - 8}" text-anchor="end" class="ltick b">km</text>`;
    const tick = (km, bold) => { const y = LY.y(km, g); o += `<path d="M${g.x0 - 6} ${y} H${g.x0}" stroke="var(--ink)" stroke-width="${bold ? 2 : 1}"/><text x="${g.x0 - 9}" y="${y + 4}" text-anchor="end" class="ltick${bold ? ' b' : ''}">${fmt(km)}</text>`; };
    if (s.scale) for (let km = 0; km <= LY.TOP; km += 100) tick(km, km === 0);
    else {
      (g.narrow ? LY.TICKS_SMALL : LY.TICKS).forEach((list, i) => list.forEach(km => tick(km, km === LAYERS[i].hi || km === 0)));
      LAYERS.slice(0, 4).forEach(L => { const y = LY.y(L.hi, g); o += `<path d="M${g.x0 - 5} ${y + 7} l5 -3 l-5 -4 l5 -3" fill="none" stroke="var(--coral)" stroke-width="2"/>`; });
    }
    // Temperature graph, sharing the same heights
    o += `<rect x="${g.gx0 - 4}" y="${T}" width="${g.gx1 - g.gx0 + 8}" height="${g.yBot - T}" rx="8" fill="#fff" id="graph" style="cursor:ns-resize"/>`;
    [-100, -50, 0, 50].forEach(t => { const x = LY.tx(t, g); o += `<path d="M${x} ${T} V${g.yBot}" stroke="${t === 0 ? '#9aa6c7' : '#e1e6f5'}" pointer-events="none"/><text x="${x}" y="${g.yBot + 17}" text-anchor="middle" class="ltick">${String(t).replace('-', '−')}</text>`; });
    o += `<text x="${(g.gx0 + g.gx1) / 2}" y="${g.yBot + 36}" text-anchor="middle" class="ltick b">Temperature (°C)</text>`;
    let pts = [], off = null;
    for (let y = g.yBot; y >= T; y -= 2) {
      const km = LY.km(y, g); if (km >= 600) break;
      const t = tempAt(km);
      if (t > 50) { off = y; break; }
      pts.push(`${LY.tx(t, g).toFixed(1)},${y}`);
    }
    o += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--coral)" stroke-width="3.5" stroke-linejoin="round" pointer-events="none"/>`;
    if (off != null) o += `<path d="M${g.gx1 - 14} ${off + 6} L${g.gx1} ${off} M${g.gx1 - 8} ${off - 4} L${g.gx1} ${off} L${g.gx1 - 3} ${off + 8}" stroke="var(--coral)" stroke-width="3" fill="none" pointer-events="none"/>`
      + `<text x="${g.gx1 - 4}" y="${off - 12}" text-anchor="end" class="iname" pointer-events="none">${g.narrow ? 'Much hotter' : 'Much hotter: off the graph!'}</text>`;
    // The thermometer you move up and down
    const py = LY.y(s.probe, g), pt = tempAt(Math.min(s.probe, 600));
    o += `<path d="M${g.x0} ${py} H${g.gx1}" stroke="var(--yellow)" stroke-width="2.5" stroke-dasharray="6 5" pointer-events="none"/>`;
    o += `<circle cx="${LY.tx(pt, g)}" cy="${py}" r="9" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2" pointer-events="none"/>`;
    o += `<text x="${g.gx1 - 2}" y="${py - 8}" text-anchor="end" style="font-size:22px" pointer-events="none">🌡️</text>`;
    // Things placed in the sky
    SKYORDER.filter(id => s.placed[id] != null).forEach(id => {
      const [em, name] = SKY[id], x = g.x0 + s.fx[id] * g.cw, y = LY.y(s.placed[id], g), r = s.res[id];
      o += `<g class="pitem" data-id="${id}">${picSVG(em, x, y, g.narrow ? 24 : 32)}${s.scale && s.placed[id] < 100 ? '' : `<text x="${x}" y="${y + (g.narrow ? 22 : 28)}" text-anchor="middle" class="iname">${name}</text>`}`;
      if (r != null) o += `<circle cx="${x + 17}" cy="${y - 15}" r="9" fill="${r === false ? 'var(--coral)' : 'var(--green)'}"/><text x="${x + 17}" y="${y - 10}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#fff">${r === false ? '✗' : '✓'}</text>`;
      o += `</g>`;
    });
    const L = LY.layerAt(s.probe);
    const read = `<div class="readout">🌡️ <b>${kmText(s.probe)}</b> up · <b>${L.name}</b><br>${s.probe >= 600 ? 'Hot, but hardly any air left' : tempText(pt)}${pt > 100 && s.probe < 600 ? ', but too thin to feel hot' : ''} <span class="muted">· ${L.short}</span></div>`;
    return `<div class="lay-top"><span class="scaletag${s.scale ? ' true' : ''}">${s.scale ? '📏 To scale' : '↕ Not to scale'}</span>${read}</div>
      <svg id="laySvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="Layers of the atmosphere">${o}</svg>`;
  },
  // Where a pointer is on the picture: 'col' (the layers), 'graph', or nothing
  where(e) {
    const g = LY.geo(), b = $('#laySvg').getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    if (y < g.yTop - 6 || y > g.yBot + 4) return null;
    // Things stay to the right of the layer names
    if (x >= g.x0 && x <= g.x0 + g.cw) return { at: 'col', fx: Math.max(Math.min(.55, (g.narrow ? 110 : 160) / g.cw), Math.min(.94, (x - g.x0) / g.cw)), km: LY.km(y, g) };
    if (x >= g.gx0 - 6 && x <= g.gx1 + 6) return { at: 'graph', km: LY.km(y, g) };
    return null;
  },
  place(id, p) {
    const s = state.layers;
    s.placed[id] = p.km; s.fx[id] = p.fx; delete s.res[id]; s.chip = null; s.said = null;
    render();
  },
  check() {
    const s = state.layers, msgs = [];
    SKYORDER.filter(id => s.placed[id] != null && s.res[id] !== 'shown').forEach(id => {
      const [, name, lo, hi, at, hint] = SKY[id], km = s.placed[id];
      if (km >= lo && km <= hi) { s.res[id] = true; return; }
      s.tries[id] = (s.tries[id] || 0) + 1;
      if (s.tries[id] >= 3) { s.placed[id] = at; s.res[id] = 'shown'; msgs.push(`<b>${name}</b>: here is where it goes, about ${kmText(at)} up.`); return; }
      s.res[id] = false;
      msgs.push(`<b>${name}</b> is too ${km > hi ? 'high' : 'low'}. ${hint}`);
    });
    const done = SKYORDER.filter(id => s.res[id] === true || s.res[id] === 'shown').length, left = SKYORDER.length - Object.keys(s.placed).length;
    if (!msgs.length) s.said = { ok: true, text: done === SKYORDER.length ? 'All 9 are at the right height! 🎉' : `Everything so far is right! ${left} still to place.` };
    else s.said = { ok: false, msgs };
    render();
    emit('layers', { all: done === SKYORDER.length });
  }
};

// ================= Around the Earth =================
// The layers drawn as rings round a curved Earth, like a textbook picture. Point at a layer, or tap it, to read about it.
const EV = {
  // Land: each shape is a list of [how far across the picture (0–1), how far down from the surface in px]
  LAND: [
    [[-.05, 0], [.06, 0], [.14, 0], [.22, 0], [.27, 6], [.24, 22], [.17, 34], [.1, 52], [.02, 66], [-.05, 70]],
    [[.4, 0], [.5, 0], [.6, 0], [.68, 0], [.72, 10], [.66, 26], [.57, 36], [.5, 28], [.43, 30], [.39, 14]],
    [[.86, 0], [.96, 0], [1.05, 0], [1.05, 60], [.97, 48], [.9, 30], [.84, 14]],
    [[.3, 70], [.36, 62], [.42, 72], [.38, 86], [.31, 84]]
  ],
  // The Earth's middle is far below the picture, under a point three-quarters of the way across.
  // The ground is lifted so that the Earth still shows at the bottom left, where the curve dips.
  geo() {
    const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600, narrow = w < 560;
    const ex = w * .75, R = 1.6 * w, dip = R - Math.sqrt(R * R - ex * ex);
    const yTop = narrow ? 52 : 58, yBot = h - 14 - Math.min(dip, h * .35);
    return { w, h, narrow, ex, ey: yBot + R, R, yTop, yBot, H: yBot - yTop };
  },
  // The radius of the top of each layer (not to scale: each layer gets a share of the height)
  rings(g) { let r = g.R; return LY.BANDS.map(b => r += b * g.H); },
  onArc: (r, x, g) => g.ey - Math.sqrt(Math.max(0, r * r - (x - g.ex) ** 2)),
  stage() {
    const e = state.earth, g = EV.geo(), tops = EV.rings(g), inner = i => i ? tops[i - 1] : g.R;
    let o = `<rect width="${g.w}" height="${g.h}" fill="#070d24"/>`;
    // A few stars, always in the same places
    const r = rng(9);
    for (let i = 0; i < 50; i++) o += `<circle cx="${(r() * g.w).toFixed(0)}" cy="${(r() * g.h * .5).toFixed(0)}" r="${(r() * 1.2 + .4).toFixed(1)}" fill="#fff" opacity=".7"/>`;
    // The layers, outside first, so each smaller ring sits on top
    for (let i = 4; i >= 0; i--) o += `<circle cx="${g.ex}" cy="${g.ey}" r="${tops[i].toFixed(1)}" fill="${LAYERS[i].c}" data-layer="${LAYERS[i].id}" style="cursor:pointer"/>`;
    const inward = ([f, d]) => { const x = f * g.w, y = EV.onArc(g.R, x, g); return [x + (g.ex - x) / g.R * d, y + (g.ey - y) / g.R * d]; };
    o += `<clipPath id="evclip"><circle cx="${g.ex}" cy="${g.ey}" r="${g.R}"/></clipPath><circle cx="${g.ex}" cy="${g.ey}" r="${g.R}" fill="#2f7fd8"/>`
      + `<g clip-path="url(#evclip)" fill="#4caf50" pointer-events="none">${EV.LAND.map(c => `<path d="${smooth(c.map(inward))}"/>`).join('')}</g>`;
    // The layer being pointed at, or chosen, has a yellow edge
    const on = LAYERS.findIndex(L => L.id === (e.hover || e.sel));
    if (on >= 0) o += `<g fill="none" stroke="var(--yellow)" stroke-width="4" pointer-events="none"><circle cx="${g.ex}" cy="${g.ey}" r="${tops[on]}"/><circle cx="${g.ex}" cy="${g.ey}" r="${inner(on)}"/></g>`;
    // The edge of space, 100 km up, near the bottom of the thermosphere
    const re = tops[2] + (100 - 85) / (600 - 85) * (tops[3] - tops[2]);
    o += `<circle cx="${g.ex}" cy="${g.ey}" r="${re}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 6" opacity=".75" pointer-events="none"/>`;
    { const x = g.w * (g.narrow ? .72 : .78), y = EV.onArc(re, x, g); o += `<text x="${x}" y="${y - 6}" text-anchor="end" class="iname" style="fill:#fff;stroke:rgba(0,0,0,.4)" pointer-events="none">Edge of space</text>`; }
    // Layer names follow the curve; the height of each layer's top sits at its right-hand end
    LAYERS.forEach((L, i) => {
      const rm = (inner(i) + tops[i]) / 2, x = g.w * (g.narrow ? .38 : .4), y = EV.onArc(rm, x, g), turn = Math.asin((x - g.ex) / rm) * 180 / Math.PI;
      const stroke = L.ink === '#fff' ? 'rgba(0,0,0,.35)' : '#fff';
      o += `<text x="${x}" y="${y + 7}" text-anchor="middle" transform="rotate(${turn.toFixed(1)} ${x} ${y})" class="lname" style="font-size:${g.narrow ? 15 : 21}px" fill="${L.ink}" stroke="${stroke}" pointer-events="none">${L.name}</text>`;
      if (i < 4) { const bx = g.w * (g.narrow ? .9 : .93), by = EV.onArc(tops[i], bx, g); o += `<text x="${bx}" y="${by - 5}" text-anchor="end" class="iname" style="fill:#fff;stroke:rgba(0,0,0,.45)" pointer-events="none">${fmt(L.hi)} km</text>`; }
    });
    return `<div class="lay-top"><span class="scaletag">↕ Not to scale</span><div class="readout">👆 Point at a layer, or tap it, to find out about it.</div></div>
      <svg id="earthSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="The five layers of the atmosphere around the Earth">${o}</svg>`;
  },
  // The pop-up with a layer's facts, next to the pointer
  show(id, e, pinned) {
    const L = LAYERS.find(x => x.id === id), pop = $('#lpop'), m = $('main').getBoundingClientRect(), st = $('#stage').getBoundingClientRect();
    pop.innerHTML = `${pinned ? '<button class="close" data-act="lpopclose" aria-label="Close">✖</button>' : ''}<h3><span class="sw" style="background:${L.c}"></span> ${L.name}</h3>
      <p class="muted">${L.id === 'exo' ? 'From about 600 km up to about 10,000 km' : `From ${L.lo} to about ${fmt(L.hi)} km up`}</p>
      <p>🌡️ ${L.trend}</p><ul class="facts">${L.facts.map(f => `<li>${f}</li>`).join('')}</ul>`;
    pop.classList.remove('hidden');
    pop.dataset.pinned = pinned ? '1' : '';
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = e.clientX - m.left + 18, y = e.clientY - m.top + 18;
    if (x + pw > st.right - m.left - 8) x = Math.max(8, e.clientX - m.left - pw - 18);
    if (y + ph > st.bottom - m.top - 8) y = Math.max(8, st.bottom - m.top - ph - 8);
    pop.style.left = `${x}px`; pop.style.top = `${y}px`;
    const ea = state.earth;
    if (!ea.seen.includes(id)) { ea.seen.push(id); const d = $('#drawer'), keep = d.scrollTop; d.innerHTML = VIEWS.earth.drawer(); d.scrollTop = keep; fitBanner(); emit('explore', { seen: ea.seen.length }); }
  },
  hide() { const pop = $('#lpop'); pop.classList.add('hidden'); pop.dataset.pinned = ''; }
};

// ================= Water cycle =================
// A still landscape: the sea on the left, flat land, and a mountain on the right with a river running back to the sea.
// Step by step, each answer adds a part of the cycle to the picture. Build it shows every part, and children put the key words in place.
const WC = {
  geo() { const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600; return { w, h, narrow: w < 560, sea: h * .72, land: h * .7 }; },
  // The ground's height across the picture, as [across, down] fractions
  GROUND: [[.3, .72], [.4, .7], [.55, .7], [.62, .66], [.68, .56], [.72, .45], [.8, .3], [.88, .4], [.95, .47], [1, .48]],
  groundY(x, g) {
    const f = x / g.w, G = WC.GROUND;
    for (let i = 1; i < G.length; i++) if (f <= G[i][0]) { const [a, b] = G[i - 1], [c, d] = G[i]; return (b + (d - b) * (f - a) / (c - a)) * g.h; }
    return G[G.length - 1][1] * g.h;
  },
  // The river is drawn from the mountain down to the sea, so its moving dashes always flow downhill
  river: g => { const { w, h } = g; return `M${w * .765} ${h * .39} Q${w * .73} ${h * .44} ${w * .71} ${h * .5} Q${w * .67} ${h * .63} ${w * .6} ${h * .715} Q${w * .5} ${h * .745} ${w * .32} ${h * .745}`; },
  cloudAt: g => [g.w * .79, g.h * (g.narrow ? .22 : .17), Math.min(g.w, g.h) * .065],
  // The three key words, where each one goes on the picture, and a hint for when one is put in the wrong place
  WORDS: {
    evap: ['Evaporation', '#ffc83d', 'Evaporation is when liquid water turns into water vapour, a gas. Where is water turning into a gas and rising?'],
    cond: ['Condensation', '#ffffff', 'Condensation is when water vapour cools and turns back into tiny drops of water. Where do lots of tiny drops make something you can see?'],
    prec: ['Precipitation', '#a8d6ff', 'Precipitation is water falling from the sky, like rain or snow. Where is water falling?']
  },
  slotAt(id, g) { const [cx, cy, r] = WC.cloudAt(g); return { evap: [g.w * .19, g.h * .42], cond: [g.w * .56, g.h * (g.narrow ? .14 : .12)], prec: [g.w * (g.narrow ? .83 : .885), g.h * .5] }[id]; },
  // Step by step: what happens next?
  STEPS: [
    { part: 'evap', ok: 0, q: 'The Sun warms the sea. What happens to some of the water?',
      opts: ['It <b>evaporates</b>: it turns into water vapour, an invisible gas, and rises into the air.', 'It turns into clouds straight away.', 'It sinks to the bottom of the sea.'],
      hint: 'Warmth makes liquid water turn into a gas. The gas is invisible.',
      done: '<b>Evaporation</b>: the Sun warms the water, and it turns into <b>water vapour</b>, an invisible gas, which rises into the air.' },
    { part: 'cond', ok: 1, q: 'The wind carries the water vapour to the mountain. The air rises up the mountain and gets colder. What happens to the water vapour?',
      opts: ['It evaporates again.', 'It <b>condenses</b>: it cools and turns into tiny drops of water, which make a cloud.', 'It disappears for ever.'],
      hint: 'Think about what happens on a cold window when you breathe on it.',
      done: '<b>Condensation</b>: the water vapour cools and turns into tiny drops of liquid water. Millions of tiny drops make a <b>cloud</b>.' },
    { part: 'prec', ok: 2, q: 'The tiny drops in the cloud join together and get bigger and heavier. What happens?',
      opts: ['They float higher, into space.', 'They turn back into water vapour.', 'They <b>fall</b> as rain, or as snow if it is very cold.'],
      hint: 'Heavy things fall down.',
      done: '<b>Precipitation</b>: the drops get too heavy and fall as <b>rain</b>, or as <b>snow</b> when it is very cold.' },
    { part: 'river', ok: 0, q: 'The rain lands on the mountain. Where does the water go next?',
      opts: ['It runs down into rivers, which carry it back to the sea.', 'It stays on top of the mountain for ever.', 'It goes straight back up into the cloud.'],
      hint: 'Water always flows downhill.',
      done: 'Rivers carry the water back to the <b>sea</b>. Then the Sun warms the sea again, and the cycle goes round and round! 🔄' }
  ],
  // Which parts of the picture are showing
  shows(part) { const a = state.water; return a.mode === 'build' || a.step > WC.STEPS.findIndex(x => x.part === part); },
  pill(x, y, txt, bg, g, cls = '') {
    const fs = g.narrow ? .8 : 1, wd = 150 * fs, ht = 28 * fs;
    return `<g class="${cls}"><rect x="${x - wd / 2}" y="${y - ht / 2}" width="${wd}" height="${ht}" rx="${ht / 2}" fill="${bg}" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="${y + 5 * fs}" text-anchor="middle" class="wlab">${txt}</text></g>`;
  },
  // The water cycle in a cup: warm water, cling film on top, ice on the cling film. Each click is one step.
  CUP: [
    { act: '💧 Pour in warm water', done: 'Warm (not boiling) water goes into the cup. Some of it <b>evaporates</b> straight away: it turns into water vapour, an invisible gas, and rises.' },
    { act: '🎞️ Cover the cup with cling film', done: 'The cling film stops the water vapour from escaping.' },
    { act: '🧊 Put ice cubes on the cling film', done: 'The ice makes the cling film <b>cold</b>.' },
    { act: '⏱️ Wait a few minutes', done: 'When the water vapour touches the cold cling film, it cools and <b>condenses</b> into tiny drops of water underneath it.' },
    { act: '⏱️ Wait a bit longer', done: 'The drops join together and get heavy, so they fall back into the water: <b>precipitation</b>! The same water goes round and round.' }
  ],
  cupStage() {
    const a = state.water, g = WC.geo(), { w, h } = g, n = a.cup, fs = g.narrow ? .8 : 1;
    const table = h * .84, bw = Math.min(w * .26, h * .36), tw = bw * 1.25, ch = Math.min(h * .56, bw * 1.6), cx = w * (g.narrow ? .42 : .38), top = table - ch;
    const side = (f, s2) => cx + s2 * (bw / 2 + (tw - bw) / 2 * f);   // the edge of the cup, f = 0 at the bottom, 1 at the top
    const lvl = .45, wy = table - ch * lvl;
    let o = `<rect width="${w}" height="${h}" fill="#eef4fb"/><rect x="0" y="${table}" width="${w}" height="${h - table}" fill="#c9a77c"/><rect x="0" y="${table}" width="${w}" height="7" fill="#a8835a"/>`;
    // The warm water
    if (n >= 1) o += `<path d="M${side(0, -1)} ${table} L${side(lvl, -1)} ${wy} L${side(lvl, 1)} ${wy} L${side(0, 1)} ${table} Z" fill="#9fd0ff"/><path d="M${side(lvl, -1)} ${wy} L${side(lvl, 1)} ${wy}" stroke="#5fa8e8" stroke-width="3"/>`
      + `<text x="${cx}" y="${table - ch * .18}" text-anchor="middle" class="wsmall" style="font-size:${14 * fs}px">warm water 🌡️</text>`;
    // Water vapour rising: invisible, so shown only by faint dashed arrows
    if (n >= 1) [-.25, 0, .25].forEach(f => {
      const x = cx + f * bw, y0 = wy - 6, y1 = top + ch * (n >= 2 ? .16 : .02);
      o += `<path class="vap" d="M${x} ${y0} q6 ${(y1 - y0) / 4} 0 ${(y1 - y0) / 2} q-6 ${(y1 - y0) / 4} 0 ${(y1 - y0) / 2}" stroke="#7fb2e6" stroke-width="3" fill="none"/><path d="M${x - 5} ${y1 + 7} l5 -7 l5 7" stroke="#7fb2e6" stroke-width="3" fill="none"/>`;
    });
    // The cup itself
    o += `<path d="M${side(1, -1)} ${top} L${side(0, -1)} ${table} L${side(0, 1)} ${table} L${side(1, 1)} ${top}" fill="rgba(220,235,255,.35)" stroke="#7d8db0" stroke-width="3"/>`;
    // Cling film, sagging a little in the middle
    const sag = ch * (n >= 3 ? .08 : .04), filmY = x => top + sag * (1 - ((x - cx) / (tw / 2)) ** 2);
    if (n >= 2) o += `<path d="M${side(1, -1) - 8} ${top + 10} L${side(1, -1)} ${top} Q${cx} ${top + 2 * sag} ${side(1, 1)} ${top} L${side(1, 1) + 8} ${top + 10}" stroke="#b9cbe6" stroke-width="4" fill="none" stroke-linejoin="round"/>`;
    // Ice cubes on the cling film
    if (n >= 3) [[-.28, -4], [0, 6], [.28, -8]].forEach(([f, turn]) => { const x = cx + f * tw * .7, y = filmY(x) - bw * .07; o += `<rect x="${x - bw * .08}" y="${y - bw * .08}" width="${bw * .16}" height="${bw * .16}" rx="${bw * .03}" fill="#eaf7ff" stroke="#8fc0e6" stroke-width="2" transform="rotate(${turn} ${x} ${y})"/>`; });
    // Drops under the cling film, bigger once they are ready to fall
    if (n >= 4) for (let i = 0; i < 9; i++) { const x = cx - tw * .38 + i * tw * .095, y = filmY(x) + 5; o += `<circle cx="${x}" cy="${y}" r="${n >= 5 ? 4.5 : 2.6}" fill="#4aa3e8" opacity=".85"/>`; }
    // Drops falling back into the water
    if (n >= 5) [-.2, -.05, .1, .24].forEach((f, i) => { const x = cx + f * tw * .8, y0 = filmY(x) + 8; o += `<circle class="drop" style="--d:${(wy - y0 - 6).toFixed(0)}px;animation-delay:${(-i * .3).toFixed(1)}s" cx="${x}" cy="${y0}" r="4" fill="#2f7fd8"/>`; });
    // The key words, joined to the part of the cup they describe
    const lx = Math.min(w - 80 * fs, side(1, 1) + 105 * fs), lab = (y, ty, tx, name, bg) => `<path d="M${tx} ${ty} L${lx - 75 * fs} ${y}" stroke="var(--ink)" stroke-width="1.5"/>` + WC.pill(lx, y, name, bg, g);
    if (n >= 1) o += lab(top + ch * .38, top + ch * .38, cx + bw * .27, 'Evaporation', '#ffc83d');
    if (n >= 4) o += lab(top - ch * .02, filmY(cx + tw * .3) + 6, cx + tw * .3, 'Condensation', '#ffffff');
    if (n >= 5) o += lab(top + ch * .2, top + ch * .2, cx + tw * .26, 'Precipitation', '#a8d6ff');
    return `<div class="lay-top"><span class="scaletag">🥤 A model</span><div class="readout">${n < 5 ? `${n} of 5 steps done` : 'A water cycle in a cup!'}</div></div>
      <svg id="waterSvg" viewBox="0 0 ${w} ${h}" aria-label="A model of the water cycle in a cup">${o}</svg>`;
  },
  stage() {
    if (state.water.mode === 'cup') return WC.cupStage();
    const a = state.water, g = WC.geo(), { w, h } = g, fs = g.narrow ? .8 : 1;
    let o = `<rect width="${w}" height="${h}" fill="#bfe3ff"/>`;
    // The Sun
    const sx = w * .12, sy = h * .25, sr = Math.min(w, h) * .055;
    for (let i = 0; i < 12; i++) { const an = i * Math.PI / 6; o += `<path d="M${sx + Math.cos(an) * sr * 1.3} ${sy + Math.sin(an) * sr * 1.3} L${sx + Math.cos(an) * sr * 1.75} ${sy + Math.sin(an) * sr * 1.75}" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>`; }
    o += `<circle cx="${sx}" cy="${sy}" r="${sr}" fill="#ffc83d" stroke="#ffb300" stroke-width="3"/>`;
    // The sea, the land and the mountain
    o += `<rect x="0" y="${g.sea}" width="${w * .34}" height="${h - g.sea}" fill="#2f7fd8"/>`;
    o += `<linearGradient id="rock" gradientUnits="userSpaceOnUse" x1="0" y1="${h * .3}" x2="0" y2="${h * .62}"><stop offset="0" stop-color="#9b8a76"/><stop offset=".55" stop-color="#8f9a6a"/><stop offset="1" stop-color="#6cbf5f"/></linearGradient>`;
    o += `<path d="M${w * .3} ${h} ${WC.GROUND.map(([x, y]) => `L${x * w} ${y * h}`).join(' ')} L${w} ${h} Z" fill="url(#rock)" stroke="#4e9c45" stroke-width="3" stroke-linejoin="round"/>`;
    o += `<path d="${WC.river(g)}" stroke="#4aa3e8" stroke-width="${g.narrow ? 5 : 8}" fill="none" stroke-linecap="round"/>`;
    // Evaporation: water vapour is invisible, so it is only shown by faint arrows, up from the sea and across to the mountain
    if (WC.shows('evap')) {
      for (let i = 0; i < 4; i++) {
        const x = w * (.05 + .07 * i), y0 = g.sea - 6, y1 = h * .5;
        o += `<path class="vap" d="M${x} ${y0} q8 ${(y1 - y0) / 4} 0 ${(y1 - y0) / 2} q-8 ${(y1 - y0) / 4} 0 ${(y1 - y0) / 2}" stroke="#fff" stroke-width="3" fill="none"/><path d="M${x - 6} ${y1 + 8} L${x} ${y1} L${x + 6} ${y1 + 8}" stroke="#fff" stroke-width="3" fill="none"/>`;
      }
      o += `<path class="vap" d="M${w * .3} ${h * .44} Q${w * .45} ${h * .36} ${w * .6} ${h * .38}" stroke="#fff" stroke-width="3" fill="none"/><path d="M${w * .6 - 8} ${h * .38 - 7} L${w * .6} ${h * .38} L${w * .6 - 9} ${h * .38 + 6}" stroke="#fff" stroke-width="3" fill="none"/>`;
      o += `<path class="vap" d="M${w * .63} ${h * .5} Q${w * .67} ${h * .38} ${w * .7} ${h * .27}" stroke="#fff" stroke-width="3" fill="none"/><path d="M${w * .7 - 8} ${h * .27 + 5} L${w * .7} ${h * .27} L${w * .7 + 4} ${h * .27 + 8}" stroke="#fff" stroke-width="3" fill="none"/>`;
      o += `<text x="${w * .19}" y="${h * .53}" text-anchor="middle" class="wsmall" style="font-size:${12 * fs}px">water vapour (an invisible gas)</text>`;
      o += `<text x="${w * .45}" y="${h * .345}" text-anchor="middle" class="wsmall" style="font-size:${12 * fs}px">carried by the wind</text>`;
    }
    // Condensation: a cloud over the mountain
    const [cx, cy, r] = WC.cloudAt(g);
    if (WC.shows('cond')) [[-1.4, .25, .8], [-.6, -.25, 1.05], [.45, -.35, 1.15], [1.35, .15, .85], [0, .35, .95]].forEach(([dx, dy, k]) => { o += `<circle cx="${cx + dx * r}" cy="${cy + dy * r}" r="${k * r}" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>`; });
    // Precipitation: rain falling from the cloud onto the mountain
    if (a.cold) o += `<path d="M${w * .765} ${h * .37} L${w * .8} ${h * .3} L${w * .84} ${h * .355} L${w * .82} ${h * .35} L${w * .805} ${h * .365} L${w * .79} ${h * .35} L${w * .775} ${h * .37} Z" fill="#fff" stroke="#dfe6f5" stroke-width="2"/>`;
    if (WC.shows('prec')) {
      for (let i = 0; i < 14; i++) {
        const x = cx - r * 1.4 + (i * 2.8 * r / 13), top = cy + r * .7, len = Math.max(10, WC.groundY(x, g) - top - 14);
        o += a.cold
          ? `<circle class="flake" style="--d:${len.toFixed(0)}px;animation-delay:${(-(i * .83) % 3).toFixed(2)}s" cx="${x}" cy="${top + 4}" r="3.5" fill="#fff" stroke="#9fb2d6" stroke-width="1.2"/>`
          : `<path class="drop" style="--d:${len.toFixed(0)}px;animation-delay:${(-(i * .37) % 1.1).toFixed(2)}s" d="M${x} ${top} l-2 12" stroke="#2f7fd8" stroke-width="2.5" stroke-linecap="round"/>`;
      }
    }
    // Rivers carry the water back to the sea
    if (WC.shows('river')) {
      o += `<path class="flow" d="${WC.river(g)}" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      o += `<text x="${w * .5}" y="${h * .82}" text-anchor="middle" class="wsmall">Rivers carry the water back to the sea</text>`;
    }
    // The key words: labels in Step by step; spaces to fill in Build it
    Object.entries(WC.WORDS).forEach(([id, [name, bg]], i) => {
      const [x, y] = WC.slotAt(id, g);
      if (a.mode === 'step') { if (WC.shows(id)) o += WC.pill(x, y, name, bg, g); return; }
      const got = a.placed[id];
      if (got) o += WC.pill(x, y, WC.WORDS[got][0], WC.WORDS[got][1], g);
      else {
        const wd = 150 * fs, ht = 28 * fs;
        o += `<g class="slot${a.said && a.said.slot === id ? ' wrong' : ''}" data-slot="${id}"><rect x="${x - wd / 2}" y="${y - ht / 2}" width="${wd}" height="${ht}" rx="${ht / 2}" fill="rgba(255,255,255,.75)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/><text x="${x}" y="${y + 5 * fs}" text-anchor="middle" class="wlab" fill="var(--muted)">${i + 1}. ?</text></g>`;
      }
    });
    return `<div class="lay-top"><span class="scaletag">↕ Not to scale</span><div class="readout">${a.cold ? '❄️ A cold day: below 0 °C on the mountain top' : '☀️ A warm day'}</div></div>
      <svg id="waterSvg" viewBox="0 0 ${w} ${h}" aria-label="The water cycle: sea, clouds, mountain and river">${o}</svg>`;
  },
  // The empty space nearest to a pointer, if it is close enough
  slotNear(e) {
    const g = WC.geo(), b = $('#waterSvg').getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    let best = null, d = 90;
    Object.keys(WC.WORDS).forEach(id => { if (state.water.placed[id]) return; const [sx, sy] = WC.slotAt(id, g), dd = Math.hypot(sx - x, sy - y); if (dd < d) { d = dd; best = id; } });
    return best;
  },
  answer(k) {
    const a = state.water, S = WC.STEPS[a.step];
    if (!S) return;
    if (k !== S.ok) { if (!a.wrong.includes(k)) a.wrong.push(k); render(); return; }
    a.step++; a.wrong = [];
    render();
    if (a.step === WC.STEPS.length) emit('wsteps');
  },
  // Build it: put a key word into a space on the picture
  put(word, slot) {
    const a = state.water;
    a.chip = null;
    if (word === slot) { a.placed[slot] = word; a.said = Object.keys(a.placed).length === 3 ? { ok: true, text: 'You built the water cycle! Water evaporates from the sea, condenses into clouds, falls as precipitation, and rivers carry it back to the sea.' } : null; render(); if (Object.keys(a.placed).length === 3) emit('wbuild'); return; }
    a.said = { ok: false, slot, text: `<b>${WC.WORDS[word][0]}</b> doesn't go there. ${WC.WORDS[word][2]}` };
    render();
  }
};

// ================= Is it pure? =================
// Five kinds of water that all look clear. Evaporate 1 litre of each and see what is left behind in the dish.
const PU = {
  // [name, short name, grams left from 1 litre, what is left, pure?]
  SAMPLES: {
    sea:     ['Sea water', 'Sea', 35, '35 g', 'Lots of <b>salt</b>.', false],
    river:   ['River water', 'River', .3, 'about 0.3 g', 'A little: <b>minerals</b> from rocks and soil.', false],
    tap:     ['Tap water', 'Tap', .4, 'about 0.4 g', 'A little: <b>minerals</b>, like the white scale inside a kettle.', false],
    rain:    ['Rain water', 'Rain', 0, 'almost nothing', 'Almost nothing. Rain is <b>nearly pure</b>.', true],
    mineral: ['Bottled mineral water', 'Mineral', .5, 'about 0.5 g', 'A little: the <b>minerals</b> written on its label.', false]
  },
  ORDER: ['sea', 'river', 'tap', 'rain', 'mineral'],
  QUESTIONS: [
    { q: 'Which water had the <b>most</b> dissolved in it?', opts: ['Tap water', 'Sea water', 'Rain water'], ok: 1, hint: 'Look for the dish with the most left in it.' },
    { q: 'Which water was <b>closest to pure</b>?', opts: ['Rain water', 'Bottled mineral water', 'River water'], ok: 0, hint: 'Pure water leaves nothing behind when it evaporates.' },
    { q: 'Tap water looks completely clear. Is it pure?', opts: ['Yes, because you can see through it.', 'No, it had substances dissolved in it.'], ok: 1, hint: 'Look at the tap water dish. Was anything left?' }
  ],
  stage() {
    const u = state.pure, st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600, narrow = w < 560;
    const bench = h * .62, step = w / 5, sz = Math.min(step * .74, h * .4);
    let o = `<rect width="${w}" height="${h}" fill="#eef4fb"/><rect x="0" y="${bench}" width="${w}" height="${h - bench}" fill="#c9a77c"/><rect x="0" y="${bench}" width="${w}" height="8" fill="#a8835a"/>`;
    PU.ORDER.forEach((id, i) => {
      const [, short, grams, left] = PU.SAMPLES[id], cx = step * (i + .5);
      if (!u.heated) {
        // A beaker of clear water
        const bw = sz * .75, bh = sz, x0 = cx - bw / 2, y0 = bench - bh;
        o += `<rect x="${x0}" y="${y0 + bh * .25}" width="${bw}" height="${bh * .75}" fill="#d6ecff" opacity=".9"/>`;
        o += `<path d="M${x0} ${y0} V${bench} H${x0 + bw} V${y0}" fill="none" stroke="#7d8db0" stroke-width="3"/><path d="M${x0} ${y0 + bh * .25} H${x0 + bw}" stroke="#8fc6ff" stroke-width="2"/>`;
        o += `<text x="${cx}" y="${y0 + bh * .6}" text-anchor="middle" class="wsmall" style="font-size:${narrow ? 10 : 14}px">1 litre</text>`;
      } else {
        // An evaporating dish with whatever was left behind
        const dw = sz * 1.08, dh = sz * .42, y0 = bench - dh;
        o += `<path d="M${cx - dw / 2} ${y0} Q${cx} ${bench + dh * .3} ${cx + dw / 2} ${y0}" fill="#f5f5f2" stroke="#7d8db0" stroke-width="3"/>`;
        if (grams >= 10) o += `<path d="M${cx - dw * .42} ${y0 + dh * .1} Q${cx - dw * .2} ${y0 - dh * .55} ${cx} ${y0 - dh * .5} Q${cx + dw * .22} ${y0 - dh * .55} ${cx + dw * .42} ${y0 + dh * .1} Q${cx} ${bench + dh * .1} ${cx - dw * .42} ${y0 + dh * .1}Z" fill="#fff" stroke="#c9ccd6" stroke-width="2"/>`
          + [-.25, -.1, .05, .2].map((f, k) => `<circle cx="${cx + f * dw}" cy="${y0 + dh * (.35 + (k % 2) * .15)}" r="2.5" fill="#dfe3ee"/>`).join('');
        else if (grams > 0) o += `<ellipse cx="${cx}" cy="${y0 + dh * .45}" rx="${dw * .28}" ry="${dh * .2}" fill="none" stroke="#d9d4bf" stroke-width="${3 + grams * 9}"/>`;
        o += `<text x="${cx}" y="${y0 - 12}" text-anchor="middle" class="wsmall" style="font-size:${narrow ? 11 : 16}px">${narrow ? left.replace('about ', '').replace('almost nothing', '≈ 0 g') : left}</text>`;
        // A small flame shows it was heated
        o += `<text x="${cx}" y="${bench + 30}" text-anchor="middle" style="font-size:${narrow ? 14 : 18}px">🔥</text>`;
      }
      o += `<text x="${cx}" y="${bench + (u.heated ? 54 : 30)}" text-anchor="middle" class="glabel" style="font-size:${narrow ? 12 : 17}px">${short}</text>`;
      const p = u.pred[id];
      if (p != null) {
        const right = p === PU.SAMPLES[id][5];
        o += `<text x="${cx}" y="${bench + (u.heated ? 74 : 50)}" text-anchor="middle" class="gsmall" style="font-size:${narrow ? 10 : 13}px">${narrow ? '' : 'You said: '}${p ? 'pure' : 'not pure'}${u.heated ? (right ? ' ✅' : ' ❌') : ''}</text>`;
      }
    });
    return `<div class="lay-top"><span class="scaletag${u.heated ? '' : ' true'}">${u.heated ? '🔥 After' : '💧 Before'}</span><div class="readout">${u.heated ? 'All the water has <b>evaporated</b>. What is left in each dish?' : '1 litre of each kind of water. They all look <b>clear</b>.'}</div></div>
      <svg id="pureSvg" viewBox="0 0 ${w} ${h}" aria-label="Five kinds of water${u.heated ? ', after evaporating' : ''}">${o}</svg>`;
  },
  answer(qi, k) {
    const u = state.pure, Q = PU.QUESTIONS[qi];
    if (k === Q.ok) { u.ans[qi] = true; delete u.wrong[qi]; } else u.wrong[qi] = [...(u.wrong[qi] || []), k];
    render();
    if (PU.QUESTIONS.every((_, i) => u.ans[i])) emit('pure');
  }
};

// ================= River town =================
// A made-up town by the River Danube. Spot the pollution, then use science and technology to make things better.
const RT = {
  // x: how far across the picture. river / air: how much this place pollutes them. fix: [picture, what to do, how it helps]
  PLACES: {
