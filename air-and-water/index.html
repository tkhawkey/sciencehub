      yes: 'Yes, it is pollution. Farm chemicals are substances added by people. In the river they can harm fish, and make too much green slime grow.',
      fix: ['🌾', 'Use less fertiliser, and leave a strip of grass and trees by the river', 'The grass and trees soak up the chemicals before they reach the river.'] },
    houses: { em: '🏠', name: 'The houses', x: .28, pol: true, river: 2, air: 0,
      see: 'Plastic bottles and bags have been dropped and blown into the river.',
      yes: 'Yes, it is pollution. Plastic is added by people. It harms animals that eat it or get tangled in it, and it takes hundreds of years to break down.',
      fix: ['♻️', 'Put out recycling bins and pick up the litter', 'Plastic is recycled into new things instead of ending up in the river.'] },
    tree: { em: '🍂', name: 'The tree by the river', x: .43, pol: false,
      see: 'It is autumn. Leaves from the tree fall into the river.',
      no: 'Right, this is <b>not</b> pollution. People did not add the leaves: they fall naturally. Rotting leaves are even food for tiny river animals.' },
    road: { em: '🚗', name: 'The busy road', x: .57, pol: true, river: 0, air: 3,
      see: 'Cars and lorries burn petrol and diesel. Their exhaust fumes go into the air.',
      yes: 'Yes, it is pollution. Exhaust fumes are substances added by people. They make the air dirty and can harm people\'s lungs.',
      fix: ['🚌', 'Run electric buses and build cycle paths', 'Electric buses and bikes do not give out exhaust fumes in the town.'] },
    factory: { em: '🏭', name: 'The factory', x: .73, pol: true, river: 3, air: 3,
      see: 'Smoke comes out of the chimney, and a pipe pours dirty water into the river.',
      yes: 'Yes, it is pollution. The smoke and the dirty water are substances added by people, and they harm the air, the river and living things.',
      fix: ['🧪', 'Put filters on the chimney, and clean the water before it goes into the river', 'Filters catch most of the harmful substances, and a treatment works cleans the water.'] },
    tip: { em: '🗑️', name: 'The rubbish tip', x: .9, pol: true, river: 2, air: 1,
      see: 'Rubbish is piled up next to the river. Rain washes dirty liquid out of it into the water, and it smells.',

  },
  ORDER: ['farm', 'houses', 'tree', 'road', 'factory', 'tip'],
  LEVELS: [['Very poor', '😫', '#d9534f'], ['Poor', '😟', '#f0892e'], ['OK', '😐', '#ffc83d'], ['Good', '🙂', '#8bc34a'], ['Very good', '😄', '#22b07d']],
  RIVERS: ['#8a7d4a', '#86935a', '#5f93a8', '#4a9ad8', '#2f86e0'],
  // 0 (very poor) to 4 (very good)
  level(kind) {
    const t = state.town, P = RT.PLACES, max = RT.ORDER.reduce((n, id) => n + (P[id][kind] || 0), 0);
    const now = RT.ORDER.reduce((n, id) => n + (t.fixed[id] ? 0 : (P[id][kind] || 0)), 0);

  },
  meter(label, lv) {

  },
  stage() {
    const t = state.town, st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600, narrow = w < 560, f = t.fixed;
    const rl = RT.level('river'), al = RT.level('air'), em = narrow ? 30 : Math.min(60, w * .065), landY = h * .6, r0 = h * .72, r1 = h * .88;

    for (let i = 0; i < rl; i++) o += `<text x="${w * (.14 + i * .2)}" y="${r0 + (r1 - r0) * (i % 2 ? .45 : .7)}" text-anchor="middle" style="font-size:${em * .6}px">🐟</text>`;

    { const x = X('road');

    // Numbered circles to tap, while spotting the pollution
    if (t.mode === 'spot') RT.ORDER.forEach((id, i) => {
      const x = X(id), y = h * .4, done = t.answered[id], on = t.open === id, r = narrow ? 15 : 20;

        + `<text x="${x}" y="${y + (narrow ? 5 : 7)}" text-anchor="middle" style="font-size:${narrow ? 14 : 19}px;font-weight:700;fill:${done ? '#fff' : 'var(--ink)'}">${done ? '✓' : i + 1}</text></g>`;
    });
    return `<div class="lay-top">${RT.meter('💧 River', rl)}${RT.meter('💨 Air', al)}</div>
      <svg id="townSvg" viewBox="0 0 ${w} ${h}" aria-label="Devín, by the River Danube">${o}</svg>`;

  answer(yes) {
    const t = state.town, P = RT.PLACES[t.open];

// A chip can be tapped (then tap the sky) or dragged onto the picture.
const TAP = {
  sky: id => { const s = state.layers; s.chip = s.chip === id ? null : id; render(); },
  wword: id => { const a = state.water; a.chip = a.chip === id ? null : id; a.said = null; render(); }
};
const DROP = {
  sky: (id, e) => { const p = LY.where(e); if (p && p.at === 'col') LY.place(id, p); },
  // A word dropped on (or near) a space goes into that space
  wword: (id, e) => { const sl = WC.slotNear(e); if (sl) WC.put(id, sl); }
};
const Chips = {
  start(e, btn) {
    if (btn.disabled) return;
    e.preventDefault();
    Chips.d = { kind: btn.dataset.kind, id: btn.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null, btn };
    try { btn.setPointerCapture(e.pointerId); } catch {}
  },
  move(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    if (!d.ghost && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) {
      d.ghost = d.btn.cloneNode(true); d.ghost.classList.add('chip-ghost'); d.ghost.style.width = d.btn.offsetWidth + 'px';
      document.body.appendChild(d.ghost);
    }
    if (d.ghost) { d.ghost.style.left = e.clientX + 'px'; d.ghost.style.top = e.clientY + 'px'; }
  },
  end(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    Chips.d = null;
    if (!d.ghost) return TAP[d.kind](d.id);
    d.ghost.remove();
    const r = $('#stage').getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) DROP[d.kind](d.id, e);
  }
};
document.addEventListener('pointerdown', e => { const b = e.target.closest('.chip'); if (b) Chips.start(e, b); });
document.addEventListener('pointermove', e => Chips.move(e));
document.addEventListener('pointerup', e => Chips.end(e));
document.addEventListener('pointercancel', () => { if (Chips.d) { Chips.d.ghost?.remove(); Chips.d = null; } });

function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('aw-done', state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}
function startMission(i) {
  closeModals();
  state.mission = i; MISSIONS[i].setup(); EV.hide();
  location.hash = 'view=' + state.view;
  const m = MISSIONS[i];
  $('#bannerKicker').textContent = `Mission ${i + 1} of ${MISSIONS.length}: ${m.title}`;
  $('#bannerText').innerHTML = m.task; $('#bannerHint').innerHTML = m.hint;
  $('#bannerHint').classList.add('hidden'); $('#hintBtn').textContent = '💡 Show a hint';
  $('#banner').classList.remove('hidden');
  render();
}
function stopMission() { state.mission = null; $('#banner').classList.add('hidden'); fitBanner(); }
// The banner sits over the top of the drawer, so the drawer's cards start below it
function fitBanner() { $('#drawer').style.paddingTop = state.mission == null ? '' : `${$('#banner').offsetHeight + 18}px`; }
function updateStars() { $('#starCount').textContent = `${state.done.filter(id => MISSIONS.some(m => m.id === id)).length}/${MISSIONS.length} ⭐`; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }

  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = `${Math.random() * 100}vw`; s.style.animationDuration = `${2 + Math.random() * 2}s`; s.style.animationDelay = `${Math.random() * .6}s`;

}

      const qs = PU.QUESTIONS.map((Q, i) => `<div style="margin-top:${i ? 10 : 4}px"><p>${i + 1}. ${Q.q}</p><div class="stops">${Q.opts.map((t, k) => {
        const cls = u.ans[i] && k === Q.ok ? ' done' : (u.wrong[i] || []).includes(k) ? ' wrong' : '';
        return `<button class="opt${cls}" data-act="pans" data-q="${i}" data-k="${k}"${u.ans[i] || (u.wrong[i] || []).includes(k) ? ' disabled' : ''}>${t}</button>`; }).join('')}</div>
        ${u.wrong[i] && !u.ans[i] ? `<p class="spot">💡 ${Q.hint}</p>` : ''}</div>`).join('');
      const finished = PU.QUESTIONS.every((_, i) => u.ans[i]);
      const right = PU.ORDER.filter(id => u.pred[id] === PU.SAMPLES[id][5]).length;
      return `${finished ? `<div class="card says good"><h2>Is it pure?</h2>
          <div class="science"><b>🔬 The science</b>Most water on Earth is <b>not pure</b>. It has substances <b>dissolved</b> in it, even when it looks clear.</div>
          <p>Rain is nearly pure because it comes from water that <b>evaporated</b>: when water evaporates, the dissolved substances are left behind, just like in the dishes.</p></div>` : ''}
        <div class="card says${finished ? '' : ' wq'}">${finished ? '' : '<h2>Is it pure?</h2>'}<h3>❓ What do the dishes show?</h3>${qs}</div>
        <div class="card"><h3>📋 What was left from 1 litre</h3>
          <table class="gtable ptable"><tr><th>Water</th><th>Left behind</th><th>You said</th></tr>
          ${PU.ORDER.map(id => { const S = PU.SAMPLES[id], p = u.pred[id]; return `<tr><td>${S[0]}</td><td>${S[3]}</td><td>${p ? 'pure' : 'not pure'} ${p === S[5] ? '✅' : '❌'}</td></tr>`; }).join('')}</table>
          <p class="muted">Your predictions: ${right} of 5 right.${u.reason ? ` Your reason: “${esc(u.reason)}”` : ''}</p>
          <ul class="facts">${PU.ORDER.map(id => `<li><b>${PU.SAMPLES[id][1]}:</b> ${PU.SAMPLES[id][4]}</li>`).join('')}</ul>
          <div class="navrow" style="margin-top:8px"><button class="btn" data-act="preset">↺ Start again</button></div></div>`;
    }
  },
  town: {
    label: '🏰 <span class="tl">Devín</span>',
    stage: () => RT.stage(),
    drawer() {
      const t = state.town, P = RT.PLACES;
      const top = `<div class="card"><h2>Devín, on the Danube</h2>
          <p><b>Devín</b> is by the <b>River Danube</b>, in Slovakia, under its castle. The farm, factory and rubbish tip in this picture are <b>made up</b>.</p>
          <p><b>🔬 What is pollution, and how can science and technology help?</b></p>
          <div class="stops"><button class="opt${t.mode === 'spot' ? ' on' : ''}" data-act="tmode2" data-m="spot">🔍 Spot the pollution</button><button class="opt${t.mode === 'fix' ? ' on' : ''}" data-act="tmode2" data-m="fix">🛠️ Make it better</button></div></div>`;
      const defn = `<div class="card"><h3>📖 What is pollution?</h3>
          <p><b>Pollution</b> is when <b>harmful substances</b> are added to the environment <b>by humans</b>.</p>
          <ol class="facts"><li><b>It is caused by humans.</b> Things that happen naturally, like leaves falling, are not pollution.</li>
          <li><b>It contaminates the environment.</b> The substances make the air, water or land dirty, and harm living things.</li></ol></div>`;
      if (t.mode === 'spot') {
        const found = RT.ORDER.filter(id => t.answered[id]).length, Q = P[t.open];
        const ask = Q ? `<div class="card says${t.answered[t.open] ? ' good' : ''}"><h3>${Q.em} ${Q.name}</h3><p>${Q.see}</p>
            ${t.answered[t.open] ? `<p class="job">${Q.pol ? Q.yes : Q.no}</p>`
              : `<p><b>Is this pollution?</b></p><div class="navrow"><button class="btn" data-act="tans" data-v="1">✅ Yes</button><button class="btn" data-act="tans" data-v="0">❌ No</button></div>
                 ${t.wrong[t.open] ? `<p class="spot">💡 Not quite. Check both parts: 1. Was it caused by <b>humans</b>? 2. Does it <b>contaminate</b> the environment: make the air, water or land dirty and harmful?</p>` : ''}`}</div>`
          : `<div class="card says"><h3>👆 Tap a numbered circle</h3><p>Look at each place in the town. Is it causing <b>pollution</b>?</p></div>`;
        return `${top}${ask}${defn}<div class="card"><p class="muted">You have looked at ${found} of 6 places.</p>
          ${found === 6 ? '<p class="job">🎉 You found all 5 kinds of pollution, and spotted that the falling leaves are natural. Now try <b>Make it better</b>!</p>' : ''}</div>`;
      }
      const ids = RT.ORDER.filter(id => P[id].pol), n = ids.filter(id => t.fixed[id]).length;
      return `${top}${n === ids.length ? `<div class="card says good"><h3>🌍 Science and technology: good and bad</h3>
          <div class="science"><b>🔬 The science</b>Science and technology can have <b>good</b> and <b>bad</b> effects on our local area.</div>
          <p>Some science and technology <b>caused</b> the pollution: the factory, the cars and lorries, and farm chemicals.</p>
          <p>Other science and technology <b>helped</b>: filters, water treatment, electric buses and recycling.</p></div>` : ''}
        ${defn}
        <div class="card"><h3>🛠️ Use science and technology to help</h3><p class="muted">Choose what to do in each place. Watch the river and the air.</p>
          ${ids.map(id => { const [em, what, how] = P[id].fix; return `<div class="fixrow"><span class="em">${em}</span><div><b>${P[id].name}</b><br>${what}
            ${t.fixed[id] ? `<p class="muted" style="margin:4px 0 0">✔ ${how}</p>` : ''}
            <div><button class="btn${t.fixed[id] ? ' active' : ''}" data-act="tfix" data-id="${id}">${t.fixed[id] ? '✔ Done (tap to undo)' : 'Do it'}</button></div></div></div>`; }).join('')}
          <p class="muted">${n} of ${ids.length} done.</p></div>`;
    }
  }
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function renderStage() { const v = VIEWS[state.view]; $('#stage').innerHTML = v.stage(); if (v.after) v.after(); }
function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>
    `<button class="btn${id === state.view ? ' active' : ''}" data-act="view" data-view="${id}" aria-label="${x.label.replace(/<[^>]+>/g, '').replace(/^\S+ /, '')}">${x.label}</button>`).join('');
  const keep = $('#drawer').scrollTop, same = render.last === state.view;
  $('#drawer').innerHTML = v.drawer();
  renderStage();
  // Staying on the same tab keeps the drawer where it was scrolled to
  if (same) $('#drawer').scrollTop = keep;
  render.last = state.view;
  fitBanner();
  autoHelp();
}

// ================= Actions =================
const ACTIONS = {
  view(el) { state.view = el.dataset.view; location.hash = 'view=' + state.view; EV.hide(); render(); },
  apred(el) { state.air.pred = el.dataset.g; render(); },
  apredsave() { if (state.air.pred) { state.air.predSaved = true; render(); } },
  amix() { const a = state.air; if (a.sorted) a.sorted = false; else a.seed++; a.tap = null; render(); },
  asort() { state.air.sorted = true; state.air.tap = null; render(); },
  alevel(el) { const a = state.air; a.level = +el.dataset.l; a.sorted = false; a.tap = null; a.msg = null; render(); $('#drawer').scrollTop = 0; },
  acheck() { AIR.check(); },
  apct(el) { AIR.answerPct(el.dataset.v); },
  lscale(el) { state.layers.scale = el.dataset.v === '1'; render(); },
  llayer(el) { state.layers.sel = el.dataset.l; render(); },
  lcheck() { LY.check(); },
  tmode2(el) { state.town.mode = el.dataset.m; state.town.open = null; render(); },
  tans(el) { RT.answer(el.dataset.v === '1'); },
  tfix(el) { RT.fix(el.dataset.id); },
  ppred(el) { state.pure.pred[el.dataset.id] = el.dataset.v === '1'; render(); },
  pheat() { const u = state.pure; if (PU.ORDER.every(id => u.pred[id] != null)) { u.heated = true; render(); $('#drawer').scrollTop = 0; } },
  pans(el) { PU.answer(+el.dataset.q, +el.dataset.k); },
  preset() { state.pure = freshPure(); render(); },
  wmode(el) { state.water = Object.assign(freshWater(), { mode: el.dataset.m, cold: state.water.cold }); render(); },
  wcold(el) { state.water.cold = el.dataset.v === '1'; render(); },
  wcup() { const a = state.water; if (a.cup < WC.CUP.length) { a.cup++; render(); $('#drawer').scrollTop = 0; } },
  wideas() { const a = state.water; if (a.well.trim() && a.diff.trim()) { a.ideas = true; render(); emit('cup'); } },
  wans(el) { WC.answer(+el.dataset.k); },
  wrestart() { state.water = Object.assign(freshWater(), { mode: state.water.mode, cold: state.water.cold }); render(); },
  elayer(el) { state.earth.sel = el.dataset.l; EV.hide(); if (!state.earth.seen.includes(el.dataset.l)) { state.earth.seen.push(el.dataset.l); emit('explore', { seen: state.earth.seen.length }); } render(); },
  lpopclose() { EV.hide(); state.earth.sel = null; renderStage(); },
  missions() {
    $('#missionList').innerHTML = MISSIONS.map((m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title}</span><span class="star">⭐</span></button>`).join('');
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  resetStars() { state.done = []; store.set('aw-done', []); updateStars(); ACTIONS.missions(); },
  closeModals() { closeModals(); },
  model() { showModel(); },
  help() { showHelp(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// Typed answers are kept as you type, so they survive the drawer being redrawn
document.addEventListener('input', e => {
  if (e.target.matches('.numin')) { state.air.counts[e.target.dataset.g] = e.target.value; }
  if (e.target.id === 'reason') state.air.reason = e.target.value;
  if (e.target.id === 'preason') state.pure.reason = e.target.value;
  // The ideas only appear once both answers have been written
  if (e.target.id === 'cupWell' || e.target.id === 'cupDiff') {
    const a = state.water; if (e.target.id === 'cupWell') a.well = e.target.value; else a.diff = e.target.value;
    const b = $('[data-act=wideas]'); if (b) b.disabled = !(a.well.trim() && a.diff.trim());
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.numin')) AIR.check(); });
// The air grid: tap or drag on the big grid to move the close-up; tap in the close-up to check a particle.
// With 100 particles, tapping one says which gas it is.
let dragging = false;
$('#stage').addEventListener('pointerdown', e => {
  if (!$('#airSvg')) return;
  const a = state.air;
  if (a.level === 10000) {
    const l = AIR.lensAt(e);
    if (l) { AIR.tapLens(l); return; }
  }
  const cell = AIR.cellAt(e);
  if (!cell) return;
  if (a.level === 100) {
    if (!a.predSaved) return;
    const t = arrange(100, a.seed, a.sorted).types[cell[1] * 10 + cell[0]];
    a.tap = `That is ${t === 'x' ? 'another gas, like argon' : GAS[t].name.toLowerCase()}.`;
    AIR.drawLens(); return;
  }
  dragging = true; $('#stage').setPointerCapture(e.pointerId); AIR.moveLens(cell);
});
$('#stage').addEventListener('pointermove', e => { if (dragging) { const c = AIR.cellAt(e); if (c) AIR.moveLens(c); } });
addEventListener('pointerup', () => { dragging = false; });
// Layers: drag a placed thing to move it, drag on the graph to move the thermometer, tap the sky to place a chosen thing or read about a layer
let lay = null;
$('#stage').addEventListener('pointerdown', e => {
  if (!$('#laySvg')) return;
  const s = state.layers, item = e.target.closest('.pitem'), p = LY.where(e);
  if (item) { lay = { item: item.dataset.id }; $('#stage').setPointerCapture(e.pointerId); return; }
  if (!p) return;
  if (p.at === 'graph') { lay = { probe: true }; $('#stage').setPointerCapture(e.pointerId); s.probe = p.km; renderStage(); return; }
  if (s.chip) { LY.place(s.chip, p); return; }
  s.sel = LY.layerAt(p.km).id; render();
});
$('#stage').addEventListener('pointermove', e => {
  if (!lay || !$('#laySvg')) return;
  const s = state.layers, p = LY.where(e);
  if (!p) return;
  if (lay.probe) { s.probe = p.km; renderStage(); }
  else if (lay.item && p.at === 'col') { lay.moved = true; s.placed[lay.item] = p.km; s.fx[lay.item] = p.fx; delete s.res[lay.item]; renderStage(); }
});
addEventListener('pointerup', () => {
  if (!lay) return;
  const s = state.layers, was = lay; lay = null;
  if (was.probe) emit('probe', { km: s.probe, t: tempAt(Math.min(s.probe, 600)) });
  if (was.item && was.moved) { s.said = null; render(); }
});
// Around the Earth: a mouse pointing at a layer shows its facts; a tap keeps them open until you tap somewhere else
$('#stage').addEventListener('pointermove', e => {
  if (!$('#earthSvg') || e.pointerType !== 'mouse' || $('#lpop').dataset.pinned) return;
  const id = e.target.closest('[data-layer]')?.dataset.layer || null, ea = state.earth;
  if (id) EV.show(id, e, false); else EV.hide();
  if (id !== ea.hover) { ea.hover = id; renderStage(); }
});
$('#stage').addEventListener('pointerleave', () => { if (!$('#earthSvg') || $('#lpop').dataset.pinned) return; EV.hide(); if (state.earth.hover) { state.earth.hover = null; renderStage(); } });
$('#stage').addEventListener('click', e => {
  if (!$('#earthSvg')) return;
  const id = e.target.closest('[data-layer]')?.dataset.layer, ea = state.earth;
  if (!id) { EV.hide(); ea.sel = null; render(); return; }
  ea.sel = id; ea.hover = null; render(); EV.show(id, e, true);
});
// Water cycle, Build it: tap a word, then tap a space
$('#stage').addEventListener('click', e => {
  if (!$('#waterSvg') || state.water.mode !== 'build') return;
  const sl = e.target.closest('[data-slot]')?.dataset.slot || WC.slotNear(e);
  if (!sl) return;
  if (state.water.chip) WC.put(state.water.chip, sl);
  else { state.water.said = { ok: false, text: 'First tap one of the words in the panel, then tap a space.' }; render(); }
});
// River town: tap a numbered circle to look at that place
$('#stage').addEventListener('click', e => {
  if (!$('#townSvg')) return;
  const id = e.target.closest('[data-place]')?.dataset.place;
  if (id) { state.town.open = id; render(); $('#drawer').scrollTop = 0; }
});
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });
let resizeT;
addEventListener('resize', () => { fitBanner(); clearTimeout(resizeT); resizeT = setTimeout(renderStage, 120); });

// ================= Start =================
// Test hooks: #level=10000&sorted=1&pred=o&counted=1&found=0,1,2,3&pct=0.04&lens=40,40&seed=5&wrong=4 sets up the air grid;
// #mission=1 starts a mission; #nohelp=1 stops the help popping up by itself
const hp = new URLSearchParams(location.hash.slice(1));
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
{
  const a = state.air;
  if (hp.get('level') === '10000') a.level = 10000;
  if (hp.has('seed')) a.seed = +hp.get('seed');
  if (hp.has('sorted')) a.sorted = true;
  if (PRED[hp.get('pred')]) { a.pred = hp.get('pred'); a.predSaved = true; }
  if (hp.has('counted')) { a.counted = true; a.predSaved = true; a.pred = a.pred || 'o'; a.counts = { n: '78', o: '21', x: '1' }; }
  if (hp.has('counts')) { const [n, o, x] = hp.get('counts').split(','); a.counts = { n, o, x }; a.predSaved = true; a.pred = a.pred || 'o'; }
  if (hp.has('found')) a.found = hp.get('found').split(',').map(Number).filter(k => k >= 0 && k < 4);
  if (hp.has('wrong')) a.pctWrong = hp.get('wrong').split(',');
  if (hp.get('pct') === '0.04') a.pct = '0.04';
  if (hp.has('lens')) a.lens = hp.get('lens').split(',').map(Number);
}
{
  // #view=layers&scale=1&sel=meso&probe=85&placed=cloud:5,plane:11&check=1
  const s = state.layers;
  if (hp.has('scale')) s.scale = true;
  if (LAYERS.some(L => L.id === hp.get('sel'))) s.sel = hp.get('sel');
  if (hp.has('probe')) s.probe = +hp.get('probe');
  if (hp.has('placed')) hp.get('placed').split(',').forEach((pair, i) => { const [id, km] = pair.split(':'); if (SKY[id]) { s.placed[id] = +km; s.fx[id] = .35 + (i % 4) * .17; } });
}
{
  // #view=water&step=2  or  #view=water&mode=build&placed=evap,cond
  const a = state.water;
  if (hp.has('step')) a.step = Math.max(0, Math.min(4, +hp.get('step')));
  if (hp.get('mode') === 'build') a.mode = 'build';
  if (hp.has('cold')) a.cold = true;
  if (hp.get('mode') === 'cup') { a.mode = 'cup'; a.cup = Math.max(0, Math.min(5, +(hp.get('cup') || 0))); }
  if (hp.has('placed')) hp.get('placed').split(',').filter(id => WC.WORDS[id]).forEach(id => { a.placed[id] = id; });
}
{
  // #view=pure&pred=0,0,1,1,0&heated=1
  const u = state.pure;
  if (hp.has('pred')) hp.get('pred').split(',').forEach((v, i) => { if (PU.ORDER[i] && v !== '') u.pred[PU.ORDER[i]] = v === '1'; });
  if (hp.has('heated') && PU.ORDER.every(id => u.pred[id] != null)) u.heated = true;
}
{
  // #view=town&open=factory&answered=farm,tree  or  #view=town&mode=fix&fixed=farm,road
  const t = state.town;
  if (hp.get('mode') === 'fix') t.mode = 'fix';
  if (RT.PLACES[hp.get('open')]) t.open = hp.get('open');
  if (hp.has('answered')) hp.get('answered').split(',').filter(id => RT.PLACES[id]).forEach(id => { t.answered[id] = true; });
  if (hp.has('fixed')) hp.get('fixed').split(',').filter(id => RT.PLACES[id]).forEach(id => { t.fixed[id] = true; });
}
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
if (hp.has('check')) { if (state.view === 'layers') LY.check(); else AIR.check(); }
</script>
<script>
  // Offline support: saves the whole Science Hub on this device the first time any page is opened (see ../sw.js)
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
