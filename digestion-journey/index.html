<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digestion Journey</title>
<meta name="description" content="Follow food through the digestive system – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Adaptation Studio) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #bfdcff; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .key { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; }
  .key li { display: flex; align-items: center; gap: 8px; }
  .sw { width: 18px; height: 18px; border-radius: 6px; flex: none; border: 2px solid rgba(0,0,0,.18); }

  /* ---------- Diagram ---------- */
  .lab text { font-family: 'Fredoka', system-ui, sans-serif; font-size: 21px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #bfdcff; stroke-width: 5px; stroke-linejoin: round; }
  .lab line, .lab polyline { stroke: var(--ink); stroke-width: 1.8; fill: none; }
  .lab circle { fill: var(--ink); stroke: #fff; stroke-width: 1.5; }
  .inset .frame { fill: #fff; stroke: #9fb2e8; stroke-width: 2.5; }
  .inset .title { font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: var(--muted); }
  .inset .lab text { stroke: #fff; font-size: 19px; }
  .callout { stroke: #6b7bb5; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
  #teethArch g g > * { fill: #fff; stroke: #7b84a3; stroke-width: 1.4; }
  #teethArch .canine > g > * { fill: #fffbe8; }
  #teethArch path[fill="none"] { fill: none; stroke: #c3c9dc; stroke-width: 1.2; stroke-linecap: round; }

  /* ---------- Diagram pop-ups ---------- */
  svg.tipmode [data-tip] { cursor: pointer; }
  svg.tipmode .organ { transition: opacity .25s; }
  svg.tipmode.hovering .organ:not(.hl) { opacity: .35; }
  svg.tipmode .hl:not(.lab) { filter: drop-shadow(0 0 3px var(--yellow)) drop-shadow(0 0 3px var(--yellow)); }
  svg.tipmode .lab.hl text { fill: var(--blue); }
  .tipbox { position: absolute; z-index: 5; max-width: 270px; background: #fff; border: 3px solid var(--yellow); border-radius: 14px; padding: 8px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25); pointer-events: none; font-size: 16px; line-height: 1.3; }
  .tipbox b { display: block; font-size: 19px; margin-bottom: 2px; }
  .tipbox[hidden] { display: none; }
  /* ---------- Journey ---------- */
  svg.journey .organ { opacity: .28; transition: opacity .4s; }
  svg.journey .organ.on { opacity: 1; }
  svg.journey .inset, svg.journey .callout { opacity: .3; transition: opacity .4s; }
  svg.journey.at-mouth .inset, svg.journey.at-mouth .callout { opacity: 1; }
  #stomach.churn { transform-box: fill-box; transform-origin: center; animation: churn .5s ease-in-out 4; }
  @keyframes churn { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-3deg) scale(1.04, .96); } 75% { transform: rotate(3deg) scale(.96, 1.04); } }
  #food .chew { transform-box: fill-box; transform-origin: center; animation: chew .6s ease-in-out infinite; }
  @keyframes chew { 50% { transform: scale(1.12, .84); } }
  #jKey { opacity: 0; transition: opacity .9s; }
  #jKey.show { opacity: 1; }
  #jKey text { font-family: 'Fredoka', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: var(--ink); }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .navrow { display: flex; gap: 8px; }
  .time { display: inline-block; background: var(--soft); border-radius: 10px; padding: 4px 10px; font-weight: 600; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.done { background: #c9f2df; border-color: var(--green); }

  /* ---------- Drag the organs ---------- */
  svg.dragmode { touch-action: none; }
  svg.dragmode .inset, svg.dragmode .callout { display: none; }
  svg.dragmode > .lab { opacity: 0; transition: opacity .6s; }
  svg.dragmode > .lab.show { opacity: 1; }
  .piece { cursor: grab; transition: transform .45s cubic-bezier(.34, 1.4, .5, 1); }
  .piece.dragging { transition: none; cursor: grabbing; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
  .piece.placed { cursor: default; pointer-events: none; }
  /* Where each organ goes: a pale silhouette with a soft outline */
  .ghost { opacity: .7; filter: drop-shadow(0 0 1px #6b7bb5) drop-shadow(0 0 1px #6b7bb5); }
  .ghost * { fill: #fff !important; stroke: #fff !important; opacity: 1 !important; fill-opacity: 1 !important; stroke-opacity: 1 !important; }
  .ghost [fill="none"] { fill: none !important; }
  .ghost.filled, svg.nohints .ghost { display: none; }
  .slot { fill: #fff; fill-opacity: .55; stroke: #9fb2e8; stroke-width: 2; stroke-dasharray: 6 5; }
  .progress { height: 14px; background: var(--soft); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; background: var(--green); transition: width .4s; }

  /* ---------- Journey order ---------- */
  svg.ordermode .organ { opacity: .28; transition: opacity .5s; }
  svg.ordermode .organ.on { opacity: 1; }
  svg.ordermode .inset, svg.ordermode .callout { display: none; }
  svg.ordermode > .lab { opacity: 0; transition: opacity .6s; }
  svg.ordermode > .lab.show { opacity: 1; }
  .badge circle { fill: var(--green); stroke: #fff; stroke-width: 3; }
  .badge text { font-family: 'Fredoka', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #fff; text-anchor: middle; }
  .oTrail path { fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round; stroke-dasharray: .1 10; opacity: 0; transition: opacity .8s; }
  .oTrail path.show { opacity: .85; }
  .seq { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .seq span { min-width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; background: var(--soft); color: var(--muted); font-weight: 700; font-size: 15px; }
  .seq span.done { background: #c9f2df; color: var(--ink); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choices .opt { font-size: 17px; min-height: 52px; }
  .opt.used { display: none; }
  .opt.wrong { animation: shake .4s; background: #ffe0e3; border-color: var(--coral); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- What happens here? ---------- */
  svg.quizmode .inset, svg.quizmode .callout { display: none; }
  svg.quizmode > .lab { opacity: 0; transition: opacity .6s; pointer-events: none; }
  svg.quizmode > .lab.show { opacity: 1; }
  svg.quizmode .organ { cursor: pointer; }
  .organ.oops { animation: oops .6s; }
  .organ.yay { animation: yay 1s; }
  @keyframes oops { 30%, 70% { filter: drop-shadow(0 0 3px var(--coral)) drop-shadow(0 0 3px var(--coral)); } }
  @keyframes yay { 30%, 70% { filter: drop-shadow(0 0 4px var(--green)) drop-shadow(0 0 4px var(--green)); } }
  /* ---------- Journey prediction ---------- */
  .card.predict { border: 3px solid var(--yellow); }
  .trow { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 8px; }
  .trow > span:last-child { white-space: nowrap; }
  .trow.best { background: #c9f2df; font-weight: 700; }
  .mine { color: var(--blue); }
  /* ---------- Other animals ---------- */
  .vname { font-family: 'Fredoka', system-ui, sans-serif; font-size: 27px; font-weight: 700; fill: var(--ink); }
  .vnote { font-size: 16px; line-height: 1.3; color: var(--muted); }
  svg.vmode .vpart { cursor: pointer; transition: opacity .25s; }
  svg.vmode.picking .vpart:not(.hl) { opacity: .3; }
  svg.vmode .vpart.hl { filter: drop-shadow(0 0 3px var(--yellow)) drop-shadow(0 0 3px var(--yellow)); }
  .job { font-size: 19px; font-weight: 600; background: #fff3c4; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }

  /* ---------- Lion vs zebra ---------- */
  .frame { fill: #fff; stroke: #9fb2e8; stroke-width: 2.5; }
  .tname { font-family: 'Fredoka', system-ui, sans-serif; font-size: 32px; font-weight: 700; fill: var(--ink); }
  .trole { font-family: 'Fredoka', system-ui, sans-serif; font-size: 19px; font-weight: 500; fill: var(--muted); }
  .tl text { stroke: #fff; }
  .incisor, .canine, .molar { transition: fill .3s; }
  svg.show-incisor .incisor, svg.show-incisor .incisor rect,
  svg.show-canine .canine, svg.show-molar .molar, svg.show-molar .molar rect { fill: var(--yellow); }
  svg.show-incisor .tl:not([data-type="incisor"]), svg.show-canine .tl:not([data-type="canine"]), svg.show-molar .tl:not([data-type="molar"]) { opacity: .3; }
  svg.chewing .chop { animation: chop .9s ease-in-out 3; }
  svg.chewing .grind { animation: grind 1.6s ease-in-out 2; }
  @keyframes chop { 0%, 100% { transform: none; } 40%, 55% { transform: translateY(-58px); } }
  @keyframes grind { 0%, 100% { transform: none; } 20% { transform: translateY(-44px); } 40% { transform: translate(14px, -44px); } 60% { transform: translate(-14px, -44px); } 80% { transform: translateY(-44px); } }
  #drawer a { color: var(--blue); }

  /* ---------- Missions ---------- */
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 11px; }
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn { color: #fff; }
  .modal-box ul.icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn.primary { background: var(--green); color: #fff; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  /* ---------- Per-tab help, close buttons, "the science" boxes ---------- */
  .modal-box { position: relative; }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }
  .help-welcome { font-size: 18px; font-weight: 700; color: var(--blue); margin: 0 0 6px; }
  .help-sec { margin: 10px 0 4px; font-weight: 700; }
  .help-body p, .help-body ol { margin: 4px 0 8px; line-height: 1.45; font-size: 17px; }
  .help-body ol { padding-left: 24px; }
  .help-teach { margin: 12px 0; font-size: 13.5px; color: var(--muted); }
  .help-teach summary { cursor: pointer; font-weight: 600; }
  .help-teach p { font-size: 13.5px; margin: 6px 0; }
  .bigq { font-weight: 700; color: var(--blue); }
  .model-tab { margin: -4px 0 8px; color: var(--muted); font-weight: 600; }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="hub-link" href="../index.html" title="Back to the Science Hub" aria-label="Back to the Science Hub">🏠</a>
  <div class="brand">🍎 Digestion Journey</div>
  <div class="tabs" id="tabs"></div>
  <button class="btn missions" data-act="missions" title="Missions">🚀 <span class="long">Missions </span><span id="starCount"></span></button>
  <button class="btn" data-act="model" title="How is this model different from real life?">🤔<span class="long"> Real life?</span></button>
  <button class="btn" id="helpBtn" data-act="help" aria-label="How to use this tab">❓</button>
</div>
<main>
  <div id="stage"></div>
  <div id="drawer"></div>
  <div id="banner" class="banner hidden" role="status">
    <div class="kicker" id="bannerKicker"></div>
    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>
    <div class="hint hidden" id="bannerHint"></div>
    <button class="close" data-act="stopMission" aria-label="Stop this mission">✖</button>
  </div>
</main>
<div id="missionsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="missionsTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="missionsTitle">🚀 Missions</h2>
    <div class="mission-list" id="missionList"></div>
    <div class="modal-actions"><button class="btn" data-act="resetStars">Reset stars</button><button class="btn primary" data-act="closeModals">Close</button></div>
  </div>
</div>
<div id="modelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="modelTitle">🤔 How is this model different from real life?</h2>
    <p class="model-tab" id="modelTab"></p>
    <p style="margin-top:0">A <span class="term">model</span> shows some important features of something real – but not everything.</p>
    <ul class="icons" id="modelList"></ul>
    <div class="modal-actions"><button class="btn primary" data-act="closeModals">Got it!</button></div>
  </div>
</div>
<div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div class="win-emoji">⭐</div>
    <h2 id="winTitle" style="text-align:center">Mission complete!</h2>
    <div class="win-text" id="winText"></div>
    <div class="modal-actions"><button class="btn" data-act="closeModals">Keep exploring</button><a class="btn primary" id="winPractise" href="../practice/index.html#digestion">✏️ Practise this</a><button class="btn primary" id="winNext" data-act="nextMission">Next mission ▶</button></div>
  </div>
</div>
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-box help-body">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div id="helpContent"></div>
    <div class="modal-actions"><a class="btn" href="../practice/index.html#digestion">✏️ Practise this</a><button class="btn primary" data-act="closeModals">Let's go! 🚀</button></div>
  </div>
</div>

<template id="diagramSvg">

// Steady speed in the middle, gentle start and stop
const easeEnds = (p, e = .12) => p < e ? p * p / (2 * e * (1 - e)) : p > 1 - e ? 1 - (1 - p) * (1 - p) / (2 * e * (1 - e)) : (p - e / 2) / (1 - e);
const gauss = (d, w) => Math.exp(-(d / w) * (d / w));
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, '0')).join('');

const J = {
  tok: 0,
  mount() {
    const svg = $('#stage svg');
    svg.classList.add('journey');
    const layer = svgEl('g', { id: 'jLayer' });
    layer.innerHTML = `<g id="jFx"></g>

        <path class="rings" fill="none" stroke="#c25e7f" stroke-width="1.2" stroke-linecap="round" opacity=".18"/>
        <path class="hot" fill="none" stroke="#a8405f" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="slug" style="display:none">
        <path fill="none" stroke-linecap="round"/><path fill="none" stroke-linecap="round"/>
        <path fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="food"></g><path id="jRoute" fill="none" stroke="none"/><path id="jOes" d="${OES_D}" fill="none" stroke="none"/>
      <g id="jKey"><rect x="-190" y="452" width="300" height="76" rx="14" fill="#fff" stroke="#9fb2e8" stroke-width="2.5"/><g class="icon"></g>
        <text x="-148" y="484" class="t1"></text><text x="-148" y="510" class="t2"></text></g>`;
    svg.insertBefore(layer, svg.querySelector('.lab'));
    J.order = [...svg.querySelectorAll(':scope > .organ')];
    // Points and sideways directions along the oesophagus, for drawing the squeezing tube
    const o = $('#jOes'), L = o.getTotalLength();
    J.oesEnd = L - 14;
    J.pts = [];
    for (let d = 8; d <= L - 9; d += 3) {
      const a = o.getPointAtLength(Math.max(0, d - 1)), b = o.getPointAtLength(d + 1), c = o.getPointAtLength(d);
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      J.pts.push({ d, x: c.x, y: c.y, nx: -(b.y - a.y) / len, ny: (b.x - a.x) / len });
    }
    J.show(state.step);
  },
  setForm(form) {
    const f = $('#food');
    if (f.dataset.form !== form) { f.dataset.form = form; f.innerHTML = FOOD[form]; }
  },
  // Waste and the squeezed ball line up with the tube they are in; stretch makes the ball longer as it is pushed
  place(x, y, opacity = 1, angle = 0, stretch = 0) {
    const f = $('#food'), turn = f.dataset.form === 'waste' || f.dataset.form === 'bolus';
    f.setAttribute('transform', `translate(${x} ${y}) rotate(${turn ? angle : 0}) scale(${1.5 * (1 + .3 * stretch)} ${1.5 * (1 - .2 * stretch)})`);
    f.setAttribute('opacity', opacity);
  },
  angleAt(r, s) { const a = r.getPointAtLength(Math.max(0, s - 2)), b = r.getPointAtLength(s + 2); return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; },
  highlight(n) {
    const svg = $('#stage svg');
    const layer = $('#jLayer');
    // Lit organs move to the front so dimmed ones never cover them
    J.order.forEach(g => svg.insertBefore(g, layer));
    J.order.forEach(g => { const on = STOPS[n].organs.includes(g.dataset.organ || g.id); g.classList.toggle('on', on); if (on) svg.insertBefore(g, layer); });
    svg.classList.toggle('at-mouth', n === 0);
  },
  // The oesophagus as a soft tube: it bulges round the food (sb) and squeezes shut where the muscle ring is (sc)
  tube(sb, sc, str) {
    const t = $('#oesTube');
    if (sb == null) { t.style.display = 'none'; $('#oesophagus').style.visibility = ''; return; }
    t.style.display = ''; $('#oesophagus').style.visibility = 'hidden';
    const left = [], right = [];
    let rings = '', hot = '';
    J.pts.forEach((p, i) => {
      const w = (12 + 12 * gauss(p.d - sb, 11) - 8 * str * gauss(p.d - sc, 8)) / 2;
      left.push(`${(p.x + p.nx * w).toFixed(1)} ${(p.y + p.ny * w).toFixed(1)}`);
      right.unshift(`${(p.x - p.nx * w).toFixed(1)} ${(p.y - p.ny * w).toFixed(1)}`);
      if (i % 4 === 1) {
        const k = w * .75, seg = `M${(p.x + p.nx * k).toFixed(1)} ${(p.y + p.ny * k).toFixed(1)} L${(p.x - p.nx * k).toFixed(1)} ${(p.y - p.ny * k).toFixed(1)}`;
        if (str > .05 && Math.abs(p.d - sc) < 13) hot += seg; else rings += seg;
      }
    });
    const [wall, rg, ht] = t.children;
    wall.setAttribute('d', `M${left.join(' L')} L${right.join(' L')} Z`);
    rg.setAttribute('d', rings); ht.setAttribute('d', hot); ht.setAttribute('opacity', Math.min(1, str * 1.4));
  },
  // Liquid food as a short flowing trail along the route; t blends it from liquid (0) to faeces (1)
  slug(r, d, t = 0, now = 0) {
    const g = $('#slug');
    if (r == null) { g.style.display = 'none'; return; }
    g.style.display = '';
    const len = (46 + 5 * Math.sin(now / 170)) * (1 - .55 * t), big = 5000, path = r.getAttribute('d');
    const [o, i, sh] = g.children;
    o.setAttribute('stroke', mix('#c9a84e', '#5e3b1f', t)); o.setAttribute('stroke-width', 13 + 7 * t);
    i.setAttribute('stroke', mix('#f4dc84', '#8a5a33', t)); i.setAttribute('stroke-width', 10.5 + 6.5 * t);
    sh.setAttribute('opacity', .55 * (1 - t));
    for (const e of [o, i]) { e.setAttribute('d', path); e.setAttribute('stroke-dasharray', `${len} ${big}`); e.setAttribute('stroke-dashoffset', -(d - len)); }
    sh.setAttribute('d', path); sh.setAttribute('stroke-dasharray', `${len * .45} ${big}`); sh.setAttribute('stroke-dashoffset', -(d - len * .7));
  },
  key(kind) {
    const k = $('#jKey');
    if (!kind) { k.classList.remove('show'); return; }
    if (k.dataset.kind !== kind) {
      k.dataset.kind = kind;
      k.querySelector('.icon').innerHTML = KEYS[kind].icon;
      k.querySelector('.t1').textContent = KEYS[kind].lines[0];
      k.querySelector('.t2').textContent = KEYS[kind].lines[1];
    }
    k.classList.add('show');
  },
  reset() {
    J.tok++;
    $('#jFx').innerHTML = '';
    $('#stomach').classList.remove('churn');
    J.tube(null); J.slug(null); J.key(null);
  },
  // Still picture of a stop (used on load, the mouth and jumps ahead)
  show(n) {
    J.reset();
    J.highlight(n);
    const s = STOPS[n];
    if (s.peri) {
      const o = $('#jOes'), p = o.getPointAtLength(J.oesEnd);
      J.tube(J.oesEnd, 0, 0); J.setForm('bolus'); J.place(p.x, p.y, 1, J.angleAt(o, J.oesEnd));
      return;
    }
    J.setForm(s.form);
    if (!s.route) { J.place(...s.at); return; }
    const r = $('#jRoute'); r.setAttribute('d', s.route);
    const L = r.getTotalLength(), p = r.getPointAtLength(L);
    if (s.form === 'liquid') J.slug(r, L); else J.place(p.x, p.y, s.form === 'gone' ? 0 : 1, J.angleAt(r, L - 2));
    if (s.fx) J.key(s.fx);
  },
  dot(kind, x, y, opacity = 1) {
    const e = kind === 'nutrients'
      ? svgEl('circle', { cx: x, cy: y, r: 4, fill: '#b3001b', stroke: '#fff', 'stroke-width': 1.6, opacity })
      : svgEl('path', { d: `M${x} ${y - 6} C${x + 3.5} ${y - 1} ${x + 4.6} ${y + 1} ${x + 4.6} ${y + 2.4} A4.6 4.6 0 0 1 ${x - 4.6} ${y + 2.4} C${x - 4.6} ${y + 1} ${x - 3.5} ${y - 1} ${x} ${y - 6} Z`, fill: '#0a5fd6', stroke: '#fff', 'stroke-width': 1.6, opacity });
    $('#jFx').appendChild(e);
    return e;
  },
  // Swallowing: a quick chew, then waves of muscle squeeze the ball down in surges
  peri(p) {
    const o = $('#jOes');
    if (p < .2) {
      J.setForm(p < .14 ? 'slice' : 'bolus'); J.place(300, 145);
      J.tube(-60, 0, 0);
      return o.getPointAtLength(0);
    }
    const N = 5, u = clamp01((p - .2) / .8), k = Math.min(N - 1, Math.floor(u * N)), tau = u * N - k;
    const push = clamp01((tau - .3) / .6);
    const sb = J.oesEnd * (k + push * push * (3 - 2 * push)) / N;
    const sc = sb - 15 - 28 * (1 - clamp01(tau / .65));
    const str = Math.pow(Math.sin(Math.PI * tau), .6);
    const pt = o.getPointAtLength(Math.max(0, sb));
    J.tube(sb, sc, str);
    J.setForm('bolus');
    J.place(pt.x, pt.y, 1, J.angleAt(o, Math.max(2, sb)), str * (tau > .3 && tau < .9 ? 1 : .3));
    return pt;
  },
  // One frame of the trip to stop n, at progress p (0–1)
  frame(n, p, now = performance.now()) {
    const s = STOPS[n], prev = STOPS[n - 1];
    if (s.peri) return J.peri(p);
    const r = $('#jRoute'); r.setAttribute('d', s.route);
    const L = r.getTotalLength();
    const d = (s.flow ? easeEnds(p) : ease(p)) * L;
    const pt = r.getPointAtLength(d);
    let form = p < (s.switchAt ?? 1) ? prev.form : s.form, t = 0;
    if (s.blend) { form = p < s.blend[1] ? 'liquid' : 'waste'; t = clamp01((p - s.blend[0]) / (s.blend[1] - s.blend[0])); }
    if (form === 'gone') form = 'waste';
    J.setForm(form);
    if (form === 'liquid') J.slug(r, d, t, now); else J.slug(null);
    J.place(pt.x, pt.y, s.form === 'gone' ? 1 - clamp01((p - .45) / .5) : 1, J.angleAt(r, d));
    if (s.fx && p > .1) J.key(s.fx);
    return pt;
  },
  go(n) {
    J.reset();
    const s = STOPS[n], tok = J.tok;
    J.highlight(n);
    const t0 = performance.now();
    let last = 0;
    const tick = () => {
      const now = performance.now();
      if (tok !== J.tok) return;
      const p = clamp01((now - t0) / s.ms);
      const pt = J.frame(n, p, now);
      if (s.fx && p > .08 && p < .97 && now - last > 140 && (!s.blend || p < s.blend[1] + .1)) {
        last = now;
        // Each dot drifts clear of the tube and stays bright for most of its trip before fading
        const e = J.dot(s.fx, pt.x, pt.y), a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 16;
        e.animate([{ transform: 'translate(0,0)', opacity: 1 }, { offset: .7, opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`, opacity: 0 }], { duration: 2200, easing: 'ease-out' }).onfinish = () => e.remove();
      }
      if (p < 1) return requestAnimationFrame(tick);
      if (s.churn) $('#stomach').classList.add('churn');
      if (s.form === 'gone') { J.setForm('gone'); J.place(0, 0, 0); }
    };
    requestAnimationFrame(tick);
  }
};

function setStep(n, animate) {
  state.step = n;
  location.hash = `view=journey&step=${n}`;
  $('#drawer').innerHTML = VIEWS.journey.drawer();
  if (animate) J.go(n); else J.show(n);
  emit('step', { n, walked: animate });
}

// ================= Drag the organs =================
// Each piece: the drawing groups it is made of, and the label that appears when it is placed.
const PIECES = [
  { id: 'oesophagus', name: 'Oesophagus', groups: ['oesophagus'] },
  { id: 'stomach', name: 'Stomach', groups: ['stomach'] },
  { id: 'small-intestine', name: 'Small intestine', groups: ['small-intestine', 'small-intestine-coils'] },
  { id: 'large-intestine', name: 'Large intestine', groups: ['large-intestine', 'large-intestine-front'] },
  // The rectum is a clipped slice of a longer path, so its visible box is given here
  { id: 'rectum', name: 'Rectum', groups: ['rectum'], box: { x: 280, y: 742, width: 34, height: 60 } },
  { id: 'anus', name: 'Anus', groups: ['anus'], snap: 22 }
];
// Tray spaces either side of the body
const SLOTS = [[-40, 230], [-40, 450], [-40, 670], [640, 450], [640, 670], [640, 230]];
const SLOT_SIZE = 170;

const D = {
  mount() {
    const svg = $('#stage svg');
    svg.classList.add('dragmode');
    state.placed = new Set();
    const firstLab = svg.querySelector(':scope > .lab');
    const tray = svgEl('g', { id: 'tray' }), layer = svgEl('g', { id: 'pieces' });
    svg.insertBefore(tray, firstLab); svg.insertBefore(layer, firstLab);
    const order = PIECES.map((p, i) => i).sort(() => Math.random() - .5);
    D.items = PIECES.map((p, i) => {
      const wrap = svgEl('g', { class: 'piece', 'data-id': p.id });
      p.groups.forEach(id => {
        const g = svg.querySelector('#' + id);
        // A dashed outline stays behind to show where the organ goes
        const ghost = g.cloneNode(true);
        ghost.removeAttribute('id'); ghost.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
        ghost.setAttribute('class', 'ghost'); ghost.dataset.for = p.id;
        g.parentNode.insertBefore(ghost, g);
        wrap.appendChild(g);
      });
      layer.appendChild(wrap);
      const b = p.box || wrap.getBBox();
      // Invisible pad so thin or tiny organs are easy to grab
      const pad = Math.max(12, (50 - Math.min(b.width, b.height)) / 2);
      wrap.insertBefore(svgEl('rect', { x: b.x - pad, y: b.y - pad, width: b.width + pad * 2, height: b.height + pad * 2, fill: 'transparent' }), wrap.firstChild);
      const [sx, sy] = SLOTS[order[i]];
      tray.appendChild(svgEl('rect', { class: 'slot', x: sx - SLOT_SIZE / 2, y: sy - SLOT_SIZE / 2, width: SLOT_SIZE, height: SLOT_SIZE, rx: 18 }));
      const item = { p, wrap, cx: b.x + b.width / 2, cy: b.y + b.height / 2, sx, sy,
        s: Math.min(3, (SLOT_SIZE - 30) / Math.max(b.width, b.height)) };
      wrap.style.transition = 'none';
      D.to(item, sx, sy, item.s);
      wrap.addEventListener('pointerdown', e => D.grab(item, e));
      return item;
    });
    // The mouth sits in front, so the top of the oesophagus tucks in behind it as in the diagram
    svg.insertBefore(svg.querySelector('#teeth'), firstLab);
    svg.classList.toggle('nohints', !state.outlines);
    D.svg = svg;
    // Whether the outlines were on at any point this round (the "no peeking" mission needs them off throughout)
    D.peeked = state.outlines;
    // Start in the tray without animating there
    void svg.getBoundingClientRect();
    D.items.forEach(item => { item.wrap.style.transition = ''; });
  },
  // Put the organ's centre at x,y at the given size
  to(item, x, y, s) { item.wrap.style.transform = `translate(${x}px,${y}px) scale(${s}) translate(${-item.cx}px,${-item.cy}px)`; },
  point(e) { const p = D.svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(D.svg.getScreenCTM().inverse()); },
  grab(item, e) {
    if (state.placed.has(item.p.id)) return;
    e.preventDefault();
    item.wrap.classList.add('dragging');
    item.wrap.parentNode.appendChild(item.wrap);
    // Listen on the window: moving the piece to the front would drop an element's pointer capture
    const move = ev => { if (ev.pointerId !== e.pointerId) return; const q = D.point(ev); D.to(item, q.x, q.y, 1); };
    const drop = ev => {
      if (ev.pointerId !== e.pointerId) return;
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', drop);
      removeEventListener('pointercancel', drop);
      item.wrap.classList.remove('dragging');
      const q = D.point(ev);
      if (Math.hypot(q.x - item.cx, q.y - item.cy) < (item.p.snap || 45)) D.place(item);
      else { D.to(item, item.sx, item.sy, item.s); D.say(`Not quite! The ${item.p.name.toLowerCase()} goes somewhere else.`); }
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', drop);
    addEventListener('pointercancel', drop);
    move(e);
  },
  place(item) {
    D.to(item, item.cx, item.cy, 1);
    item.wrap.classList.add('placed');
    state.placed.add(item.p.id);
    D.svg.querySelectorAll(`.ghost[data-for="${item.p.id}"]`).forEach(g => g.classList.add('filled'));
    D.svg.querySelectorAll(':scope > .lab').forEach(l => { if (l.querySelector('text').textContent === item.p.name) l.classList.add('show'); });
    $('#drawer').innerHTML = VIEWS.organs.drawer();
    if (state.placed.size < PIECES.length) D.say(`Yes! That is the ${item.p.name.toLowerCase()}.`);
    else emit('placed', { peeked: D.peeked });
  },
  say(msg) { const m = $('#dragMsg'); if (m) m.textContent = msg; }
};

const labelFor = (svg, name) => [...svg.querySelectorAll(':scope > .lab')].find(l => l.querySelector('text').textContent === name);
const organGroups = (svg, id) => svg.querySelectorAll(`#${id}, [data-organ="${id}"]`);

// ================= Journey order =================
// Children tap the stops in the order food visits them; each correct tap lights the organ, numbers it and extends the route.
const O = {
  mount() {
    const svg = $('#stage svg');
    svg.classList.add('ordermode');
    state.order = { done: 0, mistakes: 0, choices: STOPS.map((s, i) => i).sort(() => Math.random() - .5) };
    const firstLab = svg.querySelector(':scope > .lab');
    addMouthLabel(svg);
    const trail = svgEl('g', { id: 'oTrail', class: 'oTrail' });
    trail.innerHTML = STOPS.map((s, i) => i ? `<path data-n="${i}" d="${i === 1 ? OES_D : s.route}"/>` : '').join('');
    svg.insertBefore(trail, firstLab);
    svg.appendChild(svgEl('g', { id: 'oBadges' }));
    O.svg = svg;
  },
  pick(n) {
    const o = state.order, s = STOPS[n];
    if (n !== o.done) {
      o.mistakes++;
      const el = $(`.choices [data-n="${n}"]`);
      el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
      O.say(o.done ? `Not quite! Where does the food go after the ${STOPS[o.done - 1].name.toLowerCase()}?` : 'Not quite! Where does the food go in?');
      return;
    }
    s.organs.forEach(id => organGroups(O.svg, id).forEach(g => g.classList.add('on')));
    const lab = labelFor(O.svg, s.name);
    lab.classList.add('show');
    // Number badge just outside the label text
    const b = lab.querySelector('text').getBBox(), left = b.x < 300;
    const badge = svgEl('g', { class: 'badge' });
    badge.innerHTML = `<circle cx="${left ? b.x - 24 : b.x + b.width + 24}" cy="${b.y + b.height / 2}" r="18"/><text x="${left ? b.x - 24 : b.x + b.width + 24}" y="${b.y + b.height / 2 + 7}">${n + 1}</text>`;
    $('#oBadges').appendChild(badge);
    if (n) O.svg.querySelector(`#oTrail [data-n="${n}"]`).classList.add('show');
    // Once the large intestine is in, it covers the small intestine's route where the two overlap
    if (s.id === 'large-intestine') {

// ================= What happens here? =================
// A job is shown; children tap the part of the body that does it. A wrong tap says what that part does instead.
const JOBS = {
  mouth: { job: 'Bites, chews and grinds food into small pieces. Saliva makes it soft and wet.', does: 'chews food into small pieces' },
  oesophagus: { job: 'A muscly tube that squeezes food down to the stomach.', does: 'squeezes food down to the stomach' },
  stomach: { job: 'Churns food with acid and digestive juices to make a thick mush called chyme.', does: 'churns food into chyme' },
  'small-intestine': { job: 'Nutrients from the food pass through its walls into the blood.', does: 'passes nutrients into the blood' },
  'large-intestine': { job: 'Takes water back into the body, leaving solid waste called faeces.', does: 'takes water back into the body' },
  rectum: { job: 'Stores faeces until you go to the toilet.', does: 'stores faeces until you go to the toilet' },
  anus: { job: 'The opening where faeces leave the body.', does: 'is where faeces leave the body' }

const W = {
  mount() {
    const svg = $('#stage svg');

    addMouthLabel(svg);
    addTapPads(svg);

      if (g) W.tap(g.dataset.organ || g.id);
    });
    W.svg = svg;
  },
  // STOPS index for an organ id (the teeth stand for the mouth)

    if (q.n === STOPS.length) return;
    const want = q.order[q.n], got = W.stopOf(id), s = STOPS[got];
    if (got < 0) return;
    W.flash(s, 'oops');
    if (got !== want) {
      q.missed = true;
      W.say(`Not quite! That is the ${s.name.toLowerCase()}. It ${JOBS[s.id].does}.`);
      return;
    }
    if (!q.missed) q.firstTry++;
    q.missed = false;
    W.flash(s, 'yay');
    labelFor(W.svg, s.name).classList.add('show');
    q.n++;
    $('#drawer').innerHTML = VIEWS.quiz.drawer();

};

    win: () => 'A dog has the same parts as you, in the same order: mouth, oesophagus, stomach, small intestine, large intestine and anus. Many <b>vertebrates</b> have a digestive system like ours!' },
  { id: 'nopeek', icon: '🙈', title: 'No peeking!', task: 'Drag all <b>6 organs</b> into place with <b>no outlines</b>.', hint: 'The stomach is on the left side of the body. That is on the right as you look at the picture!',

function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('dj-done', state.done); }
  updateStars();
  // Let the last animation play before the pop-up covers it
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, ev === 'step' ? 1800 : 900);
}
function startMission(i) {
  closeModals();
  state.mission = i; MISSIONS[i].setup();
  location.hash = 'view=' + state.view;
  const m = MISSIONS[i];
  $('#bannerKicker').textContent = `Mission ${i + 1} of ${MISSIONS.length}: ${m.title}`;
  $('#bannerText').innerHTML = m.task; $('#bannerHint').innerHTML = m.hint;
  $('#bannerHint').classList.add('hidden'); $('#hintBtn').textContent = '💡 Show a hint';
  $('#banner').classList.remove('hidden');
  render();
}
function stopMission() { state.mission = null; $('#banner').classList.add('hidden'); fitBanner(); }
// The banner sits over the top of the drawer, so the drawer's cards start below it
function fitBanner() { $('#drawer').style.paddingTop = state.mission == null ? '' : `${$('#banner').offsetHeight + 18}px`; }
function updateStars() { $('#starCount').textContent = `${state.done.length}/${MISSIONS.length} ⭐`; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
function confetti() {
  const em = ['⭐', '🌟', '🍎', '✨', '🎉'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = `${Math.random() * 100}vw`; s.style.animationDuration = `${2 + Math.random() * 2}s`; s.style.animationDelay = `${Math.random() * .6}s`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}

  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  closeModals() { closeModals(); },
  resetStars() { state.done = []; store.set('dj-done', []); updateStars(); ACTIONS.missions(); },
  // Going back (or to any stop already reached) replays the trip into that stop; the mouth has no trip, so it is a still picture
  jback() { if (state.step > 0) setStep(state.step - 1, state.step > 1); },
  jgo(el) { const n = +el.dataset.n; setStep(n, n > 0 && n <= state.step + 1); },
  jpredict(el) { state.predict = el.dataset.id; $('#drawer').innerHTML = VIEWS.journey.drawer(); },
  vpick(el) { V.show(state.vpart === el.dataset.part ? null : el.dataset.part); },
  model() { closeModals(); showModel(); },
  help() { closeModals(); showHelp(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });
addEventListener('resize', fitBanner);

// ================= Start =================
// Test hooks: #view=journey&step=3 opens a stop; adding &t=0.5 freezes the trip into that stop halfway
const hp = new URLSearchParams(location.hash.slice(1));
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
// #nohelp=1 skips the help pop-up that opens with each new tab (for screenshots and tests)
if (hp.get('nohelp') === '1') noAutoHelp = true;
if (hp.has('step')) state.step = Math.max(0, Math.min(STOPS.length - 1, +hp.get('step') || 0));
updateStars();
// #mission=3 starts a mission straight away
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
// #view=organs&placed=3 places the first few organs, for screenshots
if (state.view === 'organs' && hp.has('placed')) D.items.slice(0, +hp.get('placed')).forEach(D.place);
// #view=order&done=3 puts the first few stops in order
if (state.view === 'order' && hp.has('done')) for (let i = 0; i < +hp.get('done'); i++) O.pick(i);
// #view=close&c=2&t=3 freezes close-up 2 at 3 seconds
if (state.view === 'close' && hp.has('c')) { state.close = +hp.get('c') || 0; render(); }
if (state.view === 'close' && hp.has('t')) { state.cpaused = true; C.t = +hp.get('t'); C.draw(C.t); $('#drawer').innerHTML = VIEWS.close.drawer(); }
// #view=teeth&type=canine highlights one type of tooth
if (state.view === 'teeth' && hp.has('type')) T.pick(hp.get('type'));
// #view=quiz&q=3 answers the first few questions
if (state.view === 'quiz' && hp.has('q')) for (let i = 0; i < +hp.get('q'); i++) W.tap(STOPS[state.quiz.order[i]].organs[0]);
if (state.view === 'journey' && hp.has('t') && state.step > 0) { J.reset(); J.highlight(state.step); J.frame(state.step, +hp.get('t')); }
</script>
</body>
