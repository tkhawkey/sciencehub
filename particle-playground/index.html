<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Playground</title>
<meta name="description" content="Solids, liquids and gases with the particle model: melting, boiling, why water is odd, evaporation, condensation, dissolving and gases – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Air and Water) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 11px; }
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #eef4fb; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done, .opt.done:disabled { background: #c9f2df; border-color: var(--green); opacity: 1; }
  .opt:disabled { opacity: .45; cursor: default; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .tick { color: var(--green); }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }
  .says { border: 3px solid var(--yellow); }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .says li { margin: 4px 0; }
  .wq .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
  /* Check stays in reach at the bottom of the drawer */
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-block; vertical-align: -2px; border: 1px solid rgba(0,0,0,.2); }
  .facts { margin: 6px 0 0; padding-left: 20px; } .facts li { margin: 3px 0; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  .gtable th { text-align: left; font-size: 13.5px; color: var(--muted); padding: 2px 4px; }
  .gtable td { border-top: 1px solid #e1e6f5; padding: 5px 4px; }
  .numin { width: 90px; min-height: 44px; font-size: 20px; text-align: center; border: 2px solid #c3cdf2; border-radius: 12px; padding: 4px; background: #fff; }
  .numin:focus { outline: 3px solid var(--yellow); border-color: #e0a800; }
  .numin.ok { border-color: var(--green); background: #effbf5; }
  .ansrow { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-weight: 600; flex-wrap: wrap; }
  .slide { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .slide input[type=range] { flex: 1; min-height: 44px; accent-color: var(--coral); }
  .bigtemp { font-size: 26px; font-weight: 700; text-align: center; margin: 0; }

  /* ---------- Labels drawn on the pictures ---------- */
  .glabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--ink); }
  .gsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--muted); }
  .wsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .lay-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  .scaletag { background: var(--blue); color: #fff; font-weight: 700; border-radius: 10px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
  .readout { background: #fff; border-radius: 12px; padding: 5px 10px; font-size: 15px; line-height: 1.3; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .tapme { cursor: pointer; }
  .drop { animation: drop 1.2s linear infinite; }
  @keyframes drop { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(var(--d)); opacity: .2; } }
  .rise { animation: rise 1.6s linear infinite; }
  @keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(var(--d)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .drop, .rise { animation: none; } }

  /* ---------- Chips (tap, or drag onto the picture) ---------- */
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 12px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); }

  /* ---------- Missions and pop-ups ---------- */
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  .modal-box ul.icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  /* ---------- Big close button on every pop-up ---------- */
  .modal-box { position: relative; }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* ---------- Help pop-up (one tab at a time) ---------- */
  .help-welcome { margin: 0 0 6px; font-weight: 600; color: var(--blue); }
  .help-sec { margin: 10px 0 2px; font-size: 17px; }
  .help-q { margin: 0 0 4px; font-size: 18px; }
  .help-steps { margin: 2px 0 6px; padding-left: 24px; } .help-steps li { margin: 3px 0; }
  .help-look { margin: 4px 0 10px; }
  .teachers { margin: 8px 0 14px; font-size: 13.5px; color: var(--muted); }
  .teachers summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .teachers p { margin: 4px 0; }
  .model-tab { margin: -4px 0 8px; color: var(--muted); font-weight: 600; }

  /* ---------- "The science" highlight ---------- */
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }
  .science p { margin: 4px 0; }
  .bigq { font-weight: 600; margin: 4px 0 8px !important; }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 18px; }
    .tl { display: none; }
    .readout, .scaletag { font-size: 13px; padding: 3px 7px; }
    .glabel { font-size: 14px; } .gsmall { font-size: 11px; } .wsmall { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="hub-link" href="../index.html" title="Back to the Science Hub" aria-label="Back to the Science Hub">🏠</a>
  <div class="brand">🫧 Particle Playground</div>
  <div class="tabs" id="tabs"></div>
  <button class="btn missions" data-act="missions" title="Missions">🚀 <span class="long">Missions </span><span id="starCount"></span></button>
  <button class="btn" data-act="model" title="How is this model different from real life?">🤔<span class="long"> Real life?</span></button>
  <button class="btn" id="helpBtn" data-act="help" aria-label="How to use">❓</button>
</div>
<main>
  <div id="stage"></div>
  <div id="drawer"></div>
  <div id="banner" class="banner hidden" role="status">
    <div class="kicker" id="bannerKicker"></div>
    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>
    <div class="hint hidden" id="bannerHint"></div>
    <button class="close" data-act="stopMission" aria-label="Stop this mission">✖</button>
  </div>
</main>
<div id="missionsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="missionsTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="missionsTitle">🚀 Missions</h2>
    <div class="mission-list" id="missionList"></div>
    <div class="modal-actions"><button class="btn" data-act="resetStars">Reset stars</button><button class="btn primary" data-act="closeModals">Close</button></div>
  </div>
</div>
<div id="modelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="modelTitle">🤔 How is this model different from real life?</h2>
    <p class="model-tab" id="modelTab"></p>
    <p style="margin-top:0">A <span class="term">model</span> shows some important features of something real – but not everything.</p>
    <ul class="icons" id="modelList"></ul>
    <div class="modal-actions"><button class="btn primary" data-act="closeModals">Got it!</button></div>
  </div>
</div>
<div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div class="win-emoji">⭐</div>
    <h2 id="winTitle" style="text-align:center">Mission complete!</h2>
    <div class="win-text" id="winText"></div>
    <div class="modal-actions"><button class="btn" data-act="closeModals">Keep exploring</button><a class="btn primary" id="winPractise" href="../practice/index.html#particles">✏️ Practise this</a><button class="btn primary" id="winNext" data-act="nextMission">Next mission ▶</button></div>
  </div>
</div>
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div id="helpBody"></div>
    <div class="modal-actions"><a class="btn" href="../practice/index.html#particles">✏️ Practise this</a><button class="btn primary" data-act="closeModals">Let's go! 🚀</button></div>
  </div>
</div>

<script>
// ================= Utilities =================
const $ = (s, r = document) => r.querySelector(s);
// Saved progress; private windows can block storage, so failures are ignored
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// A repeatable random number generator, so the same picture comes back every time
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stageSize = () => { const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600; return { w, h, narrow: w < 560 }; };
const minus = n => String(n).replace('-', '−');
// A typed number, allowing a comma for the decimal point
const num = v => parseFloat(String(v).replace(',', '.'));

// Particles drawn inside a round close-up, in one of three arrangements.
// kind: 'solid' (a neat pattern), 'open' (a pattern with more space, like ice), 'liquid' (close, no pattern), 'gas' (far apart).
// mix: { n, col } adds n smaller particles of a second substance in the gaps between the others (a solution).
// Every particle of the first substance stays where it was.
function zoomCircle(cx, cy, R, kind, col, extra = '', mix = null) {
  const id = 'z' + (zoomCircle.n = (zoomCircle.n || 0) + 1), r = R / 7, pts = [], gapsAt = [], g = rng(Math.round(cx + cy));
  if (kind === 'gas') for (let i = 0; i < 7; i++) { const a = i * 2.4 + 0.5, d = R * (.25 + .5 * ((i * 37) % 10) / 10); pts.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d]); }
  else {
    const gap = kind === 'open' ? 2.5 : kind === 'liquid' ? 2.25 : 2.05;
    for (let row = -4; row <= 4; row++) for (let col = -5; col <= 5; col++) {
      let x = cx + (col + (row & 1) * .5) * gap * r, y = cy + row * gap * r * .87;
      if (kind === 'liquid') { x += (g() - .5) * r * .32; y += (g() - .5) * r * .32; }
      if (Math.hypot(x - cx, y - cy) < R - r * .6) pts.push([x, y]);
      // The middle of each triangle of neighbouring particles: a gap where a dissolved particle can fit
      const gx = cx + (col + .5 + (row & 1) * .5) * gap * r, gy = cy + (row + 1 / 3) * gap * r * .87;
      if (Math.hypot(gx - cx, gy - cy) < R - r) gapsAt.push([gx, gy, (Math.sin(row * 7.1 + col * 3.7) * 43758.5453 % 1 + 1) % 1]);
    }
  }
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" stroke="#8a93ad" stroke-width="3"/>`
    + `<g clip-path="url(#${id})">${pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * .92).toFixed(1)}" fill="${col}" stroke="rgba(0,0,0,.25)"/>`).join('')}`
    + (mix ? gapsAt.sort((a, b) => a[2] - b[2]).slice(0, mix.n).map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * .5).toFixed(1)}" fill="${mix.col}" stroke="rgba(0,0,0,.6)" stroke-width="2"/>`).join('') : '')
    + `${extra}</g>`;
}
const zoomLabel = (cx, y, txt) => `<text x="${cx}" y="${y}" text-anchor="middle" class="wsmall">${txt}</text>`;

// ================= State =================
const freshBox = () => ({ sub: 'water', temp: 20 });
const freshOdd = () => ({ mode: 'float', dropped: { water: false, wax: false }, waxTries: 0, why: null, whyWrong: [], frozen: false, read: { water: '', wax: '' }, tries: {}, ok: {} });
const freshEvap = () => ({ mode: 'evap', pred: null, left: false, ans: '', tries: 0, ok: false, waited: false, q1: null, q1w: [], q2: null, q2w: [] });
const freshDis = () => ({ pick: null, pred: {}, stirred: {} });
const freshGas = () => ({ mode: 'balloons', open: null, seen: [], placed: {}, chip: null, checked: false });
const state = { view: 'box', box: freshBox(), odd: freshOdd(), evap: freshEvap(), dis: freshDis(), gas: freshGas(), mission: null, done: store.get('pp-done', []) };

// ================= Particle box =================
// 30 particles in a box. Where each one is drawn comes straight from a formula of the time, so the motion is smooth and never builds up errors.
const SUBS = {
  water: { name: 'Water', em: '💧', mp: 0, bp: 100, col: '#3d7bff', names: { solid: 'ice', liquid: 'water', gas: 'water vapour' }, ems: { solid: '🧊', liquid: '💧', gas: '♨️' } },
  wax:   { name: 'Wax', em: '🕯️', mp: 60, bp: null, col: '#f0892e', names: { solid: 'solid wax', liquid: 'melted wax' }, ems: { solid: '🕯️', liquid: '🫗' } }
};
const PB = {
  N: 30,
  phase(sub, T) { const S = SUBS[sub]; return T < S.mp || (T === S.mp && sub === 'water' && T <= 0) ? 'solid' : S.bp != null && T >= S.bp ? 'gas' : 'liquid'; },
  geo() {
    const { w, h, narrow } = stageSize();
    const thermo = narrow ? 70 : 120, bs = Math.max(150, Math.min(h - (narrow ? 90 : 110), (w - thermo - 40) * .9, 470));
    const bx = (w - bs - thermo) / 2, by = (narrow ? 64 : 70) + (h - (narrow ? 64 : 70) - bs) / 2;
    return { w, h, narrow, bs, bx, by, r: bs / 24, tx: bx + bs + thermo * .55 };
  },
  // Where particle i would be, for this substance, state and temperature, at time t (seconds)
  target(i, sub, ph, T, t, g) {
    const { bx, by, bs, r } = g, heat = Math.max(0, Math.min(1, (T + 20) / 140)), rr = rng(i * 7919 + 1), p1 = rr() * 6.3, p2 = rr() * 6.3;
    const lattice = gap => { const row = Math.floor(i / 6), col = i % 6; return [bx + bs / 2 + (col - 2.5 + (row & 1 ? .25 : -.25)) * gap * r, by + bs - r * 1.1 - row * gap * r * .87]; };
    if (ph === 'solid') {
      // A neat pattern. Ice has a more open pattern than liquid water; solid wax is packed tighter than melted wax.
      const [x, y] = lattice(sub === 'water' ? 2.45 : 2.14), a = r * (.05 + .12 * heat);
      return [x + a * Math.sin(t * 9 + p1), y + a * Math.cos(t * 11 + p2)];
    }
    if (ph === 'liquid') {
      // Close together but not in a pattern. A liquid takes the shape of its container, so it spreads across the whole
      // bottom of the box: three uneven rows of touching particles that slide past each other.
      const row = Math.floor(i / 10), k = i % 10, rr2 = rng(row * 131 + 7), gaps = Array.from({ length: 10 }, () => 2.12 + rr2() * .2);
      const width = gaps.slice(1).reduce((a, c) => a + c, 0), off = gaps.slice(1, k + 1).reduce((a, c) => a + c, 0), shift = (rr2() - .5) * .5;
      const sp = .5 + heat, slide = r * .7 * Math.sin(t * .7 * sp + row * 1.9), dy = sub === 'water' ? 2.0 : 2.18;
      const x = bx + bs / 2 + (off - width / 2 + shift) * r + slide + r * .08 * Math.sin(t * 3 * sp + p1);
      return [Math.max(bx + r * 1.05, Math.min(bx + bs - r * 1.05, x)), by + bs - r * 1.1 - row * dy * r + r * .06 * Math.sin(t * 2.3 * sp + p2)];
    }
    // A gas: far apart, moving fast in straight lines and bouncing off the walls
    const sp = .25 + .35 * heat, tri = u => { u = ((u % 2) + 2) % 2; return u < 1 ? u : 2 - u; };
    return [bx + r + tri(rr() * 2 + (rr() - .5) * sp * t) * (bs - 2 * r), by + r + tri(rr() * 2 + (rr() - .5) * sp * t * 1.1) * (bs - 2 * r)];
  },
  stage() {
    const b = state.box, S = SUBS[b.sub], g = PB.geo(), ph = PB.phase(b.sub, b.temp), { bx, by, bs, tx } = g;
    let o = `<rect width="${g.w}" height="${g.h}" fill="#eef4fb"/>`;
    o += `<text x="${bx + bs / 2}" y="${by - 12}" text-anchor="middle" class="gsmall">🔍 Zoomed in: each circle is one particle</text>`;
    o += `<rect x="${bx}" y="${by}" width="${bs}" height="${bs}" rx="16" fill="#fff" stroke="#8a93ad" stroke-width="3"/>`;
    o += `<g id="parts"></g>`;
    // The thermometer
    const T0 = -20, T1 = 120, y0 = by + bs - 24, y1 = by + 16, ty = T => y0 - (T - T0) / (T1 - T0) * (y0 - y1);
    o += `<rect x="${tx - 9}" y="${y1 - 8}" width="18" height="${y0 - y1 + 16}" rx="9" fill="#fff" stroke="#8a93ad" stroke-width="2.5"/><circle cx="${tx}" cy="${y0 + 14}" r="16" fill="var(--coral)" stroke="#8a93ad" stroke-width="2.5"/>`;
    o += `<rect x="${tx - 5}" y="${ty(b.temp)}" width="10" height="${y0 + 6 - ty(b.temp)}" fill="var(--coral)"/>`;
    const mark = (T, txt) => `<path d="M${tx + 10} ${ty(T)} h10" stroke="var(--ink)" stroke-width="2"/><text x="${tx + 24}" y="${ty(T) + 4}" class="gsmall" style="fill:var(--ink)">${minus(T)} °C${g.narrow ? '' : ' ' + txt}</text>`;
    o += mark(S.mp, 'melts');
    if (S.bp != null) o += mark(S.bp, 'boils');
    o += `<text x="${tx}" y="${y1 - 16}" text-anchor="middle" class="glabel">${minus(b.temp)} °C</text>`;
    const label = { solid: 'Solid', liquid: 'Liquid', gas: 'Gas' }[ph];
    return `<div class="lay-top"><span class="scaletag">${S.ems[ph]} ${label}</span><div class="readout"><b>${S.name}</b> at ${minus(b.temp)} °C: ${S.names[ph]}</div></div>
      <svg id="boxSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="${S.name} particles at ${b.temp} degrees: ${label}">${o}</svg>`;
  },
  tick(now) {
    const el = $('#parts');
    if (state.view !== 'box' || !el) { PB.raf = null; return; }
    const b = state.box, g = PB.geo(), ph = PB.phase(b.sub, b.temp), key = `${b.sub}-${ph}`, t = still ? 0 : now / 1000;
    const tgt = Array.from({ length: PB.N }, (_, i) => PB.target(i, b.sub, ph, b.temp, t, g));
    // When the state changes, the particles glide from where they were to their new places
    if (key !== PB.key || !PB.cur) { PB.from = PB.cur || tgt; PB.t0 = now; PB.key = key; }
    const k = Math.min(1, (now - PB.t0) / 800), e = k * k * (3 - 2 * k);
    PB.cur = tgt.map(([x, y], i) => [PB.from[i][0] + (x - PB.from[i][0]) * e, PB.from[i][1] + (y - PB.from[i][1]) * e]);
    const col = SUBS[b.sub].col;
    el.innerHTML = PB.cur.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(g.r * .98).toFixed(1)}" fill="${col}" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>`).join('');
    PB.raf = requestAnimationFrame(PB.tick);
  },
  start() { if (!PB.raf) PB.raf = requestAnimationFrame(PB.tick); },
  DESCRIBE: {
    solid: ['🧱 Solid', 'The particles are <b>close together</b> in a <b>neat pattern</b>.', 'They <b>vibrate</b> (wobble) on the spot, but stay in place.', 'So a solid keeps its <b>shape</b>.'],
    liquid: ['💧 Liquid', 'The particles are <b>close together</b>, but <b>not in a pattern</b>.', 'They <b>move around</b> and <b>slide past</b> each other.', 'So a liquid can <b>flow</b>. It spreads out to take the <b>shape of its container</b>: look how it covers the bottom of the box!'],
    gas: ['💨 Gas', 'The particles are <b>far apart</b>.', 'They move <b>quickly</b> in all directions, bumping into the walls.', 'So a gas <b>spreads out</b> to fill its container.']
  },
  stateCard() {
    const b = state.box, S = SUBS[b.sub], ph = PB.phase(b.sub, b.temp), [title, ...lines] = PB.DESCRIBE[ph];
    let note = '';
    if (b.temp === S.mp) note = `At ${S.mp} °C, ${S.names.solid} <b>melts</b> into ${S.names.liquid}. This is the <b>melting point</b>.`;
    if (S.bp != null && b.temp === S.bp) note = `At ${S.bp} °C, water <b>boils</b> and turns into water vapour. This is the <b>boiling point</b>.`;
    if (b.sub === 'water' && ph === 'solid') note += ' Look: the particles in ice are in an <b>open</b> pattern, a tiny bit further apart than in liquid water.';
    if (b.sub === 'wax' && b.temp > 100) note += ' Wax needs to be very much hotter than this to boil.';
    return `<h3>${title}: ${S.names[ph]}</h3><ul class="facts">${lines.map(l => `<li>${l}</li>`).join('')}</ul>${note ? `<p class="spot">${note.trim()}</p>` : ''}`;
  },
  setTemp(T) {
    const b = state.box, before = PB.phase(b.sub, b.temp);
    b.temp = Math.max(-20, Math.min(120, Math.round(T)));
    renderStage();
    const sc = $('#stateCard'); if (sc) sc.innerHTML = PB.stateCard();
    const sl = $('#tempSlider'); if (sl && +sl.value !== b.temp) sl.value = b.temp;
    const ph = PB.phase(b.sub, b.temp);
    if (ph !== before) emit('phase', { sub: b.sub, ph });
  }
};

// ================= Water is odd =================
const WO = {
  WHY: [
    ['In ice, the particles are a little <b>further apart</b> than in liquid water, so ice is lighter than the same amount of water. Solid wax is the other way round.', true],
    ['Ice is colder than the water, and cold things always float.', false],
    ['The wax piece was too big. A smaller piece would float.', false]
  ],
  floatStage() {
    const o2 = state.odd, { w, h, narrow } = stageSize();
    const bw = Math.min(w * .27, h * .3), bh = bw * 1.05, base = h * (narrow ? .62 : .58), lvl = base - bh * .72, piece = bw * .3;
    let o = `<rect width="${w}" height="${h}" fill="#eef4fb"/><rect x="0" y="${base}" width="${w}" height="${h - base}" fill="#c9a77c"/><rect x="0" y="${base}" width="${w}" height="7" fill="#a8835a"/>`;
    [['water', w * .28, '#9fd0ff', '#eaf7ff', 'Water at 20 °C', 'Ice'], ['wax', w * .72, '#f4c46c', '#fbeecb', 'Melted wax at 70 °C', 'Solid wax']].forEach(([id, cx, liq, sol, title, pname]) => {
      const x0 = cx - bw / 2;
      o += `<text x="${cx}" y="${base - bh - 60}" text-anchor="middle" class="glabel">${title}</text>`;
      o += `<rect x="${x0}" y="${lvl}" width="${bw}" height="${base - lvl}" fill="${liq}" opacity=".85"/><path d="M${x0} ${base - bh} V${base} H${x0 + bw} V${base - bh}" fill="none" stroke="#7d8db0" stroke-width="3"/>`;
      let px = cx - piece / 2, py;
      // Not dropped yet: the piece waits above. Dropped: ice floats with a little showing; solid wax sinks to the bottom.
      if (!o2.dropped[id]) py = base - bh - 45;
      else py = id === 'water' ? lvl - piece * .1 : base - piece - 3;
      o += `<rect x="${px}" y="${py}" width="${piece}" height="${piece}" rx="${piece * .15}" fill="${sol}" stroke="${id === 'water' ? '#8fc0e6' : '#c9a05a'}" stroke-width="2.5"/>`;
      if (!o2.dropped[id]) o += `<text x="${cx + piece * .7}" y="${py + piece * .7}" class="gsmall">↓ ${pname}</text>`;
      else o += `<text x="${cx}" y="${base + 28}" text-anchor="middle" class="glabel" style="fill:${id === 'water' ? 'var(--green)' : 'var(--coral)'}">${id === 'water' ? 'Ice floats!' : 'Solid wax sinks!'}</text>`;
      // Close-ups of the particles once it has been dropped

        if (zy + R < h - 4) {
          o += zoomCircle(cx - R * 1.15, zy, R, id === 'water' ? 'open' : 'solid', id === 'water' ? '#7fb2ff' : '#f0892e') + zoomLabel(cx - R * 1.15, zy + R + 16, pname);
          o += zoomCircle(cx + R * 1.15, zy, R, 'liquid', id === 'water' ? '#3d7bff' : '#d9822b') + zoomLabel(cx + R * 1.15, zy + R + 16, id === 'water' ? 'Water' : 'Melted wax');
        }
      }
    });
    return `<div class="lay-top"><span class="scaletag">🧊 Float test</span><div class="readout">Drop a <b>solid</b> piece into its own <b>liquid</b>. Does it float or sink?</div></div>
      <svg id="oddSvg" viewBox="0 0 ${w} ${h}" aria-label="Ice in water and solid wax in melted wax">${o}</svg>`;
  },
  // Measuring cylinders: 100 ml of water and of melted wax, before and after they turn solid
  VOL: { water: 109, wax: 90 },
  freezeStage() {
    const o2 = state.odd, { w, h, narrow } = stageSize();
    const cw = Math.min(w * .09, 64), top = h * .2, bot = h * .86, ml = v => bot - (v / 120) * (bot - top);

    [['water', w * (narrow ? .17 : .16), o2.frozen ? '#e3f3ff' : '#9fd0ff', o2.frozen ? 'Ice' : 'Water'], ['wax', w * (narrow ? .62 : .6), o2.frozen ? '#fbeecb' : '#f4c46c', o2.frozen ? 'Solid wax' : 'Melted wax']].forEach(([id, cx, fill, name]) => {
      const v = o2.frozen ? WO.VOL[id] : 100, x0 = cx - cw / 2;

      o += `<rect x="${x0}" y="${ml(v)}" width="${cw}" height="${bot - ml(v)}" fill="${fill}" stroke="${id === 'water' ? '#8fc0e6' : '#c9a05a'}" stroke-width="1.5"/>`;

      if (o2.frozen && id === 'water') o += `<path d="M${x0 + 2} ${ml(v) + 1} Q${cx} ${ml(v) - 7} ${x0 + cw - 2} ${ml(v) + 1}" fill="${fill}" stroke="#8fc0e6" stroke-width="1.5"/>`;
      o += `<path d="M${x0} ${top - 8} V${bot} H${x0 + cw} V${top - 8}" fill="none" stroke="#7d8db0" stroke-width="3"/>`;
      for (let m = 0; m <= 120; m += 10) o += `<path d="M${x0} ${ml(m)} h${m % 50 ? 8 : 14}" stroke="#5b6386" stroke-width="1.5"/>` + (m % 20 === 0 ? `<text x="${x0 - 6}" y="${ml(m) + 4}" text-anchor="end" class="gsmall" style="font-size:11px">${m}</text>` : '');
      o += `<text x="${cx}" y="${bot + 20}" text-anchor="middle" class="gsmall">ml</text>`;
      // A magnified close-up of the scale from 80 ml to 120 ml, joined to the cylinder
      const zx = cx + cw / 2 + (narrow ? 14 : 30), zw = narrow ? 70 : 110, zt = top, zb = top + (bot - top) * .62, zv = m => zb - (m - 80) / 40 * (zb - zt);

      o += `<rect x="${zx}" y="${zt}" width="${zw}" height="${zb - zt}" rx="8" fill="#fff" stroke="var(--yellow)" stroke-width="3"/>`;

    const o2 = state.odd, msgs = [];
    ['water', 'wax'].forEach(id => {
      if (o2.ok[id]) return;
      const v = num(o2.read[id]), want = WO.VOL[id], name = id === 'water' ? 'ice' : 'solid wax';
      if (!Number.isFinite(v)) { msgs.push(`Type a number for the ${name}.`); return; }

      if (Math.abs(v - want) <= 1) { o2.ok[id] = 'right'; return; }

    o2.said = msgs.length ? msgs : null;

// ================= Evaporation and condensation =================
const EC = {
  // Three jugs of 100 ml, left for a day: the warmer it is, the more water evaporates
  JUGS: [['❄️', 'Fridge', 5, 90, 1], ['🏫', 'Classroom', 20, 80, 2], ['☀️', 'Sunny windowsill', 35, 50, 5]],
  evapStage() {
    const e = state.evap, { w, h, narrow } = stageSize(), jw = Math.min(w * .17, 110), jh = h * .36, base = h * .6, ml = v => base - v / 110 * jh;
    let o = `<rect width="${w}" height="${h}" fill="#eef4fb"/><rect x="0" y="${base}" width="${w}" height="${h - base}" fill="#c9a77c"/><rect x="0" y="${base}" width="${w}" height="7" fill="#a8835a"/>`;
    EC.JUGS.forEach(([em, name, T, after, n], i) => {
      const cx = w * (.18 + i * .32), x0 = cx - jw / 2, v = e.left ? after : 100;
      o += `<text x="${cx}" y="${base - jh - 38}" text-anchor="middle" class="glabel">${em} ${narrow ? '' : name}</text><text x="${cx}" y="${base - jh - 18}" text-anchor="middle" class="gsmall">${T} °C</text>`;
      o += `<rect x="${x0}" y="${ml(v)}" width="${jw}" height="${base - ml(v)}" fill="#9fd0ff"/><path d="M${x0} ${base - jh} V${base} H${x0 + jw} V${base - jh}" fill="none" stroke="#7d8db0" stroke-width="3"/>`;
      for (let m = 0; m <= 100; m += 10) o += `<path d="M${x0} ${ml(m)} h${m % 50 ? 9 : 15}" stroke="#1d2340" stroke-width="${m % 50 ? 1.2 : 2}"/>` + (true ? `<text x="${x0 + 18}" y="${ml(m) + 4}" style="font-size:${narrow ? 10 : 12}px;font-weight:700;fill:#1d2340">${m}</text>` : '');
      // Close-up of the water's surface: liquid below, air above, and particles escaping from the surface
      if (e.left) {
        const R = Math.min(w * .1, h * .12), zy = base + 22 + R, pr = R / 7 * .92;
        if (zy + R < h - 2) {
          const surf = zy - R * .05;
          let air = `<rect x="${cx - R}" y="${zy - R}" width="${2 * R}" height="${surf - (zy - R) - pr * 1.1}" fill="#fff"/><path d="M${cx - R} ${surf - pr * 1.1} H${cx + R}" stroke="#5fa8e8" stroke-width="2"/>`;
          for (let k = 0; k < n; k++) {
            const ax = cx - R * .48 + k * (n > 1 ? R * .96 / (n - 1) : 0) + (n === 1 ? R * .48 : 0), ay = surf - pr * 3 - (k % 2) * R * .28;
            air += `<circle cx="${ax}" cy="${ay}" r="${pr}" fill="#7fb2ff" stroke="rgba(0,0,0,.3)"/><path d="M${ax} ${ay - pr - 2} v-${R * .16}" stroke="var(--coral)" stroke-width="2.5"/><path d="M${ax - 4} ${ay - pr - R * .12} l4 -6 l4 6" stroke="var(--coral)" stroke-width="2.5" fill="none"/>`;
          }
          o += zoomCircle(cx, zy, R, 'liquid', '#3d7bff', air);
          o += zoomLabel(cx, zy + R + 15, `${n} particle${n > 1 ? 's' : ''} escaping`);
        }
      }
    });
    return `<div class="lay-top"><span class="scaletag">💨 Evaporation</span><div class="readout">${e.left ? 'One day later. How much water is left in each jug?' : '100 ml of water in each jug, in three different places.'}</div></div>
      <svg id="evapSvg" viewBox="0 0 ${w} ${h}" aria-label="Three jugs of water">${o}</svg>`;
  },
  condStage() {
    const e = state.evap, { w, h, narrow } = stageSize(), cw = Math.min(w * .15, 90), ch = cw * 1.7, base = h * .66;
    let o = `<rect width="${w}" height="${h}" fill="#fff6e0"/><rect x="0" y="${base}" width="${w}" height="${h - base}" fill="#c9a77c"/><rect x="0" y="${base}" width="${w}" height="7" fill="#a8835a"/>`;
    [['cold', w * .2, '#3d7bff', 'Cold can (from the fridge, 5 °C)'], ['warm', w * (narrow ? .82 : .8), '#f0892e', 'Can at room temperature (25 °C)']].forEach(([id, cx, col, name]) => {
      const x0 = cx - cw / 2, y0 = base - ch;
      o += `<rect x="${x0}" y="${y0}" width="${cw}" height="${ch}" rx="${cw * .18}" fill="${col}"/><rect x="${x0 + cw * .1}" y="${y0 - 6}" width="${cw * .8}" height="10" rx="4" fill="#b8bfd3"/><rect x="${x0 + cw * .15}" y="${y0 + ch * .3}" width="${cw * .7}" height="${ch * .35}" rx="6" fill="rgba(255,255,255,.35)"/>`;

    });
    // Close-up: water vapour particles in the air slow down on the cold can and join into a droplet
    if (e.waited) {
      const R = Math.min(w * .12, h * .17), zx = w * .2 + cw / 2 + R + (narrow ? 4 : 24), zy = base - ch * .55;
      const wall = `<rect x="${zx - R}" y="${zy - R}" width="${R * .35}" height="${R * 2}" fill="#3d7bff"/>`

          + [-.3, 0, .3].map(f => `<path class="rise" style="--d:-${br}px" d="M${cx + f * br} ${base - br * 1.25} q5 -${br * .3} 0 -${br * .6}" stroke="#8fb8e6" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>`).join('')

// ================= Dragging chips =================
// A chip can be tapped (then tap a box on the picture) or dragged onto the picture.
const TAP = { sort: id => { const s = state.gas; s.chip = s.chip === id ? null : id; render(); } };
const DROP = { sort: (id, e) => { const bin = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-bin]'); if (bin) GS.put(id, +bin.dataset.bin); } };
const Chips = {
  start(e, btn) {
    if (btn.disabled) return;
    e.preventDefault();
    Chips.d = { kind: btn.dataset.kind, id: btn.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null, btn };
    try { btn.setPointerCapture(e.pointerId); } catch {}
  },
  move(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    if (!d.ghost && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) {
      d.ghost = d.btn.cloneNode(true); d.ghost.classList.add('chip-ghost'); d.ghost.style.width = d.btn.offsetWidth + 'px';
      document.body.appendChild(d.ghost);
    }
    if (d.ghost) { d.ghost.style.left = e.clientX + 'px'; d.ghost.style.top = e.clientY + 'px'; }
  },
  end(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    Chips.d = null;
    if (!d.ghost) return TAP[d.kind](d.id);
    d.ghost.remove();
    const r = $('#stage').getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) DROP[d.kind](d.id, e);
  }
};
document.addEventListener('pointerdown', e => { const b = e.target.closest('.chip'); if (b) Chips.start(e, b); });
document.addEventListener('pointermove', e => Chips.move(e));
document.addEventListener('pointerup', e => Chips.end(e));
document.addEventListener('pointercancel', () => { if (Chips.d) { Chips.d.ghost?.remove(); Chips.d = null; } });

function emit(ev, data = {}) {
  if (state.mission == null) return;

  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('pp-done', state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    closeModals(); // never two pop-ups at once
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}
function startMission(i) {

function confetti() {
  const em = ['⭐', '🌟', '🫧', '🧊', '🎉'];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];

    ${helpFirst ? '<p class="help-welcome">👋 Welcome to Particle Playground!</p>' : ''}
    <h3 class="help-sec">🔬 The big question</h3><p class="help-q">${H.q}</p>
    <h3 class="help-sec">👆 What to do</h3><ol class="help-steps">${H.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    ${H.look ? `<p class="help-look"><b>💡 Look out for:</b> ${H.look}</p>` : ''}
    <p class="muted" style="margin:4px 0">🚀 Try the <b>Missions</b> to win stars!</p>
    <details class="teachers"><summary>For teachers</summary>${H.codes.map(c => `<p><b>${c}</b> ${CODES[c]}</p>`).join('')}
      <p><b>Also: 5TWSm.01</b> ${CODES['5TWSm.01']}</p></details>`;
  helpFirst = false;
  $('#helpModal').classList.remove('hidden');
}
// Never on top of another pop-up: if one is open, this runs again when it closes
function helpIfNew() {
  if (noHelp || helpSeen.has(state.view) || document.querySelector('.modal:not(.hidden)')) return;
  showHelp();
}
// Bring a card that has just changed into view in the drawer
function showCard(sel) { const c = $(sel); if (c) c.scrollIntoView({ block: 'nearest' }); }

function renderStage() { const v = VIEWS[state.view]; $('#stage').innerHTML = v.stage(); if (v.after) v.after(); }
function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>
    `<button class="btn${id === state.view ? ' active' : ''}" data-act="view" data-view="${id}" aria-label="${x.label.replace(/<[^>]+>/g, '').replace(/^\S+ /, '').replace('&amp;', '&')}">${x.label}</button>`).join('');
  const keep = $('#drawer').scrollTop, same = render.last === state.view;
  $('#drawer').innerHTML = v.drawer();
  renderStage();
  // Staying on the same tab keeps the drawer where it was scrolled to
  if (same) $('#drawer').scrollTop = keep;
  render.last = state.view;
  fitBanner();
  helpIfNew();
}

// ================= Actions =================
const ACTIONS = {
  view(el) { state.view = el.dataset.view; location.hash = 'view=' + state.view; render(); },
  bsub(el) { state.box.sub = el.dataset.s; render(); },
  bpreset(el) { PB.setTemp(+el.dataset.t); },
  omode(el) { state.odd.mode = el.dataset.m; state.odd.said = null; render(); },
  odrop(el) { const o2 = state.odd; o2.dropped[el.dataset.id] = true; if (el.dataset.id === 'wax') o2.waxTries++; render(); },
  owhy(el) { const o2 = state.odd, k = +el.dataset.k; if (WO.WHY[k][1]) { o2.why = k; render(); emit('why'); } else { o2.whyWrong.push(k); render(); } },
  ofreeze() { state.odd.frozen = true; render(); },
  ocheck() { WO.check(); },
  emode(el) { const e = state.evap; e.mode = el.dataset.m; render(); },
  epred(el) { state.evap.pred = +el.dataset.k; render(); },
  eleave() { const e = state.evap; if (e.pred != null) { e.left = true; render(); } },
  echeck() { EC.checkEvap(); },
  ewait() { state.evap.waited = true; render(); },
  eq1(el) { const e = state.evap, k = +el.dataset.k; if (EC.Q1[k][1]) e.q1 = k; else e.q1w.push(k); render(); },
  eq2(el) { const e = state.evap, k = +el.dataset.k; if (EC.Q2[k][1]) { e.q2 = k; render(); emit('cond'); } else { e.q2w.push(k); render(); } },
  dpick(el) { state.dis.pick = el.dataset.id; render(); },
  dpred(el) { const d = state.dis; d.pred[d.pick] = el.dataset.v === '1'; render(); },
  dstir() { const d = state.dis; if (d.pick && d.pred[d.pick] != null) { d.stirred[d.pick] = true; render(); showCard('#disStep'); if (DORDER.every(x => d.stirred[x])) emit('dissolve'); } },
  gmode(el) { state.gas.mode = el.dataset.m; state.gas.chip = null; render(); },
  gcheck() { GS.check(); },
  greset() { state.gas = Object.assign(freshGas(), { mode: 'sort', seen: state.gas.seen }); render(); },
  missions() {
    $('#missionList').innerHTML = MISSIONS.map((m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title}</span><span class="star">⭐</span></button>`).join('');
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  resetStars() { state.done = []; store.set('pp-done', []); updateStars(); ACTIONS.missions(); },
  // Closing a pop-up (button, ✕, Esc or tapping outside) may let a waiting help pop-up appear
  closeModals() { closeModals(); helpIfNew(); },
  help() { closeModals(); showHelp(); },
  model() {
    $('#modelTab').textContent = tabName(state.view);
    $('#modelList').innerHTML = [...REAL_ALL, ...(REAL[state.view] || [])].map(([em, t]) => `<li><span class="em">${em}</span><span>${t}</span></li>`).join('');
    $('#modelModal').classList.remove('hidden');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// Typed answers are kept as you type, so they survive the drawer being redrawn
document.addEventListener('input', e => {
  if (e.target.id === 'tempSlider') PB.setTemp(+e.target.value);
  if (e.target.matches('.numin[data-id]')) state.odd.read[e.target.dataset.id] = e.target.value;
  if (e.target.id === 'evapAns') state.evap.ans = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.matches('.numin[data-id]')) WO.check();
  if (e.target.id === 'evapAns') EC.checkEvap();
});
// Taps on the pictures: a balloon to read about it; a box to put the chosen word in (or take things back out)
$('#stage').addEventListener('click', e => {
  const gas = e.target.closest('[data-gas]')?.dataset.gas;
  if (gas) { const s = state.gas; s.open = gas; if (!s.seen.includes(gas)) s.seen.push(gas); render(); showCard('#gasCard'); emit('gases', { n: s.seen.length }); return; }
  const bin = e.target.closest('[data-bin]')?.dataset.bin;
  if (bin != null) {
    const s = state.gas;
    if (s.chip) GS.put(s.chip, +bin);
    // Nothing chosen: tapping one thing in a box sends just that one back to the panel
    else { const item = e.target.closest('[data-item]')?.dataset.item; if (item) { delete s.placed[item]; s.checked = false; render(); } }
  }
});
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) ACTIONS.closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.modal:not(.hidden)')) ACTIONS.closeModals(); });
let resizeT;
addEventListener('resize', () => { fitBanner(); clearTimeout(resizeT); resizeT = setTimeout(renderStage, 120); });

// ================= Start =================
// Test hooks: #view=box&sub=wax&temp=70 · #view=odd&mode=freeze&frozen=1 · #view=odd&dropped=1 · #view=evap&left=1 · #view=evap&mode=cond&waited=1
// #view=dis&pick=salt&stirred=salt · #view=gas&open=co2 · #view=gas&mode=sort&placed=all · #mission=3
// #nohelp=1 stops the help popping up by itself (for screenshots and tests)
const hp = new URLSearchParams(location.hash.slice(1));
noHelp = hp.get('nohelp') === '1';
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
if (SUBS[hp.get('sub')]) state.box.sub = hp.get('sub');
if (hp.has('temp')) state.box.temp = Math.max(-20, Math.min(120, +hp.get('temp')));
if (state.view === 'odd') {
  if (hp.get('mode') === 'freeze') state.odd.mode = 'freeze';
  if (hp.has('frozen')) state.odd.frozen = true;
  if (hp.has('dropped')) { state.odd.dropped = { water: true, wax: true }; state.odd.waxTries = 1; }
}
if (state.view === 'evap') {
  if (hp.get('mode') === 'cond') state.evap.mode = 'cond';
  if (hp.has('left')) { state.evap.pred = 2; state.evap.left = true; }
  if (hp.has('waited')) state.evap.waited = true;
}
if (DIS[hp.get('pick')]) state.dis.pick = hp.get('pick');
if (hp.has('stirred')) hp.get('stirred').split(',').filter(id => DIS[id]).forEach(id => { state.dis.stirred[id] = true; state.dis.pred[id] = true; });
if (GASES[hp.get('open')]) { state.gas.open = hp.get('open'); state.gas.seen.push(hp.get('open')); }
if (state.view === 'gas' && hp.get('mode') === 'sort') state.gas.mode = 'sort';
if (hp.get('placed') === 'all') SORDER.forEach(id => { state.gas.placed[id] = SORTS[id][1]; });
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
</script>
</body>
