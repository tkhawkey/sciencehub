<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Lab</title>
<meta name="description" content="Plan a fair test to find out what bean seeds need to germinate: change one thing, keep the rest the same, predict, then fast forward 10 days – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Particle Playground) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 11px; }
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #eef4fb; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done, .opt.done:disabled { background: #c9f2df; border-color: var(--green); opacity: 1; }
  .opt:disabled { opacity: .45; cursor: default; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .tick { color: var(--green); }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }
  .says { border: 3px solid var(--yellow); }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .says li { margin: 4px 0; }
  .wq .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
  /* Check stays in reach at the bottom of the drawer */
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-block; vertical-align: -2px; border: 1px solid rgba(0,0,0,.2); }
  .facts { margin: 6px 0 0; padding-left: 20px; } .facts li { margin: 3px 0; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  .gtable th { text-align: left; font-size: 13.5px; color: var(--muted); padding: 2px 4px; }
  .gtable td { border-top: 1px solid #e1e6f5; padding: 5px 4px; }
  .numin { width: 90px; min-height: 44px; font-size: 20px; text-align: center; border: 2px solid #c3cdf2; border-radius: 12px; padding: 4px; background: #fff; }
  .numin:focus { outline: 3px solid var(--yellow); border-color: #e0a800; }
  .numin.ok { border-color: var(--green); background: #effbf5; }
  .ansrow { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-weight: 600; flex-wrap: wrap; }
  .slide { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .slide input[type=range] { flex: 1; min-height: 44px; accent-color: var(--coral); }
  .bigtemp { font-size: 26px; font-weight: 700; text-align: center; margin: 0; }

  /* ---------- Labels drawn on the pictures ---------- */
  .glabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--ink); }
  .gsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--muted); }
  .wsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .lay-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  .scaletag { background: var(--blue); color: #fff; font-weight: 700; border-radius: 10px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
  .readout { background: #fff; border-radius: 12px; padding: 5px 10px; font-size: 15px; line-height: 1.3; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .tapme { cursor: pointer; }
  .drop { animation: drop 1.2s linear infinite; }
  @keyframes drop { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(var(--d)); opacity: .2; } }
  .rise { animation: rise 1.6s linear infinite; }
  @keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(var(--d)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .drop, .rise { animation: none; } }

  /* ---------- Chips (tap, or drag onto the picture) ---------- */
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 12px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); }

  /* ---------- Missions and pop-ups ---------- */
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  .modal-box ul.icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 18px; }
    .tl { display: none; }
    .readout, .scaletag { font-size: 13px; padding: 3px 7px; }
    .glabel { font-size: 14px; } .gsmall { font-size: 11px; } .wsmall { font-size: 11px; }
  }

  /* ---------- Seed Lab ---------- */
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .steps span { font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); }
  .steps span.now { background: var(--yellow); color: var(--ink); }
  .steps span.done { background: #c9f2df; color: #147a55; }
  .varrow { margin: 8px 0; }
  .varrow > span { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
  .tag { background: var(--yellow); border-radius: 8px; padding: 1px 6px; font-size: 12px; }
  .opt.sm { font-size: 14px; padding: 4px 8px; }
  .keeps { display: grid; gap: 4px; margin-top: 6px; }
  .keep { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 8px; border-radius: 10px; background: var(--soft); font-size: 15px; cursor: pointer; }
  .keep input { width: 22px; height: 22px; accent-color: var(--green); }
  ul.spot { padding-left: 28px; }
  .report p { margin: 6px 0; }
  .report b.k { display: block; font-size: 13.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  /* A page of flaps, like the paper one: tap to lift a flap and see what is under it */
  .flaps { position: absolute; top: 54px; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; }
  .flap { position: relative; overflow: hidden; border: 0; border-radius: 16px; background: var(--fc); box-shadow: 0 4px 0 rgba(0,0,0,.15); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; color: var(--ink); }
  .flap::after { content: ''; position: absolute; right: 0; bottom: 0; border-style: solid; border-width: 0 0 26px 26px; border-color: transparent transparent rgba(0,0,0,.14) transparent; }
  .flap .ft { font-weight: 700; font-size: 17px; line-height: 1.15; }
  .flap .em { font-size: 40px; }
  .flap .tap { font-size: 13px; font-weight: 600; color: var(--muted); }
  .flap.open { background: #fff; box-shadow: inset 0 0 0 4px var(--fc), 0 4px 0 rgba(0,0,0,.1); justify-content: space-evenly; }
  .flap.open::after { display: none; }
  .flap.sel { box-shadow: inset 0 0 0 4px var(--yellow), 0 4px 0 rgba(0,0,0,.1); }
  .flap .pics { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 6px; }
  .flap .pics span { display: flex; flex-direction: column; align-items: center; }
  .flap .pics svg { width: clamp(36px, 6.2vw, 92px); height: auto; }
  .flap .pics i { font-style: normal; font-size: 12px; font-weight: 600; }
  .flap .why { font-size: 15px; line-height: 1.3; }
  @media (max-width: 760px) {
    .flaps { top: 44px; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; }
    .flap { flex-direction: row; gap: 6px; padding: 4px 6px; }
    .flap .ft { font-size: 13.5px; } .flap .em { font-size: 24px; } .flap .tap { display: none; }
    .flap.open { flex-direction: column; justify-content: center; gap: 2px; }
    .flap .pics svg { width: 28px; } .flap .pics i { display: none; }
    .flap .why { font-size: 11.5px; }
  }
  .seedcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .seedcard { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 4px; min-height: 44px; font-weight: 600; font-size: 13.5px; line-height: 1.15; cursor: pointer; text-align: center; }
  .seedcard.sel { background: var(--yellow); border-color: #e0a800; }
  textarea.reason { width: 100%; min-height: 64px; border: 2px solid #c3cdf2; border-radius: 12px; padding: 6px 8px; font-size: 15.5px; resize: vertical; }

  /* ---------- Per-tab help, close buttons and "the science" boxes ---------- */
  .modal-box { position: relative; }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }
  .help-body h3 { margin: 12px 0 4px; font-size: 17px; }
  .help-body p { margin: 4px 0; line-height: 1.4; }
  .help-body ol { margin: 4px 0; padding-left: 24px; line-height: 1.4; }
  .help-body ol li { margin: 3px 0; }
  .help-body .welcome { font-weight: 700; color: var(--blue); }
  .help-body .subtab { margin: -4px 0 8px; color: var(--muted); font-weight: 600; }
  details.teach { margin: 12px 0; font-size: 13px; color: var(--muted); }
  details.teach summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  details.teach p { margin: 4px 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="hub-link" href="../index.html" title="Back to the Science Hub" aria-label="Back to the Science Hub">🏠</a>
  <div class="brand">🌱 Seed Lab</div>
  <div class="tabs" id="tabs"></div>
  <button class="btn missions" data-act="missions" title="Missions">🚀 <span class="long">Missions </span><span id="starCount"></span></button>
  <button class="btn" data-act="model" title="How is this model different from real life?">🤔<span class="long"> Real life?</span></button>
  <button class="btn" id="helpBtn" data-act="help" aria-label="How to use">❓</button>
</div>
<main>
  <div id="stage"></div>
  <div id="drawer"></div>
  <div id="banner" class="banner hidden" role="status">
    <div class="kicker" id="bannerKicker"></div>
    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>
    <div class="hint hidden" id="bannerHint"></div>
    <button class="close" data-act="stopMission" aria-label="Stop this mission">✖</button>
  </div>
</main>
<div id="missionsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="missionsTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="missionsTitle">🚀 Missions</h2>
    <div class="mission-list" id="missionList"></div>
    <div class="modal-actions"><button class="btn" data-act="resetStars">Reset stars</button><button class="btn primary" data-act="closeModals">Close</button></div>
  </div>
</div>
<div id="modelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="modelTitle">🤔 How is this model different from real life?</h2>
    <p class="muted" id="modelTab" style="margin:-4px 0 8px;font-weight:600"></p>
    <p style="margin-top:0">A <span class="term">model</span> shows some important features of something real – but not everything.</p>
    <ul class="icons" id="modelList"></ul>
    <div class="modal-actions"><button class="btn primary" data-act="closeModals">Got it!</button></div>
  </div>
</div>
<div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div class="win-emoji">⭐</div>
    <h2 id="winTitle" style="text-align:center">Mission complete!</h2>
    <div class="win-text" id="winText"></div>
    <div class="modal-actions"><button class="btn" data-act="closeModals">Keep exploring</button><a class="btn primary" id="winPractise" href="../practice/index.html#seeds">✏️ Practise this</a><button class="btn primary" id="winNext" data-act="nextMission">Next mission ▶</button></div>
  </div>
</div>
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <div class="help-body" id="helpBody"></div>
    <div class="modal-actions"><a class="btn" href="../practice/index.html#seeds">✏️ Practise this</a><button class="btn primary" data-act="closeModals">Let's go! 🚀</button></div>
  </div>
</div>

<script>
// ================= Utilities =================
const $ = (s, r = document) => r.querySelector(s);
// Saved progress; private windows can block storage, so failures are ignored
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// Lower-case the first letter only, so units like °C keep their capitals
const lc = t => t[0].toLowerCase() + t.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const stageSize = () => { const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600; return { w, h, narrow: w < 560 }; };

// ================= Variables =================
// The four things that can be different for a pot. The first choice of each is how every pot starts.
const VARS = {
  // Each choice is [icon, label, how to say it in a sentence]
  water: { name: 'Water', the: 'the water', opts: { wet: ['💧', 'Watered', 'with water'], dry: ['🚫', 'No water', 'with no water'] } },
  temp:  { name: 'Temperature', the: 'the temperature', opts: { warm: ['🌡️', 'Warm (20 °C)', 'in the warm'], cold: ['❄️', 'Cold (4 °C)', 'in the cold'] } },
  light: { name: 'Light', the: 'the light', opts: { light: ['☀️', 'Light', 'in the light'], dark: ['🌑', 'Dark', 'in the dark'] } },
  soil:  { name: 'What it grows in', the: 'what the seeds grow in', opts: { soil: ['🟫', 'Soil', 'in soil'], cotton: ['☁️', 'Damp cotton wool', 'in damp cotton wool'] } }
};
const VORDER = ['water', 'temp', 'light', 'soil'];

const BLOCKS = { water: ['dry', 'none of the pots had any <b>water</b>'], temp: ['cold', 'all the pots were <b>cold</b>'] };
// What could be measured, and whether it fits a question about germination
const MEASURES = [
  ['germ', 'How many of the 10 seeds germinate (start to grow)', true, ''],
  ['height', 'How tall the plants are after 10 days', false, 'That is a good thing to measure for <b>growth</b>, but our question is about <b>germination</b>: does the seed start to grow at all?'],

// How many pots in each group: the question that makes children decide to repeat
const REPS = [
  ['1', '1 pot', false, 'If that one pot had some <b>dud</b> seeds, you would never know! Use more than one pot, so you can see if the results <b>repeat</b>.'],
  ['3', '3 pots', true, 'Good choice! If the 3 pots in a group give similar results, you can trust them more. If one is very different, you will spot it.'],

const PER = 3;   // pots in each group on the bench
// Things that should be kept the same (the control variables), plus two that should not be on the list
const KEEPS = [

// Analysing the results: what to do about an odd result
const ACTS = [

// The science behind each conclusion: [answer, right?, why not]
const WHY = {
  water: [['A seed takes in water, so it swells up, splits its coat and starts to grow.', true],
    ['Water keeps the seed cool, so it can grow.', false, 'The seeds were warm in both groups. Think about what water does <b>inside</b> the seed.'],
    ['Water washes the soil away, so the shoot can get out.', false, 'The soil stayed in the pot. Think about what water does <b>inside</b> the seed.']],
  temp: [['At 4 °C, the seeds are frozen solid and die.', false, '4 °C is cold, but it is above freezing (0 °C), so the water does not freeze. The seeds are still alive.'],
    ['Warmth lets the changes inside a seed happen. In the cold they are very slow, so the seed waits.', true],

  light: [['Seeds can get light through the soil.', false, 'Light can\'t get through soil, and the dark pots had no light at all.'],

  soil: [['A seed has its own store of food inside it. The damp cotton wool gave it water, so it did not need soil to germinate.', true],
    ['Cotton wool has plant food in it.', false, 'Cotton wool has no plant food in it. So where does a seed get food from when it starts to grow?'],
    ['Seeds don\'t need water to germinate.', false, 'The cotton wool was <b>damp</b>, so the seeds had water.']]

// Ways to improve the investigation: [idea, good idea?, why]
const IMPROVE = [
  ['Use more pots in each group', true, 'More repeats make it easier to spot odd results, so you can trust the pattern more.'],
  ['Check the pots every day, not just on day 10', true, 'Then you would find out how <b>quickly</b> the seeds germinate, not just how many.'],
  ['Test other kinds of seed too', true, 'Then you would know if your conclusion is true for other seeds, not just beans. (Lettuce seeds do need light!)'],

// ================= State =================
// The pots are set up a group at a time: every pot in a group is the same
const freshLab = () => ({ step: 0, iv: null, dv: null, dvWrong: [], reps: null, repsWrong: [], groups: [startPot(), startPot()], sel: 0, said: null, keeps: {}, keepsSaid: null,
  pred: null, reason: '', ran: false,
  // Analysing: the bar chart children draw, the pattern, the odd result, the conclusion and an improvement

  act: null, actWrong: [], repeated: false, claim: null, claimWrong: [], why: null, whyWrong: [], imp: null, impTried: [],
  get pots() { return this.groups.flatMap(gp => Array.from({ length: PER }, () => ({ ...gp }))); } });
const GNAME = ['A', 'B'], groupOf = i => Math.floor(i / PER);
const state = { view: 'bench', lab: freshLab(), mission: null, done: store.get('sl-done', []) };

// ================= Germination =================
// Beans need water and warmth to germinate. Light and soil make no difference (they need light later, to grow).
// The results are always the same for the same set-up, with a few dud seeds so they are not perfectly neat.
const LAB = {
  germinated(pots) {
    const good = p => p.water === 'wet' && p.temp === 'warm';
    let goodSeen = 0;
    return pots.map((p, i) => {
      if (p.water === 'dry') return 0;
      if (p.temp === 'cold') return [1, 0, 0, 1, 0, 0][i];
      goodSeen++;
      // The second pot with good conditions has a batch of duds: an odd result to spot later
      if (goodSeen === 2 && pots.filter(good).length >= 3) return 4;
      return [9, 10, 9, 8, 10, 9][i];
    });
  },
  // Is the plan fair? Returns a list of problems (empty if fair)
  problems() {
    const L = state.lab, V = VARS[L.iv], [A, B] = L.groups, msgs = [];
    VORDER.filter(k => k !== L.iv).forEach(k => {
      if (A[k] !== B[k]) msgs.push(`Not fair: ${VARS[k].the} is different in the two groups. You are only testing <b>${V.the}</b>, so keep everything else the same.`);
    });
    if (A[L.iv] === B[L.iv]) msgs.push(`Both groups have the same ${V.name.toLowerCase()}. Change it for one of the groups.`);
    return msgs;
  },
  // What actually happened: which group germinated more, or no real difference
  effect() {
    const L = state.lab, g = LAB.germinated(L.pots), vals = Object.keys(VARS[L.iv].opts);
    const mean = v => { const xs = g.filter((_, i) => L.pots[i][L.iv] === v); return xs.reduce((a, b) => a + b, 0) / xs.length; };
    const [a, b] = vals.map(mean);
    // Hardly anything germinated in either group: the test can't tell us anything
    if (Math.max(a, b) < 2) return 'none';
    return Math.abs(a - b) < 3 ? 'same' : a > b ? vals[0] : vals[1];
  },
  // The things kept the same that stopped the seeds germinating
  blockers() { const L = state.lab; return VORDER.filter(k => k !== L.iv && BLOCKS[k] && L.groups[0][k] === BLOCKS[k][0]); },
  // Pictures: two groups, each a labelled row of three pots
  geo() {
    const { w, h, narrow } = stageSize(), gw = (w - 28) / PER, top = narrow ? 50 : 56, gh = (h - top - 4) / 2, hh = narrow ? 28 : 34;
    return { w, h, narrow, gw, gh, hh, top, band: gi => top + gi * gh, cell: i => ({ x: 14 + (i % PER) * gw, y: top + groupOf(i) * gh + hh }) };
  },
  stage() {
    if (state.lab.step >= 5 && state.lab.show === 'chart') return LAB.chart();
    const L = state.lab, g = LAB.geo(), ran = L.ran, counts = ran ? LAB.germinated(L.pots) : null;
    const setting = L.step === 1 && L.said !== 'fair';
    let o = `<rect width="${g.w}" height="${g.h}" fill="#eef4fb"/>`;
    // Each group's frame and label, with how it is set up
    L.groups.forEach((gp, gi) => {
      const y0 = g.band(gi), on = setting && L.sel === gi, iv = L.iv && VARS[L.iv].opts[gp[L.iv]];
      o += `<g${setting ? ' class="tapme"' : ''} data-group="${gi}"><rect x="6" y="${y0}" width="${g.w - 12}" height="${g.gh - 6}" rx="16" fill="#fff" fill-opacity=".55" stroke="${on ? 'var(--yellow)' : 'rgba(0,0,0,.15)'}" stroke-width="${on ? 5 : 2}"/>`;
      o += `<text x="18" y="${y0 + g.hh * .72}" style="font-size:${g.narrow ? 14 : 18}px;font-weight:700;fill:var(--ink)">Group ${GNAME[gi]}${iv ? ` · ${iv[0]} ${iv[1]}` : ''}</text>`;
      o += `<text x="${g.w - 18}" y="${y0 + g.hh * .72}" text-anchor="end" style="font-size:${g.narrow ? 12 : 17}px">${VORDER.map(k => VARS[k].opts[gp[k]][0]).join(g.narrow ? '' : ' ')}</text></g>`;
    });
    L.pots.forEach((p, i) => {
      const { x, y } = g.cell(i), cw = g.gw - 10, ch = g.gh - g.hh - 14, dark = p.light === 'dark', cold = p.temp === 'cold';
      const bg = cold ? (dark ? '#3d4a66' : '#dcefff') : (dark ? '#4f5468' : '#fff4cf'), ink = dark ? '#fff' : 'var(--ink)';
      o += `<g${setting ? ' class="tapme"' : ''} data-group="${groupOf(i)}"><rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="12" fill="${bg}" stroke="rgba(0,0,0,.12)" stroke-width="2"/>`;
      o += `<text x="${x + 10}" y="${y + 20}" style="font-size:${g.narrow ? 12 : 15}px;font-weight:700;fill:${ink}">${g.narrow ? '' : 'Pot '}${i + 1}</text>`;

      o += `<path d="M${px - pw / 2} ${rim} L${px - pw * .38} ${pb} L${px + pw * .38} ${pb} L${px + pw / 2} ${rim} Z" fill="#c8673d" stroke="#8e4524" stroke-width="2"/>`;
      o += `<path d="M${px - pw * .47} ${rim + 6} L${px - pw * .39} ${pb - 4} L${px + pw * .39} ${pb - 4} L${px + pw * .47} ${rim + 6} Z" fill="${fill}"/>`;

          o += dark ? `<ellipse cx="${bx - 3}" cy="${top}" rx="3.5" ry="2" fill="#f0e27a"/><ellipse cx="${bx + 3}" cy="${top}" rx="3.5" ry="2" fill="#f0e27a"/>`
            : `<ellipse cx="${bx - 5}" cy="${top}" rx="6" ry="3" fill="#5fbf4f"/><ellipse cx="${bx + 5}" cy="${top}" rx="6" ry="3" fill="#5fbf4f"/>`;
        }
        o += `<ellipse cx="${bx}" cy="${by}" rx="${Math.max(3, sw * .38)}" ry="${Math.max(2.2, sw * .26)}" fill="#e9d7a8" stroke="#a88b4e" stroke-width="1.2"/>`;
      }
      if (ran) o += `<g><rect x="${x + 8}" y="${y + ch - 40}" width="${g.narrow ? 46 : 58}" height="28" rx="10" fill="#fff" stroke="var(--green)" stroke-width="2"/><text x="${x + 8 + (g.narrow ? 23 : 29)}" y="${y + ch - 21}" text-anchor="middle" style="font-size:${g.narrow ? 13 : 16}px;font-weight:700;fill:var(--ink)">${n}/10</text></g>`;
      o += `</g>`;
    });
    return `<div class="lay-top"><span class="scaletag">${ran ? '⏩ Day 10' : '🌱 Day 0'}</span><div class="readout">${ran ? 'How many seeds germinated in each pot?' : setting ? 'Tap a group to set it up.' : 'Two groups of 3 pots. Each pot has 10 bean seeds.'}</div></div>
      <svg id="labSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="Two groups of three pots of bean seeds">${o}</svg>`;
  },
  // The pot whose result does not fit the pattern (the batch of dud seeds)
  anomaly() { return LAB.germinated(state.lab.pots).indexOf(4); },
  groupLabel(gi) { const L = state.lab, o = VARS[L.iv].opts[L.groups[gi][L.iv]]; return `Group ${GNAME[gi]} (${o[0]} ${lc(o[1]).replace(/ \((.+)\)/, ', $1')})`; },

  },
  chart() {
    const L = state.lab, c = LAB.chartGeo(), g = LAB.germinated(L.pots), anom = LAB.anomaly();
    const drawing = L.step === 5 && L.chartSaid !== 'ok' && L.chartSaid !== 'shown', spotting = L.step === 6 && L.pat === LAB.patAnswer() && !L.oddFound;

      o += `<g${tap}><rect x="${x - c.slot / 2}" y="${c.top - 6}" width="${c.slot}" height="${c.y0 - c.top + 6}" fill="${drawing ? 'rgba(61,123,255,.05)' : 'transparent'}"/>`;

        o += `<text x="${x}" y="${c.y0 - v * c.unit - 7}" text-anchor="middle" style="font-size:${fs}px;font-weight:700;fill:${wrong ? 'var(--coral)' : 'var(--ink)'}">${v}</text>`;
      }
      o += `<text x="${x}" y="${c.y0 + 18}" text-anchor="middle" style="font-size:${fs}px;font-weight:600;fill:var(--ink)">${c.narrow ? '' : 'Pot '}${i + 1}</text></g>`;
      // The repeat of the odd pot, drawn as a dashed bar beside the first try

    });
    [0, 1].forEach(gi => {
      const o2 = VARS[L.iv].opts[L.groups[gi][L.iv]];
      o += `<text x="${c.cx(gi * PER + 1)}" y="${c.y0 + (c.narrow ? 38 : 44)}" text-anchor="middle" style="font-size:${fs}px;font-weight:700;fill:${cols[gi]}">Group ${GNAME[gi]}: ${o2[0]} ${o2[1]}</text>`;
    });
    const say = drawing ? 'Tap each column to make its bar the right height.' : spotting ? 'Tap the bar that does not fit the pattern.' : `How ${VARS[L.iv].the} affected germination`;
    return `<div class="lay-top"><span class="scaletag">📊 Bar chart</span><div class="readout">${say}</div></div>
      <svg id="labSvg" viewBox="0 0 ${c.w} ${c.h}" aria-label="Bar chart of how many seeds germinated in each pot">${o}</svg>`;
  },
  analyse(bar) {
    const L = state.lab, V = VARS[L.iv], g = LAB.germinated(L.pots), anom = LAB.anomaly(), ag = groupOf(anom);
    // Step 6: draw the bar chart from the table

        ${L.oddFound ? `<div class="card wq"><h3>3. What should you do about it?</h3>

          ${act && !act[2] ? `<p class="spot">💡 ${act[3]}</p>` : ''}

      <div class="card">${showToggle()}<div class="navrow" style="margin-top:8px"><button class="btn" data-act="preset">↺ Plan a new test</button></div></div>`;
  },

function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('sl-done', state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}
function startMission(i) {
  closeModals();
  state.mission = i; MISSIONS[i].setup();
  location.hash = 'view=' + state.view;
  const m = MISSIONS[i];
  $('#bannerKicker').textContent = `Mission ${i + 1} of ${MISSIONS.length}: ${m.title}`;
  $('#bannerText').innerHTML = m.task; $('#bannerHint').innerHTML = m.hint;
  $('#bannerHint').classList.add('hidden'); $('#hintBtn').textContent = '💡 Show a hint';
  $('#banner').classList.remove('hidden');
  render();
}
function stopMission() { state.mission = null; $('#banner').classList.add('hidden'); fitBanner(); }
// The banner sits over the top of the drawer, so the drawer's cards start below it
function fitBanner() { $('#drawer').style.paddingTop = state.mission == null ? '' : `${$('#banner').offsetHeight + 18}px`; }
function updateStars() { $('#starCount').textContent = `${state.done.filter(id => MISSIONS.some(m => m.id === id)).length}/${MISSIONS.length} ⭐`; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
// Closing a pop-up by hand (button, ✕, Esc, tapping outside) can let a waiting help pop-up show
function closeAll() { closeModals(); maybeHelp(); }
function confetti() {
  const em = ['⭐', '🌟', '🌱', '🫘', '🎉'];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = `${Math.random() * 100}vw`; s.style.animationDuration = `${2 + Math.random() * 2}s`; s.style.animationDelay = `${Math.random() * .6}s`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);

}

const SP = {

          <p>Plants spread their seeds so the new plants are not competing with the parent plant, or with each other, for <b>light</b>, <b>water</b> and <b>space</b>.</p></div>`
        : `<div class="card says good"><h3>${T[0]} ${T[1]}</h3><p>${T[2]}</p><ul class="icons" style="margin:0">${SORDER.filter(id => SEEDS[id][1] === f).map(id => `<li><span class="em">${seedSvg(id, 34)}</span><span><b>${SEEDS[id][0]}</b>: ${SEEDS[id][2]}</span></li>`).join('')}</ul></div>`;
      return `${detail}<div class="card">${nav}<h2 style="margin-top:8px">📖 Ways seeds travel</h2><p>There are <b>7</b> ways seeds travel. Tap each flap to open it, and find out how.</p><p class="muted">${n} of 8 flaps opened</p></div>
        ${n === 8 ? '<div class="checkbar"><button class="btn go" data-act="spart" data-v="sort">Next: sort the seeds ▶</button></div>' : ''}`;
    }
    if (sp.part === 'sort') {
      const left = roundSeeds(sp.round).filter(id => !sp.placed[id]), L = sp.last, allDone = SORDER.every(id => sp.placed[id]);
      const said = L ? (L.ok ? `<div class="card says good"><h3>✅ ${SEEDS[L.id][0]}: ${TYPES[SEEDS[L.id][1]][1].toLowerCase()}</h3><p>${SEEDS[L.id][2]}</p></div>`
        : `<div class="card says"><h3>💡 Not ${TYPES[L.bin][1].toLowerCase()}</h3><p>${SEEDS[L.id][3]}</p></div>`) : '';
      return `${said}<div class="card">${nav}<h2 style="margin-top:8px">🔍 Sort the seeds</h2><p>The <b>shape</b> of a seed gives you a clue! Choose a seed, then tap where it belongs.</p></div>
        ${left.length ? `<div class="card"><div class="seedcards">${left.map(id => `<button class="seedcard${sp.sel === id ? ' sel' : ''}" data-act="spick" data-v="${id}">${seedSvg(id)}<span>${SEEDS[id][0]}</span></button>`).join('')}</div></div>`
          : !allDone ? `<div class="card says good"><h3>✅ Round 1 done!</h3><p>Now sort the seeds that burst, drop and roll, or shake.</p></div><div class="checkbar"><button class="btn go" data-act="sround">Next: round 2 ▶</button></div>`
          : `<div class="card says good"><h3>🎉 You sorted all ${SORDER.length} seeds!</h3><p>Look for the clue:</p><ul class="icons" style="margin:0">${TORDER.map(t => `<li><span class="em">${TYPES[t][0]}</span><span><b>${TYPES[t][1]}</b>: ${TYPES[t][4]}</span></li>`).join('')}</ul></div>
          <div class="checkbar"><button class="btn go" data-act="spart" data-v="fit">Next: seed for the place ▶</button></div>`}
        ${Object.keys(sp.placed).length ? '<div class="card"><button class="btn" data-act="sreset">↺ Start the sort again</button></div>' : ''}`;
    }
    const P = PLACES[sp.place], done = sp.pick === P[3], allDone = sp.fitDone.length === PLACES.length;
    return `<div class="card">${nav}<h2 style="margin-top:8px">🗺️ ${P[1]}</h2><p>${P[2]}</p></div>
      <div class="card wq"><h3>Which kind of seed would spread best from here?</h3>
        ${Object.entries(FEATS).map(([f, [pic, t]]) => `<button class="opt${sp.pick === f && done ? ' done' : sp.picksWrong.includes(f) ? ' wrong' : ''}" data-act="sfit" data-v="${f}"${sp.picksWrong.includes(f) || done ? ' disabled' : ''} style="display:flex;align-items:center;gap:10px">${seedSvg(pic, 34)}${t}</button>`).join('')}
        ${sp.pick && !done ? `<p class="spot">💡 ${FEATS[sp.pick][2]}</p>` : ''}
        ${done ? `<p class="job">✅ ${P[4]}</p>` : ''}
        ${done && allDone ? '<div class="science"><b>🔬 The science</b>🎉 Well done! A plant\'s seeds suit the place where it grows, so they can travel to a new place with enough <b>light</b>, <b>water</b> and <b>space</b>.</div>' : ''}</div>
      ${done ? `<div class="checkbar">${sp.place < PLACES.length - 1 ? '<button class="btn go" data-act="snext">Next place ▶</button>' : allDone ? '<button class="btn" data-act="sfitreset">↺ Start again</button>' : ''}</div>` : ''}`;
  }
};

// ================= Views =================
const said = (msgs, good) => msgs ? `<div class="card says${good ? ' good' : ''}"><h3>${good ? '✅ That is a fair test!' : '🔎 Check your plan'}</h3>${Array.isArray(msgs) ? `<ul>${msgs.map(m => `<li>${m}</li>`).join('')}</ul>` : `<p>${msgs}</p>`}</div>` : '';
const STEPS = ['Plan', 'Set up', 'Predict', 'Run', 'Results', 'Chart', 'Analyse', 'Conclude'];
// Results table, used while drawing the chart too
const resultsTable = () => { const L = state.lab, V = VARS[L.iv], g = LAB.germinated(L.pots);
  return `<table class="gtable"><tr><th>Group</th><th>Pot</th><th>${V.name}</th><th>Seeds germinated</th></tr>
    ${L.pots.map((p, i) => `<tr><td>${GNAME[groupOf(i)]}</td><td>${i + 1}</td><td>${V.opts[p[L.iv]][0]} ${V.opts[p[L.iv]][1]}</td><td><b>${g[i]}</b> out of 10${L.repeated && i === LAB.anomaly() ? ' <span class="muted">(repeat: 9)</span>' : ''}</td></tr>`).join('')}</table>`; };
const showToggle = () => `<div class="stops" style="margin-top:6px">${[['chart', '📊 Bar chart'], ['pots', '🪴 Pots']].map(([v, t]) => `<button class="opt sm${state.lab.show === v ? ' on' : ''}" data-act="pshow" data-v="${v}">${t}</button>`).join('')}</div>`;
// A question with choices: wrong ones turn red and stay disabled, the right one turns green
const choices = (act, opts, chosen, wrongs, right) => opts.map(([v, t]) => `<button class="opt${chosen === v && v === right ? ' done' : wrongs.includes(v) ? ' wrong' : ''}" data-act="${act}" data-v="${v}"${wrongs.includes(v) || chosen === right ? ' disabled' : ''}>${t}</button>`).join('');
const VIEWS = {
  bench: {
    label: '🌱 <span class="tl">Germination test</span>',
    stage: () => LAB.stage(),
    drawer() {
      const L = state.lab, V = VARS[L.iv];
      const bar = `<div class="steps">${STEPS.map((s, k) => `<span class="${k === L.step ? 'now' : k < L.step ? 'done' : ''}">${k < L.step ? '✔' : k + 1} ${s}</span>`).join('')}</div>`;
      // Step 1: what to change and what to measure
      if (L.step === 0) {
        const dvOk = L.dv === 'germ', dvBad = MEASURES.find(m => m[0] === L.dv && !m[2]);
        return `<div class="card">${bar}<h2>🌱 Germination test</h2><p>Do bean seeds need water, warmth, light or soil to <b>germinate</b> (start to grow)? Plan a <b>fair test</b>.</p></div>
          <div class="card"><h3>1. What will you <b>change</b>?</h3><p class="muted">This is the <span class="term">independent variable</span>. Change only one thing.</p>
            <div class="stops">${VORDER.map(k => `<button class="opt${L.iv === k ? ' on' : ''}" data-act="piv" data-k="${k}">${VARS[k].opts[Object.keys(VARS[k].opts)[0]][0]} ${VARS[k].name}</button>`).join('')}</div></div>
          <div class="card wq"><h3>2. What will you <b>measure</b>?</h3><p class="muted">This is the <span class="term">dependent variable</span>: what you think will change.</p>
            ${MEASURES.map(([id, t]) => `<button class="opt${L.dv === id && dvOk ? ' done' : L.dvWrong.includes(id) ? ' wrong' : ''}" data-act="pdv" data-k="${id}"${L.dvWrong.includes(id) ? ' disabled' : ''}>${t}</button>`).join('')}
            ${dvBad ? `<p class="spot">💡 ${dvBad[3]}</p>` : ''}</div>
          <div class="card wq"><h3>3. How many pots in each <b>group</b>?</h3><p class="muted">You will compare two groups of pots. Each pot has 10 bean seeds.</p>
            ${REPS.map(([id, t, ok]) => `<button class="opt${L.reps === id && ok ? ' done' : L.repsWrong.includes(id) ? ' wrong' : ''}" data-act="preps" data-k="${id}"${L.repsWrong.includes(id) ? ' disabled' : ''}>${t}</button>`).join('')}
            ${L.reps ? `<p class="spot">💡 ${REPS.find(r => r[0] === L.reps)[3]}</p>` : ''}</div>
          <div class="checkbar"><button class="btn go" data-act="pnext"${L.iv && dvOk && L.reps && L.reps !== '1' ? '' : ' disabled'}>Next: set up the pots ▶</button></div>`;
      }
      // Step 2: set up the pots, check the plan, then name the control variables
      if (L.step === 1) {
        const p = L.groups[L.sel], fair = L.said === 'fair';
        const controls = VORDER.map(k => `<div class="varrow"><span>${VARS[k].name}${k === L.iv ? ' <b class="tag">changing</b>' : ''}</span><div class="stops">${Object.entries(VARS[k].opts).map(([v, [em, t]]) =>
          `<button class="opt sm${p[k] === v ? ' on' : ''}" data-act="pset" data-k="${k}" data-v="${v}"${fair ? ' disabled' : ''}>${em} ${t}</button>`).join('')}</div></div>`).join('');
        const keepList = [...VORDER.filter(k => k !== L.iv).map(k => [k, `${VARS[k].name}`, true]), ...KEEPS, [L.iv, `${V.name}`, false, `${V.name} is what you are <b>changing</b>, so it can\'t stay the same!`]];
        const keepCard = fair ? `<div class="card says${L.keepsSaid === 'ok' ? ' good' : ''}"><h3>3. What must you keep the <b>same</b>?</h3><p class="muted">These are the <span class="term">control variables</span>. Tick every one.</p>
            <div class="keeps">${keepList.map(([id, t]) => `<label class="keep"><input type="checkbox" data-keep="${id}"${L.keeps[id] ? ' checked' : ''}${L.keepsSaid === 'ok' ? ' disabled' : ''}> ${t}</label>`).join('')}</div>
            ${L.keepsSaid && L.keepsSaid !== 'ok' ? `<ul class="spot">${L.keepsSaid.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
            ${L.keepsSaid === 'ok' ? '<p class="job">Yes! Keeping all of these the same makes it a fair test.</p>' : ''}</div>` : '';
        return `${fair ? said('Only ' + V.the + ' is different between the two groups. Everything else is the same in every pot.', true) : said(L.said)}
          <div class="card">${bar}<h3>Set up the two groups</h3><p>You are changing <b>${V.the}</b>. Make it different for the two groups. Keep everything else the same.</p>
            <div class="stops">${GNAME.map((n, gi) => `<button class="opt${L.sel === gi ? ' on' : ''}" data-act="pgroup" data-g="${gi}"${fair ? ' disabled' : ''}>Group ${n}</button>`).join('')}</div></div>
          <div class="card"><h3>Group ${GNAME[L.sel]} <span class="muted">(pots ${L.sel * PER + 1} to ${L.sel * PER + PER})</span></h3><p class="muted">Every pot in the group changes together.</p>${controls}</div>
          ${keepCard}
          <div class="checkbar">${!fair ? '<button class="btn go" data-act="pcheck">✔ Check my plan</button>' : L.keepsSaid === 'ok' ? '<button class="btn go" data-act="pnext">Next: predict ▶</button>' : '<button class="btn go" data-act="pkeeps">✔ Check</button>'}</div>`;
      }
      // Step 3: predict, with a reason
      if (L.step === 2) return `<div class="card">${bar}<h3>🤔 Predict</h3><p>What do you think will happen?</p>
          <div class="wq">${LAB.predOpts().map(([v, t]) => `<button class="opt${L.pred === v ? ' on' : ''}" data-act="ppred" data-v="${v}">${t.replace(/<\/?b>/g, '')}</button>`).join('')}</div>
          <p style="margin-top:8px"><b>Why?</b> Use what you know about seeds.</p>
          <textarea class="reason" id="reason" placeholder="I think this because…">${esc(L.reason)}</textarea></div>
        <div class="checkbar"><button class="btn go" data-act="pnext"${L.pred && L.reason.trim() ? '' : ' disabled'}>Next ▶</button></div>`;
      // Step 4: run it
      if (L.step === 3) return `<div class="card">${bar}<h3>⏩ Run the test</h3><p>Leave the pots for <b>10 days</b>, then count how many seeds in each pot have germinated.</p>
          <p class="muted">Your prediction: ${LAB.predOpts().find(o => o[0] === L.pred)[1]}</p>
          <div class="navrow"><button class="btn go" data-act="prun">⏩ Fast forward 10 days</button></div></div>`;
      if (L.step >= 5) return LAB.analyse(bar);
      // Step 5: results, and how accurate the prediction was
      const g = LAB.germinated(L.pots), eff = LAB.effect(), right = eff === L.pred;
      const yours = `<p class="muted">You predicted: ${LAB.predOpts().find(o => o[0] === L.pred)[1]}${L.reason ? `<br>Your reason: “${esc(L.reason)}”` : ''}</p>`;
      // Nothing germinated in either group, because of something that was kept the same: the test can't answer the question
      const bl = LAB.blockers();
      const verdict = eff === 'none' ? `<div class="card says"><h3>🤔 Your test can't answer the question</h3>
          <p>Hardly any seeds germinated in <b>either</b> group. So you can't tell whether ${V.the} makes a difference.</p>
          ${bl.length ? `<p>Something else stopped the seeds: ${bl.map(k => BLOCKS[k][1]).join(', and ')}.</p>` : ''}
          <p>The things you keep the same must still give the seeds a <b>chance</b> to germinate. Keep them the same in every pot, but make them suitable for seeds.</p>
          ${yours}<p class="muted">You can't check your prediction yet.</p>
          <div class="navrow"><button class="btn go" data-act="pfix">🔧 Change the set-up and try again</button></div></div>`
        : `<div class="card says${right ? ' good' : ''}"><h3>${right ? '✅ Your prediction was right!' : '❌ Your prediction was not right'}</h3>
          <p>${eff === 'same' ? `In this test, ${V.the} made <b>no real difference</b>.` : `Pots that were <b>${lc(V.opts[eff][1])}</b> had many more seeds germinate.`}</p>${yours}
          ${right ? '' : '<p>That is fine! Scientists often find their predictions were wrong. That is how we learn something new.</p>'}
          ${L.iv === 'light' ? '<p>🔎 <b>Look closely</b> at the seedlings. The ones in the dark germinated, but they are <b>taller, thinner and pale yellow</b>. They are growing fast to search for light, and they can\'t make the green <span class="term">chlorophyll</span> without it.</p>' : ''}</div>`;
      return `${verdict}
        <div class="card">${bar}<h3>📋 Results</h3>${resultsTable()}
          <p class="muted">Everything else was the same: ${VORDER.filter(k => k !== L.iv).map(k => lc(VARS[k].opts[L.pots[0][k]][1])).join(', ')}.</p></div>
        <div class="card"><div class="navrow"><button class="btn" data-act="preset">↺ Plan a new test</button></div></div>
        ${eff === 'none' ? '' : '<div class="checkbar"><button class="btn go" data-act="pnext">Next: draw a bar chart ▶</button></div>'}`;
    }
  },
  spread: {
    label: '🌬️ <span class="tl">Spreading seeds</span>',
    stage: () => SP.stage(),
    drawer: () => SP.drawer()
  }
};

function renderStage() { const v = VIEWS[state.view]; $('#stage').innerHTML = v.stage(); }
function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>

// ================= Actions =================
const ACTIONS = {
  view(el) { state.view = el.dataset.view; location.hash = 'view=' + state.view; render(); },
  piv(el) { state.lab.iv = el.dataset.k; render(); },
  pdv(el) { const L = state.lab, m = MEASURES.find(x => x[0] === el.dataset.k); L.dv = m[0]; if (!m[2] && !L.dvWrong.includes(m[0])) L.dvWrong.push(m[0]); render(); },
  pnext() { const L = state.lab; L.step++; render(); $('#drawer').scrollTop = 0; },
  preps(el) { const L = state.lab, r = REPS.find(x => x[0] === el.dataset.k); L.reps = r[0]; if (!r[2] && !L.repsWrong.includes(r[0])) L.repsWrong.push(r[0]); render(); },
  pgroup(el) { state.lab.sel = +el.dataset.g; render(); },
  pset(el) { const L = state.lab; L.groups[L.sel][el.dataset.k] = el.dataset.v; L.said = null; render(); },
  pcheck() { const L = state.lab, p = LAB.problems(); L.said = p.length ? p : 'fair'; render(); $('#drawer').scrollTop = 0; },
  pkeeps() {
    const L = state.lab, msgs = [], all = [...VORDER.filter(k => k !== L.iv).map(k => [k, VARS[k].name, true]), ...KEEPS, [L.iv, VARS[L.iv].name, false, `${VARS[L.iv].name} is what you are <b>changing</b>, so it can't stay the same!`]];
    all.forEach(([id, t, yes, why]) => { if (yes && !L.keeps[id]) msgs.push(`You also need to keep <b>${t.toLowerCase()}</b> the same.`); if (!yes && L.keeps[id]) msgs.push(why); });
    L.keepsSaid = msgs.length ? msgs.slice(0, 3) : 'ok'; render();
  },
  ppred(el) { state.lab.pred = el.dataset.v; render(); },
  prun() { const L = state.lab; L.ran = true; L.step = 4; render(); $('#drawer').scrollTop = 0; emit('ran', { iv: L.iv, eff: LAB.effect() }); },
  // Back to setting up, keeping the plan and the prediction
  pfix() { const L = state.lab; Object.assign(L, { ran: false, step: 1, said: null, keepsSaid: null }); render(); $('#drawer').scrollTop = 0; },
  preset() { state.lab = freshLab(); render(); },
  spart(el) { state.sp.part = el.dataset.v; render(); $('#drawer').scrollTop = 0; },
  sframe(el) { const sp = state.sp; sp.frame = Math.max(0, Math.min(2, sp.frame + +el.dataset.d)); render(); },
  swhy() {
    const sp = state.sp, msgs = [];
    WHYS.forEach(([id, t, yes, why]) => { if (yes && !sp.ticks[id]) msgs.push(`There is another reason. Look at the picture again.`); if (!yes && sp.ticks[id]) msgs.push(why); });
    sp.whySaid = msgs.length ? [...new Set(msgs)] : 'ok'; render();
    if (!msgs.length) emit('whyspread');
  },
  spick(el) { const sp = state.sp; sp.sel = sp.sel === el.dataset.v ? null : el.dataset.v; render(); },
  sreset() { Object.assign(state.sp, { round: 0, sel: null, placed: {}, last: null }); render(); },
  sround() { Object.assign(state.sp, { round: 1, sel: null, last: null }); render(); $('#drawer').scrollTop = 0; },
  // Opening a flap shows what is under it; tapping the chosen flap again closes it
  sflap(el) {
    const sp = state.sp, f = el.dataset.v;
    if (sp.flap === f && sp.open[f]) { sp.open[f] = false; sp.flap = null; }
    else { const was = FLAPS.every(x => sp.done?.[x]); sp.open[f] = true; sp.flap = f; (sp.done = sp.done || {})[f] = true; if (!was && FLAPS.every(x => sp.done[x])) emit('flaps'); }
    render(); $('#drawer').scrollTop = 0;
  },
  sfit(el) {
    const sp = state.sp, P = PLACES[sp.place], f = el.dataset.v; sp.pick = f;
    if (f === P[3]) { if (!sp.fitDone.includes(P[0])) sp.fitDone.push(P[0]); if (sp.fitDone.length === PLACES.length) emit('fitted'); }
    else if (!sp.picksWrong.includes(f)) sp.picksWrong.push(f);
    render();
  },
  snext() { Object.assign(state.sp, { place: state.sp.place + 1, pick: null, picksWrong: [] }); render(); $('#drawer').scrollTop = 0; },
  sfitreset() { Object.assign(state.sp, { place: 0, pick: null, picksWrong: [], fitDone: [] }); render(); },
  pshow(el) { state.lab.show = el.dataset.v; render(); },
  pchart() {
    const L = state.lab, g = LAB.germinated(L.pots), wrong = L.bars.map((b, i) => b === g[i] ? -1 : i).filter(i => i >= 0);
    if (!wrong.length) { L.chartSaid = 'ok'; emit('charted'); }
    // After three tries, show the right chart
    else if (++L.chartTries >= 3) { L.bars = g.slice(); L.chartSaid = 'shown'; }
    else L.chartSaid = wrong;
    render(); $('#drawer').scrollTop = 0;
  },
  ppat(el) { const L = state.lab; L.pat = el.dataset.v; if (L.pat !== LAB.patAnswer() && !L.patWrong.includes(L.pat)) L.patWrong.push(L.pat); L.show = 'chart'; render(); },
  pact(el) { const L = state.lab; L.act = el.dataset.v; if (L.act === 'repeat') { L.repeated = true; emit('repeated'); } else if (!L.actWrong.includes(L.act)) L.actWrong.push(L.act); render(); },
  pclaim(el) { const L = state.lab; L.claim = el.dataset.v; if (L.claim !== LAB.effect() && !L.claimWrong.includes(L.claim)) L.claimWrong.push(L.claim); render(); },
  pwhy(el) { const L = state.lab; L.why = el.dataset.v; if (!WHY[L.iv][+L.why][1] && !L.whyWrong.includes(L.why)) L.whyWrong.push(L.why); render(); },
  pimp(el) { const L = state.lab; L.imp = +el.dataset.v; if (!L.impTried.includes(L.imp)) L.impTried.push(L.imp); render(); },
  pfinish() { const L = state.lab; L.step = 8; render(); $('#drawer').scrollTop = 0; emit('finished', { iv: L.iv }); },
  missions() {
    $('#missionList').innerHTML = MISSIONS.map((m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title}</span><span class="star">⭐</span></button>`).join('');
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  resetStars() { state.done = []; store.set('sl-done', []); updateStars(); ACTIONS.missions(); },
  closeModals() { closeAll(); },
  help() { closeModals(); showHelp(); },
  model() {
    $('#modelTab').textContent = tabName(state.view);
    $('#modelList').innerHTML = [...MODEL[state.view], ...MODEL.all].map(([em, t]) => `<li><span class="em">${em}</span><span>${t}</span></li>`).join('');
    $('#modelModal').classList.remove('hidden');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// Typed and ticked answers are kept, so they survive the drawer being redrawn
document.addEventListener('input', e => { if (e.target.id === 'reason') { state.lab.reason = e.target.value; const b = $('[data-act=pnext]'); if (b) b.disabled = !(state.lab.pred && state.lab.reason.trim()); } });
document.addEventListener('change', e => { const w = e.target.dataset.why; if (w) { state.sp.ticks[w] = e.target.checked; state.sp.whySaid = null; } });
document.addEventListener('change', e => { const k = e.target.dataset.keep; if (k) { state.lab.keeps[k] = e.target.checked; state.lab.keepsSaid = null; } });
// Tapping a group (or one of its pots) chooses it, while setting up
$('#stage').addEventListener('click', e => {
  // Spreading seeds: tapping a box puts the chosen seed in it, if that is how it travels
  if (state.view === 'spread') {
    const sp = state.sp, bin = e.target.closest('[data-bin]')?.dataset.bin;
    if (!bin || !sp.sel) return;
    const ok = SEEDS[sp.sel][1] === bin; sp.last = { id: sp.sel, bin, ok };
    if (ok) { sp.placed[sp.sel] = true; sp.sel = null; if (SORDER.every(id => sp.placed[id])) emit('sorted'); }
    render(); $('#drawer').scrollTop = 0; return;
  }
  const L = state.lab, col = e.target.closest('[data-col]'), bar = e.target.closest('[data-bar]');
  if (col) {
    // The height tapped, in the chart's own units, rounded to a whole number of seeds
    const svg = $('#labSvg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const y = pt.matrixTransform(svg.getScreenCTM().inverse()).y, c = LAB.chartGeo();
    L.bars[+col.dataset.col] = Math.max(0, Math.min(10, Math.round((c.y0 - y) / c.unit))); L.chartSaid = null; render(); return;
  }
  if (bar) { L.oddTap = +bar.dataset.bar; if (L.oddTap === LAB.anomaly()) L.oddFound = true; render(); return; }
  const gi = e.target.closest('[data-group]')?.dataset.group;
  if (gi != null && state.lab.step === 1 && state.lab.said !== 'fair') { state.lab.sel = +gi; render(); }
});
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeAll(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
let resizeT;
addEventListener('resize', () => { fitBanner(); clearTimeout(resizeT); resizeT = setTimeout(renderStage, 120); });

// ================= Start =================
// Test hooks: #iv=water&step=1&groups=wet,dry  ·  …&fair=1&pred=wet&run=1  ·  …&step=5 (chart)  ·  …&chart=1&step=6  ·  #mission=0  ·  …&nohelp=1 (no help pop-up)
const hp = new URLSearchParams(location.hash.slice(1));
{
  const L = state.lab;
  if (VARS[hp.get('iv')]) { L.iv = hp.get('iv'); L.dv = 'germ'; L.reps = '3'; L.step = 1; }
  if (hp.has('groups') && L.iv) hp.get('groups').split(',').forEach((v, i) => { if (L.groups[i] && VARS[L.iv].opts[v]) L.groups[i][L.iv] = v; });
  if (hp.has('fair')) { L.said = 'fair'; L.keepsSaid = 'ok'; }
  if (hp.has('pred')) { L.pred = hp.get('pred'); L.reason = 'Test reason'; L.step = 3; }
  if (hp.has('run')) { L.ran = true; L.step = 4; }
  if (hp.has('step')) L.step = +hp.get('step');
  if (hp.has('chart')) { L.bars = LAB.germinated(L.pots); L.chartSaid = 'ok'; }
}
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
if (hp.has('nohelp')) autoHelp = false;
if (['why', 'flaps', 'sort', 'fit'].includes(hp.get('part'))) state.sp.part = hp.get('part');
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
</script>
</body>
