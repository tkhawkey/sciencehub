<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balanced Plate</title>
<meta name="description" content="Build a balanced plate, find out what food is for, and feed the zoo – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Forces Playground) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 11px; }
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #fdf0dc; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt:disabled { opacity: .45; cursor: default; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .tick { color: var(--green); }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }

  /* ---------- Food chips (tap to add, or drag onto the picture) ---------- */
  .shelf { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 2px; min-height: 58px; font-weight: 600; font-size: 13px; line-height: 1.1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: center; }
  .chip .em { font-size: 26px; line-height: 1; }
  .chip.on { background: #c9f2df; border-color: var(--green); }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip:disabled { opacity: .35; cursor: default; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); }

  /* ---------- Plate builder ---------- */
  .svgtext { font-family: 'Fredoka', system-ui, sans-serif; }
  .food { cursor: pointer; }
  .food text { font-size: 48px; }
  .food.spill text { filter: drop-shadow(0 0 4px #ff5f6d) drop-shadow(0 0 2px #ff5f6d); }
  .slabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 21px; font-weight: 700; paint-order: stroke; stroke: #fdf0dc; stroke-width: 6px; stroke-linejoin: round; }
  .scount { font-size: 17px; fill: var(--ink); }
  .food.pop { animation: pop .35s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .wlabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: var(--muted); }
  .key { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 3px; }
  .key li { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .key .n { margin-left: auto; font-weight: 700; }
  .sw { width: 16px; height: 16px; border-radius: 5px; flex: none; }
  .says { border: 3px solid var(--yellow); }
  /* Check stays in reach at the bottom of the drawer */
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .says li { margin: 4px 0; }

  /* ---------- Drawn icons, meal tabs and the pyramid ---------- */
  .ic { width: 28px; height: 28px; display: block; }
  .opt .ic { width: 22px; height: 22px; display: inline-block; vertical-align: -5px; }
  .mealtabs { margin: 6px 0 8px; }
  .mealtabs .opt { flex: 1; padding: 4px 6px; font-size: 14px; }
  .plabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: var(--muted); }

  /* ---------- Lunchbox and labels ---------- */
  .bubble { position: absolute; left: 12px; top: 12px; max-width: min(420px, 60%); display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 18px; padding: 10px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); font-size: 17px; line-height: 1.3; z-index: 3; }
  .bubble .who { font-size: 46px; line-height: 1; }
  .swrow { margin: 6px 0; }
  .swrow > span { font-weight: 700; font-size: 14px; color: var(--muted); display: block; margin-bottom: 3px; }
  .opt.sm { font-size: 13.5px; padding: 4px 8px; }
  .lpair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .nlabel { border: 2px solid var(--ink); border-radius: 8px; padding: 6px 7px; font-size: 13.5px; background: #fff; }
  .nlabel .nname { font-weight: 700; font-size: 14.5px; }
  .nlabel .nhead { background: var(--ink); color: #fff; font-size: 12px; padding: 2px 5px; margin: 3px 0; border-radius: 3px; }
  .nlabel table { width: 100%; border-collapse: collapse; }
  .nlabel td { border-top: 1px solid #c9d0e4; padding: 2px 0; }
  .nlabel td:last-child { text-align: right; font-weight: 700; }
  .lq p { margin: 0 0 6px; }
  /* Labels tab: four packs with big labels on the stage */
  .lstage { width: 100%; height: 100%; overflow: auto; padding: 16px; background: #e9d2b0; }
  .lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; margin: 0 auto; }
  .pack { background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
  .pk-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 20px; }
  .pk-ic { font-size: 40px; line-height: 1; } .pk-ic .ic { width: 44px; height: 44px; }
  .pk-size { font-size: 15px; color: var(--muted); }
  .nlabel.big { font-size: 19px; padding: 8px 10px; }
  .nlabel.big .nhead { font-size: 15px; padding: 3px 7px; }
  .nlabel.big td { padding: 4px 0; }
  /* What a food on the plate gives you */
  .ftip { position: absolute; z-index: 5; width: 230px; background: #fff; border: 3px solid var(--yellow); border-radius: 14px; padding: 9px 11px; box-shadow: 0 6px 18px rgba(0,0,0,.22); font-size: 15px; line-height: 1.3; }
  .ftip.hidden { display: none; }
  .ftip p { margin: 6px 0 0; }
  .ftip .tname { display: flex; align-items: center; gap: 8px; font-size: 18px; }
  .ftip .tpic { font-size: 30px; line-height: 1; } .ftip .tpic .ic { width: 32px; height: 32px; }
  .ftip .tgrp { display: inline-block; margin-top: 4px; color: #fff; font-weight: 700; font-size: 13px; border-radius: 8px; padding: 1px 8px; }
  .ftip .btn { margin-top: 8px; width: 100%; font-size: 15px; }
  @media (max-width: 760px) { .lgrid { gap: 8px; } .pack { padding: 8px; } .pk-top { font-size: 15px; } .pk-ic { font-size: 28px; } .nlabel.big { font-size: 14px; } }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done:disabled { opacity: 1; }
  .sjobtxt { font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; color: var(--muted); line-height: 1.25; }

  /* ---------- What is food for? ---------- */
  .station { cursor: pointer; }
  .station .panel { fill: #fff; stroke: #d3dbf7; stroke-width: 4; transition: stroke .2s; }
  .station.ready .panel { stroke: var(--yellow); stroke-dasharray: 10 7; }
  .station.yes .panel { stroke: var(--green); }
  .station.no .panel { stroke: var(--coral); animation: shake .4s; }
  .stitle { font-family: 'Fredoka', system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: var(--ink); }
  .sjob { font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; fill: var(--muted); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- Feed the zoo ---------- */
  .aname { font-family: 'Fredoka', system-ui, sans-serif; font-size: 34px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; }
  .opt.done { background: #c9f2df; border-color: var(--green); }

  /* ---------- Missions and pop-ups ---------- */
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  .modal-box ul.icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  /* Help pop-up (one tab at a time) */
  .help-welcome { font-size: 17px; font-weight: 600; color: var(--blue); margin: 0 0 4px; }
  .help-sec { margin: 12px 0 4px; font-size: 17px; }
  .help-sec + p { margin: 0 0 4px; }
  .modal-box ol { margin: 4px 0 6px; padding-left: 24px; line-height: 1.4; }
  .teach { font-size: 13.5px; color: var(--muted); margin: 12px 0 14px; }
  .teach summary { cursor: pointer; font-weight: 600; }
  .teach p { margin: 4px 0; }
  .model-tab { margin: -4px 0 8px; color: var(--muted); font-weight: 600; }
  .modal-box { position: relative; }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 18px; }
    .tl { display: none; }
    .bubble { left: 6px; top: 6px; max-width: 78%; padding: 5px 9px; font-size: 13.5px; gap: 6px; }
    .bubble .who { font-size: 28px; }
  }
</style>
</head>

    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>

    <button class="close" data-act="stopMission" aria-label="Stop this mission">✖</button>
  </div>
</main>
<div id="missionsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="missionsTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="missionsTitle">🚀 Missions</h2>
    <div class="mission-list" id="missionList"></div>
    <div class="modal-actions"><button class="btn" data-act="resetStars">Reset stars</button><button class="btn primary" data-act="closeModals">Close</button></div>
  </div>
</div>
<div id="modelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>
    <h2 id="modelTitle">🤔 How is this model different from real life?</h2>
    <p class="model-tab" id="modelTab"></p>
    <p style="margin-top:0">A <span class="term">model</span> shows some important features of something real – but not everything.</p>
    <ul class="icons" id="modelList"></ul>
    <div class="modal-actions"><button class="btn primary" data-act="closeModals">Got it!</button></div>
  </div>
</div>
<div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>

    <h2 id="winTitle" style="text-align:center">Mission complete!</h2>
    <div class="win-text" id="winText"></div>
    <div class="modal-actions"><button class="btn" data-act="closeModals">Keep exploring</button><a class="btn primary" id="winPractise" href="../practice/index.html#diet">✏️ Practise this</a><button class="btn primary" id="winNext" data-act="nextMission">Next mission ▶</button></div>
  </div>

  <div class="modal-box">
    <button class="modal-x" data-act="closeModals" aria-label="Close">✕</button>

<script>
// ================= Utilities =================
const $ = (s, r = document) => r.querySelector(s);
// Saved progress; private windows can block storage, so failures are ignored
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const polar = (cx, cy, r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
// n places for pictures, gathered as close as possible around (cx, cy) on a honeycomb grid, all inside the area.
// The group is then shifted so its middle sits on (cx, cy), so adding a food re-centres the whole group.
// extra: places to try as well, for areas too thin for the grid.
function cluster(n, cx, cy, inside, extra = [], step = 60) {
  if (!n) return [];
  const pts = [];
  for (let j = -8; j <= 8; j++) for (let i = -10; i <= 10; i++) {
    const x = cx + (i + (j & 1) / 2) * step, y = cy + j * step * .866;
    if (inside(x, y)) pts.push([x, y]);
  }
  extra.forEach(p => { if (inside(...p) && pts.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > step * .8)) pts.push(p); });
  pts.sort((a, b) => Math.hypot(a[0] - cx, a[1] - cy) - Math.hypot(b[0] - cx, b[1] - cy));
  const pick = pts.slice(0, n);
  if (!pick.length) return pick;
  const dx = cx - pick.reduce((t, p) => t + p[0], 0) / pick.length, dy = cy - pick.reduce((t, p) => t + p[1], 0) / pick.length;
  const moved = pick.map(([x, y]) => [x + dx, y + dy]);
  return moved.every(p => inside(...p)) ? moved : pick;
}
// A food's picture: an emoji, or one of the drawn icons (ic-…) for foods that have no emoji, like yoghurt

const picHTML = em => isIc(em) ? `<svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#${em}"/></svg>` : em;
const picSVG = (em, x, y, size) => isIc(em)

// ================= Food =================

const FOODS = {

const GIVES_FOOD = {

const DRINKS = {

// Each group's section of the plate, as angles clockwise from the top
const SECT = (() => { let a = 0; const o = {}; for (const [id, g] of Object.entries(GROUPS)) { o[id] = [a, a + g.share * 360]; a += g.share * 360; } return o; })();

// ================= State =================
const freshLunch = brief => ({ brief, box: [], drink: null, sw: { bread: null, fill: null, salad: 'none' }, said: null });

// ================= Plate builder =================
const PL = {
  CX: 400, CY: 360, R: 250,
  counts() {

  // What Sam says about the plate. Each problem is a short, kind message; no problems means a balanced day.

  judge() {

  },

  },
  cup(id, x, y) {
    const d = DRINKS[id];
    return `<g transform="translate(${x} ${y}) scale(.85)">
      <path d="M-34 -70 L34 -70 L26 50 L-26 50 Z" fill="#fff" fill-opacity=".6" stroke="#9fb2e8" stroke-width="4" stroke-linejoin="round"/>
      ${d ? `<path d="M-30 -40 L30 -40 L26 46 L-26 46 Z" fill="${d[2]}" stroke="${id === 'milk' ? '#d3dbf7' : 'none'}"/>
        ${id === 'fizzy' ? '<circle cx="-8" cy="-10" r="4" fill="#fff" opacity=".7"/><circle cx="10" cy="10" r="3" fill="#fff" opacity=".7"/><circle cx="0" cy="30" r="4" fill="#fff" opacity=".7"/>' : ''}` : ''}

  },
  // n places in one group's section, gathered around the section's middle (its centre of mass).
  // Thin sections are widest near the rim, so their middle is pushed out towards it.
  layout(grp, n) {
    const [a0, a1] = SECT[grp], th = (a1 - a0) * Math.PI / 180, mid = (a0 + a1) / 2, R = PL.R - 30;
    const rc = Math.max(4 * R * Math.sin(th / 2) / (3 * th), th < .5 ? 175 : 0);
    const [cx, cy] = polar(PL.CX, PL.CY, rc, mid);

      const dx = x - PL.CX, dy = PL.CY - y, r = Math.hypot(dx, dy);

  },
  stage() {

    const model = state.model === 'pyramid' ? PY.draw(c) : (() => {
      const sects = Object.entries(GROUPS).map(([id, g]) => {
        const [a0, a1] = SECT[id], [x0, y0] = polar(PL.CX, PL.CY, R, a0), [x1, y1] = polar(PL.CX, PL.CY, R, a1);

    })();
    return `<svg viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sam's food for one day, shown as a ${state.model === 'pyramid' ? 'food pyramid' : 'plate split into food groups'}">
      <defs><pattern id="cloth" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#fdf0dc"/><rect width="40" height="40" fill="#f8e1bf"/><rect x="40" y="40" width="40" height="40" fill="#f8e1bf"/></pattern></defs>
      <rect x="-700" y="-300" width="2400" height="1300" fill="url(#cloth)"/>
      ${model}<g id="foods"></g>
      ${PL.cup(state.drink, 870, 330)}
      ${PL.sam(verdict ? (verdict.ok ? 'happy' : 'think') : 'wait')}</svg>
      <div id="ftip" class="ftip hidden" role="status"></div>`;
  },
  // Each food goes in its own group's part of the plate (or pyramid), gathered around the middle of that part.
  // Too many for that part, and the extras spill over the edge.
  foods() {
    const g = $('#foods'); if (!g) return;
    const pyr = state.model === 'pyramid', part = id => { const grp = FOODS[id][2]; return pyr && (grp === 'oil' || grp === 'tr') ? 'top' : grp; };
    const lists = {}, places = {}, pics = [];
    state.plate.forEach(id => (lists[part(id)] = lists[part(id)] || []).push(id));
    for (const [pt, list] of Object.entries(lists)) {
      places[pt] = pyr ? PY.layout(pt, list.length) : pt === 'tr' ? list.map((_, k) => polar(870, 130, k === 0 ? 0 : 46, (k - 1) * 72))
        : PL.layout(pt, Math.min(list.length, GROUPS[pt].most));
    }
    state.plate.forEach(id => {
      const F = FOODS[id], pt = part(id), k = lists[pt].indexOf(id), sp = places[pt];
      let x, y, spill = false;
      if (sp[k]) [x, y] = sp[k];
      else if (pyr) { spill = true; [x, y] = PY.spill(pt, k - sp.length); }
      else { spill = true; const [a0, a1] = SECT[pt]; [x, y] = polar(PL.CX, PL.CY, PL.R + 8, (a0 + a1) / 2 + (k - sp.length) * 9 - 4); }
      pics.push(`<g class="food${id === state.justAdded ? ' pop' : ''}${spill ? ' spill' : ''}" data-act="pinfo" data-id="${id}" role="button" aria-label="${F[1]}: what it gives you">

  },
  add(id) {
    if (state.plate.includes(id)) return PL.remove(id);

  },
  remove(id) { state.plate = state.plate.filter(x => x !== id); state.said = null; render(); },
  // A card next to a food on the plate: what it gives you. Pointing at it with a mouse shows the card;

  tip(id, el, pinned) {

// ================= Food pyramid =================
// Another model of the same day's food: eat most of what is at the bottom and least of what is at the top.
// Tiers from the top: fats, oils and sweets; protein beside dairy; fruit and vegetables; starchy foods.
const PY = {
  CX: 430, TOP: 50, BASE: 640, HALF: 340, Y: [50, 170, 330, 480, 640],
  half: y => PY.HALF * (y - PY.TOP) / (PY.BASE - PY.TOP),
  // Each tier's area for pictures: below its name, and clear of the sloping sides. Protein and dairy share a tier, split down the middle.
  AREA: { st: [534, 616], fv: [384, 458], pr: [220, 306], da: [220, 306] },
  inside(pt, x, y) {
    const [y0, y1] = PY.AREA[pt], C = PY.CX;
    if (y < y0 || y > y1 || Math.abs(x - C) > PY.half(y - 21) - 22) return false;
    return pt === 'pr' ? x <= C - 26 : pt === 'da' ? x >= C + 26 : true;
  },
  layout(pt, n) {
    // The point of the pyramid is too narrow for a grid, so it has set places for 1, 2 or 3 foods
    if (pt === 'top') return [[[PY.CX, 146]], [[PY.CX - 23, 148], [PY.CX + 23, 148]], [[PY.CX - 23, 150], [PY.CX + 23, 150], [PY.CX, 108]]][Math.min(n, 3) - 1] || [];
    const [y0, y1] = PY.AREA[pt], cy = (y0 + y1) / 2, C = PY.CX, w = PY.half(cy - 21) - 22;
    const cx = pt === 'pr' ? C - (w + 26) / 2 : pt === 'da' ? C + (w + 26) / 2 : C;
    // Tiers are short, so try the honeycomb rows in two positions and keep whichever fits more foods
    const ins = (x, y) => PY.inside(pt, x, y), dy = [0, -21, 21].sort((a, b) => cluster(99, cx, cy + b, ins, [], 50).length - cluster(99, cx, cy + a, ins, [], 50).length)[0];
    return cluster(n, cx, cy + dy, ins, [], 50);
  },
  // Foods that don't fit wait just outside the tier, on the left
  spill(pt, k) {
    const y = pt === 'top' ? 150 : (PY.AREA[pt][0] + PY.AREA[pt][1]) / 2;
    return [PY.CX - PY.half(y) - 40 - k * 52, y];
  },
  draw(c) {
    const C = PY.CX, Y = PY.Y, pt = y => [C - PY.half(y), C + PY.half(y)];
    const tier = (y0, y1, x0f, x1f, col, op) => {
      const [a, b] = pt(y0), [d, e] = pt(y1), L0 = x0f ? C : a, R0 = x1f ? C : b, L1 = x0f ? C : d, R1 = x1f ? C : e;
      return `<path d="M${L0} ${y0} L${R0} ${y0} L${R1} ${y1} L${L1} ${y1} Z" fill="${col}" fill-opacity="${op}" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`;
    };
    const op = n => n ? .45 : .2;
    return `${tier(Y[0], Y[1], false, false, '#a066d3', op(c.oil + c.tr))}${tier(Y[1], Y[2], false, true, '#e5735f', op(c.pr))}${tier(Y[1], Y[2], true, false, '#5fa8e8', op(c.da))}
      ${tier(Y[2], Y[3], false, false, '#3faa4f', op(c.fv))}${tier(Y[3], Y[4], false, false, '#f2b632', op(c.st))}
      <text x="${C + PY.half(110) + 16}" y="102" class="slabel" fill="#a066d3">Fats, oils and sweets <tspan class="scount">${c.oil + c.tr}</tspan></text>
      <text x="${C + PY.half(110) + 16}" y="128" class="plabel">Eat the least</text>
      <text x="${C - PY.half(194) / 2}" y="196" text-anchor="middle" class="slabel" fill="#e5735f">Protein <tspan class="scount">${c.pr}</tspan></text>
      <text x="${C + PY.half(194) / 2}" y="196" text-anchor="middle" class="slabel" fill="#5fa8e8">Dairy <tspan class="scount">${c.da}</tspan></text>
      <text x="${C}" y="356" text-anchor="middle" class="slabel" fill="#3faa4f">Fruit and vegetables <tspan class="scount">${c.fv}</tspan></text>
      <text x="${C}" y="506" text-anchor="middle" class="slabel" fill="#c99200">Starchy foods <tspan class="scount">${c.st}</tspan></text>
      <text x="${C}" y="668" text-anchor="middle" class="plabel">Eat the most</text>`;
  }
};

        <rect x="-20" y="-140" width="40" height="34" rx="8" fill="#3d7bff"/>
        ${d ? `<rect x="-32" y="-60" width="64" height="144" rx="22" fill="${d[2]}" stroke="${l.drink === 'milk' ? '#d3dbf7' : 'none'}"/>` : ''}

  sandwich() {

// ================= What is food for? =================
// Five jobs. Some foods do more than one (beans have protein and fibre), so either of their jobs is right.
const JOBS = {
  carb:  { icon: '⚡', name: 'Carbohydrates', noun: 'carbohydrate', job: 'Give us energy to move, play and think', c: '#f2b632' },
  prot:  { icon: '🧱', name: 'Proteins', noun: 'protein', job: 'Help us grow and repair our bodies', c: '#e5735f' },

const JFOODS = { toast: ['carb'], rice: ['carb'], pasta: ['carb'], potato: ['carb'], porridge: ['carb', 'fibre'], chicken: ['prot'], egg: ['prot'], fish: ['prot'],
  beans: ['prot', 'fibre'], butter: ['fat'], olive: ['fat'], carrot: ['vit'], orange: ['vit'], broccoli: ['vit', 'fibre'] };
const JORDER = ['egg', 'carrot', 'toast', 'butter', 'beans', 'fish', 'orange', 'porridge', 'rice', 'olive', 'potato', 'broccoli', 'chicken', 'pasta'];
const JB = {
  BOX: { carb: [20, 30, 310], prot: [345, 30, 310], fat: [670, 30, 310], vit: [20, 350, 470], fibre: [510, 350, 470] }, H: 300,
  stage() {
    const j = state.jobs;
    const boxes = Object.entries(JOBS).map(([id, J]) => {
      const [x, y, w] = JB.BOX[id], items = Object.keys(j.placed).filter(f => j.placed[f] === id), per = Math.floor((w - 30) / 70);

        <rect class="panel" x="${x}" y="${y}" width="${w}" height="${JB.H}" rx="24"/>

        <text x="${x + 62}" y="${y + 46}" class="stitle">${J.name}</text>
        <foreignObject x="${x + 16}" y="${y + 78}" width="${w - 32}" height="60"><div class="sjobtxt">${J.job}</div></foreignObject>
        ${items.map((f, k) => picSVG(FOODS[f][0], x + 50 + (k % per) * 70, y + 180 + Math.floor(k / per) * 66, 50)).join('')}</g>`;
    }).join('');
    return `<svg viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Five jobs that food does">
      <rect x="-700" y="-300" width="2400" height="1300" fill="#eef3ff"/>${boxes}</svg>`;
  },
  // Tap a food, then tap its job (or drag the food onto the job)
  put(f, jobId) {
    const j = state.jobs, right = JFOODS[f], name = FOODS[f][1], is = /s$/.test(name) ? 'are' : 'is';
    if (!f || j.placed[f]) return;
    j.sel = null;
    if (right.includes(jobId)) {
      j.placed[f] = jobId;
      const other = right.find(r => r !== jobId);
      j.msg = ['✅', `Yes! ${name} ${is} a good source of <b>${JOBS[jobId].noun}</b>${other ? `, and of <b>${JOBS[other].noun}</b> too, so either box is right` : ''}.`];
      render(); $(`#st-${jobId}`)?.classList.add('yes');
      if (Object.keys(j.placed).length === JORDER.length) emit('jobs', { mistakes: j.mistakes });
    } else {
      j.mistakes++;
      const R = JOBS[right[0]];
      j.msg = ['🤔', `Not quite. ${name} ${is} a good source of <b>${right.map(r => JOBS[r].noun).join('</b>, and of <b>')}</b>. ${R.name} ${R.job.charAt(0).toLowerCase() + R.job.slice(1)}.`];

    }
  }
};

  start(e, btn) {
    if (btn.disabled) return;

    Chips.d = { kind: btn.dataset.kind, id: btn.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null, btn };
    try { btn.setPointerCapture(e.pointerId); } catch {}

  move(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    if (!d.ghost && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) {
      d.ghost = d.btn.cloneNode(true); d.ghost.classList.add('chip-ghost'); d.ghost.style.width = d.btn.offsetWidth + 'px';

    }
    if (d.ghost) { d.ghost.style.left = e.clientX + 'px'; d.ghost.style.top = e.clientY + 'px'; }
  },
  end(e) {
    const d = Chips.d; if (!d || d.pid !== e.pointerId) return;
    Chips.d = null;
    if (!d.ghost) return TAP[d.kind](d.id);
    d.ghost.remove();
    const r = $('#stage').getBoundingClientRect();

function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('bp-done', state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}

}

        <div class="checkbar"><button class="btn go" data-act="pcheck"${state.plate.length ? '' : ' disabled'}>💬 Check with Sam</button></div>
        <div class="card"><h3>👀 Show the day as…</h3><div class="stops">
          <button class="opt${state.model === 'plate' ? ' on' : ''}" data-act="pmodel" data-m="plate">🍽️ A plate</button>
          <button class="opt${state.model === 'pyramid' ? ' on' : ''}" data-act="pmodel" data-m="pyramid">🔺 A food pyramid</button></div>
          <p class="muted">${state.model === 'pyramid' ? 'A <b>food pyramid</b> is another model. Eat most of the foods at the bottom, and least of the ones at the top. Notice that it puts starchy foods at the bottom, but the plate gives fruit and vegetables just as much room!' : 'The <b>plate</b> shows how much of each food group to eat. The bigger the part, the more of that group you need.'}</p></div>`;
    }
  },
  lunch: {
    label: '🥪 <span class="tl">Lunchbox</span>',
    stage: () => LB.stage(),
    drawer() {
      const l = state.lunch, full = l.box.length >= LB.SPACES;
      const briefs = Object.entries(LB.BRIEFS).map(([id, b]) => `<button class="opt${id === l.brief ? ' on' : ''}" data-act="lbrief" data-b="${id}">${b.em} ${b.name}${state.packed.includes(id) ? ' <span class="tick">✔</span>' : ''}</button>`).join('');
      const items = Object.entries(LB.ITEMS).map(([id, it]) => chip('lunch', id, it[0], it[1], l.box.includes(id) ? ' on' : '', full && !l.box.includes(id))).join('');
      const row = (title, set, key) => `<div class="swrow"><span>${title}</span><div class="stops">${Object.entries(set).map(([id, p]) =>
        `<button class="opt sm${l.sw[key] === id ? ' on' : ''}" data-act="lsw" data-k="${key}" data-v="${id}"${l.box.includes('sandwich') ? ' disabled' : ''}>${picHTML(p[0])} ${p[1]}</button>`).join('')}</div></div>`;
      return `
        ${saysCard(l.said, LB.BRIEFS[l.brief].name)}
        ${l.said?.ok ? '<div class="science"><b>🔬 The science</b>A <b>balanced</b> lunch has food from the different food groups. Different people need different things, so think about who will eat it.</div>' : ''}
        <div class="card"><h2>Lunchbox</h2>
          <p><b>🔬 Big question:</b> how do you pack a <b>balanced</b> lunch that suits the person eating it?</p>
          <p>Pack a <b>balanced lunch</b> that fits in <b>5 spaces</b>. Read who it is for first!</p>
          <div class="stops">${briefs}</div></div>
        <div class="card"><h3>🥪 Make a sandwich</h3>
          <p class="muted">A sandwich takes one space, but it counts for <b>more than one</b> food group.</p>
          ${row('Bread', LB.BREAD, 'bread')}${row('Filling', LB.FILL, 'fill')}${row('Salad', LB.SALAD, 'salad')}
          <div class="navrow" style="margin-top:6px">${l.box.includes('sandwich')
            ? '<button class="btn" data-act="lremove" data-id="sandwich">↩ Take the sandwich out</button>'
            : `<button class="btn" data-act="lsandwich"${full ? ' disabled' : ''}>➕ Put the sandwich in</button>`}</div></div>
        <div class="card"><h3>🧺 Other food</h3><div class="shelf">${items}</div></div>
        <div class="card"><h3>🥤 Choose a drink</h3><div class="stops">${Object.entries(LB.DRINKS).map(([id, d]) =>
          `<button class="opt${l.drink === id ? ' on' : ''}" data-act="ldrink" data-d="${id}">${d[0]} ${d[1]}</button>`).join('')}</div></div>
        <div class="checkbar"><button class="btn go" data-act="lcheck"${l.box.length ? '' : ' disabled'}>💬 Check the lunchbox</button></div>`;
    }
  },
  labels: {
    label: '🏷️ <span class="tl">Labels</span>',
    stage: () => LBL.stage(),
    drawer: () => LBL.drawer()
  },
  jobs: {
    label: '🔋 <span class="tl">What is food for?</span>',
    stage: () => JB.stage(),
    drawer() {
      const j = state.jobs, left = JORDER.filter(f => !j.placed[f]);
      return `
        <div class="card"><h2>What is food for?</h2>
          <p><b>🔬 Big question:</b> what <b>jobs</b> do different foods do in your body?</p>
          <p>Different foods do different <b>jobs</b> in your body. Tap a food, then tap a job it does. You can drag it there too. Some foods do <b>two</b> jobs!</p>
          ${left.length ? `<div class="shelf">${left.map(f => chip('job', f, FOODS[f][0], FOODS[f][1], j.sel === f ? ' sel' : '')).join('')}</div>`
            : '<p class="job">🎉 All the foods are in a right place!</p>'}
          ${left.length ? '' : `<div class="science"><b>🔬 The science</b><b>Carbohydrates</b> give energy. <b>Proteins</b> help you grow and repair. <b>Fats</b> store energy. <b>Vitamins and minerals</b> keep you healthy. <b>Fibre</b> helps digestion. A <b>balanced diet</b> gives you all of these, in the right amounts.</div>`}
          ${j.msg ? `<p class="spot"><span>${j.msg[0]}</span> ${j.msg[1]}</p>` : ''}
          <p class="muted">Mistakes: ${j.mistakes}</p></div>
        ${left.length ? '' : `<div class="card"><h3>💡 One more thing you need</h3>
          <p><b>Water</b> helps every part of your body work. You need to drink every day.</p>
          <div class="navrow"><button class="btn" data-act="jreset">↺ Start again</button></div></div>`}`;
    }
  },
  zoo: {
    label: '🦁 <span class="tl">Feed the zoo</span>',
    stage: () => ZOO.stage(),
    drawer() {
      const z = state.zoo, A = ANIMALS[z.animal], bowl = z.bowl[z.animal], wet = z.water[z.animal];
      const animals = Object.entries(ANIMALS).map(([id, a]) => `<button class="opt${id === z.animal ? ' on' : ''}" data-act="zanimal" data-a="${id}">${a.em} ${a.name}${z.fed.includes(id) ? ' <span class="tick">✔</span>' : ''}</button>`).join('');
      const chips = Object.entries(PANTRY).map(([id, p]) => chip('zoo', id, p[0], p[1], bowl.includes(id) ? ' on' : '')).join('');
      return `
        <div class="card"><h2>Feed the zoo</h2>
          <p><b>🔬 Big question:</b> does every animal need the <b>same</b> balanced diet?</p>
          <p>Animals need a balanced diet too. Fill each animal's bowl with the <b>right foods</b> for it, then check.</p>
          <div class="stops">${animals}</div>
          ${z.fed.length === 4 ? '<div class="science"><b>🔬 The science</b>Every animal needs a <b>balanced diet</b> to be healthy, but a balanced diet is <b>different</b> for each animal. Humans eat both plants and animals, so our balanced diet has lots of different foods.</div>' : ''}</div>
        <div class="card"><h3>${A.em} Food for the ${A.name.toLowerCase()}</h3>
          ${z.msg ? `<p class="${z.msg[0] === '🎉' ? 'job' : 'spot'}"><span>${z.msg[0]}</span> ${z.msg[1]}</p>` : ''}
          <div class="shelf">${chips}</div>
          <div class="navrow" style="margin-top:8px"><button class="btn${wet ? ' active' : ''}" data-act="zwater">💧 ${wet ? 'Trough is full' : 'Fill the water trough'}</button></div>
          <div class="navrow" style="margin-top:8px"><button class="btn go" data-act="zcheck"${bowl.length ? '' : ' disabled'}>✔ Check</button></div></div>`;
    }
  }
};

function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>
    `<button class="btn${id === state.view ? ' active' : ''}" data-act="view" data-view="${id}" aria-label="${x.label.replace(/<[^>]+>/g, '').replace(/^\S+ /, '')}">${x.label}</button>`).join('');
  const keep = $('#drawer').scrollTop, same = render.last === state.view;
  $('#stage').innerHTML = v.stage();
  $('#drawer').innerHTML = v.drawer();
  if (v.after) v.after();
  // Staying on the same tab keeps the drawer where it was scrolled to
  if (same) $('#drawer').scrollTop = keep;
  render.last = state.view;
  fitBanner();
  autoHelp();
}

// ================= Actions =================
const ACTIONS = {
  view(el) { state.view = el.dataset.view; location.hash = 'view=' + state.view; render(); },
  premove(el) { PL.remove(el.dataset.id); },
  pinfo(el) { PL.tip(el.dataset.id, el, true); },
  pmeal(el) { state.meal = el.dataset.m; render(); },
  pmodel(el) { state.model = el.dataset.m; render(); },
  pdrink(el) { state.drink = state.drink === el.dataset.d ? null : el.dataset.d; state.said = null; render(); },
  pcheck() { PL.check(); },
  lbrief(el) { state.lunch = freshLunch(el.dataset.b); render(); },
  lsw(el) { state.lunch.sw[el.dataset.k] = el.dataset.v; state.lunch.said = null; render(); },
  lsandwich() { LB.sandwich(); },
  lremove(el) { LB.remove(el.dataset.id); },
  ldrink(el) { const l = state.lunch; l.drink = l.drink === el.dataset.d ? null : el.dataset.d; l.said = null; render(); },
  lcheck() { LB.check(); },
  lset(el) { state.labels.set = el.dataset.s; render(); },
  lans(el) { LBL.answer(+el.dataset.q, +el.dataset.k); },
  jdrop(el) { if (state.jobs.sel) JB.put(state.jobs.sel, el.dataset.j); },
  jreset() { state.jobs = { placed: {}, sel: null, mistakes: 0, msg: null }; render(); },
  zanimal(el) { state.zoo.animal = el.dataset.a; state.zoo.msg = null; render(); },
  zwater() { const z = state.zoo; z.water[z.animal] = !z.water[z.animal]; z.msg = null; render(); },
  zcheck() { ZOO.check(); },
  missions() {
    $('#missionList').innerHTML = MISSIONS.map((m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title}</span><span class="star">⭐</span></button>`).join('');
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  resetStars() { state.done = []; store.set('bp-done', []); updateStars(); ACTIONS.missions(); },
  closeModals() { closeModals(); },
  help() { closeModals(); showHelp(); },
  model() {
    $('#modelTab').textContent = tabName(state.view);
    $('#modelList').innerHTML = REAL_TABS[state.view].map(k => `<li><span class="em">${REAL[k][0]}</span><span>${REAL[k][1]}</span></li>`).join('');
    $('#modelModal').classList.remove('hidden');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// The food card on the plate: a mouse pointing at a food shows it; a tap anywhere else closes it
document.addEventListener('pointerover', e => {
  const f = e.target.closest('#foods .food');
  if (f && e.pointerType === 'mouse' && !$('#ftip')?.dataset.pinned) PL.tip(f.dataset.id, f, false);
});
document.addEventListener('pointerout', e => { if (e.target.closest('#foods .food') && e.pointerType === 'mouse') PL.hideTip(false); });
document.addEventListener('click', e => { if (!e.target.closest('#foods .food, #ftip')) PL.hideTip(true); }, true);
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });
addEventListener('resize', fitBanner);

// ================= Start =================
// Test hooks: #view=plate&foods=apple,toast&drink=water&model=pyramid&check=1 fills the plate; #view=jobs&placed=toast,egg places foods;
// #view=lunch&brief=ben&box=apple,yogNat&sandwich=brown,egg,lettuce&drink=water&check=1 packs a lunchbox;
// #view=labels&set=drink opens a set of labels; #view=zoo&animal=lion&food=meat&water=1&check=1 fills a bowl; #mission=2 starts a mission;
// add &nohelp=1 to any of these to skip the help pop-ups
const hp = new URLSearchParams(location.hash.slice(1));
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
if (hp.has('foods')) state.plate = hp.get('foods').split(',').filter(id => FOODS[id]).slice(0, MAXFOOD);
if (DRINKS[hp.get('drink')]) state.drink = hp.get('drink');
if (hp.get('model') === 'pyramid') state.model = 'pyramid';
if (MEALS[hp.get('meal')]) state.meal = hp.get('meal');
if (hp.has('placed')) hp.get('placed').split(',').filter(f => JFOODS[f]).forEach(f => { state.jobs.placed[f] = JFOODS[f][0]; });
if (ANIMALS[hp.get('animal')]) state.zoo.animal = hp.get('animal');
if (hp.has('food')) state.zoo.bowl[state.zoo.animal] = hp.get('food').split(',').filter(f => PANTRY[f]);
if (hp.has('water')) state.zoo.water[state.zoo.animal] = true;
if (LB.BRIEFS[hp.get('brief')]) state.lunch = freshLunch(hp.get('brief'));
if (LABELS[hp.get('set')]) state.labels.set = hp.get('set');
if (hp.has('sandwich')) { const [bread, fill, salad] = hp.get('sandwich').split(','); Object.assign(state.lunch.sw, { bread, fill, salad: salad || 'none' }); state.lunch.box.push('sandwich'); }
if (hp.has('box')) hp.get('box').split(',').filter(id => LB.ITEMS[id]).forEach(id => state.lunch.box.length < LB.SPACES && state.lunch.box.push(id));
if (LB.DRINKS[hp.get('drink')] && state.view === 'lunch') state.lunch.drink = hp.get('drink');
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
if (hp.has('check')) { if (state.view === 'plate') PL.check(); if (state.view === 'zoo') ZOO.check(); if (state.view === 'lunch') LB.check(); }
</script>
<script>
  // Offline support: saves the whole Science Hub on this device the first time any page is opened (see ../sw.js)
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
</body>
</html>
