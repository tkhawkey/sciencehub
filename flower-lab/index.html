<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower Lab</title>
<meta name="description" content="Sort plants that flower from plants that don't, take a flower apart, follow the pollen, design a flower for a pollinator, see flowers turn into fruit and complete the life cycle – an interactive tool for Year 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================= Shared look (matches Seed Lab) ================= */
  :root {
    --ink: #1d2340; --muted: #5b6386; --soft: #eef2ff;
    --yellow: #ffc83d; --blue: #3d7bff; --coral: #ff5f6d; --green: #22b07d; --orange: #f0892e; --grey: #8a93ad; --pink: #e85d9e;
    --space: #070d24; --drawerW: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  .btn { border: 0; border-radius: 14px; padding: 9px 14px; min-height: 44px; cursor: pointer; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.active { background: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: var(--green); color: #fff; font-size: 19px; flex: 1; }
  .btn.primary { background: var(--green); color: #fff; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #drawer a.btn.go, #drawer a.btn.primary { color: #fff; }

  /* ---------- Top bar ---------- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(7,13,36,.95); z-index: 15; }
  .brand { color: #fff; font-size: 21px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  .hub-link { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; text-decoration: none; font-size: 20px; background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: background .15s, transform .08s; }
  .hub-link:hover { background: rgba(255,255,255,.26); }
  .hub-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.missions { background: var(--blue); color: #fff; }
  .tabs .btn { padding: 9px 10px; }
  /* Seven tabs: their words go first, leaving the icons */
  @media (max-width: 1399px) {
    .topbar .long { display: none; }
    .brand { font-size: 18px; }
    .topbar, .tabs { gap: 4px; }
    .tabs .btn { padding: 9px 8px; font-size: 14.5px; }
  }
  @media (max-width: 1180px) { .tl { display: none; } .tabs .btn { font-size: 20px; padding: 6px 9px; } }

  /* ---------- Main area: stage on the left, drawer on the right ---------- */
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; top: 0; bottom: 0; left: 0; right: var(--drawerW); overflow: hidden; background: #eef4fb; display: flex; align-items: center; justify-content: center; }
  #stage > svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawerW); background: #dfe6ff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .term { background: #fff3c4; border-radius: 6px; padding: 0 4px; font-weight: 600; }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .opt.on { background: var(--yellow); border-color: #e0a800; }
  .opt.wrong { background: #ffe0e3; border-color: var(--coral); }
  .opt.done, .opt.done:disabled { background: #c9f2df; border-color: var(--green); opacity: 1; }
  .opt:disabled { opacity: .45; cursor: default; }
  .opt.sm { font-size: 14px; padding: 4px 8px; }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; }
  .spot { background: #fff3c4; border-radius: 12px; padding: 8px 10px; margin-top: 6px !important; }
  .job { font-size: 16px; background: #c9f2df; border-radius: 12px; padding: 8px 10px; }
  .says { border: 3px solid var(--yellow); }
  .says.good { border-color: var(--green); background: #effbf5; }
  .says ul { margin: 6px 0 0; padding-left: 20px; }
  .wq .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
  .checkbar { position: sticky; bottom: -10px; z-index: 2; display: flex; margin: 0 -10px; padding: 6px 10px 10px; background: #dfe6ff; }
  .slide { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .slide input[type=range] { flex: 1; min-height: 44px; accent-color: var(--coral); }
  .lay-top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  .scaletag { background: var(--blue); color: #fff; font-weight: 700; border-radius: 10px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
  .readout { background: #fff; border-radius: 12px; padding: 5px 10px; font-size: 15px; line-height: 1.3; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .tapme { cursor: pointer; }
  .icons { list-style: none; padding: 0; margin: 0 0 14px; }
  .icons li { display: flex; gap: 10px; padding: 6px 0; line-height: 1.35; }
  .icons .em { font-size: 24px; width: 32px; flex: none; text-align: center; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 15px; min-height: 32px; }
  a.linkbtn { display: inline-flex; align-items: center; text-decoration: none; }

  /* ---------- Chips: tap one, then tap where it goes – or drag it there ---------- */
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 2px solid #d3dbf7; background: #fff; border-radius: 12px; padding: 4px 12px; min-height: 44px; font-weight: 600; font-size: 15px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .chip.sel { background: var(--yellow); border-color: #e0a800; }
  .chip-ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); opacity: .95; }
  .bank { display: flex; flex-wrap: wrap; gap: 6px; }
  .bank:empty::before { content: 'All placed!'; color: var(--muted); font-size: 15px; }
  .mrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .mrow > span { flex: 1; font-size: 15px; line-height: 1.25; }
  .mslot { flex: none; width: 118px; min-height: 44px; border: 2px dashed #b7c3ea; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background: #f7f9ff; cursor: pointer; text-align: center; padding: 2px 4px; }
  .mslot.ready { border-color: #e0a800; background: #fffbea; }
  .mslot.over { border-style: solid; border-color: var(--green); }
  .mslot.ok { border-style: solid; border-color: var(--green); background: #c9f2df; cursor: default; }
  .mslot.bad { border-style: solid; border-color: var(--coral); background: #ffe0e3; }
  svg .slot.over rect { stroke: var(--green); stroke-width: 4; }
  svg .slot.ready rect { stroke: #e0a800; }

  /* ---------- Sorting into two boxes ---------- */
  .sortwrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 50px 8px 8px; }
  .pool { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; align-content: start; padding: 4px; }
  .pcard { position: relative; display: flex; flex-direction: column; border: 3px solid #fff; background: #fff; border-radius: 14px; padding: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.12); text-align: center; }
  .pcard img, .pcard .ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; pointer-events: none; }
  .pcard .ph { display: grid; place-items: center; font-size: 46px; background: #e6f3e0; }
  .pcard .ph svg { width: 60%; height: auto; }
  .pcard > span { padding: 4px 6px; }
  .pcard.sel { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
  .pcard.look { border-color: var(--blue); }
  .bins { flex: none; height: 40%; min-height: 130px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bin { border: 3px dashed #b7c3ea; border-radius: 16px; background: #fff; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; cursor: pointer; }
  .bin h3 { margin: 0; font-size: 18px; text-align: center; pointer-events: none; }
  .bin .bsub { text-align: center; font-size: 13.5px; color: var(--muted); font-weight: 600; pointer-events: none; }
  .bin.ready { border-color: var(--yellow); background: #fffbea; }
  .bin.over { border-style: solid; border-color: var(--green); background: #effbf5; }
  .bin .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .mini { width: 66px; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.1; pointer-events: none; }
  .mini img, .mini .ph { width: 58px; height: 44px; object-fit: cover; border-radius: 8px; display: grid; place-items: center; font-size: 28px; background: #e6f3e0; }
  .mini .ph svg { width: 34px; height: 34px; }
  .photo { position: relative; border-radius: 14px; overflow: hidden; background: #e6f3e0; }
  .photo img { width: 100%; display: block; }
  .photo .ph { display: grid; place-items: center; font-size: 80px; aspect-ratio: 4 / 3; }
  .pcard .credit, .mini .credit { display: none; }
  .credit { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; max-width: calc(100% - 12px); }

  /* ---------- Flower to fruit: photos in a row ---------- */
  .film { position: absolute; inset: 0; padding: 54px 10px 10px; display: flex; gap: 8px; align-items: stretch; }
  .frame { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 16px; padding: 8px; }
  .frame .photo { flex: 1; min-height: 0; }
  .frame .photo img { width: 100%; height: 100%; object-fit: cover; }
  .frame .photo .ph { height: 100%; aspect-ratio: auto; }
  .frame .cap { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .frame .cap i { display: block; font-style: normal; font-weight: 500; font-size: 14px; color: var(--muted); }
  .frame .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 15px; margin-right: 4px; }
  .arrow { align-self: center; font-size: 28px; color: var(--muted); }
  .cover { display: grid; place-items: center; height: 100%; font-size: 70px; background: repeating-linear-gradient(45deg, #fff3c4 0 14px, #ffeaa0 14px 28px); }

  /* ---------- Design a flower: the visits gauges (as in Adaptation Studio) ---------- */
  .gauges { position: absolute; left: 10px; top: 52px; bottom: 10px; display: flex; gap: 6px; z-index: 3; }
  .gauge { width: 82px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(255,255,255,.94); border-radius: 16px; padding: 8px 6px; cursor: pointer; border: 3px solid transparent; text-align: center; font: inherit; color: var(--ink); }
  .gauge.on { border-color: var(--blue); }
  .gauge .gt { font-weight: 700; font-size: 14px; line-height: 1.15; display: flex; flex-direction: column; align-items: center; }
  .gauge .gi { font-size: 24px; line-height: 1.2; }
  .gauge .end { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.1; }
  .gauge .tube { position: relative; flex: 1; min-height: 50px; width: 26px; border-radius: 13px; margin: 14px 0; background: linear-gradient(to top, #ff7a5a 0%, #ffd27a 32%, #9ad48a 62%, #22a06b 100%); }
  .gauge .tube.off { background: #e1e6f5; }
  .gauge .gs { font-weight: 700; font-size: 13px; line-height: 1.15; min-height: 30px; display: flex; align-items: center; }
  .gauge.bad .gs { color: #b23a12; } .gauge.good .gs { color: #0b6644; }
  .marker { position: absolute; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 15px; transition: top .8s cubic-bezier(.3,1.4,.5,1); }
  .feat { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-top: 1px solid #e1e6f5; font-size: 15px; line-height: 1.3; }
  .feat:first-of-type { border-top: 0; }
  .st { display: inline-block; flex: none; border-radius: 999px; padding: 1px 9px; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .st.help { background: #d9f6ea; color: #0b6644; } .st.problem { background: #ffe3cc; color: #8a4300; } .st.little { background: #eceff6; color: #4a5170; }
  .frow { margin: 7px 0; }
  .frow > span { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }

  /* ---------- Pictures drawn on the stage ---------- */
  .glabel { font-family: 'Fredoka', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: var(--ink); }
  .gsmall { font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--muted); }
  .part:hover > path, .part:hover > ellipse { filter: brightness(1.08); }
  .bob { animation: bob 1.4s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-8px); } }
  .puff { animation: puff 1.6s ease-out infinite; }
  @keyframes puff { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .glow { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .35; } to { opacity: .9; } }
  .scent { animation: rise 2.4s ease-in infinite; }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } 20% { opacity: .9; } to { transform: translateY(-40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bob, .puff, .glow, .scent { animation: none; } }

  /* ---------- Missions and pop-ups ---------- */
  .banner { position: absolute; top: 10px; right: 10px; width: calc(var(--drawerW) - 20px); z-index: 6; background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 9px 44px 9px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .banner.hidden { display: none; }
  .banner .kicker { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .banner .close { position: absolute; top: 6px; right: 6px; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .banner .hint { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .banner .hint.hidden { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(5,10,30,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.hidden { display: none; }
  .modal-box { position: relative; background: #fff; border-radius: 24px; padding: 20px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-box h2 { margin: 0 0 8px; font-size: 25px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .mission-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .mission-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 16px; background: var(--soft); border: 0; text-align: left; cursor: pointer; font-size: 16px; }
  .mission-item .em { font-size: 25px; } .mission-item .t { flex: 1; font-weight: 600; }
  .mission-item .star { font-size: 21px; filter: grayscale(1); opacity: .35; }
  .mission-item.done .star { filter: none; opacity: 1; }
  .core { background: var(--yellow); color: var(--ink); border-radius: 8px; padding: 1px 7px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .win-emoji { font-size: 56px; text-align: center; }
  .win-text { font-size: 17.5px; line-height: 1.5; margin-bottom: 14px; }
  .confetti { position: fixed; top: -40px; font-size: 26px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  .modal-x {
    position: sticky; top: 0; float: right; z-index: 2;
    width: 52px; height: 52px; margin: -6px -6px 6px 12px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--coral); color: #fff; font-size: 26px; font-weight: 700; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .08s, filter .15s;
  }
  .modal-x:hover { filter: brightness(1.08); }
  .modal-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .modal-x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .science { background: #fff6d6; border: 3px solid var(--yellow); border-radius: 16px; padding: 10px 14px; margin: 8px 0; }
  .science > b:first-child { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #8a5a00; margin-bottom: 2px; }
  .seelab { display: flex; align-items: center; gap: 8px; background: #e7f7ee; border-radius: 12px; padding: 8px 10px; font-weight: 600; color: #0b6644; text-decoration: none; min-height: 44px; }
  .help-body h3 { margin: 12px 0 4px; font-size: 17px; }
  .help-body p { margin: 4px 0; line-height: 1.4; }
  .help-body ol { margin: 4px 0; padding-left: 24px; line-height: 1.4; }
  .help-body ol li { margin: 3px 0; }
  .help-body .welcome { font-weight: 700; color: var(--blue); }
  details.teach { margin: 12px 0; font-size: 13px; color: var(--muted); }
  details.teach summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  details.teach p { margin: 4px 0; }
  details.teach h4 { margin: 8px 0 2px; font-size: 13px; color: var(--ink); }

  /* ---------- Narrow screens: stage on top, drawer below ---------- */
  @media (max-width: 760px) {
    :root { --drawerW: 0px; }
    #stage { bottom: 42%; right: 0; }
    #drawer { top: 58%; width: 100%; }
    .banner { top: calc(58% + 8px); left: 8px; right: 8px; width: auto; }
    .brand { font-size: 17px; }
    .topbar > .btn { padding: 6px 9px; }
    /* The seven tabs get a row of their own, under the title and buttons */
    .tabs { order: 9; width: 100%; justify-content: space-between; gap: 3px; }
    .tabs .btn { flex: 1; font-size: 18px; padding: 4px 0; min-height: 40px; }
    .readout, .scaletag { font-size: 13px; padding: 3px 7px; }
    .glabel { font-size: 12px; } .gsmall { font-size: 10.5px; }
    .sortwrap { padding-top: 40px; gap: 5px; }
    .pool { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 5px; }
    .pcard { font-size: 12px; } .pcard .ph { font-size: 30px; }
    .bins { min-height: 100px; gap: 5px; }
    .bin h3 { font-size: 14px; } .bin .bsub { display: none; }
    .mini { width: 46px; font-size: 10px; } .mini img, .mini .ph { width: 42px; height: 32px; font-size: 20px; }
    .film { padding-top: 40px; gap: 4px; }
    .frame { padding: 4px; } .frame .cap { font-size: 12px; } .frame .cap i { display: none; } .frame .num { width: 20px; height: 20px; font-size: 12px; }
    .arrow { font-size: 16px; }
    .gauges { top: 40px; gap: 3px; }
    .gauge { width: 50px; padding: 5px 2px; } .gauge .gn, .gauge .end { display: none; } .gauge .gs { font-size: 10px; min-height: 24px; }
    .gauge .tube { width: 18px; margin: 10px 0; } .marker { width: 26px; height: 26px; margin: -13px 0 0 -13px; font-size: 12px; }
    .mslot { width: 96px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="hub-link" href="../index.html" title="Back to the Science Hub" aria-label="Back to the Science Hub">🏠</a>
  <div class="brand">🌸 Flower Lab</div>
  <div class="tabs" id="tabs"></div>
  <button class="btn missions" data-act="missions" title="Missions">🚀 <span class="long">Missions </span><span id="starCount"></span></button>
  <button class="btn" data-act="model" title="How is this model different from real life?">🤔<span class="long"> Real life?</span></button>
  <button class="btn" id="helpBtn" data-act="help" aria-label="How to use">❓</button>
</div>
<main>
  <div id="stage"></div>
  <div id="drawer"></div>
  <div id="banner" class="banner hidden" role="status">
    <div class="kicker" id="bannerKicker"></div>
    <div id="bannerText"></div>
    <button class="linkbtn" data-act="hint" id="hintBtn">💡 Show a hint</button>
    <div class="hint hidden" id="bannerHint"></div>

<script>
// ================= Utilities =================
const $ = (s, r = document) => r.querySelector(s);
// Saved progress; private windows can block storage, so failures are ignored
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const stageSize = () => { const st = $('#stage'), w = st.clientWidth || 900, h = st.clientHeight || 600; return { w, h, narrow: w < 560 }; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mix = (c1, c2, t) => { const p = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16)), a = p(c1), b = p(c2);
  return '#' + a.map((v, k) => Math.round(v + (b[k] - v) * clamp(t)).toString(16).padStart(2, '0')).join(''); };
const lc = t => t[0].toLowerCase() + t.slice(1);
const cap = t => t[0].toUpperCase() + t.slice(1);
// A question with choices: wrong ones turn red and stay disabled, the right one turns green
const choices = (act, opts, chosen, wrongs, right) => opts.map(([v, t]) => `<button class="opt${chosen === v && v === right ? ' done' : wrongs.includes(v) ? ' wrong' : ''}" data-act="${act}" data-v="${v}"${wrongs.includes(v) || chosen === right ? ' disabled' : ''}>${t}</button>`).join('');
// A prediction: no right or wrong yet, just the child's choice
const predict = (act, opts, chosen) => opts.map(([v, t]) => `<button class="opt${chosen === v ? ' on' : ''}" data-act="${act}" data-v="${v}"${chosen ? ' disabled' : ''}>${t}</button>`).join('');

// ================= Photos =================
// Each photo's credit, as in Adaptation Studio. A missing photo falls back to the plant's emoji.
// All from Wikimedia Commons; photos/credits.json has the link to each one.
const CREDITS = {
  'sunflower.jpg': 'Photo: daryl_mitchell, CC BY-SA 2.0', 'sunflower-clue.jpg': 'Photo: Brandon Weeks, CC BY 3.0',
  'apple-tree.jpg': 'Photo: Mars 2002, CC BY-SA 3.0', 'apple-blossom.jpg': 'Photo: Billpowellisalive, CC BY-SA 3.0',
  'grass.jpg': 'Photo: Julian Paren, CC BY-SA 2.0', 'grass-flower.jpg': 'Photo: Hectonichus, CC BY-SA 4.0',
  'oak-catkins.jpg': 'Photo: Famartin, CC BY-SA 4.0', '../adaptation-studio/photos/oak.jpg': 'Photo: David Hawgood, CC BY-SA 2.0',
  'cactus.jpg': 'Photo: Diego Delso, CC BY-SA 3.0', 'cactus-flower.jpg': 'Photo: DataEcologist, CC BY-SA 4.0',
  'moss.jpg': 'Photo: Tomas Pocius, CC0', 'moss-capsules.jpg': 'Photo: jacilluch, CC BY-SA 2.0',
  'fern.jpg': 'Photo: Christian Berg, CC BY 4.0', 'fern-spores.jpg': 'Photo: Krzysztof Ziarnek, Kenraiz, CC BY-SA 4.0',
  'pine.jpg': 'Photo: Ruslan Kastani, CC BY-SA 4.0', 'pine-cone.jpg': 'Photo: Wilfredor, CC0',
  'apple-young.jpg': 'Photo: Natalka Ukraine, CC BY 4.0', 'apple-bottom.jpg': 'Photo: Forest and Kim Starr, CC BY 3.0 US',
  'pea-flower.jpg': 'Photo: Dyorkey, CC BY-SA 3.0', 'pea-young.jpg': 'Photo: Chmee2, CC BY 3.0', 'tomato-cut.jpg': 'Photo: Adityamadhav83, CC BY-SA 3.0', 'pea-pod.jpg': 'Photo: Rachael Gorjestani, CC0',
  'tomato-flower.jpg': 'Photo: Dinesh Valke, CC BY-SA 2.0', 'tomato-fruit.jpg': 'Photo: Rob Bertholf, CC BY 3.0'
};
const photo = (file, em, alt = '') => {
  const src = file.includes('/') ? file : `photos/${file}`, c = CREDITS[file];
  return `<img src="${src}" alt="${esc(alt)}" onerror="this.outerHTML='<div class=&quot;ph&quot;>${em}</div>'">${c ? `<span class="credit">${esc(c)}</span>` : ''}`;
};

// ================= Drag or tap =================
// Anything with data-drag can be picked up; anything with data-drop can take it.
// A tap picks it up (the view's pick), a second tap on a drop place puts it there (the view's drop).
// Dragging does the same in one go.
const DND = { start: null, ghost: null, over: null, skipClick: false };
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0 || el.matches(':disabled')) return;
  DND.start = { el, id: el.dataset.drag, x: e.clientX, y: e.clientY, moved: false };
});
document.addEventListener('pointermove', e => {
  const d = DND.start; if (!d) return;
  if (!d.moved) {
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10) return;
    d.moved = true;
    const v = VIEWS[state.view], html = v.ghost && v.ghost(d.id);
    let g;
    if (html) { g = document.createElement('div'); g.className = 'chip'; g.innerHTML = html; }
    else { g = d.el.cloneNode(true); g.style.width = d.el.offsetWidth + 'px'; }
    g.classList.add('chip-ghost'); g.removeAttribute('data-drag');
    document.body.appendChild(g); DND.ghost = g;
  }
  DND.ghost.style.left = e.clientX + 'px'; DND.ghost.style.top = e.clientY + 'px';
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
  if (over !== DND.over) { DND.over?.classList.remove('over'); over?.classList.add('over'); DND.over = over; }
});
function endDrag(e) {
  const d = DND.start; DND.start = null;
  if (!d || !d.moved) return;
  DND.ghost?.remove(); DND.ghost = null; DND.over?.classList.remove('over'); DND.over = null;
  DND.skipClick = true; setTimeout(() => DND.skipClick = false, 0);
  const over = e && document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
  const v = VIEWS[state.view];
  if (over && v.drop) v.drop(d.id, over.dataset.drop);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => endDrag(null));

// ================= The model flower =================
// Drawn side-on, with its stalk going down from the base of the flower at (0, 0). One unit = the flower's size.
// It has 5 sepals, 5 petals, 6 stamens (each an anther on a filament) and 1 carpel (stigma, style and ovary).
const FL = { sepals: [-145, -108, 108, 145, 180], petals: [0, -32, 32, -64, 64], stamens: [-34, -22, -10, 10, 22, 34] };
const PARTS = [...FL.sepals.map((_, i) => 'sepal' + i), ...FL.petals.map((_, i) => 'petal' + i), ...FL.stamens.map((_, i) => 'stamen' + i), 'carpel'];
const layerOf = id => id.replace(/\d+$/, '');
const SHAPE = {
  sepal: (L = .2, w = .055) => `M0 0 C${w} ${-L * .25} ${w * 1.1} ${-L * .7} 0 ${-L} C${-w * 1.1} ${-L * .7} ${-w} ${-L * .25} 0 0Z`,
  petal: (L = .5, w = .15) => `M0 0 C${w * .5} ${-L * .15} ${w * 1.15} ${-L * .55} ${w * .75} ${-L * .9} Q0 ${-L * 1.08} ${-w * .75} ${-L * .9} C${-w * 1.15} ${-L * .55} ${-w * .5} ${-L * .15} 0 0Z`
};
const NS = 'vector-effect="non-scaling-stroke"';
const COL = { petal: '#ff7eb6', petalEdge: '#cf3f80', sepal: '#4caf50', sepalEdge: '#2f7d3a', anther: '#ffb81c', antherEdge: '#c78300', filament: '#f3e6b0', ovary: '#8fd16f', ovaryEdge: '#4e9a3a', style: '#bfe3a6', stigma: '#e8a23a', fruit: '#e0463a' };
// The parts on their own, pointing up from (0, 0): used on the flower and on the dissection tray
const PART = {
  sepal: (o = {}) => `<path d="${SHAPE.sepal()}" fill="${o.dry ? '#a39250' : COL.sepal}" stroke="${o.hl || COL.sepalEdge}" stroke-width="${o.hl ? 5 : 1.5}" ${NS}/><path d="M0 -.02 V-.16" stroke="${COL.sepalEdge}" stroke-width="1" ${NS} opacity=".6"/>`,
  petal: (o = {}) => { const c = o.wither ? mix(o.col || COL.petal, '#a0784a', o.wither) : o.col || COL.petal;
    return `<path d="${SHAPE.petal(.5 * (1 - (o.wither || 0) * .18))}" fill="${c}" stroke="${o.hl || COL.petalEdge}" stroke-width="${o.hl ? 5 : 1.5}" ${NS}/><path d="M0 -.04 V-.36" stroke="${COL.petalEdge}" stroke-width="1" ${NS} opacity=".35"/>`; },
  // A stamen: the filament (stalk) holding up the anther, where pollen is made
  stamen: (o = {}) => `<path d="M0 0 V-.34" stroke="${o.wither ? '#c9b98a' : COL.filament}" stroke-width=".014"/><path d="M0 0 V-.34" stroke="${o.hl || 'transparent'}" stroke-width="${o.hl ? 5 : 0}" ${NS} opacity=".7"/>
    <ellipse cy="-.36" rx=".026" ry=".048" fill="${o.wither ? '#9b7a3a' : COL.anther}" stroke="${o.hl || COL.antherEdge}" stroke-width="${o.hl ? 5 : 1.2}" ${NS}/>
    ${o.pollen ? [[-.03, -.37], [.032, -.35], [-.024, -.32], [.02, -.41], [0, -.42]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".009" fill="#ffd84a"/>`).join('') : ''}`,
  // The carpel: the stigma on top of the style, and the ovary at the bottom
  carpel: (o = {}) => {
    const s = o.swell || 0, rx = .065 * (1 + s * 2.4), ry = .08 * (1 + s * 2.4), cy = -ry - .005, top = cy - ry;
    const oc = s > 0 ? mix(COL.ovary, COL.fruit, (s - .45) / .55) : COL.ovary, gone = clamp(1 - s * 1.6);
    let g = '';
    if (gone > 0) g += `<g opacity="${gone}"><path d="M-.012 ${top + .01} L-.012 -.41 L.012 -.41 L.012 ${top + .01}Z" fill="${o.cut ? '#eaf6dd' : COL.style}" stroke="${o.hl || COL.ovaryEdge}" stroke-width="${o.hl ? 5 : 1.2}" ${NS}/>
      <path d="M-.042 -.415 Q-.04 -.455 0 -.452 Q.04 -.455 .042 -.415 Q0 -.4 -.042 -.415Z" fill="${COL.stigma}" stroke="${o.hl || '#a8641a'}" stroke-width="${o.hl ? 5 : 1.2}" ${NS}/>
      ${Array.from({ length: o.stuck || 0 }, (_, k) => `<circle cx="${(-.03 + (k % 5) * .015).toFixed(3)}" cy="${(-.448 - (k % 2) * .01).toFixed(3)}" r=".009" fill="#ffd84a" stroke="#c78300" stroke-width=".5" ${NS}/>`).join('')}</g>`;
    g += `<ellipse cy="${cy}" rx="${rx}" ry="${ry}" fill="${o.cut ? '#f3fbe9' : oc}" stroke="${o.hl || (s > .5 ? '#a8261c' : COL.ovaryEdge)}" stroke-width="${o.hl ? 5 : 1.5}" ${NS}/>`;
    if (o.cut) {
      // Inside the ovary: tiny parts that can become seeds (not labelled: Year 5 doesn't need their name)
      g += `<ellipse cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${oc}" stroke-width="${Math.max(.012, rx * .18)}" opacity=".9"/>`;
      const n = 4, seed = o.seeds || 0;
      for (let k = 0; k < n; k++) {
        const yy = cy - ry * .55 + k * (ry * 1.1 / (n - 1)), xx = (k % 2 ? 1 : -1) * rx * .28;
        g += seed > 0 ? `<ellipse cx="${xx}" cy="${yy}" rx="${(.012 + seed * rx * .2).toFixed(4)}" ry="${(.009 + seed * ry * .12).toFixed(4)}" fill="${mix('#f6f1c7', '#d9b56a', seed)}" stroke="#a88b4e" stroke-width="1" ${NS}/>`
          : `<ellipse cx="${xx}" cy="${yy}" rx=".012" ry=".009" fill="#f6f1c7" stroke="#b9b37a" stroke-width="1" ${NS}/>`;
      }
      // The pollen tube grows from the stigma, down the style, into the ovary
      if (o.tube > 0) { const end = -.41 + (top + ry * .3 + .41) * o.tube; g += `<path d="M0 -.41 L0 ${end.toFixed(4)}" stroke="#e08a00" stroke-width="2.5" stroke-linecap="round" ${NS}/>`; }
    }
    return g;
  }
};
// The whole flower. o: x, y (base of the flower), S (size in px), stalk (px), rm (parts taken off), tap (parts can be picked up),
// hl (a part or a whole layer to highlight), col (petal colour), wither, fall (0–1), swell, cut, tube, seeds, stuck (pollen on the stigma), pollen (on the anthers)
function flowerG(o) {
  const { x, y, S, stalk = S * .9, rm = {}, tap = false, hl = null } = o;
  const w = o.wither || 0, f = o.fall || 0;
  const da = id => o.act ? ` data-act="${o.act}" data-v="${id}" class="tapme part"` : tap ? ` data-drag="${id}" class="tapme part"` : '';
  const hi = id => hl && (hl === id || hl === layerOf(id)) ? '#ffc83d' : null;
  let g = `<path d="M${x} ${y} Q${x - S * .04} ${y + stalk * .5} ${x} ${y + stalk}" stroke="#3f9d4a" stroke-width="${Math.max(3, S * .035)}" fill="none" stroke-linecap="round"/>`;
  g += `<g transform="translate(${x} ${y}) scale(${S})">`;
  FL.sepals.forEach((a, i) => { const id = 'sepal' + i; if (!rm[id]) g += `<g transform="rotate(${a})${a === 180 ? ' scale(.8)' : ''}"${da(id)}>${PART.sepal({ hl: hi(id), dry: o.swell > .3 })}</g>`; });
  // Petals and stamens droop as they wither, then fall
  const droop = a => a + (a >= 0 ? 1 : -1) * w * 50;
  const falling = (k, inner) => f > 0 ? `<g transform="translate(${((k % 2 ? 1 : -1) * f * .25).toFixed(3)} ${(f * 1.3).toFixed(3)})" opacity="${(1 - f).toFixed(2)}">${inner}</g>` : inner;
  if (f < 1) {
    FL.petals.forEach((a, i) => { const id = 'petal' + i; if (!rm[id]) g += falling(i, `<g transform="rotate(${droop(a)})"${da(id)}>${PART.petal({ hl: hi(id), col: o.col, wither: w })}</g>`); });
    FL.stamens.forEach((a, i) => { const id = 'stamen' + i; if (!rm[id]) g += falling(i + 1, `<g transform="rotate(${droop(a) * (1 + w * .4)})"${da(id)}>${PART.stamen({ hl: hi(id), wither: w > .2, pollen: o.pollen })}</g>`); });
  }
  if (!rm.carpel) g += `<g${da('carpel')}>${PART.carpel({ hl: hi('carpel'), swell: o.swell, cut: o.cut, tube: o.tube, seeds: o.seeds, stuck: o.stuck })}</g>`;
  return g + '</g>';
}
// A flower made for the wind: no petals, anthers dangling outside on long filaments, a feathery stigma
function windFlowerG(x, y, S, o = {}) {
  let g = `<path d="M${x} ${y} Q${x + S * .05} ${y + S * .6} ${x} ${y + S * 1.2}" stroke="#7a9a3a" stroke-width="${Math.max(3, S * .03)}" fill="none"/>`;
  g += `<g transform="translate(${x} ${y}) scale(${S})">`;
  // Small, dull, green-brown scales instead of petals
  g += [-.05, .05].map(dx => `<ellipse cx="${dx}" cy="-.04" rx=".05" ry=".09" fill="#a8b06a" stroke="#6f7a3a" stroke-width="1" ${NS}/>`).join('');
  // Anthers dangling on long, floppy filaments
  [[-1, .1], [1, .14], [-1, .3], [1, .26]].forEach(([s, d]) => {
    const ex = s * (.2 + d * .3), ey = .1 + d;
    g += `<path d="M0 -.04 Q${s * .16} -.1 ${ex} ${ey}" stroke="#d8cf9a" stroke-width=".01" fill="none"/><ellipse cx="${ex}" cy="${ey + .04}" rx=".022" ry=".05" fill="${o.empty ? '#c9b98a' : '#e9d36a'}" stroke="#9a8a3a" stroke-width="1" ${NS}/>`;
  });
  // A feathery stigma, sticking out to catch pollen from the air
  [-1, 1].forEach(s => {
    g += `<path d="M0 -.1 L${s * .1} -.38" stroke="#efe6f2" stroke-width=".012"/>`;
    for (let k = 1; k <= 6; k++) { const t = k / 7, px = s * .1 * t, py = -.1 - .28 * t; g += `<path d="M${px} ${py} l${-.05} ${-.02} M${px} ${py} l.05 ${-.02}" stroke="#d9c9e6" stroke-width=".007"/>`; }
  });
  g += Array.from({ length: o.stuck || 0 }, (_, k) => `<circle cx="${((k % 2 ? 1 : -1) * (.03 + (k % 4) * .018)).toFixed(3)}" cy="${(-.18 - (k % 5) * .04).toFixed(3)}" r=".012" fill="#ffd84a" stroke="#c78300" stroke-width=".5" ${NS}/>`).join('');
  return g + '</g>';
}
// A bee: o.dust = pollen on its body
const beeG = (x, y, s, o = {}) => `<g transform="translate(${x} ${y}) scale(${s})"${o.attrs || ''}>
  <ellipse cx="-.1" cy="-.62" rx=".34" ry=".44" fill="#eaf4ff" stroke="#9fb3cf" stroke-width="1" ${NS} opacity=".85" transform="rotate(-25 -.1 -.62)"/>
  <ellipse cx=".22" cy="-.6" rx=".28" ry=".38" fill="#eaf4ff" stroke="#9fb3cf" stroke-width="1" ${NS} opacity=".85" transform="rotate(20 .22 -.6)"/>
  <ellipse cx="0" cy="0" rx=".72" ry=".46" fill="#ffc83d" stroke="#3a2a10" stroke-width="2" ${NS}/>
  <path d="M-.25 -.42 Q-.32 0 -.25 .42 M.08 -.45 Q.02 0 .08 .45" stroke="#3a2a10" stroke-width=".14" fill="none"/>
  <circle cx=".66" cy="-.05" r=".26" fill="#3a2a10"/><circle cx=".74" cy="-.12" r=".06" fill="#fff"/>
  <path d="M-.72 0 l-.22 .05 l.22 .08Z" fill="#3a2a10"/>
  ${o.dust ? [[-.4, .2], [-.1, .32], [.25, .3], [-.5, -.1], [.1, .1], [.4, .22], [-.2, -.05]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r=".09" fill="#ffe14a" stroke="#c78300" stroke-width="1" ${NS}/>`).join('') : ''}
</g>`;

// ================= State =================
const freshSort = () => ({ pred: null, placed: {}, sel: null, look: null, clue: {}, last: null });
const freshParts = () => ({ mode: 'explore', rm: {}, named: {}, info: null, cut: false, oops: null, sel: null, placed: {}, marks: {}, bank: shuffle(NAMES), tries: 0 });
const NAMES = ['sepal', 'petal', 'anther', 'filament', 'stamen', 'stigma', 'style', 'ovary', 'carpel'];
const state = { view: 'sort', mission: null, done: store.get('fl-done', []), sort: freshSort(), parts: freshParts() };

// Sorting into two boxes. items: [id, name, picture]; bins: [id, title, small print]
function sortStage({ items, bins, placed, sel, look, tag, say }) {
  const left = items.filter(([id]) => !placed[id]);
  return `<div class="lay-top"><span class="scaletag">${tag}</span><div class="readout">${say}</div></div>
    <div class="sortwrap">
      <div class="pool">${left.map(([id, name, pic]) => `<button class="pcard${sel === id ? ' sel' : ''}${look === id && sel !== id ? ' look' : ''}" data-drag="${id}" aria-label="${esc(name)}">${pic}<span>${name}</span></button>`).join('')}</div>
      <div class="bins">${bins.map(([b, t, sub]) => `<div class="bin${sel ? ' ready' : ''}" data-drop="${b}" role="button" aria-label="${esc(t)}"><h3>${t}</h3><div class="bsub">${sub}</div>
        <div class="in">${items.filter(([id]) => placed[id] === b).map(([, name, pic]) => `<span class="mini">${pic}${name}</span>`).join('')}</div></div>`).join('')}</div>
    </div>`;
}

// ================= 1. Flowering or not? =================
// [id, name, emoji, photo, clue photo, makes flowers?, what it is, the clue, said when sorted right, hint when sorted wrong]
const PLANTS = [
  ['grass', 'Grass', '🌾', 'grass.jpg', 'grass-flower.jpg', true, 'A meadow of long grass.',
    'Look at the tops of the stems. These feathery bits are lots of tiny <b>flowers</b>! They have no colourful petals, so they are easy to miss.',
    'Surprise! Grass <b>does</b> make flowers. They are small and green, with no colourful petals.', 'Look closely at the feathery tops of the grass. What are they?'],
  ['fern', 'Fern', '🌿', 'fern.jpg', 'fern-spores.jpg', false, 'A fern with big, feathery leaves.',
    'Turn a leaf over. The brown dots underneath are full of <b>spores</b>: tiny specks, like dust, that can grow into new ferns.',
    'Ferns never make flowers. They make <b>spores</b> under their leaves instead.', 'Look under the leaves. Are those brown dots flowers?'],
  ['apple', 'Apple tree', '🍏', 'apple-tree.jpg', 'apple-blossom.jpg', true, 'An apple tree in spring.',
    'In spring, apple trees are covered in white and pink <b>blossom</b>. Blossom is lots of flowers!',
    'Apple blossom is flowers. Later, the flowers turn into apples.', 'What is the white and pink blossom made of?'],
  ['pine', 'Pine tree', '🌲', 'pine.jpg', 'pine-cone.jpg', false, 'A tall pine tree.',
    'Look for the <b>cones</b>. A pine tree\'s seeds grow inside its cones, between the woody scales.',
    'Pine trees make seeds inside <b>cones</b>, but they never make flowers.', 'A cone is not a flower. Does a pine tree have any flowers?'],
  ['cactus', 'Cactus', '🌵', 'cactus.jpg', 'cactus-flower.jpg', true, 'A spiky cactus.',

const plant = id => PLANTS.find(p => p[0] === id);
const SBINS = [['yes', '🌸 Makes flowers', 'a flowering plant'], ['no', '🚫 No flowers', 'never makes flowers']];
const SORT = {
  stage() {
    const s = state.sort, n = Object.keys(s.placed).length;
    return sortStage({ items: PLANTS.map(p => [p[0], p[1], s.clue[p[0]] ? photo(p[4], p[2]) : photo(p[3], p[2])]), bins: SBINS, placed: s.placed, sel: s.sel, look: s.look,
      tag: `${n} of ${PLANTS.length} sorted`, say: s.sel ? `Now tap the box where the ${lc(plant(s.sel)[1])} belongs.` : 'Tap a plant to look at it. Then tap its box, or drag it there.' });
  },
  drawer() {
    const s = state.sort, n = Object.keys(s.placed).length, all = n === PLANTS.length, P = s.look && plant(s.look), L = s.last;
    const pred = `<div class="card${s.pred ? '' : ' says'}"><h3>🤔 Predict first</h3><p>Do <b>all</b> plants make flowers?</p>
      <div class="wq">${predict('spred', [['yes', 'Yes: every plant makes flowers.'], ['no', 'No: some plants never make flowers.']], s.pred)}</div></div>`;
    const said = L ? `<div class="card says${L.ok ? ' good' : ''}"><h3>${L.ok ? '✅' : '💡'} ${plant(L.id)[1]}</h3><p>${L.ok ? plant(L.id)[8] : s.clue[L.id] ? plant(L.id)[9] : 'Not quite. Tap <b>🔍 Look for clues</b> to look closer.'}</p></div>` : '';
    const look = P && !s.placed[P[0]] ? `<div class="card"><div class="photo">${s.clue[P[0]] ? photo(P[4], P[2], `${P[1]}: a close-up`) : photo(P[3], P[2], P[1])}</div>
        <h3 style="margin-top:8px">${P[2]} ${P[1]}</h3><p>${s.clue[P[0]] ? P[7] : P[6]}</p>
        <div class="navrow" style="margin-top:6px"><button class="btn" data-act="sclue">${s.clue[P[0]] ? '↩ Whole plant' : '🔍 Look for clues'}</button></div>
        <p style="margin-top:8px"><b>Where does it go?</b></p><div class="navrow">${SBINS.map(([b, t]) => `<button class="opt" data-act="sbin" data-v="${b}">${t}</button>`).join('')}</div></div>` : '';
    const intro = `<div class="card"><h2>🌼 Flowering or not?</h2><p>A <span class="term">flowering plant</span> is a plant that makes flowers. Do all plants make flowers? Look for clues!</p>
      <p class="muted">${n} of ${PLANTS.length} sorted.${n ? '' : ' Tap a plant to start.'}</p>${n ? '<button class="linkbtn" data-act="sreset">↺ Start again</button>' : ''}</div>`;
    if (all) return `${said}<div class="card says good"><h3>🎉 All sorted!</h3><p>5 of these plants make flowers. 3 never do.</p>
        ${s.pred ? `<p class="muted">You predicted: ${s.pred === 'yes' ? 'every plant makes flowers.' : 'some plants never make flowers.'} ${s.pred === 'no' ? '✅ You were right!' : '❌ Not this time: moss, ferns and pine trees never make flowers.'}</p>` : ''}</div>
      <div class="science"><b>🔬 The science</b>Not all plants make flowers. <b>Mosses</b> and <b>ferns</b> make <span class="term">spores</span> instead. <b>Conifers</b>, like pine trees, make seeds in <b>cones</b>, but no flowers. Some flowering plants have flowers that are small and easy to miss, like grass and oak trees.</div>
      ${intro}`;
    return `${s.pred ? '' : pred}${said}${look}${intro}${s.pred ? pred : ''}`;
  },
  sel: () => state.sort.sel,
  pick(id) { const s = state.sort; s.sel = s.sel === id ? null : id; s.look = id; s.last = null; render(); $('#drawer').scrollTop = 0; },
  drop(id, bin) {
    const s = state.sort, P = plant(id); if (!P || s.placed[id]) return;
    const ok = (bin === 'yes') === P[5]; s.last = { id, ok };
    if (ok) { s.placed[id] = bin; s.sel = null; s.look = null; if (Object.keys(s.placed).length === PLANTS.length) emit('sorted'); }
    else { s.sel = null; s.look = id; }
    render(); $('#drawer').scrollTop = 0;
  }
};

// ================= 2. Take a flower apart =================
// The order of a real dissection: from the outside in
const LAYERS = ['sepal', 'petal', 'stamen', 'carpel'];
const LAYER_HOW = {
  sepal: 'Start on the outside. Take off the 5 <span class="term">sepals</span>: the green, leaf-like parts under the petals. Tap each one, or drag it to the tray.',
  petal: 'Now take off the 5 <span class="term">petals</span>: the coloured parts of the flower.',
  stamen: 'Next, take off the 6 <span class="term">stamens</span>: the thin stalks with yellow tips, around the middle.',
  carpel: 'Only the <span class="term">carpel</span> is left, in the middle. Tap it to lift it onto the tray.'
};
// What each name means, shown when it is found on the tray
const NAME_INFO = {
  sepal: 'A <b>sepal</b> is one of the green, leaf-like parts on the outside of the flower.',
  petal: 'A <b>petal</b> is one of the coloured parts of the flower.',
  anther: 'The <b>anther</b> is the top of a stamen. It is covered in yellow <span class="term">pollen</span>: a fine, yellow dust.',
  filament: 'The <b>filament</b> is the thin stalk under the anther.',
  stamen: 'A <b>stamen</b> is an anther on a filament. This flower has 6 stamens.',
  stigma: 'The <b>stigma</b> is the sticky top of the carpel.',
  style: 'The <b>style</b> is the stalk that joins the stigma to the ovary.',
  ovary: 'The <b>ovary</b> is the swollen part at the bottom of the carpel.',
  carpel: 'The <b>carpel</b> is the stigma, the style and the ovary together. It is in the very middle of the flower.'
};
// Tapping part of a stamen or the carpel also finds the name of the whole thing
const GROUP = { anther: 'stamen', filament: 'stamen', stigma: 'carpel', style: 'carpel', ovary: 'carpel' };
const DIS = {
  layerNow() { const p = state.parts; return LAYERS.find(l => PARTS.some(id => layerOf(id) === l && !p.rm[id])); },
  geo() {
    // Once the whole flower is on the tray, the tray takes the whole width
    const { w, h, narrow } = stageSize(), top = narrow ? 40 : 50, gone = !DIS.layerNow(), fw = gone ? 0 : Math.round(w * (narrow ? .38 : .4));
    const tx = fw + (gone ? 8 : 4), ty = top, tw = w - tx - 8, th = h - ty - 8, head = narrow ? 22 : 30, ch = th - head, cy = ty + head;
    // One part of the tray for each layer. A wide, short tray is split into a 2 × 2 grid (sepals and petals on the left,
    // stamens and carpel on the right); otherwise the four parts are rows, one under another.
    const grid = tw > ch * 1.6, lw = tw * .38;
    const cells = grid ? [{ x: tx, y: cy, w: lw, h: ch / 2 }, { x: tx, y: cy + ch / 2, w: lw, h: ch / 2 }, { x: tx + lw, y: cy, w: tw - lw, h: ch / 2 }, { x: tx + lw, y: cy + ch / 2, w: tw - lw, h: ch / 2 }]
      : (() => { let yy = cy; return (narrow ? [.16, .16, .34, .34] : [.2, .2, .3, .3]).map(k => { const r = { x: tx, y: yy, w: tw, h: ch * k }; yy += r.h; return r; }); })();
    const small = narrow || ch < 330;
    return { w, h, narrow, top, fw, tx, ty, tw, th, cells, sw: small ? 72 : 104, sh: small ? 26 : 32, fs: small ? 12.5 : 15 };
  },
  // Label places side by side: spread out so they don't overlap, and kept inside x0–x1
  spread(xs, sw, x0, x1) {
    const o = xs.map(x => Math.max(x0, x - sw / 2));
    for (let k = 1; k < o.length; k++) o[k] = Math.max(o[k], o[k - 1] + sw + 6);
    for (let k = o.length - 1; k >= 0; k--) o[k] = Math.min(o[k], k === o.length - 1 ? x1 - sw : o[k + 1] - sw - 6);
    return o;
  },
  // One label place: blank, a name found by tapping (explore), or a label placed by the child (test)
  slot(name, x, y, g, tx, ty) {
    const p = state.parts, test = p.mode === 'test', put = test ? p.placed[name] : p.named[name] ? name : null, mark = test && put ? p.marks[name] : null;
    const fill = mark === true ? '#c9f2df' : mark === false ? '#ffe0e3' : put ? '#fff' : '#f7f9ff', stroke = mark === true ? 'var(--green)' : mark === false ? 'var(--coral)' : put ? 'var(--ink)' : '#b7c3ea';
    const att = test ? ` class="slot tapme${p.sel ? ' ready' : ''}" data-drop="slot:${name}"${put && mark !== true ? ` data-act="dunplace" data-v="${name}"` : ''}` : ` class="tapme" data-act="dname" data-v="${name}"`;
    return `<line x1="${x + g.sw / 2}" y1="${ty < y ? y : y + g.sh}" x2="${tx}" y2="${ty}" stroke="#8a93ad" stroke-width="1.5"/>
      <circle cx="${tx}" cy="${ty}" r="3" fill="#8a93ad"/>
      <g${att}><rect x="${x}" y="${y}" width="${g.sw}" height="${g.sh}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-dasharray="${put ? '' : '5 4'}"/>
      <text x="${x + g.sw / 2}" y="${y + g.sh / 2 + g.fs * .36}" text-anchor="middle" style="font-size:${g.fs}px;font-weight:700;fill:${put ? 'var(--ink)' : '#9aa3c5'}">${put ? cap(put) : test ? '' : '?'}</text></g>`;
  },
  // A bracket under a stamen or the carpel, with the name of the whole thing
  bracket(name, x1, x2, y, g, r) {
    const sx = Math.min(Math.max((x1 + x2) / 2 - g.sw / 2, r.x + 4), r.x + r.w - g.sw - 4);
    return `<path d="M${x1} ${y} v7 H${x2} v-7" stroke="#8a93ad" stroke-width="2" fill="none"/>` + DIS.slot(name, sx, y + 16, g, (x1 + x2) / 2, y + 7);
  },
  stage() {
    const p = state.parts, g = DIS.geo(), now = DIS.layerNow();
    // The flower, on the left
    const fy = g.top + (g.h - g.top) * .5, S = Math.min(g.fw * .92, (g.h - g.top) * .52 / .58);
    let o = `<rect width="${g.w}" height="${g.h}" fill="#eef4fb"/><rect x="0" y="${g.h - 16}" width="${g.fw}" height="16" fill="#cfe6c0"/>`;
    if (g.fw) o += flowerG({ x: g.fw / 2, y: fy, S, stalk: g.h - fy - 8, rm: p.rm, tap: p.mode === 'explore', hl: p.oops ? now : null, pollen: true });
    // The dissection tray, on the right
    o += `<g data-drop="tray"><rect x="${g.tx}" y="${g.ty}" width="${g.tw}" height="${g.th}" rx="16" fill="#fff" stroke="#c6d0f2" stroke-width="2"/>
      <text x="${g.tx + 12}" y="${g.ty + (g.narrow ? 16 : 21)}" class="glabel">🧪 Dissection tray</text>`;
    const has = l => PARTS.filter(id => layerOf(id) === l && p.rm[id]).length;
    g.cells.forEach((r, k) => {
      const l = LAYERS[k], n = has(l), x0 = r.x + 14;
      // Dashed lines between the parts of the tray
      if (r.y > g.ty + 40) o += `<line x1="${r.x + 10}" x2="${r.x + r.w - 10}" y1="${r.y}" y2="${r.y}" stroke="#e1e6f5" stroke-dasharray="4 4"/>`;
      if (r.x > g.tx + 1) o += `<line x1="${r.x}" x2="${r.x}" y1="${r.y + 6}" y2="${r.y + r.h - 6}" stroke="#e1e6f5" stroke-dasharray="4 4"/>`;
      if (!n) { o += `<text x="${r.x + r.w / 2}" y="${r.y + r.h / 2 + 5}" text-anchor="middle" class="gsmall">${k + 1}</text>`; return; }
      if (k < 2) {
        // Sepals and petals: one laid out flat, how many there are, and a label just to the right
        const L = l === 'sepal' ? .2 : .5, yc = r.y + r.h * .45, Sr = Math.max(20, Math.min(r.w * .42 / L, (r.w - g.sw - 70) / L, r.h * .6 / (l === 'sepal' ? .11 : .3)));
        o += `<g class="tapme" data-act="dname" data-v="${l}" transform="translate(${x0} ${yc}) scale(${Sr}) rotate(90)">${PART[l]()}</g>`;
        o += `<text x="${x0 + L * Sr + 6}" y="${yc + 22}" class="glabel">×${n}</text>`;
        const sx = Math.min(x0 + L * Sr + 40, r.x + r.w - g.sw - 8);
        o += DIS.slot(l, sx, yc - g.sh / 2, g, x0 + L * Sr * .55, yc);
        return;
      }
      // Stamen and carpel: label places above, the part, then a bracket and the whole thing's label below.
      // The part's size comes from the room left once the labels fit, so nothing runs into the next part of the tray.
      const thick = l === 'stamen' ? .1 : .17, len = l === 'stamen' ? .42 : .47, sy = r.y + 4;
      const Sr = Math.max(40, Math.min((r.w - 60) / len, (r.h - g.sh * 2 - 42) / thick)), yc = sy + g.sh + 12 + thick / 2 * Sr;
      if (l === 'stamen') {
        const by = yc + Math.max(.05 * Sr, 8) + 4;
        o += `<g transform="translate(${x0} ${yc}) scale(${Sr}) rotate(90)">${PART.stamen({ pollen: true })}</g>`;
        o += `<rect class="tapme" data-act="dname" data-v="filament" x="${x0}" y="${yc - 12}" width="${.32 * Sr}" height="24" fill="transparent"/>`;
        o += `<rect class="tapme" data-act="dname" data-v="anther" x="${x0 + .31 * Sr}" y="${yc - .06 * Sr - 6}" width="${.1 * Sr + 6}" height="${.12 * Sr + 12}" fill="transparent"/>`;
        o += `<text x="${x0 + .43 * Sr + 6}" y="${yc + 6}" class="glabel">×${n}</text>`;
        const [fx, ax] = DIS.spread([x0 + .17 * Sr, x0 + .36 * Sr], g.sw, r.x + 4, r.x + r.w - 4);
        o += DIS.slot('filament', fx, sy, g, x0 + .17 * Sr, yc - 2) + DIS.slot('anther', ax, sy, g, x0 + .36 * Sr, yc - .045 * Sr);
        o += DIS.bracket('stamen', x0, x0 + .41 * Sr, by, g, r);
        return;
      }
      // The carpel, lying flat: ovary on the left, style, stigma on the right. Cut open, the ovary shows what is inside.
      const by = yc + .085 * Sr + 4;
      o += `<g transform="translate(${x0} ${yc}) scale(${Sr}) rotate(90)">${PART.carpel({ cut: p.cut })}</g>`;
      o += `<circle class="tapme" data-act="dname" data-v="ovary" cx="${x0 + .085 * Sr}" cy="${yc}" r="${.08 * Sr + 4}" fill="transparent"/>`;
      o += `<rect class="tapme" data-act="dname" data-v="style" x="${x0 + .17 * Sr}" y="${yc - 12}" width="${.23 * Sr}" height="24" fill="transparent"/>`;
      o += `<rect class="tapme" data-act="dname" data-v="stigma" x="${x0 + .4 * Sr}" y="${yc - .05 * Sr - 6}" width="${.06 * Sr + 8}" height="${.1 * Sr + 12}" fill="transparent"/>`;
      const [ox, sx2, gx] = DIS.spread([x0 + .085 * Sr, x0 + .29 * Sr, x0 + .44 * Sr], g.sw, r.x + 4, r.x + r.w - 4);
      o += DIS.slot('ovary', ox, sy, g, x0 + .085 * Sr, yc - .08 * Sr) + DIS.slot('style', sx2, sy, g, x0 + .29 * Sr, yc - 2) + DIS.slot('stigma', gx, sy, g, x0 + .435 * Sr, yc - .03 * Sr);
      o += DIS.bracket('carpel', x0, x0 + .46 * Sr, by, g, r);
    });
    o += '</g>';
    const say = p.mode === 'test' ? (p.sel ? `Tap the box where “${cap(p.sel)}” goes.` : 'Choose a label, then tap its box on the tray.')
      : now ? (g.narrow ? 'Tap a part to take it off.' : 'Take the flower apart, from the outside in. Tap a part, or drag it to the tray.') : p.cut ? 'The ovary, cut open.' : 'Tap each part on the tray to find its name.';
    return `<div class="lay-top"><span class="scaletag">${p.mode === 'test' ? '🙈 Test' : '🔍 Explore'}</span><div class="readout">${say}</div></div>
      <svg id="disSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="A flower and a dissection tray">${o}</svg>`;
  },
  drawer() {
    const p = state.parts, now = DIS.layerNow(), found = NAMES.filter(n => p.named[n]).length;
    const modes = `<div class="stops">${[['explore', '🔍 Explore'], ['test', '🙈 Test']].map(([m, t]) => `<button class="opt sm${p.mode === m ? ' on' : ''}" data-act="dmode" data-v="${m}">${t}</button>`).join('')}</div>`;
    const cut = !now ? `<div class="card"><h3>🔪 Inside the carpel</h3><p>${p.cut ? 'Inside the ovary are tiny parts. After pollination, they can grow into <b>seeds</b>.' : 'What is inside the ovary? Cut the carpel open to find out.'}</p>
      <div class="navrow"><button class="btn${p.cut ? '' : ' go'}" data-act="dcut">${p.cut ? '↩ Put it back together' : '🔪 Cut the carpel open'}</button></div></div>` : '';
    if (p.mode === 'test') {
      const right = NAMES.filter(n => p.marks[n] === true).length, wrong = NAMES.filter(n => p.marks[n] === false).length, left = p.bank.filter(n => !Object.values(p.placed).includes(n));
      return `${right === NAMES.length ? `<div class="card says good"><h3>🎉 All 9 labels are right!</h3><p>You know every part of a flower.</p></div>` : wrong ? `<div class="card says"><h3>🔎 ${right} right so far</h3><p>The red labels are in the wrong place. Tap one to take it off, then try again.</p></div>` : ''}
        <div class="card"><h2>🙈 No peeking!</h2>${modes}<p style="margin-top:6px">All the parts are on the tray. Put each label in the right box: tap a label, then tap its box. Or drag it there.</p>
          <div class="bank" style="margin-top:8px">${left.map(n => `<button class="chip${p.sel === n ? ' sel' : ''}" data-drag="${n}">${cap(n)}</button>`).join('')}</div></div>
        ${cut}
        <div class="checkbar"><button class="btn go" data-act="dcheck"${Object.keys(p.placed).length ? '' : ' disabled'}>✔ Check my labels</button></div>`;
    }
    const step = now ? `<div class="card${p.oops ? ' says' : ''}"><h3>${LAYERS.indexOf(now) + 1}. ${cap(now)}${now === 'carpel' ? '' : 's'}</h3><p>${LAYER_HOW[now]}</p>${p.oops ? `<p class="spot">💡 ${p.oops}</p>` : ''}</div>` : '';
    const info = p.info ? `<div class="card says good"><h3>🏷️ ${cap(p.info)}</h3><p>${NAME_INFO[p.info]}</p>${GROUP[p.info] ? `<p class="muted">${GROUP[p.info] === 'stamen' ? 'The anther and the filament together make a <b>stamen</b>.' : 'The stigma, style and ovary together make the <b>carpel</b>.'}</p>` : ''}</div>` : '';
    return `${info}<div class="card"><h2>🔪 Take a flower apart</h2>${modes}<p style="margin-top:6px">Scientists take flowers apart to see how they are made. This is called a <span class="term">dissection</span>.</p>
        ${now ? '' : `<p class="muted">${found} of ${NAMES.length} names found.</p>`}</div>
      ${step}${cut}
      ${!now && found === NAMES.length ? `<div class="science"><b>🔬 The science</b>From the outside in, a flower has <b>sepals</b>, <b>petals</b>, <b>stamens</b> and a <b>carpel</b>. A stamen is an <b>anther</b> on a <b>filament</b>. The carpel is the <b>stigma</b>, the <b>style</b> and the <b>ovary</b>.</div>
        <div class="checkbar"><button class="btn go" data-act="dmode" data-v="test">🙈 Now test yourself</button></div>` : ''}
      ${Object.keys(p.rm).length ? '<div class="card"><button class="btn" data-act="dreset">↺ Put the flower back together</button></div>' : ''}`;
  },
  ghost(id) {
    if (state.parts.mode === 'test') return null;
    const l = layerOf(id);
    return `<svg width="54" height="54" viewBox="-.3 -.5 .6 .6"><g>${PART[l]({ pollen: true })}</g></svg>`;
  },
  sel: () => state.parts.mode === 'test' ? state.parts.sel : null,
  // Explore: picking up a part takes it off the flower. Test: picking up a label chooses it.
  pick(id) {
    const p = state.parts;
    if (p.mode === 'test') { p.sel = p.sel === id ? null : id; render(); return; }
    const now = DIS.layerNow(), l = layerOf(id);
    if (l !== now) { p.oops = `Take off the ${now === 'carpel' ? 'carpel' : now + 's'} first. A dissection starts on the outside and works in.`; render(); return; }
    p.rm[id] = true; p.oops = null; render(); DIS.check();
  },
  drop(id, where) {
    const p = state.parts;
    if (p.mode !== 'test') { if (where === 'tray' && PARTS.includes(id)) DIS.pick(id); return; }
    if (!where.startsWith('slot:') || !NAMES.includes(id)) return;
    const slot = where.slice(5); if (p.marks[slot] === true) return;
    Object.keys(p.placed).forEach(k => { if (p.placed[k] === id) { delete p.placed[k]; delete p.marks[k]; } });
    p.placed[slot] = id; delete p.marks[slot]; p.sel = null; render();
  },
  check() { const p = state.parts; if (p.mode === 'explore' && !DIS.layerNow() && NAMES.every(n => p.named[n])) emit('dissected'); }
};

// ================= 3. What does each part do? =================
// [icon, name, job (short, for matching), the job explained]. Sepals are extra: not in 5Bs.03, but children ask.
const JOBS = {
  petal: ['🌸', 'Petals', 'Attract pollinators', 'Bright petals attract insects, like bees and butterflies, and other <span class="term">pollinators</span>: animals that carry pollen from flower to flower.'],
  anther: ['🟡', 'Anthers', 'Make pollen', 'The anthers make <span class="term">pollen</span>: a fine, yellow dust. A flower needs pollen to make seeds.'],
  stigma: ['🎯', 'Stigma', 'Catches pollen', 'The stigma is <b>sticky</b>, so it catches pollen. The pollen might come on an insect, or blow in on the wind.'],
  ovary: ['🌰', 'Ovary', 'Where seeds form. It becomes the fruit.', 'After pollination, <b>seeds</b> form inside the ovary. Then the ovary grows into the <b>fruit</b>, with the seeds inside.'],
  sepal: ['🛡️', 'Sepals', 'Protect the flower while it is a bud', 'Before the flower opens, the sepals wrap around the bud and <b>protect</b> it.']
};
const JORDER = ['petal', 'anther', 'stigma', 'ovary', 'sepal'];
const freshJobs = () => ({ sel: null, seen: {}, rows: shuffle(JORDER), chip: null, placed: {}, marks: {} });
state.jobs = freshJobs();
// A closed bud, with its sepals wrapped round it
const budG = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V.5" stroke="#3f9d4a" stroke-width=".04"/>
  <ellipse cy="-.24" rx=".11" ry=".22" fill="${COL.petal}" stroke="${COL.petalEdge}" stroke-width="1" ${NS}/>
  <g transform="rotate(-9)"><path d="${SHAPE.sepal(.42, .1)}" fill="${COL.sepal}" stroke="${COL.sepalEdge}" stroke-width="1.5" ${NS}/></g>
  <g transform="rotate(9)"><path d="${SHAPE.sepal(.42, .1)}" fill="#5fbf5f" stroke="${COL.sepalEdge}" stroke-width="1.5" ${NS}/></g></g>`;
const JOB = {
  geo() { const { w, h, narrow } = stageSize(), top = narrow ? 40 : 50, S = Math.min(w * .62, (h - top) * .62 / .58); return { w, h, narrow, top, S, x: w * .5, y: top + (h - top) * .62 }; },
  stage() {
    const j = state.jobs, g = JOB.geo(), sel = j.sel, at = (ux, uy) => [g.x + ux * g.S, g.y + uy * g.S];
    let o = `<rect width="${g.w}" height="${g.h}" fill="#eef4fb"/><rect y="${g.h - 18}" width="${g.w}" height="18" fill="#cfe6c0"/>`;
    o += flowerG({ x: g.x, y: g.y, S: g.S, stalk: g.h - g.y - 10, act: 'jpart', hl: sel === 'anther' ? 'stamen' : sel === 'stigma' || sel === 'ovary' ? null : sel, pollen: true,
      cut: sel === 'ovary', seeds: sel === 'ovary' ? .5 : 0, stuck: sel === 'stigma' ? 6 : 0 });
    // Tap places on top of the carpel, so the stigma and the ovary can be chosen on their own
    const [sx, sy] = at(0, -.43), [ox, oy] = at(0, -.085);
    o += `<circle class="tapme" data-act="jpart" data-v="stigma" cx="${sx}" cy="${sy}" r="${Math.max(16, g.S * .05)}" fill="transparent"/>`;
    o += `<ellipse class="tapme" data-act="jpart" data-v="ovary" cx="${ox}" cy="${oy}" rx="${Math.max(14, g.S * .07)}" ry="${Math.max(16, g.S * .085)}" fill="transparent"/>`;
    const ring = (x, y, r) => `<circle class="glow" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#ffc83d" stroke-width="6" pointer-events="none"/>`;
    if (sel === 'stigma') o += ring(sx, sy, g.S * .07);
    if (sel === 'ovary') o += ring(ox, oy, g.S * .12);
    if (sel === 'petal') o += `<g class="bob" pointer-events="none">${beeG(g.x + g.S * .62, g.top + 60, Math.max(16, g.S * .07))}</g><text class="bob" x="${g.x - g.S * .7}" y="${g.top + 70}" style="font-size:${Math.max(28, g.S * .1)}px" pointer-events="none">🦋</text>`;
    if (sel === 'anther') FL.stamens.forEach((a, k) => { const r = a * Math.PI / 180, [x, y] = at(Math.sin(r) * .36, -Math.cos(r) * .36);
      for (let q = 0; q < 3; q++) o += `<circle class="puff" style="--dx:${(Math.sin(r) * 30 + (q - 1) * 12).toFixed(0)}px;--dy:${-20 - q * 10}px;animation-delay:${(k * .2 + q * .45).toFixed(2)}s" cx="${x}" cy="${y}" r="3.5" fill="#ffd84a" pointer-events="none"/>`; });
    if (sel === 'sepal') o += `<rect x="${g.w - (g.narrow ? 96 : 150)}" y="${g.top + 8}" width="${g.narrow ? 88 : 140}" height="${g.narrow ? 120 : 180}" rx="14" fill="#fff" stroke="var(--yellow)" stroke-width="3"/>
      ${budG(g.w - (g.narrow ? 52 : 80), g.top + (g.narrow ? 92 : 136), g.narrow ? 140 : 210)}<text x="${g.w - (g.narrow ? 52 : 80)}" y="${g.top + (g.narrow ? 120 : 180)}" text-anchor="middle" class="gsmall">A bud</text>`;
    const say = sel && JOBS[sel] ? `${JOBS[sel][0]} ${JOBS[sel][1]}: ${lc(JOBS[sel][2])}` : 'Tap a part of the flower to find out its job.';
    return `<div class="lay-top"><span class="scaletag">${Object.keys(j.seen).length} of 5 jobs found</span><div class="readout">${say}</div></div>
      <svg id="jobSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="A flower: tap a part to find out its job">${o}</svg>`;
  },
  drawer() {
    const j = state.jobs, J = JOBS[j.sel], right = JORDER.filter(k => j.marks[k] === true).length;
    const card = J ? `<div class="card says good"><h3>${J[0]} ${J[1]}</h3><p>${J[3]}</p>${j.sel === 'sepal' ? '<p class="muted">Sepals are extra: they are not one of the four jobs to learn.</p>' : ''}</div>`
      : j.sel === 'style' ? '<div class="card says"><h3>Style</h3><p>This is the style, between the stigma and the ovary. Tap the <b>stigma</b> at the top, or the <b>ovary</b> at the bottom.</p></div>' : '';
    const left = JORDER.filter(k => !Object.values(j.placed).includes(k));
    return `${card}<div class="card"><h2>🛠️ What does each part do?</h2><p>Each part of a flower has a job. Tap the <b>petals</b>, the <b>anthers</b>, the <b>stigma</b> and the <b>ovary</b>. Can you find the job of the <b>sepals</b> too?</p>
        <div class="stops" style="margin-top:6px">${JORDER.map(k => `<button class="opt sm${j.sel === k ? ' on' : j.seen[k] ? ' done' : ''}" data-act="jpart" data-v="${k}">${JOBS[k][0]} ${JOBS[k][1]}</button>`).join('')}</div></div>
      <div class="card"><h3>🔗 Match the part to its job</h3><p class="muted">Tap a part, then tap its job. Or drag it there.</p>
        <div class="bank" style="margin:6px 0">${left.map(k => `<button class="chip${j.chip === k ? ' sel' : ''}" data-drag="${k}">${JOBS[k][1]}</button>`).join('')}</div>
        ${j.rows.map(k => { const put = j.placed[k], m = j.marks[k];
          return `<div class="mrow"><span>${JOBS[k][2]}</span><div class="mslot${m === true ? ' ok' : m === false ? ' bad' : j.chip ? ' ready' : ''}" data-drop="m:${k}"${put && m !== true ? ` data-act="junplace" data-v="${k}"` : ''}>${put ? JOBS[put][1] : ''}</div></div>`; }).join('')}
        ${right === 5 ? '<p class="job">🎉 All 5 matched!</p>' : JORDER.some(k => j.marks[k] === false) ? '<p class="spot">💡 The red ones are not right yet. Tap one to take it off. Tap that part on the flower to check its job.</p>' : ''}</div>
      ${right === 5 ? '<div class="science"><b>🔬 The science</b><b>Petals</b> attract pollinators. <b>Anthers</b> make pollen. The <b>stigma</b> catches pollen. The <b>ovary</b> is where seeds form, and it becomes the fruit.</div>'
        : `<div class="checkbar"><button class="btn go" data-act="jcheck"${Object.keys(j.placed).length ? '' : ' disabled'}>✔ Check my matches</button></div>`}`;
  },
  sel: () => state.jobs.chip,
  pick(id) { const j = state.jobs; j.chip = j.chip === id ? null : id; render(); },
  drop(id, where) {
    const j = state.jobs; if (!where.startsWith('m:') || !JOBS[id]) return;
    const slot = where.slice(2); if (j.marks[slot] === true) return;
    Object.keys(j.placed).forEach(k => { if (j.placed[k] === id) { delete j.placed[k]; delete j.marks[k]; } });
    j.placed[slot] = id; delete j.marks[slot]; j.chip = null; render();
  }
};

// ================= 4. Follow the pollen =================
const freshPol = () => ({ mode: 'insect', bee: null, carry: null, target: null, msg: null, pred: null, t: 0, grown: false, wpred: null, blown: false, blowing: false });
state.pol = freshPol();
const POL = {
  geo() {
    const { w, h, narrow } = stageSize(), top = narrow ? 40 : 50, S = Math.min(w * .34, (h - top) * .5 / .58), y = top + (h - top) * .6;
    const F = { A: { x: w * .26, y }, B: { x: w * .74, y } };
    // Where the bee lands: on the anthers, in the middle of the flower
    Object.values(F).forEach(f => { f.lx = f.x - S * .02; f.ly = f.y - S * .4; });
    return { w, h, narrow, top, S, F, bs: Math.max(16, S * .11) };
  },
  // The time-lapse after pollination: what the flower looks like at time t (0–100)
  look(t) { return { tube: clamp(t / 18), seeds: clamp((t - 18) / 12) * .3 + clamp((t - 55) / 45) * .7, wither: clamp((t - 30) / 15), fall: clamp((t - 42) / 13), swell: clamp((t - 55) / 45), cut: t > 0 }; },
  day: t => Math.round(t * .56),
  phase(t) {
    if (t < 3) return 'Day 0. Pollen is stuck on the stigma.';
    if (t < 18) return 'A tiny tube grows out of a pollen grain. It grows down the <b>style</b>, all the way to the <b>ovary</b>.';
    if (t < 30) return 'The pollen joins with a tiny part inside the ovary, and that part grows into a <b>seed</b>.';
    if (t < 55) return 'The petals and stamens <b>wither</b> (dry up) and fall off. The flower doesn\'t need them any more.';
    if (t < 100) return 'The ovary <b>swells</b>. It is turning into a <b>fruit</b>, with the seeds growing inside it.';
    return 'About 8 weeks later: the ovary has become a <b>fruit</b>, full of seeds!';
  },
  stage() {
    const P = state.pol, g = POL.geo();
    let o = `<rect width="${g.w}" height="${g.h}" fill="#dff1ff"/><rect y="${g.h - 22}" width="${g.w}" height="22" fill="#9bd06a"/>`;
    if (P.mode === 'wind') {
      const wy = g.top + (g.h - g.top) * .45, ws = Math.min(g.w * .32, (g.h - g.top) * .48);
      o += windFlowerG(g.w * .26, wy, ws) + windFlowerG(g.w * .74, wy, ws, { stuck: P.blown ? 6 : 0 });
      o += ['A', 'B'].map((n, k) => `<text x="${g.w * (k ? .74 : .26)}" y="${g.h - 30}" text-anchor="middle" class="glabel">Flower ${n}</text>`).join('');
      o += `<g id="windPollen"></g>`;
      if (!P.blowing) o += `<text x="${g.w * .06}" y="${wy - ws * .2}" style="font-size:${g.narrow ? 26 : 40}px">🌬️</text>`;
      return `<div class="lay-top"><span class="scaletag">🌬️ Wind</span><div class="readout">${P.blown ? 'Some pollen stuck to flower B\'s feathery stigma.' : 'Press 🌬️ Blow to make the wind blow.'}</div></div>
        <svg id="polSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="Two wind-pollinated flowers">${o}</svg>`;
    }
    ['A', 'B'].forEach(n => {
      const f = g.F[n], tl = P.target === n ? POL.look(P.t) : {};
      o += `<g class="tapme" data-act="pfly" data-v="${n}">${flowerG({ x: f.x, y: f.y, S: g.S, stalk: g.h - f.y - 12, pollen: !(P.target === n && P.t > 30), stuck: P.target === n ? 6 : 0, ...tl })}</g>`;
      o += `<text x="${f.x}" y="${g.h - 30}" text-anchor="middle" class="glabel">Flower ${n}</text>`;
    });
    // After pollination, the bee flies off to the top of the picture, out of the way of the time-lapse
    const b = P.target && P.pred ? { x: g.w * .5, y: g.top + 40 } : P.bee || { x: g.w * .5, y: g.top + 40 };
    o += `<g id="bee" data-bee="1" style="cursor:grab">${beeG(b.x, b.y, g.bs, { dust: !!P.carry })}<circle cx="${b.x}" cy="${b.y}" r="${g.bs * 1.6}" fill="transparent"/></g>`;
    const tag = P.target && P.pred ? `⏩ Day ${POL.day(P.t)}${P.t > 0 ? ' · cut-away view' : ''}` : '🐝 Insect';
    const say = !P.carry ? 'Drag the bee to a flower, or tap a flower.' : !P.target ? 'Now take the bee to the other flower.' : P.pred ? 'Move the slider to fast forward time.' : 'Pollination! What will happen now?';
    return `<div class="lay-top"><span class="scaletag" id="polTag">${tag}</span><div class="readout">${say}</div></div>
      <svg id="polSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="Two flowers and a bee">${o}</svg>`;
  },
  drawer() {
    const P = state.pol;
    const modes = `<div class="stops">${[['insect', '🐝 Insect'], ['wind', '🌬️ Wind']].map(([m, t]) => `<button class="opt sm${P.mode === m ? ' on' : ''}" data-act="pmode" data-v="${m}">${t}</button>`).join('')}</div>`;
    const again = '<div class="card"><button class="btn" data-act="preset">↺ Start again</button></div>';
    if (P.mode === 'wind') {
      const opts = [['most', 'Most of the pollen'], ['half', 'About half of it'], ['little', 'Only a little of it']];
      return `<div class="card"><h2>🌬️ Wind pollination</h2>${modes}<p style="margin-top:6px">Some flowers don't need insects. The <b>wind</b> carries their pollen. Look: no bright petals, the anthers dangle outside, and the stigma is <b>feathery</b>.</p></div>
        <div class="card wq"><h3>🤔 Predict first</h3><p>The wind blows pollen from flower A. How much will land on flower B's stigma?</p>${predict('pwpred', opts, P.wpred)}</div>
        ${P.blown ? `<div class="card says${P.wpred === 'little' ? ' good' : ''}"><h3>${P.wpred === 'little' ? '✅ You were right!' : '❌ Not this time'}</h3><p>You predicted: ${lc(opts.find(x => x[0] === P.wpred)[1])}. Only a <b>little</b> pollen landed on the stigma. Most of it blew away.</p></div>
          <div class="science"><b>🔬 The science</b>In <span class="term">wind pollination</span>, light pollen blows from dangling anthers. A feathery stigma catches some of it. Most of the pollen is lost, so wind-pollinated flowers make <b>lots</b> of pollen.</div>` : ''}
        <div class="checkbar"><button class="btn go" data-act="pblow"${P.wpred && !P.blowing ? '' : ' disabled'}>🌬️ ${P.blown ? 'Blow again' : 'Blow'}</button></div>`;
    }
    const intro = `<div class="card"><h2>🐝 Follow the pollen</h2>${modes}<p style="margin-top:6px">Bees visit flowers to drink <span class="term">nectar</span>: a sweet juice inside the flower. Drag the bee to a flower, or tap the flower.</p></div>`;
    const other = P.carry === 'A' ? 'B' : 'A';
    const msg = { dusted: `<div class="card says good"><h3>🟡 Dusted with pollen</h3><p>The bee drinks nectar from flower ${P.carry}. Pollen from the <b>anthers</b> rubs onto its hairy body. Now take the bee to flower ${other}!</p></div>`,
      same: `<div class="card says"><h3>💡 Same flower</h3><p>The bee already has this flower's pollen on it. Take it to the <b>other</b> flower.</p></div>` }[P.msg] || '';
    if (!P.target) return msg + intro;
    const opts = [['fruit', 'It will grow a fruit with seeds inside.'], ['petals', 'It will grow more petals.'], ['none', 'Nothing will change.']];
    const end = P.t >= 100;
    return `<div class="card says good"><h3>✨ Pollination!</h3><p>Some pollen rubs off the bee onto flower ${P.target}'s sticky <b>stigma</b>. Moving pollen from an anther to a stigma is called <span class="term">pollination</span>.</p></div>
      <div class="card wq"><h3>🤔 Predict first</h3><p>What will happen to flower ${P.target} now?</p>${predict('ppred', opts, P.pred)}</div>
      ${P.pred ? `<div class="card"><h3>⏩ Time-lapse</h3><p class="muted">Move the slider. You can go back and forth.</p>
        <div class="slide"><span>🌸</span><input type="range" id="tl" min="0" max="100" value="${P.t}" aria-label="Time after pollination"><span>🍅</span></div>
        <p id="tlText" style="min-height:66px">${POL.phase(P.t)}</p></div>` : ''}
      <div id="tlEnd">${end && P.pred ? POL.ending() : ''}</div>
      ${intro}${again}`;
  },
  ending() {
    const P = state.pol;
    return `<div class="card says${P.pred === 'fruit' ? ' good' : ''}"><h3>${P.pred === 'fruit' ? '✅ Your prediction was right!' : '❌ Your prediction was not right'}</h3><p>The ovary grew into a fruit, with seeds inside.</p></div>
      <div class="science"><b>🔬 The science</b>After <b>pollination</b>, the pollen joins with tiny parts inside the ovary, and they grow into <b>seeds</b>. The petals fall off, and the <b>ovary</b> becomes the <b>fruit</b>. The fruit holds the seeds.</div>`;
  },
  // Bee flights: dragged by hand, or flying to a tapped flower
  moveBee(x, y) { const P = state.pol, g = POL.geo(); P.bee = { x, y }; const el = $('#bee'); if (el) el.innerHTML = `${beeG(x, y, g.bs, { dust: !!P.carry })}<circle cx="${x}" cy="${y}" r="${g.bs * 1.6}" fill="transparent"/>`; },
  fly(n) {
    const P = state.pol, g = POL.geo(), f = g.F[n], from = P.bee || { x: g.w * .5, y: g.top + 40 }, t0 = performance.now();
    if (POL.flying) return; POL.flying = true;
    const step = now => { const k = clamp((now - t0) / 700), e = k * k * (3 - 2 * k);
      POL.moveBee(from.x + (f.lx - from.x) * e, from.y + (f.ly - from.y) * e - Math.sin(k * Math.PI) * 40);
      if (k < 1) requestAnimationFrame(step); else { POL.flying = false; POL.land(n); } };
    requestAnimationFrame(step);
  },
  land(n) {
    const P = state.pol, g = POL.geo();
    P.bee = { x: g.F[n].lx, y: g.F[n].ly };
    if (P.carry && P.carry !== n) { if (!P.target) P.target = n; P.msg = null; }
    else P.msg = P.carry === n ? 'same' : 'dusted';
    P.carry = n; render(); $('#drawer').scrollTop = 0;
  },
  // The wind blows pollen grains from flower A: a few stick on flower B's stigma, the rest blow away
  blow() {
    const P = state.pol, g = POL.geo(), wy = g.top + (g.h - g.top) * .45, ws = Math.min(g.w * .32, (g.h - g.top) * .48);
    const sx = g.w * .26, bx = g.w * .74, by = wy - ws * .26, N = 60, t0 = performance.now();
    const grains = Array.from({ length: N }, (_, k) => ({ y0: wy + ws * (.1 + Math.random() * .3), d: Math.random() * 900, amp: 10 + Math.random() * 30, ph: Math.random() * 6, stick: k % 10 === 0, end: wy - ws * (Math.random() * .6) + (Math.random() < .5 ? 1 : -1) * ws * .7 }));
    P.blowing = true; P.blown = false; render();
    const step = now => {
      const el = $('#windPollen'); if (!el || state.view !== 'pollen' || P.mode !== 'wind') { P.blowing = false; return; }
      const T = now - t0; let o = '';
      grains.forEach(q => { const k = clamp((T - q.d) / 2200); if (k <= 0) return;
        let x = sx + (g.w * 1.1 - sx) * k, y = q.y0 + (q.end - q.y0) * k + Math.sin(k * 9 + q.ph) * q.amp;
        if (q.stick) { const k2 = clamp(k * 1.6); x = sx + (bx - sx) * k2; y = q.y0 + (by - q.y0) * k2 + Math.sin(k2 * 7 + q.ph) * q.amp * (1 - k2); }
        o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${g.narrow ? 2.5 : 3.5}" fill="#ffd84a" stroke="#c78300" stroke-width=".8"/>`; });
      el.innerHTML = o;
      if (T < 3300) requestAnimationFrame(step); else { P.blowing = false; P.blown = true; render(); }
    };
    requestAnimationFrame(step);
  }
};

// ================= 5. Design a flower for a pollinator =================
const FEATS = [
  ['colour', 'Petal colour', [['blue', '🔵 Blue'], ['purple', '🟣 Purple'], ['yellow', '🟡 Yellow'], ['red', '🔴 Red'], ['white', '⚪ White'], ['dull', '🟤 Dull green']]],
  ['size', 'Petals', [['big', 'Big'], ['small', 'Small'], ['none', 'Tiny or none']]],
  ['shape', 'Shape', [['open', 'Open bowl'], ['tube', 'Long tube']]],
  ['scent', 'Scent', [['none', 'None'], ['sweet', 'Sweet, in the day'], ['night', 'Strong, in the evening']]],
  ['nectar', 'Nectar', [['yes', 'Yes'], ['no', 'No']]],
  ['time', 'Opens', [['day', '☀️ In the day'], ['night', '🌙 At night']]],
  ['parts', 'Anthers and stigma', [['in', 'Inside the flower'], ['out', 'Hanging outside']]],
  ['pollen', 'Pollen', [['sticky', 'A little, sticky'], ['light', 'Lots, light and dusty']]]
];
const PCOL = { blue: '#4a7bff', purple: '#9b59d0', yellow: '#ffd23d', red: '#e8343c', white: '#f7f7f0', dull: '#a8b06a' };
const WHO = [['bee', '🐝', 'Bee'], ['butterfly', '🦋', 'Butterfly'], ['moth', '🌙', 'Moth'], ['wind', '🌬️', 'Wind']];
// Which features suit each pollinator: [help / little / problem, why]. A feature that isn't listed makes no difference to it.
const BRIGHT = ['blue', 'purple', 'yellow', 'red'];
const RULES = {
  bee: {
    colour: v => ['blue', 'purple', 'yellow'].includes(v) ? ['help', 'Bees see blue, purple and yellow well.'] : v === 'red' ? ['problem', 'Bees see red poorly.'] : v === 'white' ? ['little', 'Bees like blue, purple or yellow best.'] : ['problem', 'Dull petals are hard for a bee to spot.'],
    size: v => v === 'big' ? ['help', 'Big petals are easy to spot, and give the bee somewhere to land.'] : v === 'small' ? ['little', 'Small petals are harder to spot and to land on.'] : ['problem', 'No petals: nothing to spot, and nowhere to land.'],
    scent: v => v === 'sweet' ? ['help', 'Bees follow a sweet scent.'] : v === 'night' ? ['little', 'Bees are asleep in the evening, so they miss the scent.'] : ['problem', 'No scent for a bee to follow.'],
    nectar: v => v === 'yes' ? ['help', 'Nectar is the sweet drink that bees come for.'] : ['problem', 'No nectar: nothing for the bee to drink.'],
    time: v => v === 'day' ? ['help', 'Bees fly in the day.'] : ['problem', 'Bees are asleep at night, when this flower is open.']
