  ['seed', 'Seed', 'A seed lies in the soil.'],
  ['germ', 'Germination', 'The seed starts to grow: a root, then a shoot.'],
  ['seedling', 'Seedling', 'A young plant with its first leaves.'],
  ['adult', 'Adult plant', 'The plant grows big and strong, with lots of leaves.'],
  ['flower', 'Flowering', 'The plant makes flowers.'],
  ['poll', 'Pollination', 'Pollen moves from an anther to a stigma.'],

const SEE_LAB = { germ: ['../seed-lab/index.html#view=grow', 'Watch a seed germinate'], disp: ['../seed-lab/index.html#view=spread', 'How seeds travel'] };
// A sunflower at each stage, in a 100 × 100 box
const SUN = (() => {
  const soil = '<rect x="0" y="72" width="100" height="28" fill="#8a5a33"/><rect x="0" y="72" width="100" height="3" fill="#6b4422"/>';
  const seed = (x, y, s = 1, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 -9 C6 -7 6 4 0 9 C-6 4 -6 -7 0 -9Z" fill="#2b2b2b"/><path d="M-2 -7 L-2.6 7 M2 -7 L2.6 7" stroke="#e8e2d0" stroke-width="1.2"/></g>`;
  const leaf = (x, y, s, r) => `<path transform="translate(${x} ${y}) rotate(${r}) scale(${s})" d="M0 0 C6 -6 14 -4 18 0 C14 4 6 6 0 0Z" fill="#4caf50" stroke="#2f7d3a" stroke-width=".8"/>`;
  const stem = (y1, y2) => `<path d="M50 ${y1} V${y2}" stroke="#3f9d4a" stroke-width="3.5"/>`;
  const head = (x, y, r, o = {}) => { let g = '';
    if (!o.bare) for (let k = 0; k < 16; k++) { const a = k * 22.5; g += `<ellipse cx="${x}" cy="${y - r * 1.05}" rx="${r * .2}" ry="${r * .45}" fill="${o.brown ? '#c9a24a' : '#ffd23d'}" stroke="#e0a800" stroke-width=".6" transform="rotate(${a} ${x} ${y})"/>`; }
    g += `<circle cx="${x}" cy="${y}" r="${r * .62}" fill="${o.brown ? '#5a3a1a' : '#7a4a1e'}"/>`;
    if (o.seeds) for (let k = 0; k < 14; k++) { const a = k * 2.4, d = r * .5 * Math.sqrt((k + .5) / 14); g += `<ellipse cx="${(x + d * Math.cos(a)).toFixed(1)}" cy="${(y + d * Math.sin(a)).toFixed(1)}" rx="1.6" ry="1" fill="#e8e2d0"/>`; }
    return g; };
  const big = (o = {}) => stem(72, 30) + leaf(50, 60, 1.4, 20) + leaf(50, 50, 1.3, 160) + leaf(50, 42, 1.1, 25) + (o.droop ? `<g transform="rotate(35 50 32)">${head(50, 24, 13, o)}</g>` : head(50, 22, 14, o));
  return [
    () => soil + seed(50, 84, 2.6, 20),
    () => soil + `<path d="M50 88 Q47 94 50 100 M50 92 l-7 5 M50 96 l6 3" stroke="#f3e7c9" stroke-width="3" fill="none"/><path d="M52 76 Q56 56 44 52" stroke="#7cc46a" stroke-width="4" fill="none"/>` + seed(50, 84, 2.1, 20),
    () => soil + stem(72, 40) + leaf(50, 41, 1.7, 200) + leaf(50, 41, 1.7, -20),
    () => soil + stem(72, 16) + leaf(50, 62, 1.4, 20) + leaf(50, 52, 1.3, 160) + leaf(50, 40, 1.2, 25) + leaf(50, 30, 1, 150) + `<circle cx="50" cy="14" r="6" fill="#7cc46a" stroke="#3f8a2a"/>`,
    () => soil + big(),
    () => soil + big() + beeG(58, 14, 6, { dust: true }),

const freshCyc = () => ({ placed: { 0: 'seed' }, sel: null, mistakes: 0, last: null, watch: false, step: 0, play: false });
state.cyc = freshCyc();
const CYC = {
  // The boxes sit round an oval. Neighbouring boxes are 0.7 × the oval's radius apart, across or down,
  // so each box is kept to about a quarter of the space: then they never overlap, whatever the screen's shape.
  geo() { const { w, h, narrow } = stageSize(), top = narrow ? 40 : 50, H = h - top - 8, cx = w / 2, cy = top + H / 2 + 4;
    const bw = Math.min(narrow ? 84 : 140, w * .25), bh = Math.min(narrow ? 60 : 92, H * .25);
    const Rx = (w - bw) / 2 - 8, Ry = (H - bh) / 2;
    return { w, h, narrow, top, cx, cy, Rx, Ry, bw, bh, at: i => { const a = (-90 + i * 45) * Math.PI / 180; return [cx + Rx * Math.cos(a), cy + Ry * Math.sin(a)]; } }; },
  done: () => STAGES.every((_, i) => state.cyc.placed[i]),
  stage() {
    const C = state.cyc, g = CYC.geo(), now = C.watch ? C.step : -1;
    let o = `<rect width="${g.w}" height="${g.h}" fill="#eef4fb"/><ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.Rx}" ry="${g.Ry}" fill="none" stroke="#b7c3ea" stroke-width="3" stroke-dasharray="8 6"/>`;
    // Arrows round the wheel, half-way between the boxes
    for (let i = 0; i < 8; i++) { const a = (-90 + i * 45 + 22.5) * Math.PI / 180, x = g.cx + g.Rx * Math.cos(a), y = g.cy + g.Ry * Math.sin(a), d = Math.atan2(g.Ry * Math.cos(a), -g.Rx * Math.sin(a)) * 180 / Math.PI;
      o += `<path d="M-7 -6 L7 0 L-7 6Z" transform="translate(${x} ${y}) rotate(${d})" fill="#8a93ad"/>`; }
    // The sunflower in the middle
    const last = C.watch ? C.step : Math.max(...Object.keys(C.placed).map(Number).filter(i => C.placed[i]));
    // The middle picture fits inside the ring of boxes
    // (it must clear the boxes above, below and at the sides, and the diagonal ones on at least one side; no room, no picture)
    const ps = Math.min(220, 2 * (g.Ry - g.bh / 2 - 6), 2 * (g.Rx - g.bw / 2 - 6), 2 * (Math.max(.707 * g.Rx - g.bw / 2, .707 * g.Ry - g.bh / 2) - 6));
    if (ps >= 40)
    o += `<svg x="${g.cx - ps / 2}" y="${g.cy - ps / 2}" width="${ps}" height="${ps}" viewBox="0 0 100 100">${SUN[last](100).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>`;
    STAGES.forEach(([id, name], i) => {
      const [x, y] = g.at(i), put = C.placed[i], bx = x - g.bw / 2, by = y - g.bh / 2, on = now === i;
      o += `<g class="slot tapme${C.sel && !put ? ' ready' : ''}"${put ? '' : ` data-drop="s:${i}"`}${C.watch ? ` data-act="cstep" data-v="${i}"` : ''}><rect x="${bx}" y="${by}" width="${g.bw}" height="${g.bh}" rx="14" fill="${on ? '#fff3c4' : put ? '#fff' : '#f7f9ff'}" stroke="${on ? 'var(--yellow)' : put ? 'var(--green)' : '#b7c3ea'}" stroke-width="${on ? 5 : 2.5}" stroke-dasharray="${put ? '' : '6 5'}"/>`;
      if (put) { const s = g.bh - (g.narrow ? 22 : 30);
        o += `<svg x="${x - s / 2}" y="${by + 2}" width="${s}" height="${s}" viewBox="0 0 100 100">${SUN[i](100).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg><text x="${x}" y="${by + g.bh - (g.narrow ? 6 : 9)}" text-anchor="middle" style="font-size:${g.narrow ? 10.5 : 14}px;font-weight:700;fill:var(--ink)">${name}</text>`; }
      else o += `<text x="${x}" y="${y + 8}" text-anchor="middle" style="font-size:${g.narrow ? 20 : 26}px;font-weight:700;fill:#b7c3ea">${i + 1}</text>`;
      o += '</g>';
    });
    const say = C.watch ? `${C.step + 1}. ${STAGES[C.step][1]}: ${lc(STAGES[C.step][2])}` : C.sel ? `Tap the box where “${STAGES.find(s => s[0] === C.sel)[1]}” goes.` : 'Start at the seed and go round clockwise. Choose a stage, then tap its box.';
    return `<div class="lay-top"><span class="scaletag">🔄 ${C.watch ? 'A sunflower' : `${Object.keys(C.placed).length} of 8`}</span><div class="readout">${say}</div></div>
      <svg id="cycSvg" viewBox="0 0 ${g.w} ${g.h}" aria-label="The life cycle of a flowering plant">${o}</svg>`;
  },
  drawer() {
    const C = state.cyc, done = CYC.done(), L = C.last;
    const left = STAGES.filter(([id], i) => !C.placed[i]);
    const head = `<div class="card"><h2>🔄 The life cycle</h2><p>A <span class="term">life cycle</span> is all the stages in a living thing's life, going round and round. Put the stages of a flowering plant in order, starting from the seed.</p></div>`;
    if (!done) return `${L ? `<div class="card says${L.ok ? ' good' : ''}"><h3>${L.ok ? '✅ ' + STAGES[L.i][1] : '💡 Not there'}</h3><p>${L.ok ? STAGES[L.i][2] : `Look at box ${L.i}: ${STAGES[L.i - 1][1]}. What comes straight after that?`}</p></div>` : ''}
      ${head}<div class="card"><h3>Stages</h3><div class="bank">${left.map(([id, name]) => `<button class="chip${C.sel === id ? ' sel' : ''}" data-drag="${id}">${SUN[STAGES.findIndex(s => s[0] === id)](30)} ${name}</button>`).join('')}</div>
        <p class="muted" style="margin-top:6px">Mistakes: ${C.mistakes}</p></div>`;
    const link = SEE_LAB[STAGES[C.step][0]];
    return `${C.mistakes ? `<div class="card says"><h3>🔄 Complete, with ${C.mistakes} mistake${C.mistakes > 1 ? 's' : ''}</h3><p>Can you do it with <b>no</b> mistakes? <button class="linkbtn" data-act="creset">↺ Try again</button></p></div>` : '<div class="card says good"><h3>🎉 Complete, with no mistakes!</h3></div>'}
      <div class="card"><h3>🌻 Watch a sunflower</h3><p>Follow one sunflower all the way round its life cycle.</p>
        <div class="navrow"><button class="btn" data-act="cmove" data-d="-1" aria-label="Back">◀</button><button class="btn go" data-act="cplay">${C.play ? '⏸ Pause' : '▶ Play'}</button><button class="btn" data-act="cmove" data-d="1" aria-label="Next">▶</button></div>
        ${C.watch ? `<p style="margin-top:8px"><b>${C.step + 1}. ${STAGES[C.step][1]}</b>: ${STAGES[C.step][2]}</p>${link ? `<a class="seelab" href="${link[0]}">🌱 Find out more in Seed Lab: ${lc(link[1])} ▶</a>` : ''}` : ''}</div>
      <div class="science"><b>🔬 The science</b>A flowering plant grows from a <b>seed</b>. It <b>germinates</b>, grows into a <b>seedling</b> and then an <b>adult plant</b>. It <b>flowers</b>, and after <b>pollination</b> it makes <b>fruit and seeds</b>. The seeds are <b>dispersed</b> (spread), and each one can start the cycle again.</div>
      <div class="card"><button class="btn" data-act="creset">↺ Start the wheel again</button></div>`;
  },
  sel: () => state.cyc.sel,
  pick(id) { const C = state.cyc; C.sel = C.sel === id ? null : id; render(); },
  drop(id, where) {
    const C = state.cyc, i = +where.slice(2); if (!where.startsWith('s:') || C.placed[i]) return;
    const ok = STAGES[i][0] === id; C.sel = null;
    if (ok) C.placed[i] = id; else C.mistakes++;
    C.last = { i, ok };
    if (CYC.done()) { C.watch = true; C.step = 0; if (!C.mistakes) emit('cycled'); }
    render(); $('#drawer').scrollTop = 0;
  },
  tick() { const C = state.cyc; clearTimeout(CYC.timer); if (!C.play || state.view !== 'cycle') { C.play = false; return; }
    CYC.timer = setTimeout(() => { if (!C.play || state.view !== 'cycle') return; C.step = (C.step + 1) % 8; render(); CYC.tick(); }, 2600); }
};

function emit(ev, data = {}) {
  if (state.mission == null) return;
  const i = state.mission, m = MISSIONS[i];
  if (!m.on(ev, data)) return;
  stopMission();
  if (!state.done.includes(m.id)) { state.done.push(m.id); store.set('fl-done', state.done); }
  updateStars();
  setTimeout(() => {
    $('#winTitle').textContent = `${m.icon} Mission complete!`;
    $('#winText').innerHTML = m.win(data);
    $('#winNext').style.display = i < MISSIONS.length - 1 ? '' : 'none';
    $('#winPractise').style.display = i < MISSIONS.length - 1 ? 'none' : '';
    $('#winNext').dataset.i = i + 1;
    $('#winModal').classList.remove('hidden'); confetti();
  }, 1200);
}
function startMission(i) {
  closeModals();
  state.mission = i; MISSIONS[i].setup();
  location.hash = 'view=' + state.view;
  const m = MISSIONS[i];
  $('#bannerKicker').textContent = `Mission ${i + 1} of ${MISSIONS.length}: ${m.title}`;
  $('#bannerText').innerHTML = m.task; $('#bannerHint').innerHTML = m.hint;
  $('#bannerHint').classList.add('hidden'); $('#hintBtn').textContent = '💡 Show a hint';
  $('#banner').classList.remove('hidden');
  render(); $('#drawer').scrollTop = 0;
}
function stopMission() { state.mission = null; $('#banner').classList.add('hidden'); fitBanner(); }
// The banner sits over the top of the drawer, so the drawer's cards start below it
function fitBanner() { $('#drawer').style.paddingTop = state.mission == null ? '' : `${$('#banner').offsetHeight + 18}px`; }
function updateStars() { $('#starCount').textContent = `${state.done.filter(id => MISSIONS.some(m => m.id === id)).length}/${MISSIONS.length} ⭐`; }
function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
// Closing a pop-up by hand (button, ✕, Esc, tapping outside) can let a waiting help pop-up show
function closeAll() { closeModals(); maybeHelp(); }
function confetti() {
  const em = ['⭐', '🌟', '🌸', '🌼', '🐝', '🎉'];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = `${Math.random() * 100}vw`; s.style.animationDuration = `${2 + Math.random() * 2}s`; s.style.animationDelay = `${Math.random() * .6}s`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}

    look: 'The four jobs to learn: <b>petals</b>, <b>anthers</b>, <b>stigma</b> and <b>ovary</b>.', codes: ['5Bs.03', '5TWSm.02'] },
  pollen: { q: 'How does a flower make seeds and fruit?', steps: ['Drag the bee to one flower, then to the other. Or tap the flowers.', '<b>Predict</b> what will happen next.', 'Move the <b>time-lapse</b> slider to watch the fruit grow.', 'Try <b>🌬️ Wind</b> to see pollen blow from flower to flower.'],
    look: 'Where does the pollen start, and where does it end up?', codes: ['5Bp.03', '5TWSm.01', '5TWSm.02', '5TWSp.03'] },
  design: { q: 'How are flowers suited to the pollinators that visit them?', steps: ['Choose who your flower is for.', 'Choose its features: colour, petals, shape, scent and more.', '<b>Predict</b> who will visit most. Then see the gauges.', 'Tap a gauge to see why.'],
    look: 'Every feature counts. Think about what each pollinator can see, smell and drink.', codes: ['5Be.02', '5TWSp.03', '5TWSm.01'] },
  fruit: { q: 'Where do fruits come from?', steps: ['Look at an apple, a pea and a tomato turning from flower to fruit.', '<b>Predict</b> before you look.', 'Then sort the foods: is it a <b>fruit</b>?'],
    look: 'To a scientist, a fruit holds the <b>seeds</b>. Not all fruits are sweet!', codes: ['5Bp.03', '5TWSc.01', '5TWSp.03'] },
  cycle: { q: 'What are the stages in the life of a flowering plant?', steps: ['Start at the seed. Choose a stage, then tap its box on the wheel. Or drag it.', 'Go round <b>clockwise</b>.', 'Then watch a <b>sunflower</b> go all the way round.'],
    look: 'It is a cycle: the seeds start it all again.', codes: ['5Bp.02', '5TWSm.02'] }
};
const MODEL = {
  sort: [['📅', 'Many plants only flower at one time of year. An oak tree\'s catkins hang for a few weeks in spring, so you might not see them.'],
    ['🌲', 'Pine is one kind of <b>conifer</b>. Fir and spruce trees are conifers too: they make cones, not flowers.']],
  parts: [['🌺', 'Real flowers come in many different shapes. Some have parts that are hard to see, or parts that are joined together.'],
    ['🔢', 'This model flower has 5 sepals, 5 petals, 6 stamens and 1 carpel. Real flowers have different numbers. A lily\'s sepals look just like its petals!']],
  jobs: [['👃', 'Petals are not the only way to attract pollinators. Many flowers have a <b>scent</b>, and <b>nectar</b> to drink.'],
    ['🌺', 'Real flowers come in many different shapes. Some have parts that are hard to see.']],
  pollen: [['⏩', 'The time-lapse is much faster than real life: a fruit takes <b>weeks</b> to grow.'],
    ['🐦', 'Pollination also happens by <b>birds</b>, <b>bats</b> and other animals, not just insects and the wind.'],
    ['🔬', 'One pollen grain is far too small to see. The yellow dots here are giant!'],
    ['🌸', 'A flower makes many seeds, not just a few. A real fruit can have hundreds.']],
  design: [['🧩', 'This tool only changes a few features. Real flowers have many more features that work together.'],
    ['🐦', 'Pollination also happens by <b>birds</b>, <b>bats</b> and other animals.'],
    ['🌼', 'Real flowers don\'t choose their features. This tool lets you explore which features suit each pollinator. Many flowers are visited by more than one kind.']],
  fruit: [['⏩', 'A fruit takes weeks to grow, not three pictures.'],
    ['🍎', 'An apple is a special fruit: most of the part we eat grows from the base of the flower, around the ovary. The core is the ovary, with the seeds inside.'],
    ['🍌', 'Some fruits we buy have been grown to have tiny seeds, or almost none.']],
  cycle: [['⏩', 'A real sunflower takes a few months to go round its life cycle, from spring to autumn.'],
    ['🌳', 'Some plants, like apple trees, live for many years. They flower and make fruit every year.']],
  all: [['🖍️', 'The pictures are simple drawings, not to scale.']]
};
// Help pops up the first time each tab is opened in this visit (not saved, so a new class sees it again)
const helpSeen = new Set();
let autoHelp = true, welcomed = false;
function showHelp() {
  const H = HELP[state.view], V = VIEWS[state.view];
  helpSeen.add(state.view);
  const core = MISSIONS.map((m, i) => m.core ? `${i + 1} (${m.title})` : null).filter(Boolean);
  $('#helpBody').innerHTML = `<h2 id="helpTitle">${V.label.replace(/<[^>]+>/g, '').split(' ')[0]} ${V.name}</h2>
    ${welcomed ? '' : '<p class="welcome">Welcome to Flower Lab!</p>'}
    <h3>🔬 The big question</h3><p>${H.q}</p>
    <h3>👆 What to do</h3><ol>${H.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <p><b>💡 Look out for:</b> ${H.look}</p>
    <p>🚀 Try the <b>Missions</b> to win stars!</p>
    <details class="teach"><summary>For teachers</summary>${H.codes.map(c => `<p><b>${c}</b> ${OBJ[c]}</p>`).join('')}
      <h4>⏱ A 45-minute lesson</h4><p>Start with the three <b>Lesson</b> missions: ${core.join(', ')}.</p>
      <h4>All of Flower Lab's objectives</h4><p>Main: ${MAIN.join(', ')}. Supporting: ${SUPPORT.join(', ')}.</p></details>`;
  welcomed = true;
  $('#helpModal').classList.remove('hidden');
}
// Never on top of another pop-up: it waits until that one closes
function maybeHelp() {
  if (!autoHelp || helpSeen.has(state.view) || document.querySelector('.modal:not(.hidden)')) return;
  showHelp();
}

function renderStage() { $('#stage').innerHTML = VIEWS[state.view].stage(); }
function render() {
  const v = VIEWS[state.view];
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([id, x]) =>
    `<button class="btn${id === state.view ? ' active' : ''}" data-act="view" data-view="${id}" title="${x.name}" aria-label="${x.name}">${x.label}</button>`).join('');
  const keep = $('#drawer').scrollTop, same = render.last === state.view;
  $('#drawer').innerHTML = v.drawer();
  renderStage();
  // Staying on the same tab keeps the drawer where it was scrolled to
  if (same) $('#drawer').scrollTop = keep;
  render.last = state.view;
  fitBanner();
  maybeHelp();
}

// ================= Actions =================
const ACTIONS = {
  view(el) { state.view = el.dataset.view; location.hash = 'view=' + state.view; render(); },
  // Flowering or not?
  spred(el) { state.sort.pred = el.dataset.v; render(); },
  sclue() { const s = state.sort; s.clue[s.look] = !s.clue[s.look]; render(); },
  sbin(el) { SORT.drop(state.sort.look, el.dataset.v); },
  sreset() { state.sort = { ...freshSort(), pred: state.sort.pred }; render(); },
  // Take a flower apart
  dmode(el) { if (el.dataset.v === 'test') setTest(); else Object.assign(state.parts, { mode: 'explore', sel: null }); render(); $('#drawer').scrollTop = 0; },
  dname(el) { const p = state.parts, n = el.dataset.v; if (p.mode !== 'explore') return; p.named[n] = true; if (GROUP[n]) p.named[GROUP[n]] = true; p.info = n; render(); $('#drawer').scrollTop = 0; DIS.check(); },
  dunplace(el) { const p = state.parts; delete p.placed[el.dataset.v]; delete p.marks[el.dataset.v]; render(); },
  dcheck() { const p = state.parts; Object.keys(p.placed).forEach(k => p.marks[k] = p.placed[k] === k); p.tries++; render(); $('#drawer').scrollTop = 0; if (NAMES.every(n => p.marks[n] === true)) emit('tested'); },
  dcut() { state.parts.cut = !state.parts.cut; render(); },
  dreset() { const m = state.parts.mode; state.parts = freshParts(); if (m === 'test') setTest(); render(); },
  // What does each part do?
  jpart(el) { const j = state.jobs, v = el.dataset.v, l = layerOf(v); j.sel = l === 'stamen' ? 'anther' : l === 'carpel' ? 'style' : l; if (JOBS[j.sel]) j.seen[j.sel] = true; render(); $('#drawer').scrollTop = 0; },
  junplace(el) { const j = state.jobs; delete j.placed[el.dataset.v]; delete j.marks[el.dataset.v]; render(); },
  jcheck() { const j = state.jobs; Object.keys(j.placed).forEach(k => j.marks[k] = j.placed[k] === k); render(); if (JORDER.every(k => j.marks[k] === true)) emit('matched'); },
  // Follow the pollen
  pfly(el) { if (state.pol.mode === 'insect') POL.fly(el.dataset.v); },
  pmode(el) { state.pol = { ...freshPol(), mode: el.dataset.v }; render(); },
  ppred(el) { state.pol.pred = el.dataset.v; render(); },
  pwpred(el) { state.pol.wpred = el.dataset.v; render(); },
  pblow() { if (!state.pol.blowing) POL.blow(); },
  preset() { state.pol = { ...freshPol(), mode: state.pol.mode }; render(); $('#drawer').scrollTop = 0; },
  // Design a flower
  dtarget(el) { Object.assign(state.des, { target: el.dataset.v, gauge: null }); render(); },
  dfeat(el) { const d = state.des; d.f[el.dataset.k] = el.dataset.v; Object.assign(d, { shown: false, pred: null, gauge: null }); render(); },
  dpred(el) { const d = state.des; d.pred = el.dataset.v; d.shown = true; render(); $('#drawer').scrollTop = 0; if (DES.wins(d.target, d.f)) emit('designed', { target: d.target }); },
  dgauge(el) { const d = state.des; if (!d.shown) return; d.gauge = el.dataset.v; render(); $('#drawer').scrollTop = 0; },
  // From flower to fruit
  fex(el) { const F = state.fruit; F.ex = el.dataset.v; F.sel = null; render(); $('#drawer').scrollTop = 0; },
  fapred(el) { state.fruit.apred = el.dataset.v; render(); },
  fspred(el) { state.fruit.spred = el.dataset.v; render(); },
  fsreset() { Object.assign(state.fruit, { placed: {}, sel: null, last: null }); render(); },
  // The life cycle
  cstep(el) { const C = state.cyc; C.step = +el.dataset.v; C.play = false; render(); },
  cmove(el) { const C = state.cyc; C.watch = true; C.play = false; C.step = (C.step + +el.dataset.d + 8) % 8; render(); },
  cplay() { const C = state.cyc; C.watch = true; C.play = !C.play; render(); CYC.tick(); },
  creset() { clearTimeout(CYC.timer); state.cyc = freshCyc(); render(); $('#drawer').scrollTop = 0; },
  // Missions and pop-ups
  missions() {
    $('#missionList').innerHTML = MISSIONS.map((m, i) => `<button class="mission-item${state.done.includes(m.id) ? ' done' : ''}" data-act="startMission" data-i="${i}">
      <span class="em">${m.icon}</span><span class="t">${i + 1}. ${m.title}</span>${m.core ? '<span class="core">⏱ Lesson</span>' : ''}<span class="star">⭐</span></button>`).join('');
    $('#missionsModal').classList.remove('hidden');
  },
  startMission(el) { startMission(+el.dataset.i); },
  nextMission(el) { startMission(+el.dataset.i); },
  stopMission() { stopMission(); },
  hint() {
    const h = $('#bannerHint');
    h.classList.toggle('hidden');
    $('#hintBtn').textContent = h.classList.contains('hidden') ? '💡 Show a hint' : '💡 Hide the hint';
    fitBanner();
  },
  resetStars() { state.done = []; store.set('fl-done', []); updateStars(); ACTIONS.missions(); },
  closeModals() { closeAll(); },
  help() { closeModals(); showHelp(); },
  model() {
    $('#modelTab').textContent = `${VIEWS[state.view].label.replace(/<[^>]+>/g, '').split(' ')[0]} ${VIEWS[state.view].name}`;
    $('#modelList').innerHTML = [...MODEL[state.view], ...MODEL.all].map(([em, t]) => `<li><span class="em">${em}</span><span>${t}</span></li>`).join('');
    $('#modelModal').classList.remove('hidden');
  }
};
// Taps: pick something up, put it down, or do an action
document.addEventListener('click', e => {
  if (DND.skipClick) { DND.skipClick = false; return; }
  const v = VIEWS[state.view], drag = e.target.closest('[data-drag]');
  if (drag && v.pick) { v.pick(drag.dataset.drag); return; }
  const drop = e.target.closest('[data-drop]'), sel = v.sel && v.sel();
  if (drop && sel) { v.drop(sel, drop.dataset.drop); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// The time-lapse slider redraws only the picture, so the slider keeps working while it is dragged
document.addEventListener('input', e => {
  if (e.target.id !== 'tl') return;
  const P = state.pol; P.t = +e.target.value; renderStage(); $('#tlText').innerHTML = POL.phase(P.t);
  if (P.t >= 100 && !P.grown) { P.grown = true; $('#tlEnd').innerHTML = POL.ending(); emit('grown'); }
});
// Dragging the bee around the sky
const BEE = { on: false, moved: false };
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-bee]') && !POL.flying) { BEE.on = true; BEE.moved = false; e.preventDefault(); } });
document.addEventListener('pointermove', e => {
  if (!BEE.on) return; const svg = $('#polSvg'); if (!svg) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  BEE.moved = true; POL.moveBee(p.x, p.y);
});
document.addEventListener('pointerup', () => {
  if (!BEE.on) return; BEE.on = false; if (!BEE.moved) return;
  DND.skipClick = true; setTimeout(() => DND.skipClick = false, 0);
  const P = state.pol, g = POL.geo(), b = P.bee, near = ['A', 'B'].find(n => Math.hypot(b.x - g.F[n].lx, b.y - g.F[n].ly) < g.S * .32);
  if (near) POL.land(near);
});
// Tapping the dark background or pressing Escape closes a pop-up
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeAll(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
let resizeT;
addEventListener('resize', () => { fitBanner(); clearTimeout(resizeT); resizeT = setTimeout(renderStage, 120); });

// ================= Start =================
// Test hooks: #view=parts  ·  #mission=1  ·  #nohelp=1  ·  #mode=test  ·  #dissected=1  ·  #ex=sort  ·  #cycle=1 (wheel done)
const hp = new URLSearchParams(location.hash.slice(1));
if (VIEWS[hp.get('view')]) state.view = hp.get('view');
if (hp.has('nohelp')) autoHelp = false;
if (hp.get('mode') === 'test') setTest();
if (hp.has('dissected')) { state.parts.rm = Object.fromEntries(PARTS.map(id => [id, true])); }
if (hp.get('ex') && (EXAMPLES[hp.get('ex')] || hp.get('ex') === 'sort')) state.fruit.ex = hp.get('ex');
if (hp.has('cycle')) { STAGES.forEach(([id], i) => state.cyc.placed[i] = id); state.cyc.watch = true; }
updateStars();
if (MISSIONS[hp.get('mission')]) startMission(+hp.get('mission'));
else render();
</script>
<script>
  // Offline support: saves the whole Science Hub on this device the first time any page is opened (see ../sw.js)
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
